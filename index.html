  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-0.03em;font-weight:700;
  font-size:var(--fs-display);margin:8px 0 4px;color:var(--ink);
}
.setup-block{margin-top:18px;}
.setup-block.tight{margin-top:0;min-width:0;}
.setup-block .session-name-wrap{margin-top:4px;}
/* New Session setup screen: the session-name input doubles as the page's dominant heading here
   (replacing the old separate static h1 + "Practice Name" field) -- scoped size bump only, the
   shared .session-name-input default (used elsewhere at a smaller size) is untouched. This is
   also the Build Session screen's main title (same input, same classes). Typography here is
   deliberately its own thing (Sora ExtraBold) rather than the app's usual Barlow Condensed --
   normal letter-spacing, not Barlow's tight -0.03em, since that tracking was tuned for Barlow's
   narrow letterforms and reads as cramped on Sora's wider, more geometric ones. */
.setup-title-name{margin-top:14px;}
.setup-title-name .session-name-input{
  font-size:var(--fs-display);padding-bottom:10px;
  font-family:'Sora',sans-serif;font-weight:800;letter-spacing:normal;
}
.setup-title-name .session-name-pencil{top:10px;}
.setup-row-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.setup-field-card{display:flex;gap:12px;align-items:flex-start;background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;margin-top:12px;}
.setup-field-icon{width:44px;height:44px;border-radius:12px;background:var(--turf-dim);color:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.setup-field-icon svg{width:19px;height:19px;}
.setup-field-body{flex:1;min-width:0;}
.setup-field-body .ps-label{margin-bottom:6px;}
.setup-date-input{
  /* fs-input (not a smaller size) is protected -- iOS Safari auto-zooms on focus for any real
     text input under 16px, so the width fix here is padding/box-sizing, not font-size. */
  width:100%;max-width:100%;min-width:0;box-sizing:border-box;margin-top:4px;padding:12px 6px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg-surface);font-family:inherit;font-size:var(--fs-input);font-weight:600;color:var(--ink);
}
.setup-date-input:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.setup-scratch-card{
  position:relative;width:100%;text-align:left;display:flex;flex-direction:column;gap:7px;
  background:var(--bg-surface);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 42px 14px 16px;margin-top:12px;
}
.setup-scratch-card.selected{border-color:var(--pitch);background:var(--chalk-dim);}
.setup-scratch-dots{display:flex;gap:5px;}
.setup-scratch-dots span{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.setup-scratch-title{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);color:var(--ink);text-transform:uppercase;letter-spacing:0.02em;}
.setup-scratch-sub{font-size:var(--fs-base);color:var(--ink-soft);line-height:1.4;}
.setup-card-check{
  position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--pitch);color:white;display:flex;align-items:center;justify-content:center;
}
.setup-card-check svg{width:12px;height:12px;}
.setup-card-check.static{position:static;margin-left:8px;}
.setup-tmpl-scroll{
  display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin-top:8px;
}
.setup-tmpl-scroll::-webkit-scrollbar{display:none;}
.setup-tmpl-card{
  position:relative;flex-shrink:0;width:158px;text-align:left;display:flex;flex-direction:column;gap:6px;
  background:var(--bg-surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 34px 12px 14px;
}
.setup-tmpl-card.selected{border-color:var(--pitch);background:var(--chalk-dim);}
.setup-tmpl-card .setup-card-check{top:10px;right:10px;width:20px;height:20px;}
.setup-tmpl-card .setup-card-check svg{width:11px;height:11px;}
.setup-tmpl-badge{display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
.setup-tmpl-badge svg{width:11px;height:11px;}
.setup-tmpl-name{font-size:var(--fs-md);font-weight:700;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.setup-tmpl-meta{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;}
.setup-viewall-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:10px;
  padding:11px 0;border:none;background:none;font-size:var(--fs-base);font-weight:700;color:var(--turf);
}
.setup-viewall-btn svg{width:13px;height:13px;}
.tmpl-lib-row.selected{border-color:var(--pitch);background:var(--chalk-dim);}

/* ---------- session review ---------- */
.review-cta-row{display:flex;gap:10px;margin-top:8px;}
.review-cta-row .btn{display:flex;align-items:center;justify-content:center;gap:6px;}
.review-cta-row .btn svg{width:14px;height:14px;}
.review-stats-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px;}
.review-total-mini{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;}
.sd-total-time{font-size:var(--fs-sm);color:var(--ink);font-weight:700;}
.review-session-toggle{
  display:flex;align-items:center;gap:4px;flex-shrink:0;
  padding:6px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--white);font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);
}
.review-session-toggle:active{background:var(--chalk-dim);}
.review-session-toggle .tp-chevron svg{width:14px;height:14px;}
.time-panel.standalone{margin-top:8px;}
.time-panel.standalone .tp-body{border-top:none;padding-top:13px;}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:30px;font-size:var(--fs-md);font-weight:600;
  z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.3);white-space:nowrap;max-width:88%;text-align:center;
}
.sync-banner{
  display:flex;align-items:center;gap:9px;background:var(--warn-dim);border:1px solid var(--warn);
  border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:var(--fs-base);font-weight:600;color:var(--warn);
  line-height:1.4;
}
.sync-banner svg{width:18px;height:18px;flex-shrink:0;}

.hidden{display:none !important;}

/* ---------- logo ---------- */
.logo-badge{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:var(--cone);color:var(--pitch-dark);
  display:flex;align-items:center;justify-content:center;
}
.logo-badge img,.logo-badge svg{width:36px;height:36px;display:block;object-fit:contain;}
.brand-lockup{display:flex;flex-direction:column;line-height:1.15;}
.brand-lockup .bl-line1{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);color:white;}
.brand-lockup .bl-line2{font-family:'Inter',sans-serif;font-weight:600;font-size:var(--fs-xs);color:rgba(255,255,255,0.72);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- section badges / icons ---------- */
.sec-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
}
.sec-badge svg{width:11px;height:11px;}

/* ---------- clear banners (bookmark-only / picking) ---------- */
.info-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:12px;padding:10px 14px;margin-bottom:6px;border:1px solid;
}
.info-banner.gold{background:var(--cone-dim);border-color:var(--cone);}
.info-banner.gold .ptxt{color:#8a611a;}
.info-banner.replace-banner{background:var(--turf-dim);border-color:var(--turf);}
.info-banner.replace-banner .ptxt{color:var(--turf);}
.info-banner.tip{background:var(--turf-dim);border-color:var(--turf);}
.info-banner.tip .ptxt{color:var(--turf);}
.info-banner .ptxt{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:6px;}
.info-banner .ptxt svg{width:15px;height:15px;flex-shrink:0;}
.info-banner button{
  /* color:var(--bg-surface), not a hardcoded white -- --ink flips to white in dark mode, and a
     hardcoded white label on a now-white button was invisible there. */
  background:var(--ink);color:var(--bg-surface);border:none;border-radius:9px;
  padding:9px 14px;font-size:var(--fs-base);font-weight:700;flex-shrink:0;min-height:36px;
  display:flex;align-items:center;gap:5px;
}
.info-banner button svg{width:13px;height:13px;}

/* ---------- picking-mode progress strip ---------- */
.sbb-sticky-wrap{
  position:sticky;top:0;z-index:10;
  background:var(--chalk);
  margin:-16px -18px 0;padding:16px 18px 12px;
}
.session-builder-box{
  background:var(--bg-surface);border:1.5px solid var(--turf);
  border-radius:14px;padding:11px 13px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08), inset 0 1.5px 0 #fff, inset 0 -1.5px 0 #fff;
}
.sbb-header{margin-bottom:6px;}
.sbb-title{
  display:flex;align-items:center;gap:6px;
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.03em;
  color:var(--ink);
}
.sbb-title img{width:15px;height:15px;object-fit:cover;object-position:center;border-radius:50%;flex-shrink:0;}
.sbb-current{font-size:var(--fs-base);font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
.sbb-current b{color:var(--pitch-dark);}
.tmpl-list{display:flex;flex-direction:column;gap:8px;}
.tmpl-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;}
.tmpl-row.off{opacity:0.45;}
.tmpl-row.dragging{opacity:0.6;box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;z-index:5;}
.tmpl-grip{width:20px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;touch-action:none;cursor:grab;}
.tmpl-grip svg{width:14px;height:14px;}
.tmpl-grip-spacer{width:20px;flex-shrink:0;}
.tmpl-pct-input{width:40px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:7px;background:var(--bg-main);color:var(--text-primary);font-size:var(--fs-input);font-weight:800;padding:5px 3px;font-family:inherit;}
.tmpl-pct-input:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.tmpl-pct-input:disabled{opacity:var(--opacity-disabled);}
.tmpl-row-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-row-icon svg{width:16px;height:16px;}
.tmpl-row-icon.custom{background:var(--chalk-dim);color:var(--ink-soft);}
.tmpl-row-label{flex:1;min-width:0;font-size:var(--fs-md);font-weight:700;color:var(--text-primary);}
.tmpl-row-hint{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);text-transform:none;margin-top:1px;}
.tmpl-row-pct{display:flex;align-items:center;gap:7px;font-size:var(--fs-lg);font-weight:700;flex-shrink:0;}
.tmpl-row-pct span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;}
/* Percentage steppers here intentionally read a size step below the chevrons on Training Session
   Default Settings (34px/16px icon vs. 44px/22px) -- same up-left/down-right chevron language,
   scaled down since a template screen also carries its name/location/duration/other rows. */
.tmpl-step{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg-surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-step svg{width:16px;height:16px;}
.tmpl-step:disabled{opacity:var(--opacity-disabled);}
.tmpl-step:active:not(:disabled){background:var(--chalk-dim);}
.tmpl-toggle{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-toggle svg{width:14px;height:14px;}
.tmpl-toggle.remove{color:var(--ink-soft);}
.tmpl-lib-list{display:flex;flex-direction:column;gap:8px;}
.tmpl-lib-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;}
.tmpl-lib-icon{width:32px;height:32px;border-radius:9px;background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-lib-icon svg{width:16px;height:16px;}
.tmpl-lib-info{flex:1;min-width:0;}
.tmpl-lib-name{font-size:var(--fs-md);font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmpl-lib-meta{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;margin-top:1px;}
.tmpl-lib-chevron{color:var(--ink-soft);display:flex;flex-shrink:0;}
.tmpl-lib-chevron svg{width:15px;height:15px;}
/* Deleting a whole template is a lighter-weight action than discarding an in-progress session, so
   its trash icons read as neutral gray here rather than the alarming red used elsewhere. */
.tmpl-lib-row .phase-box-del{color:var(--ink-soft);}
.tmpl-sum-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs-sm);font-weight:700;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--chalk-dim);color:var(--ink);}
.tmpl-sum-row.bad .tmpl-sum-warn{color:var(--warn);}
.tmpl-sum-row.ok .tmpl-sum-warn{color:var(--turf);}
/* ---------- Training Session Settings (Settings > Training Session Settings) ---------- */
.tsg-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;}
.tsg-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.tsg-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tsg-card-icon svg{width:18px;height:18px;}
.tsg-card-headtext{flex:1;min-width:0;}
.tsg-card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);text-transform:uppercase;letter-spacing:0.02em;color:var(--text-primary);}
.tsg-card-sub{font-size:var(--fs-md);color:var(--ink-soft);font-weight:600;margin-top:2px;}
.tsg-card-pctbadge{font-size:var(--fs-xl);font-weight:800;color:var(--turf);flex-shrink:0;font-variant-numeric:tabular-nums;}
.tsg-phase-rows{display:flex;flex-direction:column;gap:10px;}
.tsg-phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chalk-dim);border-radius:12px;padding:10px 12px 10px 14px;}
.tsg-phase-label{font-size:var(--fs-lg);font-weight:700;color:var(--text-primary);}
.tsg-stepper{display:flex;flex-direction:row;align-items:center;gap:10px;flex-shrink:0;}
.tsg-chev{width:var(--icon-btn-lg);height:var(--icon-btn-lg);border-radius:12px;border:1.5px solid var(--line);background:var(--bg-surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tsg-chev svg{width:22px;height:22px;}
.tsg-chev:disabled{opacity:var(--opacity-disabled);}
.tsg-chev:active:not(:disabled){background:var(--chalk-dim);}
.tsg-pct-val{font-size:var(--fs-2xl);font-weight:800;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;}
.settings-wip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:60px 20px;color:var(--ink-soft);}
.settings-wip svg{width:40px;height:40px;opacity:.5;}
.settings-wip-title{font-size:var(--fs-xl);font-weight:800;color:var(--ink);}
.settings-wip-sub{font-size:var(--fs-base);}
.pps-dots{display:flex;gap:8px;margin-bottom:10px;}
.pps-dot{
  flex:1;min-width:0;height:36px;border-radius:9px;border:none;
  display:flex;align-items:center;justify-content:center;
}
.pps-dot svg{width:16px;height:16px;}
.pps-caption{display:flex;justify-content:space-between;margin-top:6px;font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;}
.pps-caption b{color:var(--pitch-dark);}
.pps-btn-row{display:flex;gap:8px;margin-top:10px;}
/* Both buttons in this row are pinned to the same fixed height (41px, matching what this row
   already rendered at before this batch) so a two-line "Next: [Section]" label never grows the
   row -- padding differs between the two buttons instead, since .pps-next-btn needs more of its
   fixed height back for the second text line. */
.pps-secondary-btn{
  /* matches the app's existing .btn-ghost secondary-action look, so it correctly follows
     light/dark theme instead of a hardcoded gray that never changed */
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--chalk-dim);color:var(--ink);
  height:41px;padding:12px 8px;font-weight:700;font-size:var(--fs-base);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.pps-secondary-btn svg{width:14px;height:14px;flex-shrink:0;}
.pps-next-btn{
  /* matches the app's existing .btn-primary look, for the same theme-following reason as above */
  flex:1;min-width:0;border:1.5px solid var(--pitch);border-radius:12px;background:var(--pitch);color:#fff;
  height:41px;padding:6px 10px;font-weight:700;font-size:var(--fs-base);white-space:nowrap;
  display:flex;align-items:center;justify-content:flex-start;gap:6px;
}
.pps-next-btn svg{width:13px;height:13px;flex-shrink:0;}
.pps-next-lines{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;line-height:1.05;}
.pps-next-line1{font-size:var(--fs-xs);font-weight:600;opacity:0.78;}
.pps-next-line2{font-size:var(--fs-base);font-weight:700;letter-spacing:-0.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

/* ---------- Batch 60: compact "Building Practice" header (picking mode) ---------- */
.sbb-compact-row1{display:flex;align-items:center;gap:6px;}
.sbb-back-row{display:flex;}
.sbb-compact-title{
  flex:1;min-width:0;text-align:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-base);text-transform:uppercase;letter-spacing:0.03em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sbb-compact-title.left{text-align:left;margin-top:8px;}
.sbb-title-spacer{width:58px;flex-shrink:0;}
.sbb-compact-stats{font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.sbb-compact-stats b{color:var(--ink);}
.sbb-compact-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.sbb-compact-count{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);}
.sbb-full-link{
  position:relative;z-index:1;display:flex;align-items:center;gap:5px;
  background:var(--pitch-dark);border:1px solid var(--pitch-dark);border-radius:8px;
  padding:7px 11px;font-size:var(--fs-base);font-weight:700;color:white;flex-shrink:0;
}
.sbb-full-link svg{width:14px;height:14px;}
.sbb-full-link:active{opacity:0.7;}
/* Batch 61: back to the pre-batch-60 dots' equal-width, always-one-line proportions -- no
   horizontal scroll -- but each chip now stacks its icon above a short label instead of being
   icon-only. */
.pps-nav-row{display:flex;gap:6px;}
.pps-navchip{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:auto;min-height:46px;padding:6px 2px;border-radius:10px;border:none;
}
.pps-navchip svg{width:16px;height:16px;flex-shrink:0;}
.pps-navchip span{font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.phase-structure-strip{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:8px;}
.psc-chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;}
.psc-icon{display:flex;width:13px;height:13px;}
.psc-icon svg{width:13px;height:13px;}
.psc-arrow{display:flex;width:12px;height:12px;color:var(--ink-soft);opacity:0.5;flex-shrink:0;}
.psc-arrow svg{width:12px;height:12px;}

/* "Adding to: X" is a context label, not a tappable control -- it has no onclick, so it should
   never look like a button. A colored icon + bold colored phase name on a transparent background,
   with a thin colored underline for structure, keeps it legible without implying it's interactive. */
.sbb-adding-pill{display:flex;align-items:center;gap:7px;padding:0 0 9px;font-size:var(--fs-base);font-weight:600;margin-bottom:10px;border-bottom:1.5px solid var(--line);color:var(--ink-soft);}
.sbb-adding-pill svg{width:15px;height:15px;flex-shrink:0;}
.sbb-adding-pill b{font-weight:800;}

/* Shown instead of the full picking box while just browsing the library (not actively adding to a
   specific phase) with a draft already started elsewhere -- low-profile, tap to jump back in. */
.draft-pill-banner{display:flex;align-items:center;gap:9px;width:100%;background:var(--bg-surface);border:1.5px solid var(--turf);border-radius:12px;padding:9px 12px;text-align:left;}
.draft-pill-banner img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.dpb-text{flex:1;min-width:0;font-size:var(--fs-base);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dpb-text b{color:var(--turf);}
.dpb-cta{flex-shrink:0;font-size:var(--fs-sm);font-weight:700;color:var(--turf);display:flex;align-items:center;gap:2px;}
.dpb-cta svg{width:12px;height:12px;}

/* Save Draft sits opposite Discard on the same low-emphasis secondary row (turf green vs warn red)
   -- both are "leave the builder" actions, distinguished by whether the draft survives. */
.draft-save-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--turf);font-size:var(--fs-sm);font-weight:700;padding:6px 0;}
.draft-save-btn svg{width:13px;height:13px;}

/* New Training Session page's Save Draft / Discard row -- real full-width buttons underneath
   the last phase box (Scrimmage), not the plain text links used elsewhere. */
.draft-note-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;}
.draft-autosave-note{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);}
.draft-autosave-note svg{width:14px;height:14px;color:var(--turf);flex-shrink:0;}
.discard-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);font-size:var(--fs-base);font-weight:700;padding:12px 8px;margin-right:-8px;min-height:44px;border-radius:8px;}
.discard-link svg{width:14px;height:14px;flex-shrink:0;}
.discard-link:disabled{opacity:var(--opacity-disabled);cursor:not-allowed;}
.discard-link:active:not(:disabled){opacity:0.6;}
.build-bottom-actions{display:flex;gap:10px;margin-top:14px;}
.bba-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 0;font-weight:700;font-size:var(--fs-md);border:1.5px solid var(--line);background:var(--bg-surface);}
.bba-btn:active{background:var(--chalk-dim);}
.bba-btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed;}
.bba-btn:disabled:active{background:var(--bg-surface);}
.bba-btn svg{width:14px;height:14px;flex-shrink:0;}
.bba-btn.discard{border-color:var(--warn);color:var(--warn);}
/* Review page's row only: Discard Session toned down to gray (this is the "softer" review-stage
   discard -- Save Draft is right next to it as the safe option), and all three buttons sized to
   match the "Save Session" button's height above them. Forcing single-line text and giving
   Discard Session extra flex share (its label is by far the longest) keeps the row's natural
   height in lockstep with Save Session's -- measured and matched exactly via Playwright. */
.build-bottom-actions.trio .bba-btn{white-space:nowrap;font-size:var(--fs-base);padding:15px 0;}
.build-bottom-actions.trio .bba-btn.discard{flex:1.2;border-color:var(--line);color:var(--ink-soft);}

/* Small translucent icon buttons for a detail-header top row (Edit / Favorite on a saved session),
   matching .backbtn's treatment at a smaller size since there are two of them side by side. */
.dh-icon-btn{background:rgba(255,255,255,0.15);border:none;width:var(--icon-btn-md);height:var(--icon-btn-md);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0;}
.dh-icon-btn svg{width:16px;height:16px;}
.dh-icon-btn.on svg{color:var(--turf);}

/* Favorite star on a saved-session list row -- session-row became a div (see renderSessions) so
   this button is a proper sibling instead of an invalid nested button. */
.session-fav-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--ink-soft);}
.session-fav-btn svg{width:18px;height:18px;}
.session-fav-btn.on svg{color:var(--turf);}
.session-del-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--warn);}
.session-del-btn svg{width:17px;height:17px;}

/* Home screen "session first" cards (2026-09 redesign) -- Continue Session keeps the same teal
   brand-accent identity the old .continue-draft-banner used for in-progress/positive states, just
   promoted to a full card since it's now the dominant element on the page when a draft exists. */
/* ---------- home hero (mockup-inspired top banner) ---------- */
.home-hero{
  /* Sits inset within .section-pad's own padding now (no more edge-to-edge bleed), so there's
     visible whitespace on every side, plus a thin border to separate it from the page background. */
  background:var(--cone);margin-top:2px;padding:14px 20px 26px;
  border-radius:16px;border:1px solid var(--line);
}
.home-hero-eyebrow{font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;font-size:var(--fs-sm);color:var(--pitch-dark);opacity:0.65;}
.home-hero h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-display);line-height:1.05;color:var(--pitch-dark);margin:2px 0 8px;text-transform:uppercase;letter-spacing:-0.02em;}
.home-hero-sub{font-size:var(--fs-md);color:var(--pitch-dark);opacity:0.7;margin:0 0 18px;max-width:80%;}
.home-hero-cta{
  display:inline-flex;align-items:center;gap:10px;
  background:#0B0F1A;color:#fff;border:none;border-radius:14px;
  padding:10px 18px 10px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);
}
.hhc-plus{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hhc-plus svg{width:14px;height:14px;}
.hhc-chev{margin-left:6px;display:flex;flex-shrink:0;}
.hhc-chev svg{width:16px;height:16px;}

/* ---------- continue session (light card, per mockup) ---------- */
.home-continue-card{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:14px 60px 14px 14px;margin-top:18px;margin-bottom:4px;
}
.hcc-icon{width:52px;height:52px;border-radius:12px;background:var(--turf-dim);color:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.hcc-icon svg{width:22px;height:22px;}
.hcc-icon img,.hcc-icon video{width:100%;height:100%;object-fit:cover;}
.hcc-body{flex:1;min-width:0;}
.hcc-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--ink);margin-top:2px;}
.hcc-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.hcc-progress-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.hcc-progress-row .progress-track{flex:1;}
.hcc-pct{font-size:var(--fs-xs);color:var(--ink-soft);white-space:nowrap;font-weight:600;}
.hcc-chevron-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
  background:var(--turf-dim);color:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hcc-chevron-btn svg{width:16px;height:16px;}

/* ---------- featured exercise (light card, per mockup) ---------- */
.home-featured-card{
  display:block;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;
}
.hfc-top{display:flex;gap:12px;align-items:flex-start;}
.hfc-icon{width:92px;height:92px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.hfc-icon svg{width:28px;height:28px;}
.hfc-icon img,.hfc-icon video{width:100%;height:100%;object-fit:cover;}
.hfc-body{flex:1;min-width:0;}
.hfc-meta{font-size:var(--fs-xs);font-weight:700;color:var(--turf);text-transform:uppercase;letter-spacing:0.05em;}
.hfc-name{font-family:'Barlow Condensed',sans-serif;font-size:var(--fs-lg);font-weight:700;color:var(--ink);margin-top:2px;line-height:1.15;}
.hfc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.hfc-tags span{font-size:var(--fs-2xs);font-weight:700;color:var(--ink-soft);background:var(--chalk-dim);border-radius:20px;padding:3px 9px;}
.hfc-desc{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.4;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hfc-link{
  /* Less prominent than the bright --cone CTA yellow -- this is a "read more" action on a
     card the coach is already looking at, not the primary thing this screen wants tapped.
     Dark gray in light mode specifically (a fixed literal, not a theme token) -- dark mode below
     restores the lighter chalk-dim/ink look it already had, unchanged. */
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  background:#374151;color:#ffffff;font-weight:700;font-size:var(--fs-sm);
  border:1px solid #374151;border-radius:10px;padding:8px 13px;
}
:root[data-theme="dark"] .hfc-link{background:var(--chalk-dim);color:var(--ink);border-color:var(--line);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hfc-link{background:var(--chalk-dim);color:var(--ink);border-color:var(--line);}
}
.hfc-link svg{width:13px;height:13px;}
.home-empty-recent{background:var(--bg-surface);border:1px dashed var(--line);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}

/* ---------- Home (hm-*) -- loud-to-quiet: Start New Session, Continue Session, Quick Start,
   Recent Sessions, Featured Exercise, Club Feed. Fixed pastel/--cone surfaces carry fixed dark text
   (never var(--ink), which flips white in dark mode) -- same rule the other pastel components use. */
.hm-page{padding-top:12px;padding-bottom:8px;}
.hm-greet{margin:0 0 14px;}
.hm-greet h1{font-family:'Poppins','Inter',sans-serif;font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-0.01em;color:var(--ink);margin:0;}
.hm-greet-sub{font-size:var(--fs-base);color:var(--ink-soft);margin-top:3px;}
.hm-start{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--cone);color:#0B0F1A;border:1.5px solid #B8C2CF;border-radius:16px;padding:16.5px 16.5px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}
.hm-start:active{transform:scale(0.99);}
:root[data-theme="dark"] .hm-start{border-color:#64748B;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hm-start{border-color:#64748B;} }
.hm-start-plus{width:42px;height:42px;border-radius:50%;background:#0B0F1A;color:var(--cone);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-start-plus svg{width:20px;height:20px;}
.hm-start-title{flex:1;font-family:'Inter',sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.01em;}
.hm-start-chev{display:flex;flex-shrink:0;}
.hm-start-chev svg{width:20px;height:20px;}
.hm-continue{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;
  background:var(--bg-surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
}
.hm-continue:active{background:var(--chalk-dim);}
.hm-continue-icon{width:42px;height:42px;border-radius:12px;background:var(--turf-dim);color:#0F766E;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-continue-icon svg{width:20px;height:20px;}
.hm-continue-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.hm-continue-title{font-size:var(--fs-md);font-weight:800;color:var(--ink);}
.hm-continue-name{font-size:var(--fs-base);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-continue-meta{font-size:var(--fs-sm);color:var(--ink-soft);}
.hm-chev{display:flex;flex-shrink:0;color:var(--ink-soft);}
.hm-chev svg{width:16px;height:16px;}

.hm-section{margin-top:24px;}
.hm-sh{display:flex;align-items:center;justify-content:space-between;}
.hm-sh h2{font-family:'Inter',sans-serif;font-size:var(--fs-base);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink);margin:0;}
.hm-sh-sub{font-size:var(--fs-sm);color:var(--ink-soft);margin:1px 0 10px;}
.hm-sh + .hm-list,.hm-sh + .hm-feat,.hm-sh + .home-empty-recent{margin-top:8px;}

/* Quick Start -- intentionally inert teasers (no handlers, no toast): dashed edge + badge read as
   "planned", not "broken". */
.hm-qs-list{display:flex;flex-direction:column;gap:8px;}
.hm-qs{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg-surface);cursor:default;}
.hm-qs-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0F172A;}
.hm-qs-icon svg{width:19px;height:19px;}
.hm-qs-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;} /* the live card is a <button>, which centers its text by default */
.hm-qs-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hm-qs-title{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.hm-qs-desc{font-size:var(--fs-sm);color:var(--ink-soft);}
.hm-soon{font-size:10px;font-weight:800;letter-spacing:0.03em;padding:3px 8px;border-radius:999px;background:var(--chalk-dim);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}


/* ---------- Sessions hub ---------- */
.ss-page .nav-page-title{margin-bottom:6px;}
.ss-section{margin-top:22px;}
.ss-page .ss-section:first-of-type{margin-top:18px;}
.ss-h2{font-family:'Inter',sans-serif;font-size:var(--fs-base);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink);margin:0;}
.ss-sub{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:1px;}
/* Continue Session: the one emphasised card on the page (unfinished work) -- pale volt fill with fixed dark text. */
.ss-continue{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;background:var(--cone-dim);border:1.5px solid #B8C2CF;border-radius:14px;padding:13px 14px;color:#0F172A;}
.ss-continue:active{filter:brightness(0.97);}
.ss-continue-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.ss-continue-top{display:flex;align-items:center;gap:8px;min-width:0;}
.ss-continue-name{font-size:var(--fs-md);font-weight:800;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ss-draft-pill{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#0F172A;color:#fff;}
.ss-continue-meta{font-size:var(--fs-sm);color:#475569;}
.ss-continue .hm-chev{color:#0F172A;}
.ss-date{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;}
.ss-viewall{display:flex;align-items:center;gap:4px;margin:10px 0 0;padding:8px 0;min-height:44px;background:none;border:none;color:var(--turf);font-size:var(--fs-base);font-weight:700;}
.ss-viewall svg{width:15px;height:15px;}
.ss-empty{margin-top:12px;padding:16px;border:1px dashed var(--line);border-radius:12px;background:var(--bg-surface);color:var(--ink-soft);font-size:var(--fs-base);line-height:1.45;}
.ss-empty-title{font-weight:700;color:var(--ink);margin-bottom:2px;}


/* ---------- Create / Edit Template ---------- */
.te-page .nav-page-title{margin-bottom:4px;font-size:19px;padding-bottom:6px;}
.te-page .nav-page-sub{font-size:var(--fs-sm);}
.te-titlebar{margin-top:8px;}
.te-card{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-surface);}
.te-compact{margin-top:6px;padding:10px 12px 12px;}
.te-compact .te-label{font-size:var(--fs-sm);margin-bottom:4px;}
.te-field{margin-top:8px;}
.te-label{display:block;font-size:var(--fs-base);font-weight:800;color:var(--ink);margin-bottom:8px;}
.te-opt{font-weight:600;color:var(--ink-soft);font-size:var(--fs-sm);}
.te-input{width:100%;box-sizing:border-box;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-main);color:var(--ink);font-size:var(--fs-input);font-family:inherit;}
.te-input:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.te-seg{gap:6px;}
.te-seg .su-seg-btn{height:auto;min-height:44px;font-size:var(--fs-base);border-radius:10px;}
.te-seg .su-seg-btn svg{width:15px;height:15px;}
/* Selected = FT2 volt with a small dark outline (so it stands out from the grey card) and fixed dark text. */
.te-seg .su-seg-btn.active{background:var(--cone);border:1.5px solid #0F172A;color:#0F172A;}
.te-structure-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:22px;}
.te-h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-xl,24px);margin:0;color:var(--ink);}
.te-sub{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;line-height:1.35;}
.te-total{text-align:right;flex-shrink:0;}
.te-total-min{font-weight:800;font-size:var(--fs-md);color:var(--ink);white-space:nowrap;}
.te-total-pct{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);}
.te-total-pct.bad{color:var(--warn);}
.te-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.te-row{background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;}
.te-row.off .te-row-top > :not(.te-switch-hit):not(.te-grip):not(.te-grip-spacer){opacity:0.45;}
.te-row.off .te-row-ctl{opacity:0.45;}
.te-row.dragging{opacity:0.6;box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;z-index:5;}
.te-row-top{display:flex;align-items:center;gap:8px;}
.te-grip,.te-grip-spacer{width:22px;flex-shrink:0;}
.te-grip{height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);touch-action:none;cursor:grab;}
.te-grip svg{width:14px;height:14px;}
.te-switch-hit{width:52px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;touch-action:manipulation;}
.te-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.te-icon svg{width:19px;height:19px;}
.te-icon.custom{background:var(--chalk-dim);color:var(--ink-soft);}
.te-text{flex:1;min-width:0;}
.te-name{font-size:var(--fs-md);font-weight:800;color:var(--ink);}
.te-desc{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.3;}
.te-alloc{text-align:right;flex-shrink:0;min-width:48px;}
.te-alloc-pct{font-size:var(--fs-md);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
.te-alloc-min{font-size:var(--fs-sm);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.te-row-ctl{display:flex;align-items:center;gap:10px;margin-top:6px;padding-left:30px;}
/* The + and - buttons are real 48 x 48 targets (not just the glyphs), never shrunk, with their own gap. */
.te-adj{width:48px;height:48px;min-width:48px;min-height:48px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);padding:0;touch-action:manipulation;color:#0F172A;}
.te-adj svg{width:22px;height:22px;}
.te-adj-minus{background:var(--chalk-dim);color:var(--ink);}
.te-adj-plus{background:var(--chalk-dim);color:var(--ink);}   /* same quiet look as the minus button */
.te-adj:active{filter:brightness(0.94);}
.te-adj:disabled{opacity:0.5;}
.te-val{min-width:40px;text-align:center;font-weight:800;font-size:var(--fs-md);color:var(--ink);font-variant-numeric:tabular-nums;}
.te-range{flex:1;min-width:60px;height:48px;background:transparent;-webkit-appearance:none;appearance:none;touch-action:manipulation;}
.te-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line);}
.te-range::-moz-range-track{height:6px;border-radius:3px;background:var(--line);}
.te-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--ink);border:2px solid var(--bg-surface);box-shadow:0 0 0 1px var(--line);}
.te-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:2px solid var(--bg-surface);}
.te-range:disabled{opacity:0.5;}
.te-mini{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--ink-soft);}
.te-mini svg{width:16px;height:16px;}
.te-addrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-surface);min-height:56px;}
.te-addrow-icon{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);}
.te-addrow-icon svg{width:20px;height:20px;}
.te-addrow-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.te-addrow-title{font-size:var(--fs-md);font-weight:800;color:var(--ink);}
.te-addrow-desc{font-size:var(--fs-sm);color:var(--ink-soft);}
.te-addrow-chev{display:flex;color:var(--ink-soft);}
.te-addrow-chev svg{width:16px;height:16px;}
.te-save{width:100%;margin-top:14px;min-height:52px;font-size:var(--fs-lg);}
.te-error{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--cone-dim);color:#7A1F1F;border:1px solid var(--warn);font-size:var(--fs-sm);font-weight:700;}


/* ---------- Print / Export + Share sheets ---------- */
.sa-section{margin:4px 0 18px;}
.sa-h2{font-family:'Inter',sans-serif;font-size:var(--fs-base);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink);margin:0 0 8px;}
.sa-items{display:flex;flex-direction:column;gap:8px;}
.sa-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;min-height:56px;border-radius:12px;background:var(--bg-surface);border:1.5px solid var(--line);color:var(--ink);}
@supports (color: color-mix(in srgb, red, blue)){ .sa-item{border-color:color-mix(in srgb, var(--ink) 28%, transparent);} }
.sa-item:active{background:var(--chalk-dim);}
.sa-ico{width:38px;height:38px;border-radius:10px;background:var(--turf-dim);color:#0F766E;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sa-ico svg{width:19px;height:19px;}
.sa-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.sa-title{font-size:var(--fs-md);font-weight:800;color:var(--ink);}
.sa-desc{font-size:var(--fs-sm);color:var(--ink-soft);}
.sa-chev{display:flex;color:var(--ink-soft);flex-shrink:0;}
.sa-chev svg{width:16px;height:16px;}
.pe-intro{font-size:var(--fs-base);color:var(--ink-soft);margin:-2px 0 12px;line-height:1.45;}
.pe-group-label{font-size:var(--fs-sm);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink);margin:12px 0 6px;}
.pe-opts{display:flex;flex-direction:column;gap:8px;}
.pe-opts-2{flex-direction:row;}
.pe-opts-2 .pe-opt{flex:1;min-width:0;}
/* Selected = the app-wide look: a dark outline around the box (same as Session Setup's selected option). */
.pe-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10.5px 12.5px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);min-height:56px;}
.pe-opt.selected{border:1.5px solid var(--ink);padding:10px 12px;}
.pe-opt-title{font-size:var(--fs-md);font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.pe-opt-size{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);}
.pe-opt-desc{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.35;}
.share-flash{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:#0F172A;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.3);width:max-content;max-width:calc(100% - 36px);}
.share-flash b{display:block;font-size:var(--fs-md);}
.share-flash small{display:block;font-size:var(--fs-sm);opacity:0.8;margin-top:1px;}
.share-flash-ic{width:30px;height:30px;border-radius:50%;background:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.share-flash-ic svg{width:16px;height:16px;color:#fff;}
.share-flash.fail{background:#7A1F1F;}
.pe-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 4px 4px;}
.pe-state-title{font-size:var(--fs-lg);font-weight:800;color:var(--ink);}
.pe-state-sub{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.4;word-break:break-word;}
.pe-check{width:40px;height:40px;border-radius:50%;background:var(--turf);color:#fff;display:flex;align-items:center;justify-content:center;}
.pe-check svg{width:20px;height:20px;}
.pe-ready-row{display:flex;align-items:center;gap:10px;margin:2px 0 10px;}
.pe-check-sm{width:26px;height:26px;flex-shrink:0;}
.pe-check-sm svg{width:14px;height:14px;}
.pe-ready-title{font-size:var(--fs-lg);font-weight:800;color:var(--ink);}
.pe-preview{border:1px solid var(--line);border-radius:12px;background:#E2E8F0;padding:8px;display:flex;justify-content:center;}
/* The whole one-page sheet is visible at once (no scrolling), sized to fit the sheet. */
.pe-preview img{display:block;width:auto;height:auto;max-width:100%;max-height:min(44vh, 400px);border-radius:4px;background:#fff;}


/* ---------- Saved Session Detail: top section ---------- */
.sd-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sd-top-left{display:flex;align-items:center;gap:10px;min-width:0;}
.sd-top-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sd-top .dh-icon-btn,.sd-top .backbtn{width:44px;height:44px;flex-shrink:0;}
.sd-top h1{margin:14px 0 8px;}
.sd-metaline{display:grid;grid-template-columns:1fr 1fr;gap:8px 0;font-size:var(--fs-sm);font-weight:600;color:rgba(255,255,255,0.85);}
.sd-mi{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.25;}
.sd-mi:nth-child(even){padding-left:14px;border-left:1px solid rgba(255,255,255,0.22);}
.sd-mi > span{min-width:0;overflow-wrap:anywhere;}
.sd-mi svg{width:14px;height:14px;flex-shrink:0;opacity:0.85;}
.sd-summary{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-radius:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
.sd-sum{display:flex;align-items:center;gap:10px;padding:11px 14px;min-width:0;}
.sd-sum + .sd-sum{border-left:1px solid rgba(255,255,255,0.14);}
.sd-sum-ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.sd-sum-ic svg{width:16px;height:16px;}
.sd-sum-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1;color:#fff;}
.sd-sum-val small{font-family:'Inter',sans-serif;font-size:var(--fs-sm);font-weight:700;letter-spacing:0.04em;}
.sd-sum-lbl{font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-top:3px;}
.sd-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px;}
.sd-actions.one{grid-template-columns:1fr;}
@media (max-width:340px){ .sd-actions{grid-template-columns:1fr;} }
.sd-act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;min-height:48px;border-radius:12px;background:var(--bg-surface);border:1.5px solid var(--line);color:var(--ink);}
@supports (color: color-mix(in srgb, red, blue)){ .sd-act{border-color:color-mix(in srgb, var(--ink) 28%, transparent);} }
.sd-act:active{background:var(--chalk-dim);}
.sd-act-ic{width:36px;height:36px;border-radius:10px;background:var(--turf-dim);color:#0F766E;display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
.sd-act-ic svg{width:19px;height:19px;}
.sd-act-t{font-size:var(--fs-md);font-weight:800;line-height:1.2;}
.sd-act-s{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.3;}
.more-list{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;}
.more-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-size:var(--fs-md);font-weight:700;}
.more-ic{display:flex;color:var(--ink-soft);}
.more-ic svg{width:19px;height:19px;}
.more-item.danger,.more-item.danger .more-ic{color:var(--warn);}

/* Recent Sessions -- one grouped list with hairline dividers, not a stack of separate cards */
.hm-list{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.hm-sess{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;}
.hm-sess + .hm-sess{border-top:1px solid var(--line);}
.hm-sess:active{background:var(--chalk-dim);}
.hm-sess-thumb{width:38px;height:38px;border-radius:10px;background:var(--pitch);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-sess-thumb svg{width:18px;height:18px;}
.hm-sess-thumb img.icon-ball-img{width:18px;height:18px;display:block;}
.hm-sess-body{flex:1;min-width:0;}
.hm-sess-name{font-size:var(--fs-md);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-sess-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:1px;}

/* Featured Exercise -- one compact discovery row */
.hm-feat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.hm-feat:active{background:var(--chalk-dim);}
.hm-feat-thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;}
.hm-feat-thumb svg{width:22px;height:22px;}
.hm-feat-thumb img,.hm-feat-thumb video{width:100%;height:100%;object-fit:cover;}
.hm-feat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.hm-feat-name{font-size:var(--fs-md);font-weight:700;color:var(--ink);line-height:1.25;}
.hm-feat-tags{font-size:var(--fs-sm);color:var(--ink-soft);}
.hm-feat-meta{font-size:var(--fs-sm);font-weight:700;color:var(--turf);}

/* Club Feed -- quiet row at the bottom; expands in place to show the club's (real) links */
.hm-feed-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.hm-feed-head:active{background:var(--chalk-dim);}
.hm-feed-icon{width:34px;height:34px;border-radius:10px;background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-feed-icon svg{width:17px;height:17px;}
.hm-feed-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.hm-feed-title{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.hm-feed-sub{font-size:var(--fs-sm);color:var(--ink-soft);}
.hm-feed-chev{transition:transform .15s;}
.hm-feed-head.open .hm-feed-chev{transform:rotate(90deg);}
.hm-feed-head + .feed-item{margin-top:10px;}

/* ---------- Session Setup (su-*) -- a quiet settings list, not a stack of form cards: big centered mint
   icon tiles on the left, one control per row on the right, selected states in deep navy. Date,
   Duration and Location rows deliberately share one height. */
.su-page{padding-top:8px;}
.su-page .nav-page-title{margin-bottom:6px;}
.su-eyebrow{font-size:var(--fs-xs);font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}
.su-title-input{
  width:100%;height:52px;padding:0 14px;border:1px solid var(--ink);border-radius:12px;background:transparent;
  font-family:inherit;font-size:var(--fs-lg);font-weight:700;color:var(--ink);outline:none;
  text-overflow:ellipsis;
}
.su-title-input::placeholder{color:var(--ink-soft);font-weight:600;opacity:0.7;}
.su-title-input:focus{box-shadow:var(--ring-focus);}
.su-group{margin-top:2px;border-bottom:1px solid var(--line);}
.su-row{display:flex;align-items:stretch;gap:10px;min-height:76px;padding:4px 0;}
.su-row + .su-row{border-top:1px solid var(--line);}
.su-lead{width:88px;box-sizing:border-box;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-right:1px solid var(--line);}
.su-icon{width:50px;height:50px;border-radius:13px;background:var(--turf-dim);color:#0F766E;display:flex;align-items:center;justify-content:center;}
.su-icon svg{width:24px;height:24px;}
.su-lab{font-size:9px;font-weight:800;letter-spacing:0.03em;white-space:nowrap;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.2;}
.su-ctl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.su-date-field{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 14px;border:1px solid var(--ink);border-radius:12px;cursor:pointer;}
.su-date-value{font-size:var(--fs-lg);font-weight:700;color:var(--ink);}
.su-date-chev{display:flex;color:var(--ink-soft);}
.su-date-chev svg{width:16px;height:16px;}
.sd-mi-edit{grid-column:1 / -1;border-left:none !important;padding-left:0 !important;}
.sd-mi-edit label{display:flex;align-items:center;gap:8px;}
.sd-mi-edit .sd-time-input{width:auto;min-height:36px;color:#0F172A;background:#fff;}
.sd-time-input{width:100%;box-sizing:border-box;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg-main);color:var(--ink);font-size:var(--fs-input);font-weight:700;padding:0 6px;font-family:inherit;}
.su-date-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:none;cursor:pointer;}
.su-seg{display:flex;gap:6px;}
.su-seg-btn{
  flex:1;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg-surface);
  font-size:var(--fs-md);font-weight:700;color:var(--ink-soft);padding:0 2px;white-space:nowrap;
}
.su-seg-btn svg{width:17px;height:17px;flex-shrink:0;}
.su-seg-btn.active{background:var(--pitch);border-color:var(--pitch);color:#fff;}
:root[data-theme="dark"] .su-seg-btn.active{border-color:#64748B;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .su-seg-btn.active{border-color:#64748B;} }
.su-seg-input{text-align:center;font-size:var(--fs-input);color:var(--ink);background:var(--bg-main);border-color:var(--ink);outline:none;}
.su-startwith{margin-top:12px;margin-bottom:8px;}
.su-opt{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid var(--line);border-radius:14px;padding:7px 12px 7px 8px;margin-top:8px;
}
.su-startwith + .su-opt{margin-top:0;}
.su-opt.selected{border:1.5px solid var(--ink);padding:6.5px 11.5px 6.5px 7.5px;}
.su-opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.su-dots{display:flex;gap:3px;}
.su-dots span{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.su-opt-title{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);color:var(--ink);}
.su-opt-sub{font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.35;letter-spacing:-0.005em;}
.su-opt-icon{width:50px;height:40px;border-radius:11px;background:var(--turf-dim);color:#0F766E;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.su-opt-icon svg{width:20px;height:20px;}
.su-opt-chev{display:flex;color:var(--ink-soft);flex-shrink:0;}
.su-opt-chev svg{width:16px;height:16px;}
.su-check{width:22px;height:22px;border-radius:50%;background:var(--pitch);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
:root[data-theme="dark"] .su-check{background:#fff;color:#0B0F1A;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .su-check{background:#fff;color:#0B0F1A;} }
.su-check svg{width:13px;height:13px;}
/* Shorter phones: squeeze Session Setup further so it still fits one screen. Controls stay >=44px. */
@media (max-height:800px){
  .su-row{min-height:64px;}
  .su-icon{width:42px;height:42px;border-radius:11px;}
  .su-icon svg{width:21px;height:21px;}
  .su-date-field,.su-title-input,.su-seg-btn{height:46px;}
  .su-startwith{margin-top:8px;margin-bottom:6px;}
}
@media (max-height:720px){
  .su-opt-sub{display:none;}
  .su-page .nav-back-link{min-height:40px;padding-top:10px;padding-bottom:10px;}
}

/* ---------- Workflow navigation (Session Setup -> Build Session -> Session Review, plus Find
   Exercises / Exercise Detail nested under Build Session) ----------
   The back link is deliberately plain text, not a bordered pill -- it must read as subordinate
   to .nav-page-title, never compete with it. Both use theme-aware tokens throughout (no fixed
   pastel backgrounds involved here), so no dark-mode-specific overrides are needed.
   Touch target is deliberately bigger than the visible glyph+label (padding, not a visible box)
   -- 10px/14px padding around a 19px icon clears the 44px minimum with room to spare, landing
   close to the ~48px preferred size, while the negative left margin keeps the chevron's visible
   left edge flush with the page's own left padding instead of the touch target pushing it in. */
/* Every "Back to ..." link is the same pill the Settings sub-pages use (.back-pill-flat): soft fill, hairline
   border, bold ink text. */
.nav-back-link{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--chalk-dim);color:var(--ink);border:1px solid var(--line);border-radius:20px;
  font-size:var(--fs-base);font-weight:700;
  padding:8px 14px;margin:0 0 8px;min-height:44px;box-sizing:border-box;
}
.nav-back-link svg{width:13px;height:13px;flex-shrink:0;}
.nav-back-link:active{opacity:0.7;}
/* Whitespace above the back link's text (page top -> text) should match the whitespace below it
   (text -> step label/title). The link's own 14px padding is its touch target, so the extra top
   space is trimmed from the page padding instead -- only on pages whose first element is the link. */
.section-pad:has(> .nav-back-link:first-child),
.section-pad:has(> .nav-sticky-back:first-child){padding-top:3px;}   /* the sticky wrapper brings its own 8px above the pill */
/* Find Exercises only: the back link stays pinned at the top while the exercise list scrolls, with
   the sticky session-stats box (see renderSessionBuilderBox) pinned directly beneath it -- that
   box's inline top:36px is this wrapper's 52px height minus the 16px of its own top padding. */
.nav-sticky-back{
  position:sticky;top:0;z-index:12;background:var(--chalk);
  margin:0 -20px;padding:8px 20px 8px;   /* same space above the pill as below it, and edge to edge so nothing shows through at the sides */
}
.nav-sticky-back .nav-back-link{margin-bottom:0;}
/* Exercise Detail: the wrapper sits directly in the scroll area (not inside a padded block), so it
   stays pinned for the whole page rather than only while its own small block is in view. */
.nav-sticky-back.nav-sticky-root{margin:0;padding:11px 18px 8px;}
/* The coloured box on Exercise Detail is split in two stacked halves that read as one box: the top half
   (section + exercise name) docks under the Back link while the details scroll; the bottom half (duration /
   format / difficulty) scrolls away. top:62px tucks 1px under the Back link's own 63px so no seam shows. */
.detail-header.dh-dock{position:sticky;top:62px;z-index:11;padding-bottom:12px;}
.detail-header.dh-dock h1{margin:0;}
.detail-header.dh-dock .detail-eyebrow,.detail-header.dh-dock h1{padding-right:52px;}   /* room for the bookmark in the corner */
.dh-bm{position:absolute;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;z-index:2;touch-action:manipulation;}
.dh-bm svg{width:20px;height:20px;}
.detail-header.dh-stats{padding-top:0;margin-top:-1px;} /* hides a sub-pixel hairline between the two halves */
.nav-page-title{
  font-family:'Poppins','Inter',sans-serif;font-weight:800;font-size:23px;
  text-transform:uppercase;letter-spacing:0.01em;color:var(--ink);line-height:1.1;
  position:relative;padding-bottom:9px;margin:0 0 12px;width:fit-content;max-width:100%;
}
/* Optional small step label above the title (data-step) -- e.g. "STEP 2 OF 3" on Setup/Build/Review. */
.nav-page-title[data-step]::before{
  content:attr(data-step);display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.14em;line-height:1.2;color:var(--turf);margin-bottom:6px;
}
/* Thin yellow rule hugging the underside of the title text (its width follows the title's), with a
   light gray hairline so it still reads against a white page. */
.nav-page-title::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;
  background:#F7FF00;box-shadow:0 0 0 1px #CBD5E1;
}
.nav-page-sub{font-size:var(--fs-md);color:var(--ink-soft);line-height:1.4;margin:4px 0 0;}
.nav-page-title + .nav-page-sub{margin-top:-6px;}

/* ---------- Quick Start (3-screen shell: Home / Pre-Built Practices / Build a Custom Session) ----------
   Fixed pastel tokens (--sky-dim, --mint-dim, etc.) and --cone/--pitch are used throughout for
   card backgrounds -- none of these vary between light/dark themes (see CLAUDE.md "Color
   system"), so text sitting on them uses var(--pitch-dark) (dark in both themes) or a fixed
   white, never var(--ink)/var(--text-primary) (which flips to white in dark mode and would
   vanish against a still-light background) -- the same rule .mac-tile and .home-hero already
   follow. */
.qs-header{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.qs-header-btn{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:var(--chalk-dim);border:1px solid var(--line);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.qs-header-btn svg{width:16px;height:16px;}
.qs-header-title{
  flex:1;min-width:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:var(--fs-2xl);text-transform:uppercase;letter-spacing:-0.01em;color:var(--ink);
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.qs-header-spacer{width:38px;flex-shrink:0;}
.qs-eyebrow{margin-top:14px;}
.qs-sub{font-size:var(--fs-md);color:var(--ink-soft);line-height:1.45;margin:4px 0 18px;}

/* Screen 1 -- the two big "Use a Pre-Built Practice" / "Build a Custom Session" cards, same
   icon-left/body/chevron shape as Home's .home-continue-card, just its own namespace since this
   is a different screen's component. */
.qs-option-card{
  position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:16px 52px 16px 16px;margin-bottom:12px;
}
.qs-option-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pitch-dark);}
.qs-option-icon svg{width:24px;height:24px;}
.qs-option-body{flex:1;min-width:0;}
.qs-option-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--ink);line-height:1.2;}
.qs-option-desc{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.qs-option-chevron{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qs-option-chevron svg{width:15px;height:15px;}

/* Popular Focuses grid, Screen 1 */
.qs-focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.qs-focus-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
  border:1px solid rgba(0,0,0,0.06);border-radius:var(--radius-card);padding:14px;
}
.qs-focus-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--pitch-dark);flex-shrink:0;background:rgba(255,255,255,0.55);}
.qs-focus-icon svg{width:17px;height:17px;}
.qs-focus-label{font-size:var(--fs-md);font-weight:700;color:var(--pitch-dark);}
.qs-focus-sub{font-size:var(--fs-xs);color:var(--pitch-dark);opacity:0.75;line-height:1.3;}

/* Surprise Me, Screen 1 -- deliberately dark/full-width so it reads as a distinct "let the app
   decide" action, not just a 7th Popular Focus card. */
.qs-surprise-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--pitch);color:#fff;border:none;border-radius:var(--radius-card);
  padding:16px;margin-top:18px;
}
.qs-surprise-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.12);color:var(--cone);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qs-surprise-icon svg{width:20px;height:20px;}
.qs-surprise-body{flex:1;min-width:0;}
.qs-surprise-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-lg);line-height:1.2;}
.qs-surprise-desc{font-size:var(--fs-sm);opacity:0.75;margin-top:2px;}
.qs-surprise-chevron{flex-shrink:0;display:flex;opacity:0.8;}
.qs-surprise-chevron svg{width:16px;height:16px;}

/* Screen 2 -- Pre-Built Practices */
.qs-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.qs-filter-row::-webkit-scrollbar{display:none;}
.qs-filter-tab{
  flex-shrink:0;padding:9px 16px;border-radius:var(--radius-pill);border:1px solid var(--line);
  background:var(--chalk);font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);white-space:nowrap;
}
.qs-filter-tab.active{background:var(--pitch);border-color:var(--pitch);color:#fff;}

.qs-practice-card{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:14px;margin-bottom:12px;position:relative;
}
.qs-practice-thumb{width:60px;height:60px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.qs-practice-thumb svg{width:22px;height:22px;}
.qs-practice-body{flex:1;min-width:0;padding-right:18px;}
.qs-practice-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--ink);line-height:1.2;}
.qs-practice-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.qs-practice-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:7px;font-weight:600;}
.qs-practice-desc{font-size:var(--fs-base);color:var(--ink-soft);margin-top:5px;line-height:1.4;}
.qs-practice-chevron{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);display:flex;}
.qs-practice-chevron svg{width:16px;height:16px;}
.qs-empty-practices{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:var(--fs-base);}

/* Screen 3 -- Build a Custom Session */
.qs-section-label{font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin:24px 0 10px;}
.qs-section-label:first-of-type{margin-top:6px;}
.qs-section-hint{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;margin-left:6px;text-transform:none;letter-spacing:0;}

.qs-primary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qs-primary-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
  border:1.5px solid var(--line);border-radius:var(--radius-card);padding:14px;background:var(--bg-surface);
}
.qs-primary-card.active{background:var(--cone);border-color:var(--cone);}
.qs-primary-icon{width:36px;height:36px;border-radius:10px;background:var(--chalk-dim);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qs-primary-card.active .qs-primary-icon{background:rgba(11,15,26,0.12);color:var(--pitch-dark);}
.qs-primary-icon svg{width:17px;height:17px;}
.qs-primary-label{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.qs-primary-card.active .qs-primary-label{color:var(--pitch-dark);}
.qs-primary-desc{font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.3;}
.qs-primary-card.active .qs-primary-desc{color:var(--pitch-dark);opacity:0.75;}

.qs-tag-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.qs-tag-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 13px;border-radius:var(--radius-pill);border:1px solid var(--line);
  background:var(--chalk);font-size:var(--fs-base);font-weight:600;color:var(--ink-soft);
}
.qs-tag-chip.active{background:var(--cone);border-color:var(--cone);color:var(--pitch-dark);font-weight:700;}
.qs-tag-chip svg{width:12px;height:12px;}

.qs-select-wrap{position:relative;}
.qs-select{
  width:100%;appearance:none;-webkit-appearance:none;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-control);
  padding:14px 38px 14px 14px;font-size:var(--fs-input);font-weight:700;color:var(--ink);
}
.qs-select-chevron{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(90deg);color:var(--ink-soft);pointer-events:none;}
.qs-select-chevron svg{width:14px;height:14px;}

.qs-len-row{display:flex;gap:8px;}
.qs-len-btn{
  flex:1;padding:13px 0;border-radius:var(--radius-control);border:1px solid var(--line);
  background:var(--bg-surface);font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);
}
.qs-len-btn.active{background:var(--cone);border-color:var(--cone);color:var(--pitch-dark);}

.qs-generate-btn{
  width:100%;border:none;border-radius:var(--radius-control);padding:16px 0;
  background:var(--pitch);color:#fff;font-size:var(--fs-lg);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.qs-generate-btn svg{width:17px;height:17px;}

/* Custom Session generator -- Step 1 (what to work on) */
.cs-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}

.cs-area{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);color:var(--ink);}
.cs-cat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0F172A;}
.cs-cat-icon svg{width:22px;height:22px;}
.cs-cat-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.cs-cat-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:var(--fs-md);letter-spacing:0.02em;text-transform:uppercase;color:var(--ink);line-height:1.2;}
.cs-cat-desc{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.3;}
.cs-area.selected{background:var(--pitch);border-color:var(--pitch);}
.cs-area.selected .cs-cat-title{color:#fff;}
.cs-area.selected .cs-cat-desc{color:rgba(255,255,255,0.78);}
:root[data-theme="dark"] .cs-area.selected{border-color:#64748B;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cs-area.selected{border-color:#64748B;} }
.cs-add-ex{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:8px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink-soft);font-size:var(--fs-base);font-weight:700;}
.cs-add-ex svg{width:15px;height:15px;}
.cs-shuffle-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.cs-shuffle-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-size:var(--fs-base);font-weight:700;flex-shrink:0;}
.cs-shuffle-btn svg{width:18px;height:18px;}
.cs-shuffle-hint{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.3;}
.cs-check{width:22px;height:22px;border-radius:50%;background:#fff;color:var(--pitch);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
:root[data-theme="dark"] .cs-check{color:#0B0F1A;}
.cs-check svg{width:13px;height:13px;}
.cs-page .su-lab{white-space:normal;}
.cs-seg .su-seg-btn{height:auto;min-height:52px;padding:6px 3px;white-space:normal;text-align:center;line-height:1.15;font-size:var(--fs-base);}
.cs-seg-style .su-seg-btn{font-size:var(--fs-sm);padding:6px 2px;}
.cs-carry{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--bg-surface);}
.cs-carry-focus{font-size:var(--fs-lg);font-weight:800;color:var(--ink);line-height:1.2;}
.cs-carry-change{min-height:44px;padding:0 4px 0 10px;background:none;border:none;font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);}
.cs-soon{margin-top:16px;padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:var(--fs-base);color:var(--ink-soft);line-height:1.45;}
.cs-how-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:12px 14px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:var(--fs-md);font-weight:700;text-align:left;}
.cs-how-btn > span:first-child{flex:1;}
.cs-how-i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-soft);color:var(--ink-soft);font-style:italic;font-weight:700;font-size:12px;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cs-how-chev{display:flex;color:var(--ink-soft);transition:transform .15s;}
.cs-how-chev svg{width:16px;height:16px;}
.cs-how-chev.open{transform:rotate(180deg);}
.cs-how-panel{margin-top:8px;padding:14px 16px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--line);}
.cs-how-step{display:flex;gap:12px;padding-bottom:12px;}
.cs-how-num{width:22px;height:22px;border-radius:50%;background:var(--pitch);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
:root[data-theme="dark"] .cs-how-num{background:#fff;color:#0B0F1A;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cs-how-num{background:#fff;color:#0B0F1A;} }
.cs-how-body{min-width:0;}
.cs-how-label{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);}
.cs-how-text{font-size:var(--fs-md);font-weight:700;color:var(--ink);line-height:1.35;margin-top:1px;}
.cs-how-sub{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.cs-how-whyhead{font-size:var(--fs-xs);font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 8px;border-top:1px solid var(--line);padding-top:12px;}
.cs-how-whys{margin:0;padding-left:18px;font-size:var(--fs-base);color:var(--ink);line-height:1.45;}
.cs-how-whys li{margin-bottom:8px;}
.cs-notes{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--cone-dim);color:var(--pitch-dark);border:1px solid var(--cone);}
.cs-notes-title{font-size:var(--fs-sm);font-weight:800;margin-bottom:4px;}
.cs-notes ul{margin:0;padding-left:18px;font-size:var(--fs-base);line-height:1.4;}
.cs-review-focus{font-size:var(--fs-md);font-weight:700;color:var(--ink);margin-top:6px;}
.cs-review-label{font-size:var(--fs-xs);font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin-right:4px;}
.cs-review-setup{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.gen-steps{list-style:none;margin:22px 0 0;padding:0;}
.gen-step{position:relative;display:flex;gap:14px;padding-bottom:22px;}
.gen-step:last-child{padding-bottom:0;}
.gen-step:not(:last-child)::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line);}
.gen-step.done:not(:last-child)::before{background:var(--turf);}
.gen-mark{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:transparent;box-sizing:border-box;}
.gen-step.done .gen-mark{background:var(--turf);border-color:var(--turf);color:#fff;}
.gen-step.done .gen-mark svg{width:15px;height:15px;}
.gen-step.active .gen-mark{border-color:transparent;}
.gen-spinner{width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:3px solid rgba(59,130,246,0.22);border-top-color:var(--set-blue);animation:genSpin .85s linear infinite;}
@keyframes genSpin{to{transform:rotate(360deg);}}
@keyframes genPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (prefers-reduced-motion: reduce){ .gen-spinner{animation:genPulse 1.4s ease-in-out infinite;} }
.gen-text{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:2px;}
.gen-title{font-size:var(--fs-lg);font-weight:700;color:var(--ink);line-height:1.25;}
.gen-sub{font-size:var(--fs-base);color:var(--ink-soft);line-height:1.4;}
.gen-step.pending .gen-title{color:var(--ink-soft);}
.gen-step.pending .gen-sub{opacity:.75;}
.gen-know{margin-top:28px;padding:14px 16px;border-radius:var(--radius-card);background:var(--bg-surface);border:1px solid var(--line);}
.gen-know-title{font-size:var(--fs-md);font-weight:800;color:var(--ink);}
.gen-know-text{font-size:var(--fs-base);color:var(--ink-soft);line-height:1.45;margin-top:4px;}
.gen-error{margin-top:16px;padding:14px 16px;border-radius:var(--radius-card);background:var(--cone-dim);border:1px solid var(--cone);color:var(--pitch-dark);}
.gen-error-title{font-size:var(--fs-md);font-weight:800;}
.gen-error-text{font-size:var(--fs-base);line-height:1.45;margin:4px 0 12px;}
.gen-error .btn{width:100%;}
.home-feed-header h2{font-size:var(--fs-base);opacity:0.75;}

/* ---------- editable fields ---------- */
[contenteditable="true"]{
  outline:none;border-radius:6px;transition:background .12s;
  padding:2px 4px;margin:-2px -4px;
}
[contenteditable="true"]:hover{background:var(--chalk-dim);}
[contenteditable="true"]:focus{background:var(--turf-dim);box-shadow:0 0 0 1.5px var(--turf);}
.edit-hint{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;
  margin-left:6px;opacity:0.65;
}
.edit-hint svg{width:10px;height:10px;}
.editable-title[contenteditable="true"]{display:inline-block;min-width:40px;}
input.section-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-input);text-transform:uppercase;letter-spacing:0.02em;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 4px;width:100%;outline:none;
}
input.section-title-input:focus{border-color:var(--turf);}

/* ---------- media / gif box ---------- */
.media-box{
  margin:16px 18px 0;height:220px;border-radius:14px;overflow:hidden;position:relative;
  background:var(--chalk-dim);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;}
.media-box-placeholder{flex-direction:column;gap:8px;color:var(--ink-soft);}
.media-box-placeholder svg{width:28px;height:28px;opacity:0.6;}
.media-box-placeholder span{font-size:var(--fs-base);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
