.review-total-mini{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;}
.sd-total-time{font-size:var(--fs-sm);color:var(--ink);font-weight:700;}
.review-session-toggle{
  display:flex;align-items:center;gap:4px;flex-shrink:0;
  padding:6px 10px;border-radius:20px;border:1px solid var(--line);
  background:var(--white);font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);
}
.review-session-toggle:active{background:var(--chalk-dim);}
.review-session-toggle .tp-chevron svg{width:14px;height:14px;}
.time-panel.standalone{margin-top:8px;}
.time-panel.standalone .tp-body{border-top:none;padding-top:13px;}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:30px;font-size:var(--fs-md);font-weight:600;
  z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.3);white-space:nowrap;max-width:88%;text-align:center;
}
.sync-banner{
  display:flex;align-items:center;gap:9px;background:var(--warn-dim);border:1px solid var(--warn);
  border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:var(--fs-base);font-weight:600;color:var(--warn);
  line-height:1.4;
}
.sync-banner svg{width:18px;height:18px;flex-shrink:0;}

.hidden{display:none !important;}

/* ---------- logo ---------- */
.logo-badge{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:var(--cone);color:var(--pitch-dark);
  display:flex;align-items:center;justify-content:center;
}
.logo-badge img,.logo-badge svg{width:36px;height:36px;display:block;object-fit:contain;}
.brand-lockup{display:flex;flex-direction:column;line-height:1.15;}
.brand-lockup .bl-line1{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);color:white;}
.brand-lockup .bl-line2{font-family:'Inter',sans-serif;font-weight:600;font-size:var(--fs-xs);color:rgba(255,255,255,0.72);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- section badges / icons ---------- */
.sec-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
}
.sec-badge svg{width:11px;height:11px;}

/* ---------- clear banners (bookmark-only / picking) ---------- */
.info-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:12px;padding:10px 14px;margin-bottom:6px;border:1px solid;
}
.info-banner.gold{background:var(--cone-dim);border-color:var(--cone);}
.info-banner.gold .ptxt{color:#8a611a;}
.info-banner.replace-banner{background:var(--turf-dim);border-color:var(--turf);}
.info-banner.replace-banner .ptxt{color:var(--turf);}
.info-banner.tip{background:var(--turf-dim);border-color:var(--turf);}
.info-banner.tip .ptxt{color:var(--turf);}
.info-banner .ptxt{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:6px;}
.info-banner .ptxt svg{width:15px;height:15px;flex-shrink:0;}
.info-banner button{
  /* color:var(--bg-surface), not a hardcoded white -- --ink flips to white in dark mode, and a
     hardcoded white label on a now-white button was invisible there. */
  background:var(--ink);color:var(--bg-surface);border:none;border-radius:9px;
  padding:9px 14px;font-size:var(--fs-base);font-weight:700;flex-shrink:0;min-height:36px;
  display:flex;align-items:center;gap:5px;
}
.info-banner button svg{width:13px;height:13px;}

/* ---------- picking-mode progress strip ---------- */
.sbb-sticky-wrap{
  position:sticky;top:0;z-index:10;
  background:var(--chalk);
  margin:-16px -18px 0;padding:16px 18px 12px;
}
.session-builder-box{
  background:var(--bg-surface);border:1.5px solid var(--turf);
  border-radius:14px;padding:11px 13px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08), inset 0 1.5px 0 #fff, inset 0 -1.5px 0 #fff;
}
.sbb-header{margin-bottom:6px;}
.sbb-title{
  display:flex;align-items:center;gap:6px;
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.03em;
  color:var(--ink);
}
.sbb-title img{width:15px;height:15px;object-fit:cover;object-position:center;border-radius:50%;flex-shrink:0;}
.sbb-current{font-size:var(--fs-base);font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
.sbb-current b{color:var(--pitch-dark);}
.tmpl-list{display:flex;flex-direction:column;gap:8px;}
.tmpl-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;}
.tmpl-row.off{opacity:0.45;}
.tmpl-row.dragging{opacity:0.6;box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;z-index:5;}
.tmpl-grip{width:20px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;touch-action:none;cursor:grab;}
.tmpl-grip svg{width:14px;height:14px;}
.tmpl-grip-spacer{width:20px;flex-shrink:0;}
.tmpl-pct-input{width:40px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:7px;background:var(--bg-main);color:var(--text-primary);font-size:var(--fs-input);font-weight:800;padding:5px 3px;font-family:inherit;}
.tmpl-pct-input:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.tmpl-pct-input:disabled{opacity:var(--opacity-disabled);}
.tmpl-row-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-row-icon svg{width:16px;height:16px;}
.tmpl-row-icon.custom{background:var(--chalk-dim);color:var(--ink-soft);}
.tmpl-row-label{flex:1;min-width:0;font-size:var(--fs-md);font-weight:700;color:var(--text-primary);}
.tmpl-row-hint{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);text-transform:none;margin-top:1px;}
.tmpl-row-pct{display:flex;align-items:center;gap:7px;font-size:var(--fs-lg);font-weight:700;flex-shrink:0;}
.tmpl-row-pct span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;}
/* Percentage steppers here intentionally read a size step below the chevrons on Training Session
   Default Settings (34px/16px icon vs. 44px/22px) -- same up-left/down-right chevron language,
   scaled down since a template screen also carries its name/location/duration/other rows. */
.tmpl-step{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg-surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-step svg{width:16px;height:16px;}
.tmpl-step:disabled{opacity:var(--opacity-disabled);}
.tmpl-step:active:not(:disabled){background:var(--chalk-dim);}
.tmpl-toggle{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-toggle svg{width:14px;height:14px;}
.tmpl-toggle.remove{color:var(--ink-soft);}
.tmpl-lib-list{display:flex;flex-direction:column;gap:8px;}
.tmpl-lib-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;}
.tmpl-lib-icon{width:32px;height:32px;border-radius:9px;background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-lib-icon svg{width:16px;height:16px;}
.tmpl-lib-info{flex:1;min-width:0;}
.tmpl-lib-name{font-size:var(--fs-md);font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmpl-lib-meta{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;margin-top:1px;}
.tmpl-lib-chevron{color:var(--ink-soft);display:flex;flex-shrink:0;}
.tmpl-lib-chevron svg{width:15px;height:15px;}
/* Deleting a whole template is a lighter-weight action than discarding an in-progress session, so
   its trash icons read as neutral gray here rather than the alarming red used elsewhere. */
.tmpl-lib-row .phase-box-del{color:var(--ink-soft);}
.tmpl-sum-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs-sm);font-weight:700;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--chalk-dim);color:var(--ink);}
.tmpl-sum-row.bad .tmpl-sum-warn{color:var(--warn);}
.tmpl-sum-row.ok .tmpl-sum-warn{color:var(--turf);}
/* ---------- Training Session Settings (Settings > Training Session Settings) ---------- */
.tsg-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;}
.tsg-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.tsg-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tsg-card-icon svg{width:18px;height:18px;}
.tsg-card-headtext{flex:1;min-width:0;}
.tsg-card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);text-transform:uppercase;letter-spacing:0.02em;color:var(--text-primary);}
.tsg-card-sub{font-size:var(--fs-md);color:var(--ink-soft);font-weight:600;margin-top:2px;}
.tsg-card-pctbadge{font-size:var(--fs-xl);font-weight:800;color:var(--turf);flex-shrink:0;font-variant-numeric:tabular-nums;}
.tsg-phase-rows{display:flex;flex-direction:column;gap:10px;}
.tsg-phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chalk-dim);border-radius:12px;padding:10px 12px 10px 14px;}
.tsg-phase-label{font-size:var(--fs-lg);font-weight:700;color:var(--text-primary);}
.tsg-stepper{display:flex;flex-direction:row;align-items:center;gap:10px;flex-shrink:0;}
.tsg-chev{width:var(--icon-btn-lg);height:var(--icon-btn-lg);border-radius:12px;border:1.5px solid var(--line);background:var(--bg-surface);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tsg-chev svg{width:22px;height:22px;}
.tsg-chev:disabled{opacity:var(--opacity-disabled);}
.tsg-chev:active:not(:disabled){background:var(--chalk-dim);}
.tsg-pct-val{font-size:var(--fs-2xl);font-weight:800;min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;}
.settings-wip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:60px 20px;color:var(--ink-soft);}
.settings-wip svg{width:40px;height:40px;opacity:.5;}
.settings-wip-title{font-size:var(--fs-xl);font-weight:800;color:var(--ink);}
.settings-wip-sub{font-size:var(--fs-base);}
.pps-dots{display:flex;gap:8px;margin-bottom:10px;}
.pps-dot{
  flex:1;min-width:0;height:36px;border-radius:9px;border:none;
  display:flex;align-items:center;justify-content:center;
}
.pps-dot svg{width:16px;height:16px;}
.pps-caption{display:flex;justify-content:space-between;margin-top:6px;font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;}
.pps-caption b{color:var(--pitch-dark);}
.pps-btn-row{display:flex;gap:8px;margin-top:10px;}
/* Both buttons in this row are pinned to the same fixed height (41px, matching what this row
   already rendered at before this batch) so a two-line "Next: [Section]" label never grows the
   row -- padding differs between the two buttons instead, since .pps-next-btn needs more of its
   fixed height back for the second text line. */
.pps-secondary-btn{
  /* matches the app's existing .btn-ghost secondary-action look, so it correctly follows
     light/dark theme instead of a hardcoded gray that never changed */
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--chalk-dim);color:var(--ink);
  height:41px;padding:12px 8px;font-weight:700;font-size:var(--fs-base);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.pps-secondary-btn svg{width:14px;height:14px;flex-shrink:0;}
.pps-next-btn{
  /* matches the app's existing .btn-primary look, for the same theme-following reason as above */
  flex:1;min-width:0;border:1.5px solid var(--pitch);border-radius:12px;background:var(--pitch);color:#fff;
  height:41px;padding:6px 10px;font-weight:700;font-size:var(--fs-base);white-space:nowrap;
  display:flex;align-items:center;justify-content:flex-start;gap:6px;
}
.pps-next-btn svg{width:13px;height:13px;flex-shrink:0;}
.pps-next-lines{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;line-height:1.05;}
.pps-next-line1{font-size:var(--fs-xs);font-weight:600;opacity:0.78;}
.pps-next-line2{font-size:var(--fs-base);font-weight:700;letter-spacing:-0.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

/* ---------- Batch 60: compact "Building Practice" header (picking mode) ---------- */
.sbb-compact-row1{display:flex;align-items:center;gap:6px;}
.sbb-back-row{display:flex;}
.sbb-compact-title{
  flex:1;min-width:0;text-align:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-base);text-transform:uppercase;letter-spacing:0.03em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sbb-compact-title.left{text-align:left;margin-top:8px;}
.sbb-title-spacer{width:58px;flex-shrink:0;}
.sbb-compact-stats{font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.sbb-compact-stats b{color:var(--ink);}
.sbb-compact-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.sbb-compact-count{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);}
.sbb-full-link{
  position:relative;z-index:1;display:flex;align-items:center;gap:5px;
  background:var(--pitch-dark);border:1px solid var(--pitch-dark);border-radius:8px;
  padding:7px 11px;font-size:var(--fs-base);font-weight:700;color:white;flex-shrink:0;
}
.sbb-full-link svg{width:14px;height:14px;}
.sbb-full-link:active{opacity:0.7;}
/* Batch 61: back to the pre-batch-60 dots' equal-width, always-one-line proportions -- no
   horizontal scroll -- but each chip now stacks its icon above a short label instead of being
   icon-only. */
.pps-nav-row{display:flex;gap:6px;}
.pps-navchip{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:auto;min-height:46px;padding:6px 2px;border-radius:10px;border:none;
}
.pps-navchip svg{width:16px;height:16px;flex-shrink:0;}
.pps-navchip span{font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.phase-structure-strip{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:8px;}
.psc-chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;}
.psc-icon{display:flex;width:13px;height:13px;}
.psc-icon svg{width:13px;height:13px;}
.psc-arrow{display:flex;width:12px;height:12px;color:var(--ink-soft);opacity:0.5;flex-shrink:0;}
.psc-arrow svg{width:12px;height:12px;}

/* "Adding to: X" is a context label, not a tappable control -- it has no onclick, so it should
   never look like a button. A colored icon + bold colored phase name on a transparent background,
   with a thin colored underline for structure, keeps it legible without implying it's interactive. */
.sbb-adding-pill{display:flex;align-items:center;gap:7px;padding:0 0 9px;font-size:var(--fs-base);font-weight:600;margin-bottom:10px;border-bottom:1.5px solid var(--line);color:var(--ink-soft);}
.sbb-adding-pill svg{width:15px;height:15px;flex-shrink:0;}
.sbb-adding-pill b{font-weight:800;}

/* Shown instead of the full picking box while just browsing the library (not actively adding to a
   specific phase) with a draft already started elsewhere -- low-profile, tap to jump back in. */
.draft-pill-banner{display:flex;align-items:center;gap:9px;width:100%;background:var(--bg-surface);border:1.5px solid var(--turf);border-radius:12px;padding:9px 12px;text-align:left;}
.draft-pill-banner img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.dpb-text{flex:1;min-width:0;font-size:var(--fs-base);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dpb-text b{color:var(--turf);}
.dpb-cta{flex-shrink:0;font-size:var(--fs-sm);font-weight:700;color:var(--turf);display:flex;align-items:center;gap:2px;}
.dpb-cta svg{width:12px;height:12px;}

/* Save Draft sits opposite Discard on the same low-emphasis secondary row (turf green vs warn red)
   -- both are "leave the builder" actions, distinguished by whether the draft survives. */
.draft-save-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--turf);font-size:var(--fs-sm);font-weight:700;padding:6px 0;}
.draft-save-btn svg{width:13px;height:13px;}

/* New Training Session page's Save Draft / Discard row -- real full-width buttons underneath
   the last phase box (Scrimmage), not the plain text links used elsewhere. */
.build-bottom-actions{display:flex;gap:10px;margin-top:14px;}
.bba-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 0;font-weight:700;font-size:var(--fs-md);border:1.5px solid var(--line);background:var(--bg-surface);}
.bba-btn:active{background:var(--chalk-dim);}
.bba-btn svg{width:14px;height:14px;flex-shrink:0;}
.bba-btn.discard{border-color:var(--warn);color:var(--warn);}
/* Review page's row only: Discard Session toned down to gray (this is the "softer" review-stage
   discard -- Save Draft is right next to it as the safe option), and all three buttons sized to
   match the "Save Session" button's height above them. Forcing single-line text and giving
   Discard Session extra flex share (its label is by far the longest) keeps the row's natural
   height in lockstep with Save Session's -- measured and matched exactly via Playwright. */
.build-bottom-actions.trio .bba-btn{white-space:nowrap;font-size:var(--fs-base);padding:15px 0;}
.build-bottom-actions.trio .bba-btn.discard{flex:1.2;border-color:var(--line);color:var(--ink-soft);}

/* Small translucent icon buttons for a detail-header top row (Edit / Favorite on a saved session),
   matching .backbtn's treatment at a smaller size since there are two of them side by side. */
.dh-icon-btn{background:rgba(255,255,255,0.15);border:none;width:var(--icon-btn-md);height:var(--icon-btn-md);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0;}
.dh-icon-btn svg{width:16px;height:16px;}
.dh-icon-btn.on svg{color:var(--turf);}

/* Favorite star on a saved-session list row -- session-row became a div (see renderSessions) so
   this button is a proper sibling instead of an invalid nested button. */
.session-fav-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--ink-soft);}
.session-fav-btn svg{width:18px;height:18px;}
.session-fav-btn.on svg{color:var(--turf);}
.session-del-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--warn);}
.session-del-btn svg{width:17px;height:17px;}

/* Home screen "session first" cards (2026-09 redesign) -- Continue Session keeps the same teal
   brand-accent identity the old .continue-draft-banner used for in-progress/positive states, just
   promoted to a full card since it's now the dominant element on the page when a draft exists. */
/* ---------- home hero (mockup-inspired top banner) ---------- */
.home-hero{
  /* Bleeds edge-to-edge under the (unchanged) global topbar by canceling out .section-pad's own
     padding with a matching negative margin -- .section-pad's left/right is overridden to 20px
     elsewhere in this file, its top/bottom stays the base rule's 16px. */
  background:var(--cone);margin:-16px -20px 0;padding:14px 20px 26px;
  border-radius:0 0 28px 28px;
}
.home-hero-eyebrow{font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;font-size:var(--fs-sm);color:var(--pitch-dark);opacity:0.65;}
.home-hero h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-display);line-height:1.05;color:var(--pitch-dark);margin:2px 0 8px;text-transform:uppercase;letter-spacing:-0.02em;}
.home-hero-sub{font-size:var(--fs-md);color:var(--pitch-dark);opacity:0.7;margin:0 0 18px;max-width:80%;}
.home-hero-cta{
  display:inline-flex;align-items:center;gap:10px;
  background:#0B0F1A;color:#fff;border:none;border-radius:14px;
  padding:10px 18px 10px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);
}
.hhc-plus{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hhc-plus svg{width:14px;height:14px;}
.hhc-chev{margin-left:6px;display:flex;flex-shrink:0;}
.hhc-chev svg{width:16px;height:16px;}

/* ---------- continue session (light card, per mockup) ---------- */
.home-continue-card{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:14px 60px 14px 14px;margin-top:18px;margin-bottom:4px;
}
.hcc-icon{width:52px;height:52px;border-radius:12px;background:var(--turf-dim);color:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.hcc-icon svg{width:22px;height:22px;}
.hcc-icon img,.hcc-icon video{width:100%;height:100%;object-fit:cover;}
.hcc-body{flex:1;min-width:0;}
.hcc-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--ink);margin-top:2px;}
.hcc-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.hcc-progress-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.hcc-progress-row .progress-track{flex:1;}
.hcc-pct{font-size:var(--fs-xs);color:var(--ink-soft);white-space:nowrap;font-weight:600;}
.hcc-chevron-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
  background:var(--turf-dim);color:var(--turf);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hcc-chevron-btn svg{width:16px;height:16px;}

/* ---------- featured exercise (light card, per mockup) ---------- */
.home-featured-card{
  display:block;width:100%;text-align:left;
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;
}
.hfc-top{display:flex;gap:12px;align-items:flex-start;}
.hfc-icon{width:92px;height:92px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.hfc-icon svg{width:28px;height:28px;}
.hfc-icon img,.hfc-icon video{width:100%;height:100%;object-fit:cover;}
.hfc-body{flex:1;min-width:0;}
.hfc-meta{font-size:var(--fs-xs);font-weight:700;color:var(--turf);text-transform:uppercase;letter-spacing:0.05em;}
.hfc-name{font-family:'Barlow Condensed',sans-serif;font-size:var(--fs-lg);font-weight:700;color:var(--ink);margin-top:2px;line-height:1.15;}
.hfc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.hfc-tags span{font-size:var(--fs-2xs);font-weight:700;color:var(--ink-soft);background:var(--chalk-dim);border-radius:20px;padding:3px 9px;}
.hfc-desc{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.4;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hfc-link{
  /* Less prominent than the bright --cone CTA yellow -- this is a "read more" action on a
     card the coach is already looking at, not the primary thing this screen wants tapped. */
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  background:var(--chalk-dim);color:var(--ink);font-weight:700;font-size:var(--fs-sm);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;
}
.hfc-link svg{width:13px;height:13px;}
.home-empty-recent{background:var(--bg-surface);border:1px dashed var(--line);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.home-feed-header h2{font-size:var(--fs-base);opacity:0.75;}

/* ---------- editable fields ---------- */
[contenteditable="true"]{
  outline:none;border-radius:6px;transition:background .12s;
  padding:2px 4px;margin:-2px -4px;
}
[contenteditable="true"]:hover{background:var(--chalk-dim);}
[contenteditable="true"]:focus{background:var(--turf-dim);box-shadow:0 0 0 1.5px var(--turf);}
.edit-hint{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;
  margin-left:6px;opacity:0.65;
}
.edit-hint svg{width:10px;height:10px;}
.editable-title[contenteditable="true"]{display:inline-block;min-width:40px;}
input.section-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-input);text-transform:uppercase;letter-spacing:0.02em;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 4px;width:100%;outline:none;
}
input.section-title-input:focus{border-color:var(--turf);}

/* ---------- media / gif box ---------- */
.media-box{
  margin:16px 18px 0;height:220px;border-radius:14px;overflow:hidden;position:relative;
  background:var(--chalk-dim);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;}
.media-box-placeholder{flex-direction:column;gap:8px;color:var(--ink-soft);}
.media-box-placeholder svg{width:28px;height:28px;opacity:0.6;}
.media-box-placeholder span{font-size:var(--fs-base);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.media-error-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--chalk-dim);color:var(--ink-soft);text-align:center;overflow:hidden;}
.media-error-fallback svg{width:18px;height:18px;opacity:0.6;flex-shrink:0;}
.media-error-fallback span{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:0 4px;line-height:1.25;}

/* Video thumbnails everywhere except the Detail page: shows the clip's first frame only (no
   playback), with a small play badge so it still reads as "tap to watch", not a broken image. */
.media-still-wrap{position:relative;overflow:hidden;}
.media-still-wrap video{pointer-events:none;}
.media-play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;background:rgba(16,20,31,0.55);
  display:flex;align-items:center;justify-content:center;color:white;
}
.media-play-badge svg{width:15px;height:15px;margin-left:2px;}
.media-input-row{display:flex;gap:8px;padding:0 18px;margin-top:10px;}
.media-input-row input{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:var(--fs-input);outline:none;
}
.media-input-row input:focus{border-color:var(--turf);}
.media-input-row button{background:var(--pitch);color:white;border:none;border-radius:10px;padding:0 18px;font-size:var(--fs-md);font-weight:700;}

.video-row{
  display:flex;align-items:center;gap:10px;padding:6px 18px 4px;
}
.video-link-btn{
  display:inline-flex;align-items:center;gap:5px;background:var(--chalk-dim);color:var(--ink-soft);
  border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:var(--fs-sm);font-weight:700;flex-shrink:0;
}
.video-link-btn svg{width:11px;height:11px;}

/* ---------- sessions list / detail ---------- */
.session-row{
  display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;text-align:left;width:100%;min-height:64px;
  cursor:pointer;
}
.session-row .srthumb{
  width:44px;height:44px;border-radius:10px;background:var(--pitch);color:white;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.session-row .srthumb svg{width:20px;height:20px;}
.session-row .srthumb img.icon-ball-img{width:20px;height:20px;display:block;}
.session-row .srname{font-size:var(--fs-md);font-weight:700;color:var(--text-primary);}
.session-row .srmeta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;}
.session-row .srmeta.structure{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.session-row .srmeta svg{width:12px;height:12px;flex-shrink:0;}
.session-row .srchevron{margin-left:auto;color:var(--ink-soft);flex-shrink:0;}
.session-row .srchevron svg{width:16px;height:16px;}
.recent-clickable{cursor:pointer;}
.recent-clickable:hover{background:var(--chalk-dim);}

.sd-meta-row{display:flex;gap:10px;margin-top:14px;}
.rate-session-box{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
.rate-session-title{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:10px;color:var(--text-primary);}
.star-row{display:flex;gap:6px;margin-bottom:10px;}
.star-btn{background:none;border:none;padding:2px;display:flex;}
.star-btn svg{width:26px;height:26px;color:var(--line);}
.star-btn.filled svg{color:var(--turf);fill:var(--turf);}
.rate-comment{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg-main);color:var(--text-primary);padding:10px;font-family:inherit;font-size:var(--fs-input);resize:vertical;}
.rate-comment:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.sd-phases .phase-title{font-size:var(--fs-md);}
.sd-meta{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;flex:1;}
.sd-meta .smnum{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--text-primary);}
.sd-meta .smlbl{font-size:var(--fs-sm);color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
</style>

<style>
/* ---- FT2 Brand v2 flourish: rounded corners (12-16px cards, 10-12px controls, per the brand
   guide's radius table), inverted primary CTAs, generous whitespace ----
   A prior "Nike sharp corners" pass used to force every card/button to border-radius:0 here.
   The brand guidelines v2.0 call for rounded corners instead, and each of those elements already
   carries its own radius rule elsewhere (e.g. .btn's 12px, --radius-card's 14px) that's now free
   to apply -- so removing the force-zero rule was the whole fix, no per-selector rewrite needed. */
body{background:var(--bg-main);}
/* Pills/circles that must stay fully round regardless of any element-level radius: topbar icon
   buttons, the coach-initials avatar, and filter/tag chips. */
.icon-btn,.avatar,.qp-info-btn,.qp-close-btn{
  border-radius:50% !important;
}
.qf-chip{
  border-radius:var(--radius-pill) !important;
}
.btn-primary,.build-cta .btn-primary{
  background:#F7FF00 !important;color:#0B0F1A !important;
}
.section-pad{padding-left:20px;padding-right:20px;}
.mac-tile{padding:16px 14px;}
* { transition:background-color .15s ease,color .15s ease,border-color .15s ease; }
</style>
</head>

/* ============ SECTION STYLE (color + icon families) ============ */
/* FT2 Brand Guidelines v2 six-phase system -- each phase gets its own two-stop gradient.
   `color` is the gradient's flat first-stop hex, for contexts that can't gradient-fill (text
   color, border-color). `bg` is the actual gradient, for surface fills (card thumbnails, the
   exercise-detail header, active filter chips). */
const SECTION_STYLE = {
  'Warmup':  {color:'var(--sec-warmup)',   bg:'var(--sec-warmup-bg)',   textOn:'white', icon: ICONS.flame},
  'Athletic': {color:'var(--sec-athletic)', bg:'var(--sec-athletic-bg)', textOn:'white', icon: ICONS.bolt},
  'Duels':    {color:'var(--sec-duels)',    bg:'var(--sec-duels-bg)',    textOn:'white', icon: ICONS.swords},
  'Rondos':   {color:'var(--sec-rondos)',   bg:'var(--sec-rondos-bg)',   textOn:'white', icon: ICONS.circleArrows},
  'SSGs':     {color:'var(--sec-ssg)',      bg:'var(--sec-ssg-bg)',      textOn:'white', icon: ICONS.pitch},
  'Scrimmage':{color:'var(--sec-scrimmage)',bg:'var(--sec-scrimmage-bg)',textOn:'dark',  icon: ICONS.trophy},
};
function secStyle(section){ return SECTION_STYLE[section] || {color:'var(--pitch)', bg:'var(--pitch)', textOn:'white', icon: ICONS.pitch}; }

/* ============ DATA ============ */
const EXERCISES = JSON.parse(document.getElementById('exercise-data').textContent);
/* Normalizes one exercise record's fields — used both for the bundled starting data and for
   rows freshly pulled from the live Google Sheet, so both paths behave identically. */
// A Diagram/Video URL cell that isn't actually a link (a stray note like "Insta" landing in the
// wrong spreadsheet column, a typo, etc.) would otherwise get handed straight to an <img>/<video>
// src and render as a blank or broken tile instead of the normal fallback icon. Treat anything
// that doesn't look like a real link the same as if the cell were empty.
function looksLikeMediaUrl(v){
  if(typeof v !== 'string') return false;
  const s = v.trim();
  return /^https?:\/\//i.test(s) || /^data:(image|video)\//i.test(s);
}
// Trims whitespace and folds legacy/casing variants (a lingering "Warm Up" from before the
// single-word rename, stray capitalization, a trailing space from a copy-paste) onto the section
// names the app actually knows about -- so a formatting slip in the sheet doesn't silently zero
// out a section filter (e.g. picking exercises for the Warmup phase showing no results). Anything
// unrecognized is left as-is (trimmed) so custom, coach-added sections still work.
const SECTION_ALIASES = {
  'warm up':'Warmup', 'warmup':'Warmup', 'athletic':'Athletic', 'duels':'Duels',
  'rondos':'Rondos', 'ssgs':'SSGs', 'ssg':'SSGs', 'scrimmage':'Scrimmage',
};
function normalizeSectionValue(v){
  if(v===undefined || v===null) return v;
  const trimmed = String(v).trim();
  if(!trimmed) return trimmed;
  return SECTION_ALIASES[trimmed.toLowerCase()] || trimmed;
}
// Guards against duplicate or blank Exercise IDs (most often: a new row copied from an existing
// one whose ID column never got changed, or was left blank). Without this, EXERCISES.find(e =>
// e.id === id) always resolves to whichever colliding row comes first in the sheet -- so tapping
// one exercise's tile can silently open a completely different exercise's detail page. Instead of
// failing silently, every row is guaranteed a unique id, and the collision is flagged (via the
// return value, surfaced as a Home-screen banner) rather than causing confusing navigation.
function dedupeExerciseIds(list){
  const seen = new Map();
  let hadIssue = false;
  list.forEach((e, i) => {
    let id = (e.id || '').trim();
    if(!id){
      hadIssue = true;       // blank ID -- flag it, even though the fallback below keeps it unique
      id = '_ROW' + i;
    }
    if(seen.has(id)){
      hadIssue = true;       // a real duplicate, not just a blank
      const n = seen.get(id) + 1;
      seen.set(id, n);
      e.id = id + '-dup' + n;
    } else {
      seen.set(id, 0);
      e.id = id;
    }
  });
  return hadIssue;
}
function normalizeExerciseRecord(e){
  if(e.mediaUrl===undefined) e.mediaUrl=null;
  if(e.videoUrl===undefined) e.videoUrl=null;
  if(e.mediaUrl && !looksLikeMediaUrl(e.mediaUrl)) e.mediaUrl=null;
  if(e.videoUrl && !looksLikeMediaUrl(e.videoUrl)) e.videoUrl=null;
  e.section = normalizeSectionValue(e.section);
  if(e.location===undefined || e.location===null || e.location===''){
    const text = (e.name + ' ' + (e.setup||'') + ' ' + (e.description||'')).toLowerCase();
    e.location = text.includes('wall') ? 'indoor' : 'both';
  } else {
    e.location = String(e.location).toLowerCase();
    if(!['indoor','outdoor','both'].includes(e.location)) e.location = 'both';
  }
  return e;
}
EXERCISES.forEach(normalizeExerciseRecord);
const bundledHadIdCollision = dedupeExerciseIds(EXERCISES);

function parseDifficultyField(v){

async function syncExercisesFromSheet(){
  let rows = null;
  let usedSource = null;

  // Preferred: Apps Script Web App — works even though the sheet itself is private.
  if(APPS_SCRIPT_URL){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        rows = data.map(jsonRowToExercise);
        usedSource = 'Apps Script';
      }
    } catch(err){
      console.warn('Apps Script sync skipped:', err.message);
    }
  }

  // Fallback: direct CSV export — only works if the sheet is shared "Anyone with the link — Viewer".
  if(!rows){
    try{
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
      const csvText = await res.text();
      if(typeof Papa === 'undefined') throw new Error('CSV parser not loaded');
      const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
      const csvRows = parsed.data.filter(r => (r['Exercise Name']||'').trim());
      if(csvRows.length){
        rows = csvRows.map(csvRowToExercise);
        usedSource = 'CSV export';
      }
    } catch(err){
      console.warn('CSV sheet sync skipped:', err.message);
    }
  }

  // Neither source worked (offline, opened as a local file, CSP blocking external fetch on a
  // hosted Artifact copy, a stale/redeployed Apps Script URL, etc.) — keep the bundled data, but
  // (unlike before) tell the coach so a stale copy never masquerades as current. This is the
  // single most likely explanation any time a recently-added video or diagram link "isn't
  // showing up" on a phone: the newest sheet edits never made it down to that device.
  if(!rows){ state.dataSource = 'offline'; render(); return; }
  state.dataSource = 'live';

  // Keep any locally-attached media (e.g. animated diagrams built directly in the app) for
  // exercises the sheet doesn't have a Diagram URL for yet, matched by name.
  const localMediaByName = {};
  EXERCISES.forEach(e => { if(e.mediaUrl) localMediaByName[e.name] = e.mediaUrl; });

  const fresh = rows.map(e => {
    if(!e.mediaUrl && localMediaByName[e.name]) e.mediaUrl = localMediaByName[e.name];
    return normalizeExerciseRecord(e);
  });

  EXERCISES.length = 0;
  // Coach-created exercises (saveDraftExercise()) never come from the sheet -- keep them on top
  // of a fresh sync instead of a resync silently deleting them. Re-run dedupe against the whole
  // merged set, not just the sheet rows, since a local exercise's auto-assigned id could now
  // collide with something newly added to the sheet.
  EXERCISES.push(...state.localExercises, ...fresh);
  state.hasIdCollision = dedupeExerciseIds(EXERCISES);
  render();
  showToast(`Synced with your live exercise sheet (${usedSource})`);
}

// showing VALID_VALUES_FALLBACK, same "stale bundled copy, no crash" behavior as EXERCISES.

   pretend to be current data. See claude_FT2_AppsScript_Code.gs for the server side. */
function normalizeCloudSession(c){
  return {
    id: String(c.id), name: c.name || 'Untitled Practice', createdBy: c.createdBy || 'Unknown coach',
    createdAt: Number(c.createdAt) || Date.now(),
    totalMin: Number(c.totalMin) || 0, exCount: Number(c.exCount) || 0,
    targetDuration: Number(c.targetDuration) || 60,

async function syncSessionsFromSheet(){
  if(!APPS_SCRIPT_URL) return;
  try{
    // &coach= tells the server who's asking, so it can leave out anyone else's Private sessions
    // entirely instead of sending every private row to every device (see readSessions() server-side).
    const res = await fetch(APPS_SCRIPT_URL + '?sheet=sessions&coach=' + encodeURIComponent(state.coachName), {cache:'no-store'});
    if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
    const cloud = await res.json();
    if(!Array.isArray(cloud)) throw new Error((cloud && cloud.error) || 'Unexpected sessions response');

    // Merge rather than replace outright: a session this device saved/edited but hasn't
    // successfully pushed yet (_syncPending) stays as our local copy until it confirms -- the
    // Sheet is the source of truth for everything else, including sessions from other coaches.
    const localById = new Map(state.savedSessions.map(s=>[s.id, s]));
    const seenIds = new Set();
    const merged = cloud.map(c => {
      seenIds.add(String(c.id));
      const local = localById.get(String(c.id));
      return (local && local._syncPending) ? local : normalizeCloudSession(c);
    });
    state.savedSessions.forEach(s => { if(!seenIds.has(String(s.id))) merged.push(s); }); // local-only, never yet synced (e.g. saved while offline)
    state.savedSessions = merged;
    state.sessionsSyncSource = 'live';
    render();
    retryPendingSessionPushes();
  } catch(err){
    console.warn('Session sync skipped:', err.message);
    state.sessionsSyncSource = 'offline';
    render();
  }
}
// The client always sends the WHOLE current session object; the server always replaces the whole
// row (see upsertSession() server-side) -- this one function covers create, rename, rate,
// favorite, visibility, and add/remove-exercise, since every one of those already ends with the
// caller mutating the local session object and calling render().
async function pushSessionToSheet(session){
  session._syncPending = true;
  if(!APPS_SCRIPT_URL) return;
  try{
    const {_syncPending, ...payload} = session;
    // Deliberately no explicit Content-Type header: Apps Script Web Apps don't handle the
    // CORS preflight (OPTIONS) request a declared "application/json" body would trigger from a
    // browser, so this relies on fetch's default text/plain body type to stay a "simple request".
    // The server reads the raw body regardless of declared type, so this doesn't affect parsing.
    // requestingCoach lets the server check this against who the session is actually stored as
    // belonging to before allowing the edit -- see upsertSession() server-side.
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'upsert', session:payload, requestingCoach: state.coachName}) });
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data && data.error) || 'Save did not confirm');
    session._syncPending = false;
  } catch(err){
    console.warn('Session push failed, will retry next sync:', err.message);
  }
  render();
}
async function deleteSessionFromSheet(id){
  if(!APPS_SCRIPT_URL) return;
  try{
    await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'delete', session:{id}, requestingCoach: state.coachName}) });
  } catch(err){
    console.warn('Session delete-sync failed (it stays deleted locally either way):', err.message);
  }
}
function retryPendingSessionPushes(){
  state.savedSessions.filter(s=>s._syncPending).forEach(s => pushSessionToSheet(s));
}

// Coaching guideline for how a session's time should roughly break down -- simplified from 6
// equal-weight sections into 3 higher-level practice phases, easier for a coach to read at a
// glance: Activate (Warmup + Athletic), Develop (Duels + Rondos + Small Sided Games), and Play
// (Scrimmage). phaseKeys lists which PHASES entries roll up into each group (in display order);
// sublabel is the human-readable "what's in this phase" line shown under each group's heading.
// This is also the single source of truth for the PHASES-to-phase-group mapping --
// computeGroupMinutes(), computeGroupMinutesFromPhases(), reviewPhaseGroups(), and
// sessionDetailPhaseGroups() all derive from it, so the grouping is only ever defined once.
const PHASE_GROUPS = [
  {key:'activate', label:'Activate', pct:25, phaseKeys:['warmup','athletic'],    sublabel:'Warmup + Athletic',                  color:'var(--sec-warmup)',    bg:'var(--sec-warmup-bg)',    textOn:'white', icon: ICONS.flame},
  {key:'develop',  label:'Develop',  pct:50, phaseKeys:['duels','rondos','ssg'], sublabel:'Duels + Rondos + Small Sided Games', color:'var(--sec-duels)',     bg:'var(--sec-duels-bg)',     textOn:'white', icon: ICONS.circleArrows},
  {key:'play',     label:'Play',     pct:25, phaseKeys:['scrimmage'],            sublabel:'Scrimmage',                          color:'var(--sec-scrimmage)', bg:'var(--sec-scrimmage-bg)', textOn:'dark',  icon: ICONS.trophy},
];
/* Suggested-split minutes, rounded to the nearest 5m for a cleaner readout (e.g. ~11m -> 10m,
   ~19m -> 20m) without letting the rounded total run over the session's target length when
   avoidable -- trims 5m at a time from whichever phase group is currently furthest above its
   own raw (un-rounded) share until the rounded total fits, or every group has hit 0. */
function suggestedSplitMinutes(target){
  const raw = PHASE_GROUPS.map(s => target * s.pct / 100);
  const rounded = raw.map(r => Math.max(0, Math.round(r/5)*5));
  let total = rounded.reduce((a,b)=>a+b,0);
  while(total > target){
    let idx = -1, bestOver = -Infinity;
    rounded.forEach((r,i) => {
      if(r <= 0) return;
      const over = r - raw[i];
      if(over > bestOver){ bestOver = over; idx = i; }
    });
    if(idx === -1) break;
    rounded[idx] -= 5;
    total -= 5;
  }
  return rounded;
}

// Counts how many values two tag arrays have in common -- used by similarityScore() below.
function tagOverlapCount(a, b){
  if(!a || !a.length || !b || !b.length) return 0;
  let n = 0;
  for(const t of a){ if(b.includes(t)) n++; }
  return n;
}
// "Similar Exercises" ranking: total shared Format/Technical/Physical/Cognitive tags between two
// exercises. Tactical and Engagement are deliberately excluded (matches the exact fields the
// coach asked "Similar Exercises" to consider).
function similarityScore(a, b){
  return tagOverlapCount(a.formatTags, b.formatTags)
       + tagOverlapCount(a.technicalTags, b.technicalTags)
       + tagOverlapCount(a.physicalTags, b.physicalTags)
       + tagOverlapCount(a.cognitiveTags, b.cognitiveTags);
}

// Location filter options for the Filters sheet: derived from whatever values are actually
// present on current exercises (there's no "Valid Values" tab entry for Location to narrow

function locationOptions(){

    const key = raw.toLowerCase();
    if(!seen.has(key)) seen.set(key, key.charAt(0).toUpperCase()+key.slice(1));
  });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}
// Granular per-value filter sections on the Filters sheet, in display order.
const TAG_FILTER_SECTIONS = [
  {label:'Format',     validKey:'Format Tags',     fieldKey:'formatTags'},
  {label:'Physical',   validKey:'Physical Tags',   fieldKey:'physicalTags'},
  {label:'Tactical',   validKey:'Tactical Tags',   fieldKey:'tacticalTags'},

  {label:'Cognitive',  validKey:'Cognitive Tags',  fieldKey:'cognitiveTags'},
  {label:'Engagement', validKey:'Engagement Tags', fieldKey:'engagementTags'},
];
// Chip options for one tag-filter section: the canonical Valid Values order, narrowed to values
// that actually appear on at least one exercise right now (so a chip is never a guaranteed-empty
// filter), plus any real-data values missing from the canonical list appended alphabetically.
function filterValueOptions(validKey, fieldKey){
  const canonical = state.validValues[validKey] || [];
  const used = new Set();
  EXERCISES.forEach(ex => (ex[fieldKey]||[]).forEach(v => { if(v) used.add(v); }));
  const ordered = canonical.filter(v => used.has(v));
  const extra = [...used].filter(v => !canonical.includes(v)).sort((a,b)=>a.localeCompare(b));
  return [...ordered, ...extra];
}

function exById(id){
  if(state.draftExercise && state.draftExercise.id === id) return state.draftExercise;
  return EXERCISES.find(e => e.id === id);

/* Renders an exercise's media as the right tag: <video> for MP4/WebM/MOV exports (e.g. from
   tactical-board.com), <img> for GIF/PNG/JPEG/etc. extraStyle sizes the element/wrapper.
   autoplay (default true) controls playback: the Detail page passes true so a coach sees the
   drill actually run as soon as they open it; every thumbnail context (grid cards, build-list
   rows, session review, similar-exercises) passes false so the same video shows only its first
   frame as a still — no small autoplaying videos competing for attention in a scrolling list,
   and far less bandwidth than playing every visible video at once. A small play badge marks
   still frames as tappable-to-watch so it doesn't read as a broken image. */
function isVideoUrl(url){
  return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
}
let mediaFallbackSeq = 0;
const mediaFallbackHtml = {};
function mediaTagHtml(url, altText, extraStyle, autoplay, fallbackHtml){
  if(autoplay === undefined) autoplay = true;
  const style = extraStyle || '';
  // fallbackHtml, when given, is the exact same markup this call site already uses for its own
  // "no media at all" case -- stashed by id (not inlined into the onerror attribute -- it can
  // contain quotes/markup that wouldn't survive that) so a broken link renders identically to a
  // missing one, instead of always falling back to one generic gray box with no section context.
  let fid = '';
  if(fallbackHtml){
    fid = 'mf'+(++mediaFallbackSeq);
    mediaFallbackHtml[fid] = fallbackHtml;
  }
  if(isVideoUrl(url)){
    if(autoplay){
      return `<video src="${escAttr(url)}" autoplay muted loop playsinline style="${style}" onerror="mediaLoadFailed(this,'${fid}')"></video>`;
    }
    // Plain first-frame still, no play badge overlay -- reads as a normal photo thumbnail.
    return `<div class="media-still-wrap" style="${style}">
      <video src="${escAttr(url)}#t=0.1" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;" onloadedmetadata="this.currentTime=0.1" onerror="mediaLoadFailed(this,'${fid}')"></video>
    </div>`;
  }
  return `<img src="${escAttr(url)}" alt="${escAttr(altText||'')}" style="${style}" onerror="mediaLoadFailed(this,'${fid}')">`;
}
/* A Diagram URL that's set but unreachable/invalid (wrong link type -- a Google Drive share page
   or YouTube page instead of a direct file link -- a typo'd/renamed filename, or a link accidentally
   pasted into the wrong Sheet column) previously showed the browser's own bare broken-image icon,
   with zero indication anything was wrong or why. Swap it for a "Diagram coming soon" placeholder --
   the caller's own fallbackHtml (matching what it shows for "no media at all") when one was given,
   otherwise a generic fallback, so a bad link degrades gracefully everywhere mediaTagHtml() is used
   (exercise cards, the Detail page, session rows, Similar Exercises). */
function mediaLoadFailed(el, fid){
  if(el.dataset.mediaFailed) return;
  el.dataset.mediaFailed = '1';
  const wrap = el.closest('.media-still-wrap');
  const target = wrap || el;
  const custom = fid && mediaFallbackHtml[fid];
  if(custom){
    const temp = document.createElement('div');
    temp.innerHTML = custom;
    const fallback = temp.firstElementChild;
    if(fallback){
      target.replaceWith(fallback);
      delete mediaFallbackHtml[fid];
      return;
    }
  }
  const style = target.getAttribute('style') || '';
  const fallback = document.createElement('div');
  fallback.className = 'media-error-fallback';
  fallback.setAttribute('style', style);
  fallback.innerHTML = `${ICONS.image}<span>Diagram coming soon</span>`;
  target.replaceWith(fallback);
}
function allTagsFor(ex){
  return [...ex.technicalTags, ...ex.tacticalTags, ...ex.formatTags, ...ex.physicalTags, ...ex.cognitiveTags, ...ex.engagementTags];
}

/* ============ TRAINING PROFILE ============ */
/* Canonical definition of the 4 core Training Dimensions the exercise repository scores every
   exercise on, 0-5 (0 = not meaningfully trained ... 5 = primary purpose). Deliberately excludes
   Engagement -- an activity characteristic, still available as Engagement Tags metadata, not a
   training dimension -- and Format/Duration/Difficulty/Location, which are activity
   characteristics too. This is the single source of truth for the 4 dimensions:
   TRAINING_DIMENSIONS (score-key/label pairs) and DIMENSION_TAG_CATEGORIES (score-key/valid-
   values-key pairs, used by dimensionForTagValue) are both derived from it below, and
   activeRankingDimensions() derives its tag-field-to-score-key map from it too, so the 4
   dimensions only ever need to be listed once. (The separate FOCUS_CATEGORIES constant above is
   intentionally NOT derived from this -- it's a different concept: a UI list of tag FIELDS for
   the Training Focus chips, with its own "Athletic" label for the Physical dimension, not the
   same thing as a Training Dimension SCORE.) */
const TRAINING_DIMENSION_DEFS = [
  {scoreKey:'technicalScore', label:'Technical', tagFieldKey:'technicalTags', validKey:'Technical Tags'},
  {scoreKey:'tacticalScore',  label:'Tactical',  tagFieldKey:'tacticalTags',  validKey:'Tactical Tags'},
  {scoreKey:'physicalScore',  label:'Physical',  tagFieldKey:'physicalTags',  validKey:'Physical Tags'},
  {scoreKey:'cognitiveScore', label:'Cognitive', tagFieldKey:'cognitiveTags', validKey:'Cognitive Tags'},
];
const TRAINING_DIMENSIONS = TRAINING_DIMENSION_DEFS.map(d => ({key:d.scoreKey, label:d.label}));
/* Normalizes one raw score value (from an exercise record, a saved-session snapshot, etc.) to
   either a number clamped to the valid 0-5 range, or null when it isn't usable data at all
   (missing/undefined/non-numeric/NaN). Used everywhere a Training Dimension score is read, so
   every consumer treats out-of-range or malformed data the same defensive way. Never invents a
   score -- null in, null out. */
function clampScore(raw){
  return (typeof raw === 'number' && !isNaN(raw)) ? Math.max(0, Math.min(5, raw)) : null;
}
/* Reads the 4 scores straight off the exercise record -- never computed or invented here.
   A missing score (null/undefined/non-numeric, e.g. a brand-new draft exercise that hasn't
   been scored yet) comes back as score:null so the caller can render an explicit "not scored"
   state. 0 is itself a valid, meaningful score ("not meaningfully trained"), so it must never
   be treated as a stand-in for "no data". */
function trainingProfileFor(ex){
  return TRAINING_DIMENSIONS.map(d => {
    const score = ex ? clampScore(ex[d.key]) : null;
    return {key: d.key, label: d.label, score};
  });
}
function trainingProfileRowHtml(dim){
  const scored = dim.score !== null;
  const filled = scored ? Math.round(dim.score) : 0;
  const dots = Array.from({length:5}, (_,i) => `<i class="tprof-dot ${i<filled?'on':''}"></i>`).join('');
  return `<div class="tprof-row ${scored?'':'tprof-row-unscored'}">
    <span class="tprof-label">${dim.label}</span>
    <span class="tprof-dots">${dots}</span>
    <span class="tprof-num">${scored?dim.score:'\u2014'}</span>
  </div>`;
}

/* ============ PRACTICE TRAINING PROFILE ============ */
/* Duration-weighted average of the same 4 Training Dimensions across every exercise in a
   practice (a build-in-progress or a saved/completed session) -- a 20-minute exercise
   contributes 4x as much as a 5-minute one, never a simple per-exercise average. Takes a
   plain {duration, scores}[] list rather than raw exercise objects so the same function
   works for a live build (scores read straight off the current EXERCISES data) and a saved
   session (scores read from that session's own frozen snapshot -- see completeSession()).
   A dimension with zero scored exercises anywhere in the practice comes back as score:null
   (nothing to average -- same "don't invent a number" rule as the per-exercise profile); an
   individual exercise missing just one dimension's score is excluded only from that
   dimension's average (its duration still counts toward whichever other dimensions it *is*
   scored on) rather than being treated as a 0, which would silently understate the practice. */
function practiceTrainingProfile(items){
  return TRAINING_DIMENSIONS.map(d => {
    let weighted = 0, durSum = 0;
    items.forEach(({duration, scores}) => {
      const score = scores ? clampScore(scores[d.key]) : null;
      const dur = (typeof duration === 'number' && duration > 0) ? duration : 0;
      if(score !== null && dur > 0){ weighted += score*dur; durSum += dur; }
    });
    return {key: d.key, label: d.label, score: durSum>0 ? weighted/durSum : null};
  });
}
/* {duration, scores} items for the build-in-progress practice (Review screen), pulled live
   from every used phase + extra section so the profile always reflects the current draft. */
function currentPracticeTrainingItems(){
  const items = [];
  PHASES.forEach(p => state.phaseData[p.key].forEach(id => {
    const ex = exById(id);
    if(ex) items.push({duration: ex.duration||10, scores: ex});
  }));
  state.extraSections.forEach(s => s.exercises.forEach(id => {
    const ex = exById(id);
    if(ex) items.push({duration: ex.duration||10, scores: ex});
  }));
  return items;
}
/* {duration, scores} items for a saved/completed session. Sessions saved by this batch carry
   their own frozen score snapshot (see completeSession()) so a practice's profile doesn't
   silently drift if an exercise's scores get edited later. A session saved before this
   feature existed has no snapshot -- falls back to a live exById() lookup so older sessions
   still get a best-effort profile instead of showing nothing. */
function savedSessionTrainingItems(s){
  const items = [];
  s.phases.forEach(p => p.exercises.forEach(e => {
    // hasScoreSnapshot is an explicit flag set by completeSession() at save time -- more
    // reliable than inferring from score contents, since a legitimately-scored-all-0 exercise
    // (0 is a valid, meaningful score) would otherwise look identical to "no snapshot taken".
    // Sessions saved before this flag existed fall back to the same content-based heuristic so
    // they still get a best-effort profile via a live exById() lookup instead of showing nothing.
    const hasSnapshot = e.hasScoreSnapshot === true || TRAINING_DIMENSIONS.some(d => typeof e[d.key] === 'number');
    const scores = hasSnapshot ? e : exById(e.id);
    items.push({duration: e.duration, scores});
  }));
  return items;
}
function practiceProfileRowHtml(dim){
  const scored = dim.score !== null;
  const pct = scored ? Math.max(0, Math.min(100, dim.score/5*100)) : 0;
  return `<div class="pprof-row ${scored?'':'pprof-row-unscored'}">
    <span class="pprof-label">${dim.label}</span>
    <div class="pprof-bar"><div class="pprof-bar-fill" style="width:${pct}%;"></div></div>
    <span class="pprof-num">${scored?dim.score.toFixed(1):'\u2014'}</span>
  </div>`;
}
function tpJoinPlus(labels){ return labels.join(' + '); }
function tpJoinAnd(labels){
  if(labels.length<=1) return labels.join('');
  if(labels.length===2) return labels.join(' and ');
  return labels.slice(0,-1).join(', ') + ', and ' + labels[labels.length-1];
}
/* Plain-language, descriptive-only summary of a practice's Training Profile -- explicitly
   NOT a recommendation: never says a score is "too low"/"too high", never invents a target,
   never assumes an even 25/25/25/25 split is the goal. It just describes in one sentence
   what the duration-weighted numbers above already show. "Primary" = at/near the top score
   (within 0.3) and clearly present (>=3.5); "secondary" = present but not dominant (>=2.5,
   not already primary); anything below 2.5 is simply left out of the sentence -- an
   omission, not a judgment call about it being too low. */
function practiceProfileInterpretation(profile){
  const scored = profile.filter(d => d.score !== null);
  if(!scored.length) return 'Training Profile not available yet \u2014 none of this practice\'s exercises have Training Dimension scores.';
  const top = Math.max(...scored.map(d=>d.score));
  const primary = scored.filter(d => d.score>=3.5 && (top-d.score)<=0.3).sort((a,b)=>b.score-a.score);
  const primaryKeys = new Set(primary.map(d=>d.key));
  const secondary = scored.filter(d => !primaryKeys.has(d.key) && d.score>=2.5).sort((a,b)=>b.score-a.score);

  if(primary.length>=2){
    const tail = secondary.length ? `, with moderate ${tpJoinAnd(secondary.map(d=>d.label))} demand` : '';
    return `Strong ${tpJoinPlus(primary.map(d=>d.label))} emphasis${tail}.`;
  }
  if(primary.length===1){
    const tail = secondary.length ? ` with moderate ${tpJoinAnd(secondary.map(d=>d.label))} demand` : '';
    return `High ${primary[0].label} emphasis${tail}.`;
  }
  if(secondary.length>=2) return `Balanced ${tpJoinAnd(secondary.map(d=>d.label))} session.`;
  if(secondary.length===1) return `Moderate ${secondary[0].label} demand across this session.`;
  return 'Light emphasis across all four training dimensions in this practice.';
}
/* Shared by both places "Training profile" appears (the live Review page and a saved session's
   read-only Detail page) so the heading + its "i" explanation can't drift out of sync between
   the two. */
function trainingProfileHeadingHtml(){
  return `<h4 style="display:flex;align-items:center;gap:6px;"><span>Training profile</span><button class="qp-info-btn" onclick="toggleTrainingProfileInfo()" title="What is the Training Profile?" aria-label="What is the Training Profile?">i</button></h4>`;
}
function trainingProfileInfoPanelHtml(){
  return state.trainingProfileInfoOpen ? `<div class="qp-info-panel">Your Training Profile shows how much this practice leans into each of the four core dimensions of player development &mdash; Technical, Tactical, Physical, and Cognitive &mdash; based on the exercises in it. Use it to see at a glance which dimension might be getting the least attention.</div>` : '';
}
function toggleTrainingProfileInfo(){ state.trainingProfileInfoOpen = !state.trainingProfileInfoOpen; render(); }
