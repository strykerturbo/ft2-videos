<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT2 — Fast Tigers Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  /* NIKE THEME -- light/dark via data-theme, spec'd variable names below, existing app
     variables aliased onto them so the whole app responds to the toggle */
  --bg-main:#FFFFFF;
  --bg-surface:#F6F6F6;
  --text-primary:#111111;
  --text-secondary:#707072;
  --border-color:#E5E5E5;
  --accent-volt:#E7FF00;

  --pitch:#111111;       /* structural chrome (nav/header/tiles) -- lightens in dark mode below */
  --pitch-dark:#0A0A0A;
  --chalk:var(--bg-main);
  --chalk-dim:var(--bg-surface);
  --turf:#2F8F6E;
  --turf-dim:#DCEEE6;
  --cone:var(--accent-volt);
  --cone-dim:#FAFAD8;
  --warn:#D6493A;
  --warn-dim:#F8DCD7;
  --ink:var(--text-primary);
  --ink-soft:var(--text-secondary);
  --line:var(--border-color);
  --white:var(--bg-surface);
  --radius:0px;
  --radius-sm:0px;

  --sec-warmup:#4FAE86;
  --sec-athletic:#257A5C;
  --sec-duels:#2A3346;
  --sec-rondos:#1C2333;
  --sec-ssg:#10141F;
  --sec-scrimmage:#D9A54A;
  --claret:#7A263A;
  --claret-dim:#F0E1E5;
  --burnt-orange:#B5561E;
  --sky-blue:#7EC8E3;
}
:root[data-theme="dark"]{
  --bg-main:#111111;
  --bg-surface:#1E1E1E;
  --text-primary:#FFFFFF;
  --text-secondary:#8D8D90;
  --border-color:#2C2C2E;
  --accent-volt:#E7FF00;
  --pitch:#242424;       /* lighter than --bg-main so tiles/chrome stay visible, not black-on-black */
  --pitch-dark:#1A1A1A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-main:#111111;
    --bg-surface:#1E1E1E;
    --text-primary:#FFFFFF;
    --text-secondary:#8D8D90;
    --border-color:#2C2C2E;
    --accent-volt:#E7FF00;
    --pitch:#242424;
    --pitch-dark:#1A1A1A;
  }
}
*{box-sizing:border-box;overflow-wrap:break-word;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
img,video{max-width:100%;}
body{
  background:#DCD8CC;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#shell{
  max-width:430px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  background:var(--chalk);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.15);
}
.display{
  font-family:'Inter',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
}
.eyebrow{
  font-family:'Inter',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-size:12px;
  color:var(--turf);
}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;
  background:var(--pitch);
  background-image:repeating-linear-gradient(115deg, rgba(242,169,59,0.06) 0 3px, transparent 3px 22px);
  color:var(--white);
  position:relative;
}
.topbar .brand{
  display:flex;align-items:center;gap:8px;
}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--cone);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:15px;color:white;
}
.brand-name{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.02em;}
.topbar-icons{display:flex;gap:14px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,0.12);
  border:none;color:white;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.icon-btn svg{width:19px;height:19px;}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--claret);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:700;font-size:14px;color:white;
  border:2px solid rgba(255,255,255,0.4);
}
.badge-dot{
  position:absolute;top:-2px;right:-2px;
  width:10px;height:10px;border-radius:50%;
  background:var(--cone);border:1.5px solid var(--pitch);
}

/* ---------- content area ---------- */
#content{
  flex:1;
  overflow-y:auto;
  padding-bottom:86px;
  background:var(--chalk);
}
#content::-webkit-scrollbar{width:0;}

.section-pad{padding:16px 18px;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--pitch);
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 6px 12px;
  box-shadow:0 -4px 18px rgba(0,0,0,0.18);
}
.navitem{
  background:none;border:none;color:rgba(255,255,255,0.55);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.04em;
  padding:7px 8px;border-radius:10px;
}
.navitem.active{color:white;}
.navitem svg{width:22px;height:22px;}
.navitem.build-fab{
  background:#ffffff;color:#14181f;
  width:58px;height:58px;border-radius:50%;
  margin-top:-30px;
  border:1.5px solid rgba(0,0,0,0.10);
  box-shadow:0 2px 8px rgba(0,0,0,0.22);
  justify-content:center;
  padding:0;/* .navitem's own 7px/8px padding was shrinking the ball image well below its set size */
}
.navitem.build-fab svg{width:38px;height:38px;}
.navitem.build-fab img{width:52px;height:52px;object-fit:cover;object-position:center;border-radius:50%;box-shadow:0 0 0 2px #fff;display:block;flex-shrink:0;}
.navitem.build-fab span{display:none;}

/* ---------- home ---------- */
.main-actions-row{display:flex;gap:8px;margin-top:6px;}
.mac-tile{
  /* All three Home tiles now share one bold treatment -- easier to spot at a glance than the old
     mix of one dark "primary" tile plus two low-contrast white ones. */
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  background:var(--claret);border:1.5px solid var(--claret);border-radius:14px;
  position:relative;overflow:hidden;
  padding:16px 5px;text-align:center;min-height:106px;
}
.mact-icon{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--sky-blue);color:#000;
}
.mact-icon svg{width:27px;height:27px;}
.mact-label{display:flex;flex-direction:column;gap:1px;text-align:center;font-family:'Inter',sans-serif;font-weight:800;font-size:14px;color:white;line-height:1.25;}
.mact-stat{font-size:10.5px;color:rgba(255,255,255,0.72);margin-top:3px;text-align:center;font-variant-numeric:tabular-nums;}

.feed-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.feed-item.linked{cursor:pointer;}
.feed-item.linked:active{background:var(--chalk-dim);}
.feed-thumb{
  width:46px;height:46px;border-radius:10px;background:var(--claret-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.feed-thumb svg{width:22px;height:22px;color:var(--claret);}
.feed-item .ftitle{font-size:14.5px;font-weight:600;}
.feed-item .fsub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.feed-item .fchevron{margin-left:auto;align-self:center;color:var(--ink-soft);flex-shrink:0;}
.feed-item .fchevron svg{width:16px;height:16px;}
.feed-tag{
  display:inline-block;font-size:11px;font-weight:700;color:var(--turf);
  text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;
}

/* ---------- section headers ---------- */
.sh{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 10px;
}
.sh h2{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin:0;color:var(--text-primary);}
.sh a.see-all{font-size:12.5px;color:var(--claret);font-weight:600;padding:4px;}

/* ---------- search / filters ---------- */
.searchbar{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
}
.searchbar svg{width:18px;height:18px;color:var(--ink-soft);flex-shrink:0;}
.searchbar input{
  /* 16px minimum keeps iOS Safari from auto-zooming the page when this field gets focus */
  border:none;outline:none;flex:1;font-size:16px;background:transparent;color:var(--ink);
}
.search-clear-btn{
  background:var(--chalk-dim);border:none;border-radius:50%;flex-shrink:0;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}
.search-clear-btn svg{width:11px;height:11px;}
.filter-chip-row{
  display:flex;flex-wrap:nowrap;gap:7px;padding:12px 0 6px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-chip-row::-webkit-scrollbar{display:none;}
.sec-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:54px;min-height:54px;flex-shrink:0;
  padding:8px 2px 7px;border-radius:11px;border:1px solid var(--line);
  background:var(--white);font-size:11px;font-weight:700;color:var(--ink-soft);
  text-align:center;line-height:1.15;
}
.sec-chip svg{width:18px;height:18px;}
.sec-chip.active{border-width:1.5px;}
.sec-chip.morefilters{width:50px;position:relative;}
.sec-chip.morefilters svg{width:19px;height:19px;}
.chip-count-dot{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;
  background:var(--cone);color:var(--pitch-dark);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.picking-banner{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--cone-dim);border:1px solid var(--cone);
  border-radius:12px;padding:10px 14px;margin-bottom:6px;
}
.picking-banner .ptxt{font-size:13.5px;font-weight:600;color:#8a3d16;}
.picking-banner button{
  background:var(--cone);color:white;border:none;border-radius:8px;
  padding:9px 14px;font-size:13px;font-weight:700;
}

/* ---------- exercise grid ---------- */
.view-toggle{display:flex;gap:8px;margin-top:14px;}
.view-toggle-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-surface);color:var(--ink-soft);font-size:12.5px;font-weight:700;
}
.view-toggle-btn svg{width:14px;height:14px;}
.view-toggle-btn.active{background:var(--pitch);border-color:var(--pitch);color:white;}
:root[data-theme="dark"] .view-toggle-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .view-toggle-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
}
.ex-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;
}
/* List view reuses the exact same .ex-card markup as Tile view (same thumbnail, badges, name,
   add button) -- just reflowed into a horizontal row instead of a 2-up grid, so the two views
   always show identical information. */
.ex-grid.list-mode{display:flex;flex-direction:column;grid-template-columns:none;gap:10px;}
.ex-grid.list-mode .ex-card{flex-direction:row;height:84px;}
.ex-grid.list-mode .ex-thumb{width:84px !important;height:84px;flex-shrink:0;}
.ex-grid.list-mode .ex-body{flex:1;justify-content:center;min-width:0;padding:8px 78px 8px 12px;}
.ex-grid.list-mode .ex-name{min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-grid.list-mode .ex-addbtn{
  position:absolute;top:50%;right:6px;width:auto;margin-top:0;transform:translateY(-50%);
  padding:6px 12px;font-size:11.5px;
}
.ex-grid.list-mode .added-badge{display:none;}
.ex-grid.list-mode .new-ex-card{flex-direction:row;min-height:84px;height:84px;padding:0 16px;gap:12px;}
.ex-card{
  background:var(--white);border-radius:14px;border:1px solid var(--line);
  overflow:hidden;text-align:left;padding:0;position:relative;
  display:flex;flex-direction:column;
}
.ex-card.added{border-color:var(--turf);border-width:1.5px;}
.new-ex-card{
  border:1.5px dashed var(--turf);background:var(--turf-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;min-height:184px;color:var(--turf);
}
.new-ex-icon{
  width:40px;height:40px;border-radius:50%;background:var(--turf);color:white;
  display:flex;align-items:center;justify-content:center;
}
.new-ex-icon svg{width:18px;height:18px;}
.new-ex-label{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;text-align:center;line-height:1.2;color:var(--turf);}
.ex-thumb{
  height:84px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--pitch);
}
.ex-thumb svg{width:36px;height:36px;opacity:0.85;}
.thumb-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;}
.thumb-placeholder svg{width:22px;height:22px;opacity:0.85;}
.thumb-placeholder-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;opacity:0.9;text-align:center;padding:0 6px;line-height:1.3;}
.ex-thumb .dur{
  position:absolute;top:6px;left:6px;
  background:rgba(0,0,0,0.4);color:white;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:8px;
}
.loc-badge{
  position:absolute;bottom:6px;left:6px;
  background:rgba(0,0,0,0.4);color:white;
  width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
}
.loc-badge svg{width:11px;height:11px;}
.ex-bookmark{
  position:absolute;top:4px;right:4px;
  width:32px;height:32px;border-radius:50%;
  background:none;border:none;
  display:flex;align-items:center;justify-content:center;
}
.ex-bookmark svg{width:17px;height:17px;color:#fff;}
.ex-bookmark.on svg{color:var(--turf);}
.ex-body{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1;}
.ex-sect{font-size:11px;font-weight:700;color:var(--turf);text-transform:uppercase;letter-spacing:0.05em;}
.ex-name{font-size:14px;font-weight:700;line-height:1.25;margin:4px 0 8px;min-height:36px;}
.ex-addbtn{
  width:100%;border:1px solid var(--pitch);background:white;color:var(--pitch);
  border-radius:9px;padding:10px 0;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
  margin-top:auto;
}
.ex-addbtn svg{width:12px;height:12px;}
.ex-addbtn.added{background:var(--turf);border-color:var(--turf);color:white;}
.added-badge{
  position:absolute;bottom:6px;right:6px;
  background:var(--turf);color:white;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.added-badge svg{width:12px;height:12px;}

/* empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
}
.empty-state svg{width:40px;height:40px;color:var(--line);margin-bottom:11px;}
.empty-state p{font-size:14px;margin:0;line-height:1.5;}

/* ---------- bottom sheet (filters) ---------- */
.sheet-backdrop{
  position:absolute;inset:0;background:rgba(20,26,22,0.45);
  z-index:40;
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--white);border-radius:20px 20px 0 0;
  max-height:82%;overflow-y:auto;
  padding:6px 18px 20px;
  z-index:41;
  box-shadow:0 -10px 30px rgba(0,0,0,0.2);
}
.sheet-handle{
  width:36px;height:4px;background:var(--line);border-radius:3px;
  margin:10px auto 14px;
}
.sheet h3{font-family:'Inter',sans-serif;font-size:18px;margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-primary);}
.sheet h3:first-of-type{margin-top:0;}
.optrow{display:flex;gap:8px;flex-wrap:wrap;}
.opt{
  padding:10px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--chalk);font-size:13.5px;font-weight:600;color:var(--ink-soft);
}
.opt.active{background:var(--turf);border-color:var(--turf);color:white;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;}
.toggle-row span{font-size:14.5px;font-weight:600;}
.switch{width:46px;height:26px;border-radius:14px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--turf);}
.switch .dot{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--bg-surface);transition:left .15s;}
.switch.on .dot{left:22px;}
.sheet-footer{display:flex;gap:10px;margin-top:18px;}
.btn{
  border:none;border-radius:12px;padding:15px 0;font-weight:700;font-size:14.5px;
  flex:1;text-align:center;
}
.btn-primary{background:var(--pitch);color:white;}
.btn-ghost{background:var(--chalk-dim);color:var(--ink);}

/* ---------- detail page ---------- */
.detail-header{
  background:var(--pitch);color:white;padding:16px 18px 20px;position:relative;
}
.backbtn{
  background:rgba(255,255,255,0.15);border:none;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:white;margin-bottom:14px;
}
.backbtn svg{width:19px;height:19px;}
.detail-header .dpill{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);color:var(--white);
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:5px 10px;border-radius:8px;margin-bottom:8px;
}
.detail-header .dpill svg{width:13px;height:13px;flex-shrink:0;}
.detail-header .dpill img{width:16px;height:16px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,0.85);flex-shrink:0;}
.section-select-wrap{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:9px;padding:6px 11px;margin-bottom:8px;min-height:34px;
}
.section-select-wrap svg{width:14px;height:14px;flex-shrink:0;}
select.section-select{
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:0;cursor:pointer;
}
select.section-select option{color:var(--ink);background:var(--bg-surface);text-transform:none;}
.section-select-cat{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;opacity:0.85;}
.draft-pill{background:rgba(0,0,0,0.28) !important;margin-left:8px;margin-bottom:0;}
.back-to-session-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.18);color:white;border:none;border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:700;min-height:34px;margin-bottom:14px;
}
.back-to-session-pill svg{width:13px;height:13px;}
.draft-actions{display:flex;gap:10px;padding:14px 18px 0;}
.draft-hint{padding:0 18px 6px;font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.draft-hint svg{width:10px;height:10px;flex-shrink:0;opacity:0.7;}
.detail-header h1{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:-0.03em;font-size:26px;line-height:1.08;margin:0 0 12px;font-weight:400;}
.stat-row{display:flex;gap:10px;}
.stat{background:rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;flex:1;}
.stat .snum{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;}
.stat .slbl{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.7);}
.snum-row{display:flex;align-items:baseline;gap:4px;}
.snum-editable{outline:none;border-radius:4px;min-width:10px;display:inline-block;}
.snum-editable:hover{background:rgba(255,255,255,0.15);}
.snum-editable:focus{background:rgba(255,255,255,0.25);box-shadow:0 0 0 1.5px currentColor;}
.snum-suffix{font-size:12px;font-weight:600;}
.stat-value{min-height:24px;display:flex;align-items:center;}
select.diff-select{
  /* Deliberately smaller than the Duration/Format value text -- "3 · Intermediate" needs the
     room, and .stat-value's shared min-height + flex centering keeps its baseline lined up with
     the other two pills regardless of the font-size difference. */
  font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;line-height:1.2;
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  width:100%;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
select.diff-select option{color:var(--ink);background:var(--bg-surface);}

/* compact "eyebrow" line above the title -- replaces the old Section + Indoor/Outdoor pill
   row, freeing up header height. Indoor/Outdoor now lives down by the Tags list instead. */
.detail-eyebrow{
  display:flex;align-items:center;gap:6px;margin-bottom:5px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  opacity:0.95;
}
.detail-eyebrow svg{width:13px;height:13px;flex-shrink:0;}
.detail-eyebrow select{
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  font:inherit;color:inherit;padding:0;cursor:pointer;
}
.detail-eyebrow select option{color:var(--ink);background:var(--bg-surface);text-transform:none;}
.detail-eyebrow .eyebrow-cat{opacity:0.85;}

.detail-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.detail-block-head h4{margin:0;}
.add-tag-trigger{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--turf);font-size:12px;font-weight:700;padding:4px 2px;flex-shrink:0;
}
.add-tag-trigger svg{width:12px;height:12px;}
.loc-select-pill{
  /* Deliberately its own accent (not the neutral tagpill gray) so Indoor/Outdoor reads as a
     distinct setting, not just another tag in the list. */
  display:inline-flex;align-items:center;gap:5px;
  background:var(--turf-dim);border:1px solid var(--turf);color:var(--turf);
  font-size:12px;font-weight:700;padding:5px 9px 5px 10px;border-radius:8px;
}
:root[data-theme="dark"] .loc-select-pill{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .loc-select-pill{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
}
.loc-select-pill svg{width:12px;height:12px;flex-shrink:0;}
.loc-select-pill select{
  border:none;background:transparent;outline:none;font-size:12px;font-weight:700;
  color:var(--turf);-webkit-appearance:none;appearance:none;padding:0;cursor:pointer;
}
.loc-select-pill select option{color:var(--ink);background:var(--bg-surface);}
:root[data-theme="dark"] .loc-select-pill select{color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .loc-select-pill select{color:var(--text-primary);}
}
.tag-picker-sheet .tp-cat-label{
  font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:0.05em;margin:12px 0 6px;
}
.tag-picker-sheet .tp-cat-label:first-of-type{margin-top:2px;}

.diagram-box{
  margin:16px 18px 0;
  height:150px;border-radius:14px;
  background:var(--turf);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.diagram-box svg{width:100%;height:100%;}

.detail-block{padding:15px 18px;}
.detail-block h4{
  font-family:'Inter',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--text-primary);margin:0 0 7px;
}
.detail-block p{font-size:16px;line-height:1.6;margin:0;color:var(--ink);white-space:pre-line;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;}
.tagpill{
  background:var(--chalk-dim);border:1px solid var(--line);color:var(--ink-soft);
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;
}
.divider{height:1px;background:var(--line);margin:0 18px;}

.detail-actions{
  display:flex;gap:10px;padding:16px 18px 4px;
}
.iconbtn-lg{
  width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg-surface);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.iconbtn-lg svg{width:21px;height:21px;color:var(--ink);}
.iconbtn-lg.on{background:var(--cone-dim);border-color:var(--cone);}
.iconbtn-lg.on svg{color:var(--cone);}
.add-session-btn{
  flex:1;background:var(--pitch);color:white;border:none;border-radius:12px;padding:15px 0;
  font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-session-btn svg{width:17px;height:17px;}
.add-session-btn.added{background:var(--turf);}

.similar-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.sim-card{
  flex-shrink:0;width:120px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:9px;
  display:flex;flex-direction:column;align-items:stretch;text-align:left;
}
.sim-card .sname{font-size:12.5px;font-weight:700;line-height:1.25;margin-top:7px;text-align:left;color:var(--text-primary);}
.sim-thumb{height:48px;border-radius:8px;background:var(--pitch);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0;}
.sim-thumb svg{width:20px;height:20px;color:rgba(255,255,255,0.85);}

/* ---------- build a session ---------- */
.duration-target{
  display:flex;gap:8px;margin-top:4px;
}
.dtarget{
  flex:1;padding:13px 0;text-align:center;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-surface);font-weight:700;font-family:'Inter',sans-serif;font-size:17px;color:var(--ink-soft);
  min-height:46px;
}
.dtarget.active{background:var(--pitch);border-color:var(--pitch);color:white;}
.dtarget-input{
  flex:1;min-width:0;padding:13px 4px;text-align:center;border-radius:10px;border:1.5px solid var(--turf);
  background:var(--turf-dim);font-weight:700;font-family:'Inter',sans-serif;font-size:17px;color:var(--ink);
  outline:none;min-height:46px;
}

/* compact, de-emphasized practice-settings row */
.practice-settings-row{display:flex;gap:10px;margin-top:14px;}
.practice-setting-group{flex:1;min-width:0;}
.ps-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.duration-target.compact{gap:5px;}
.dtarget.compact{
  padding:7px 0;font-size:12px;min-height:30px;border-radius:8px;
}
.dtarget-input.compact{padding:7px 2px;font-size:12px;min-height:30px;border-radius:8px;}
.location-toggle{display:flex;gap:5px;}
.loc-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);
  font-size:11px;font-weight:700;color:var(--ink-soft);min-height:30px;
}
.loc-btn svg{width:12px;height:12px;flex-shrink:0;}
.loc-btn.active{background:var(--pitch);border-color:var(--pitch);color:white;}
.session-name-wrap{position:relative;margin-top:2px;}
.session-name-wrap .session-name-input{margin-top:0;padding-right:26px;}
.session-name-pencil{
  position:absolute;right:2px;top:6px;color:var(--ink-soft);opacity:0.55;pointer-events:none;
}
.session-name-pencil svg{width:15px;height:15px;display:block;}
.session-name-input{
  width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;
  font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:-0.03em;font-weight:400;font-size:22px;color:var(--ink);
  padding:4px 0 8px;outline:none;margin-top:2px;
}
.session-name-input:focus{border-color:var(--turf);}
.session-name-input::placeholder{color:var(--ink-soft);font-weight:600;opacity:0.6;}
.progress-wrap{margin-top:14px;}
.progress-track{height:9px;background:var(--chalk-dim);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:var(--turf);border-radius:6px;transition:width .2s;}
.progress-fill.over{background:var(--warn);}
.progress-caption{display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--ink-soft);}
.progress-caption b{color:var(--ink);}

/* ---------- suggested time split / comparison panel ---------- */
.time-panel{margin-top:16px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.time-panel-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:15px 14px;background:none;border:none;text-align:left;min-height:48px;
}
.tp-summary{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
.tp-summary b{font-family:'Inter',sans-serif;font-size:16px;}
.tp-sep{color:var(--line);}
.tp-chevron{color:var(--ink-soft);display:flex;transition:transform .15s;flex-shrink:0;}
.tp-chevron svg{width:16px;height:16px;transform:rotate(90deg);}
.tp-chevron.open svg{transform:rotate(-90deg);}
.tp-body{padding:0 13px 13px;border-top:1px solid var(--line);padding-top:12px;}
.tp-row-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
.split-bar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--chalk-dim);}
.split-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;}
.split-legend-item{font-size:11px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px;line-height:1.35;}
.split-legend-item i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.split-legend-item span{color:var(--ink-soft);font-weight:500;}

.phase-strip{margin-top:20px;position:relative;}
.phase-card{
  position:relative;
  display:flex;gap:12px;
  padding-bottom:16px;
}
.phase-line{
  position:relative;width:26px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
}
.phase-num{
  width:30px;height:30px;border-radius:50%;background:var(--pitch);color:white;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;
  flex-shrink:0;z-index:2;
}
.phase-num.empty{background:var(--line);color:var(--ink-soft);}
.phase-connector{
  flex:1;width:2px;background:var(--line);margin-top:2px;
}
.phase-content{flex:1;padding-top:2px;}
.phase-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.phase-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16.5px;text-transform:uppercase;letter-spacing:0.02em;}
.phase-time{font-size:12px;color:var(--ink-soft);font-weight:600;flex-shrink:0;}
.phase-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.phase-icon-btn{
  width:32px;height:32px;border-radius:50%;border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.phase-icon-btn svg{width:14px;height:14px;}
.phase-del-icon{background:var(--warn-dim);color:var(--warn);}
.phase-add-pill{
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  background:var(--turf);color:white;border:none;border-radius:16px;
  padding:8px 13px 8px 10px;font-size:12px;font-weight:700;min-height:34px;
  white-space:nowrap;
}
.phase-add-pill svg{width:12px;height:12px;flex-shrink:0;}
.phase-time-divider{width:1px;height:14px;background:var(--line);flex-shrink:0;}
.phase-exlist{margin-top:9px;display:flex;flex-direction:column;gap:8px;}
.phase-ex-item{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px 9px 8px;
}
.pei-thumb{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.pei-thumb svg{width:17px;height:17px;}
.pei-thumb img,.pei-thumb video{width:100%;height:100%;object-fit:cover;}
.phase-ex-item .peiname{flex:1;font-size:13.5px;font-weight:600;}
.phase-ex-item .peidur{font-size:12px;color:var(--ink-soft);font-weight:600;}
.phase-ex-item button{background:none;border:none;color:var(--ink-soft);padding:8px;display:flex;margin:-8px;}
.phase-ex-item button svg{width:15px;height:15px;}
.addsection-row{margin-top:6px;}
.addsection-btn{
  width:100%;border:1px solid var(--line);background:var(--chalk-dim);border-radius:10px;
  padding:13px 0;font-size:13.5px;font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.addsection-btn svg{width:14px;height:14px;flex-shrink:0;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ---------- build screen: one full-width section per row ---------- */
.build-progress-line{display:flex;align-items:center;gap:9px;margin-top:10px;}
.build-progress-line .progress-track{flex:1;}
.build-progress-line span{font-size:11.5px;color:var(--ink-soft);font-weight:600;flex-shrink:0;white-space:nowrap;}
.phase-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;}
.phase-box{background:var(--bg-surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 12px 14px;}
.phase-box.next-up{border-color:var(--cone);box-shadow:0 0 0 1px var(--cone);}
.phase-box-header{display:flex;align-items:flex-start;gap:7px;margin-bottom:4px;}
.pb-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.pb-icon svg{width:14px;height:14px;}
.pb-icon.big{width:38px;height:38px;border-radius:10px;margin-top:0;}
.pb-icon.big svg{width:20px;height:20px;}
.phase-box-header.centered{align-items:center;}
.phase-collapse-spacer{width:29px;flex-shrink:0;}
.phase-box-add-btn{
  background:var(--turf-dim);color:var(--turf);border:none;border-radius:12px;
  padding:6px 12px;font-size:11px;font-weight:800;line-height:1.25;text-align:center;
  flex-shrink:0;margin:-2px -3px -2px 0;min-width:64px;min-height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.phase-box-title{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;text-transform:uppercase;letter-spacing:0.01em;line-height:1.25;flex:1;padding-top:2px;}
.next-up-pill{
  display:inline-block;background:var(--cone);color:var(--pitch-dark);text-transform:none;
  font-size:10px;font-weight:700;letter-spacing:0.02em;padding:2px 7px;border-radius:20px;
  vertical-align:middle;margin-left:5px;
}
.phase-box-time{font-size:11.5px;color:var(--ink-soft);font-weight:700;flex-shrink:0;white-space:nowrap;margin-top:6px;}
.phase-collapse-btn{background:none;border:none;color:var(--ink-soft);flex-shrink:0;padding:7px;display:flex;margin:-6px 0 -6px -7px;transition:transform .15s;}
.phase-collapse-btn svg{width:15px;height:15px;transform:rotate(90deg);}
.phase-collapse-btn.collapsed svg{transform:rotate(0deg);}
.phase-box-edit{background:none;border:none;color:var(--ink-soft);flex-shrink:0;padding:7px;display:flex;margin:-6px -7px -6px 0;}
.phase-box-edit svg{width:14px;height:14px;}
.phase-box-del{background:none;border:none;color:var(--warn);flex-shrink:0;padding:7px;display:flex;margin:-6px -7px -6px 0;}
.phase-box-del svg{width:15px;height:15px;}
.extra-box-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;text-transform:uppercase;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 3px;flex:1;min-width:0;outline:none;
}
.extra-box-title-input:focus{border-color:var(--turf);}

/* each exercise: image on the left, bullets (from Description + Variations) on the right */
.build-ex-list{margin-top:6px;}
.build-ex-row{position:relative;display:flex;gap:11px;padding:11px 22px 11px 0;border-top:1px solid var(--line);}
.build-ex-list .build-ex-row:first-child{border-top:none;}
.build-ex-image{width:84px;height:66px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--chalk-dim);}
.build-ex-image img,.build-ex-image video{width:100%;height:100%;object-fit:cover;display:block;}
.build-ex-image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.build-ex-image-fallback svg{width:24px;height:24px;}
.build-ex-info{flex:1;min-width:0;}
.build-ex-name{font-size:13.5px;font-weight:700;margin-bottom:4px;line-height:1.3;}
.build-ex-bullets{margin:0;padding-left:15px;}
.build-ex-bullets li{font-size:11.5px;color:var(--ink-soft);line-height:1.45;margin-bottom:2px;}
.build-ex-remove{
  position:absolute;top:9px;right:-4px;background:none;border:none;color:var(--ink-soft);
  opacity:0.38;padding:8px;display:flex;
}
.build-ex-remove svg{width:13px;height:13px;}
.build-ex-remove:active{opacity:0.75;}
.build-ex-empty{font-size:12px;color:var(--ink-soft);text-align:center;padding:14px 0 10px;font-style:italic;}
.build-add-btn{
  width:100%;margin-top:8px;border:1.5px dashed var(--line);background:var(--chalk-dim);
  border-radius:10px;padding:11px 0;font-size:12.5px;font-weight:700;color:var(--turf);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.build-add-btn svg{width:13px;height:13px;}
.session-state-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;padding:5px 10px;border-radius:20px;flex-shrink:0;}
.session-state-tag.new{background:var(--bg-surface);color:var(--ink-soft);border:1px solid var(--line);}
.session-state-tag.inprogress{background:var(--cone-dim);color:#7a4a10;border:1px solid var(--cone);}
.session-state-tag.saved{background:rgba(255,255,255,0.18);color:white;position:absolute;top:16px;right:18px;}
.discard-session-row{display:flex;justify-content:flex-end;margin-top:4px;}
.discard-session-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--warn);font-size:12px;font-weight:700;padding:6px 0;}
.discard-session-btn svg{width:13px;height:13px;}
.build-cta{
  position:sticky;bottom:0;background:linear-gradient(180deg, rgba(246,244,236,0) 0%, var(--chalk) 30%);
  padding:16px 18px 6px;
}
.build-cta .btn-primary{width:100%;padding:16px 0;font-size:15.5px;border-radius:12px;background:var(--pitch);}

/* ---------- session review ---------- */
.review-cta-row{display:flex;gap:10px;margin-top:8px;}
.review-cta-row .btn{display:flex;align-items:center;justify-content:center;gap:6px;}
.review-cta-row .btn svg{width:14px;height:14px;}
.review-total-mini{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:4px;}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;
  z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.3);white-space:nowrap;max-width:88%;text-align:center;
}
.sync-banner{
  display:flex;align-items:center;gap:9px;background:var(--warn-dim);border:1px solid var(--warn);
  border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:12.5px;font-weight:600;color:var(--warn);
  line-height:1.4;
}
.sync-banner svg{width:18px;height:18px;flex-shrink:0;}

.hidden{display:none !important;}

/* ---------- logo ---------- */
.logo-badge{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:var(--cone);color:var(--pitch-dark);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.01em;
}
.brand-lockup{display:flex;flex-direction:column;line-height:1.15;}
.brand-lockup .bl-line1{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;color:white;}
.brand-lockup .bl-line2{font-family:'Inter',sans-serif;font-weight:600;font-size:11px;color:rgba(255,255,255,0.72);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- section badges / icons ---------- */
.sec-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
}
.sec-badge svg{width:11px;height:11px;}

/* ---------- clear banners (bookmark-only / picking) ---------- */
.info-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-radius:12px;padding:10px 14px;margin-bottom:6px;border:1px solid;
}
.info-banner.gold{background:var(--cone-dim);border-color:var(--cone);}
.info-banner.gold .ptxt{color:#8a611a;}
.info-banner .ptxt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
.info-banner .ptxt svg{width:15px;height:15px;flex-shrink:0;}
.info-banner button{
  background:var(--ink);color:white;border:none;border-radius:9px;
  padding:9px 14px;font-size:13px;font-weight:700;flex-shrink:0;min-height:36px;
  display:flex;align-items:center;gap:5px;
}
.info-banner button svg{width:13px;height:13px;}

/* ---------- picking-mode progress strip ---------- */
.session-builder-box{
  background:var(--cone-dim);border:1.5px solid var(--cone);border-radius:14px;
  padding:11px 13px 12px;margin-bottom:12px;
}
.sbb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sbb-title{
  display:flex;align-items:center;gap:6px;
  font-family:'Inter',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;
  color:#7a4a10;
}
.sbb-title svg{width:15px;height:15px;}
.sbb-full-view{
  /* var(--ink) used to sit here, which is nearly indistinguishable from the Duels/Rondos/Tactical
     Focus (SSG) section colors shown a few pixels below in the dots row. Turf green instead -- it
     can never collide with a section color and it draws from the claret/green/burnt-orange palette. */
  display:flex;align-items:center;gap:5px;
  background:var(--turf);color:#fff;border:1.5px solid var(--turf);border-radius:20px;
  padding:8px 14px;font-size:12px;font-weight:700;flex-shrink:0;min-height:34px;
}
.sbb-full-view svg{width:12px;height:12px;}
.sbb-current{font-size:13px;font-weight:600;color:#8a5010;margin-bottom:10px;}
.sbb-current b{color:var(--pitch-dark);}
.tmpl-list{display:flex;flex-direction:column;gap:8px;}
.tmpl-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;}
.tmpl-row.off{opacity:0.45;}
.tmpl-row.dragging{opacity:0.6;box-shadow:0 4px 14px rgba(0,0,0,0.25);position:relative;z-index:5;}
.tmpl-grip{width:20px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;touch-action:none;cursor:grab;}
.tmpl-grip svg{width:14px;height:14px;}
.tmpl-grip-spacer{width:20px;flex-shrink:0;}
.tmpl-pct-input{width:32px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;background:var(--bg-main);color:var(--text-primary);font-size:13px;font-weight:700;padding:3px 2px;font-family:inherit;}
.tmpl-pct-input:disabled{opacity:0.4;}
.tmpl-row-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-row-icon svg{width:16px;height:16px;}
.tmpl-row-icon.custom{background:var(--chalk-dim);color:var(--ink-soft);}
.tmpl-row-label{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--text-primary);}
.tmpl-row-hint{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:none;margin-top:1px;}
.tmpl-row-pct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex-shrink:0;}
.tmpl-row-pct span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;}
.tmpl-step{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--chalk);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-step svg{width:11px;height:11px;}
.tmpl-step:disabled{opacity:0.35;}
.tmpl-toggle{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tmpl-toggle svg{width:14px;height:14px;}
.tmpl-toggle.remove{color:var(--warn);}
.tmpl-sum-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--chalk-dim);color:var(--ink);}
.tmpl-sum-row.bad .tmpl-sum-warn{color:var(--warn);}
.tmpl-sum-row.ok .tmpl-sum-warn{color:var(--turf);}
.settings-wip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:60px 20px;color:var(--ink-soft);}
.settings-wip svg{width:40px;height:40px;opacity:.5;}
.settings-wip-title{font-size:18px;font-weight:800;color:var(--ink);}
.settings-wip-sub{font-size:13px;}
.pps-dots{display:flex;gap:8px;margin-bottom:10px;}
.pps-dot{
  flex:1;min-width:0;height:36px;border-radius:9px;border:none;
  display:flex;align-items:center;justify-content:center;
}
.pps-dot svg{width:16px;height:16px;}
.pps-progress .progress-track{background:rgba(255,255,255,0.6);border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}
.pps-progress .progress-fill{background:var(--turf);}
.pps-progress .progress-fill.over{background:var(--warn);}
.pps-caption{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:#8a5010;font-weight:600;}
.pps-caption b{color:var(--pitch-dark);}
.pps-next-btn{
  width:100%;margin-top:10px;border:none;border-radius:12px;background:var(--pitch);color:white;
  padding:12px 0;font-weight:700;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.pps-next-btn svg{width:15px;height:15px;}

/* ---------- editable fields ---------- */
[contenteditable="true"]{
  outline:none;border-radius:6px;transition:background .12s;
  padding:2px 4px;margin:-2px -4px;
}
[contenteditable="true"]:hover{background:var(--chalk-dim);}
[contenteditable="true"]:focus{background:var(--turf-dim);box-shadow:0 0 0 1.5px var(--turf);}
.edit-hint{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;
  margin-left:6px;opacity:0.65;
}
.edit-hint svg{width:10px;height:10px;}
.editable-title[contenteditable="true"]{display:inline-block;min-width:40px;}
input.section-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:16.5px;text-transform:uppercase;letter-spacing:0.02em;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 4px;width:100%;outline:none;
}
input.section-title-input:focus{border-color:var(--turf);}

/* ---------- media / gif box ---------- */
.media-box{
  margin:16px 18px 0;height:150px;border-radius:14px;overflow:hidden;position:relative;
  background:var(--chalk-dim);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;}
.media-box-placeholder{flex-direction:column;gap:8px;color:var(--ink-soft);}
.media-box-placeholder svg{width:28px;height:28px;opacity:0.6;}
.media-box-placeholder span{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.media-error-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--chalk-dim);color:var(--ink-soft);text-align:center;overflow:hidden;}
.media-error-fallback svg{width:18px;height:18px;opacity:0.6;flex-shrink:0;}
.media-error-fallback span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:0 4px;line-height:1.25;}

/* Video thumbnails everywhere except the Detail page: shows the clip's first frame only (no
   playback), with a small play badge so it still reads as "tap to watch", not a broken image. */
.media-still-wrap{position:relative;overflow:hidden;}
.media-still-wrap video{pointer-events:none;}
.media-play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;background:rgba(16,20,31,0.55);
  display:flex;align-items:center;justify-content:center;color:white;
}
.media-play-badge svg{width:15px;height:15px;margin-left:2px;}
.media-input-row{display:flex;gap:8px;padding:0 18px;margin-top:10px;}
.media-input-row input{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:13.5px;outline:none;
}
.media-input-row input:focus{border-color:var(--turf);}
.media-input-row button{background:var(--pitch);color:white;border:none;border-radius:10px;padding:0 18px;font-size:13.5px;font-weight:700;}

.video-row{
  display:flex;align-items:center;gap:10px;padding:6px 18px 4px;
}
.video-link-btn{
  display:inline-flex;align-items:center;gap:5px;background:var(--chalk-dim);color:var(--ink-soft);
  border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;flex-shrink:0;
}
.video-link-btn svg{width:11px;height:11px;}

/* ---------- sessions list / detail ---------- */
.session-row{
  display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;text-align:left;width:100%;min-height:64px;
}
.session-row .srthumb{
  width:44px;height:44px;border-radius:10px;background:var(--pitch);color:white;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.session-row .srthumb svg{width:20px;height:20px;}
.session-row .srname{font-size:14.5px;font-weight:700;color:var(--text-primary);}
.session-row .srmeta{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;}
.session-row .srmeta svg{width:12px;height:12px;flex-shrink:0;}
.session-row .srchevron{margin-left:auto;color:var(--ink-soft);flex-shrink:0;}
.session-row .srchevron svg{width:16px;height:16px;}
.recent-clickable{cursor:pointer;}
.recent-clickable:hover{background:var(--chalk-dim);}

.sd-meta-row{display:flex;gap:10px;margin-top:14px;}
.rate-session-box{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
.rate-session-title{font-family:'Inter',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:10px;color:var(--text-primary);}
.star-row{display:flex;gap:6px;margin-bottom:10px;}
.star-btn{background:none;border:none;padding:2px;display:flex;}
.star-btn svg{width:26px;height:26px;color:var(--line);}
.star-btn.filled svg{color:var(--claret);fill:var(--claret);}
.rate-comment{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg-main);color:var(--text-primary);padding:10px;font-family:inherit;font-size:13px;resize:vertical;}
.sd-phases .phase-title{font-size:13.5px;}
.sd-meta{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;flex:1;}
.sd-meta .smnum{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;color:var(--text-primary);}
.sd-meta .smlbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
</style>

<style>
/* ---- Nike theme flourish: sharp corners, inverted primary CTAs, generous whitespace ---- */
body{background:var(--bg-main);}
button,.btn,.ex-card,.mac-tile,.phase-box,.session-builder-box,.stat,.feed-item,.view-toggle-btn,
.sec-chip,.new-ex-card,.searchbar,input,select,textarea,.session-row,.tagpill,.loc-select-pill,
.ex-thumb,.ex-bookmark,.backbtn,.back-to-session-pill,.icon-btn,.avatar,.media-box,.detail-header,
.thumb-placeholder-label,.search-clear-btn,.feed-thumb{
  border-radius:0 !important;
}
/* ...except the 3 elements that are deliberately round pills/circles, not square-corner cards:
   the topbar icon buttons, the coach-initials avatar, and the bottom-nav soccer-ball button.
   Both rules above and here are !important, so this one wins on higher selector specificity
   (.navitem.build-fab, a compound class) and matching source order (.icon-btn/.avatar, same
   specificity as their mention above but declared later). */
.icon-btn,.avatar,.navitem.build-fab{
  border-radius:50% !important;
}
.btn-primary,.build-cta .btn-primary{
  background:var(--text-primary) !important;color:var(--bg-main) !important;
  text-transform:uppercase !important;letter-spacing:0.04em !important;
}
.section-pad{padding-left:20px;padding-right:20px;}
.mac-tile{padding:22px 12px;}
* { transition:background-color .15s ease,color .15s ease,border-color .15s ease; }
</style>
</head>

  "setup": "Setup a 20 x 20 yard field with 2 mini goals at each end. Divide the teams into 2 and split each team in half with players lining up on the same side as their other half but next to each goal.\nAdd a center line to with cones. Balls should start with one of the teams only.",

 {
  "id": "EX101",
  "name": "Numbers up - The numbers game",
  "section": "Warmup",
  "category": null,
  "difficulty": 2,
  "duration": 10,
  "setup": "Set up a field approximately 20 x 30 yards with a pug goal at each end. Players are divided into teams and given a number, ideally matching up with an opponent of similar skill level. Each team lines up around their respective goal.",
  "description": "Fun for younger kids to help increase their competitive drive and 1v1 skills.\nThe coach rolls a ball into the middle of the field and calls a number. The player from each team with that number attempts to score in the other teams goal. The team with 5 goals wins.",

/* Normalizes one exercise record's fields — used both for the bundled starting data and for
   rows freshly pulled from the live Google Sheet, so both paths behave identically. */
// A Diagram/Video URL cell that isn't actually a link (a stray note like "Insta" landing in the
// wrong spreadsheet column, a typo, etc.) would otherwise get handed straight to an <img>/<video>
// src and render as a blank or broken tile instead of the normal fallback icon. Treat anything
// that doesn't look like a real link the same as if the cell were empty.
function looksLikeMediaUrl(v){
  if(typeof v !== 'string') return false;
  const s = v.trim();
  return /^https?:\/\//i.test(s) || /^data:(image|video)\//i.test(s);
}
// Trims whitespace and folds legacy/casing variants (a lingering "Warm Up" from before the
// single-word rename, stray capitalization, a trailing space from a copy-paste) onto the section
// names the app actually knows about -- so a formatting slip in the sheet doesn't silently zero
// out a section filter (e.g. picking exercises for the Warmup phase showing no results). Anything
// unrecognized is left as-is (trimmed) so custom, coach-added sections still work.
const SECTION_ALIASES = {
  'warm up':'Warmup', 'warmup':'Warmup', 'athletic':'Athletic', 'duels':'Duels',
  'rondos':'Rondos', 'ssgs':'SSGs', 'ssg':'SSGs', 'scrimmage':'Scrimmage',
};
function normalizeSectionValue(v){
  if(v===undefined || v===null) return v;
  const trimmed = String(v).trim();
  if(!trimmed) return trimmed;
  return SECTION_ALIASES[trimmed.toLowerCase()] || trimmed;
}
// Guards against duplicate or blank Exercise IDs (most often: a new row copied from an existing
// one whose ID column never got changed, or was left blank). Without this, EXERCISES.find(e =>
// e.id === id) always resolves to whichever colliding row comes first in the sheet -- so tapping
// one exercise's tile can silently open a completely different exercise's detail page. Instead of
// failing silently, every row is guaranteed a unique id, and the collision is flagged (via the
// return value, surfaced as a Home-screen banner) rather than causing confusing navigation.
function dedupeExerciseIds(list){
  const seen = new Map();
  let hadIssue = false;
  list.forEach((e, i) => {
    let id = (e.id || '').trim();
    if(!id){
      hadIssue = true;       // blank ID -- flag it, even though the fallback below keeps it unique
      id = '_ROW' + i;
    }
    if(seen.has(id)){
      hadIssue = true;       // a real duplicate, not just a blank
      const n = seen.get(id) + 1;
      seen.set(id, n);
      e.id = id + '-dup' + n;
    } else {
      seen.set(id, 0);
      e.id = id;
    }
  });
  return hadIssue;
}
function normalizeExerciseRecord(e){
  if(e.mediaUrl===undefined) e.mediaUrl=null;
  if(e.videoUrl===undefined) e.videoUrl=null;
  if(e.mediaUrl && !looksLikeMediaUrl(e.mediaUrl)) e.mediaUrl=null;
  if(e.videoUrl && !looksLikeMediaUrl(e.videoUrl)) e.videoUrl=null;
  e.section = normalizeSectionValue(e.section);
  if(e.location===undefined || e.location===null || e.location===''){
    const text = (e.name + ' ' + (e.setup||'') + ' ' + (e.description||'')).toLowerCase();
    e.location = text.includes('wall') ? 'indoor' : 'both';
  } else {
    e.location = String(e.location).toLowerCase();
    if(!['indoor','outdoor','both'].includes(e.location)) e.location = 'both';
  }
  return e;
}

const DIFF_TEXT_MAP = {Beginner:1, Intermediate:3, Advanced:5};
function parseDifficultyField(v){
  if(v===undefined || v===null || v==='') return null;
  const trimmed = String(v).trim();
  if(DIFF_TEXT_MAP[trimmed] !== undefined) return DIFF_TEXT_MAP[trimmed];
  const n = parseInt(trimmed, 10);
  return isNaN(n) ? null : n;
}
function splitTags(v){
  if(!v) return [];
  // Google Sheets' native multi-select dropdown ("Allow multiple selections" on a chip-format
  // Data Validation rule) writes its picks into the cell comma-separated (e.g. "Passing, Receiving"),
  // not semicolon-separated -- so both delimiters need to be accepted here. None of the tag
  // vocabulary itself contains a comma or semicolon, so splitting on either is safe.
  return String(v).split(/[;,]/).map(s=>s.trim()).filter(Boolean);
}
function csvRowToExercise(row){
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  return {
    id: (row['Exercise ID']||'').trim(),
    name: (row['Exercise Name']||'').trim(),
    section: (row['Section']||'').trim(),
    category: row['Category']?.trim() || null,
    difficulty: parseDifficultyField(row['Difficulty']),
    duration: num(row['Duration (min)']),
    setup: row['Setup']?.trim() || null,

    mediaUrl: row['Diagram URL']?.trim() || null,
    videoUrl: row['Video URL']?.trim() || null,
  };
}

// Apps Script returns raw JSON cell values (not always strings — e.g. Duration may already be a
// number), so this coerces defensively rather than assuming .trim() is safe like the CSV path can.
function jsonRowToExercise(row){
  const str = (v) => (v===null || v===undefined) ? '' : String(v).trim();
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  return {
    id: str(row['Exercise ID']),
    name: str(row['Exercise Name']),
    section: str(row['Section']),
    category: str(row['Category']) || null,
    difficulty: parseDifficultyField(row['Difficulty']),

    description: str(row['Description']) || null,
    coachingPoints: str(row['Coaching Points']) || null,

    technicalTags: splitTags(row['Technical Tags']),
    tacticalTags: splitTags(row['Tactical Tags']),
    formatTags: splitTags(row['Format Tags']),
    physicalTags: splitTags(row['Physical Tags']),
    cognitiveTags: splitTags(row['Cognitive Tags']),
    engagementTags: splitTags(row['Engagement Tags']),
    source: str(row['Source']) || null,
    location: str(row['Location']) || 'both',
    mediaUrl: str(row['Diagram URL']) || null,
    videoUrl: str(row['Video URL']) || null,
  };
}

async function syncExercisesFromSheet(){
  let rows = null;
  let usedSource = null;

  // Preferred: Apps Script Web App — works even though the sheet itself is private.
  if(APPS_SCRIPT_URL){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        rows = data.map(jsonRowToExercise);
        usedSource = 'Apps Script';
      }
    } catch(err){
      console.warn('Apps Script sync skipped:', err.message);
    }
  }

  // Fallback: direct CSV export — only works if the sheet is shared "Anyone with the link — Viewer".
  if(!rows){
    try{
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
      const csvText = await res.text();
      if(typeof Papa === 'undefined') throw new Error('CSV parser not loaded');
      const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
      const csvRows = parsed.data.filter(r => (r['Exercise Name']||'').trim());
      if(csvRows.length){
        rows = csvRows.map(csvRowToExercise);
        usedSource = 'CSV export';
      }
    } catch(err){
      console.warn('CSV sheet sync skipped:', err.message);
    }
  }

  // Neither source worked (offline, opened as a local file, CSP blocking external fetch on a
  // hosted Artifact copy, a stale/redeployed Apps Script URL, etc.) — keep the bundled data, but
  // (unlike before) tell the coach so a stale copy never masquerades as current. This is the
  // single most likely explanation any time a recently-added video or diagram link "isn't
  // showing up" on a phone: the newest sheet edits never made it down to that device.
  if(!rows){ state.dataSource = 'offline'; render(); return; }
  state.dataSource = 'live';

  // Keep any locally-attached media (e.g. animated diagrams built directly in the app) for
  // exercises the sheet doesn't have a Diagram URL for yet, matched by name.
  const localMediaByName = {};
  EXERCISES.forEach(e => { if(e.mediaUrl) localMediaByName[e.name] = e.mediaUrl; });

  const fresh = rows.map(e => {
    if(!e.mediaUrl && localMediaByName[e.name]) e.mediaUrl = localMediaByName[e.name];
    return normalizeExerciseRecord(e);
  });
  state.hasIdCollision = dedupeExerciseIds(fresh);

  EXERCISES.length = 0;
  EXERCISES.push(...fresh);
  render();
  showToast(`Synced with your live exercise sheet (${usedSource})`);
}

   Small Sided Games 20%, Scrimmage 20% -- sums to exactly 100%. */
function defaultTemplateSections(){

  return PHASES.map(p => ({key:p.key, label:p.label, pct:pctByKey[p.key]||0, standard:true, enabled:true}));
}

// declaration order for any key not yet present (e.g. before a template has ever been saved).
function orderedPhases(){

// Coaching guideline for how a session's time should roughly break down across phase groups.
const SUGGESTED_SPLIT = [
  {key:'warmupAthletic', label:'Warmup + Athletic', pct:25, color:'var(--sec-warmup)', textOn:'white'},
  {key:'duels',          label:'Duels',             pct:15, color:'var(--sec-duels)',  textOn:'white'},
  {key:'rondos',         label:'Rondos',             pct:20, color:'var(--sec-duels)',  textOn:'white'},
  {key:'ssg',            label:'SSGs',               pct:20, color:'var(--sec-duels)',  textOn:'white'},
  {key:'scrimmage',      label:'Scrimmage',          pct:20, color:'var(--sec-scrimmage)', textOn:'dark'},
];
/* Suggested-split minutes, rounded to the nearest 5m for a cleaner readout (e.g. ~11m -> 10m,
   ~19m -> 20m) without letting the rounded total run over the session's target length when
   avoidable -- trims 5m at a time from whichever phase group is currently furthest above its
   own raw (un-rounded) share until the rounded total fits, or every group has hit 0. */
function suggestedSplitMinutes(target){
  const raw = SUGGESTED_SPLIT.map(s => target * s.pct / 100);
  const rounded = raw.map(r => Math.max(0, Math.round(r/5)*5));
  let total = rounded.reduce((a,b)=>a+b,0);
  while(total > target){
    let idx = -1, bestOver = -Infinity;
    rounded.forEach((r,i) => {
      if(r <= 0) return;
      const over = r - raw[i];
      if(over > bestOver){ bestOver = over; idx = i; }
    });
    if(idx === -1) break;
    rounded[idx] -= 5;
    total -= 5;
  }
  return rounded;
}

/* Renders an exercise's media as the right tag: <video> for MP4/WebM/MOV exports (e.g. from
   tactical-board.com), <img> for GIF/PNG/JPEG/etc. extraStyle sizes the element/wrapper.
   autoplay (default true) controls playback: the Detail page passes true so a coach sees the
   drill actually run as soon as they open it; every thumbnail context (grid cards, build-list
   rows, session review, similar-exercises) passes false so the same video shows only its first
   frame as a still — no small autoplaying videos competing for attention in a scrolling list,
   and far less bandwidth than playing every visible video at once. A small play badge marks
   still frames as tappable-to-watch so it doesn't read as a broken image. */
function isVideoUrl(url){
  return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
}
function mediaTagHtml(url, altText, extraStyle, autoplay){
  if(autoplay === undefined) autoplay = true;
  const style = extraStyle || '';
  if(isVideoUrl(url)){
    if(autoplay){
      return `<video src="${escAttr(url)}" autoplay muted loop playsinline style="${style}" onerror="mediaLoadFailed(this)"></video>`;
    }
    // Plain first-frame still, no play badge overlay -- reads as a normal photo thumbnail.
    return `<div class="media-still-wrap" style="${style}">
      <video src="${escAttr(url)}#t=0.1" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;" onloadedmetadata="this.currentTime=0.1" onerror="mediaLoadFailed(this)"></video>
    </div>`;
  }
  return `<img src="${escAttr(url)}" alt="${escAttr(altText||'')}" style="${style}" onerror="mediaLoadFailed(this)">`;
}
/* A Diagram URL that's set but unreachable/invalid (wrong link type -- a Google Drive share page
   or YouTube page instead of a direct file link -- a typo'd/renamed filename, or a link accidentally
   pasted into the wrong Sheet column) previously showed the browser's own bare broken-image icon,
   with zero indication anything was wrong or why. Swap it for the same "Diagram coming soon"
   placeholder shown when no media is set at all, so a bad link degrades gracefully everywhere
   mediaTagHtml() is used (exercise cards, the Detail page, session rows, Similar Exercises). */
function mediaLoadFailed(el){
  if(el.dataset.mediaFailed) return;
  el.dataset.mediaFailed = '1';
  const wrap = el.closest('.media-still-wrap');
  const target = wrap || el;
  const style = target.getAttribute('style') || '';
  const fallback = document.createElement('div');
  fallback.className = 'media-error-fallback';
  fallback.setAttribute('style', style);
  fallback.innerHTML = `${ICONS.image}<span>Diagram coming soon</span>`;
  target.replaceWith(fallback);
}

  const templateCustoms = tmpl.sections.filter(s=>!s.standard && s.enabled!==false);

    if(!es){

/* Long-press-and-drag reorder for Settings template rows. Warmup is excluded entirely -- it's
   never the drag source and never a valid drop target -- so it's structurally impossible for a
   swap to land anything above it; it stays pinned first without any extra bookkeeping.
   A short setTimeout distinguishes a deliberate long-press-drag from an ordinary tap/scroll:
   if the pointer moves more than a few px before the timer fires, the gesture is treated as a
   scroll instead and the drag is cancelled. */
let tmplDrag = null;
function tmplGripDown(e, loc, key){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!tmplDrag) return;
    tmplDrag.longPressed = true;
    const row = document.querySelector(`.tmpl-row[data-key="${key}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  tmplDrag = {loc, key, timer, startY, longPressed:false};
  document.addEventListener('pointermove', tmplGripMove);
  document.addEventListener('pointerup', tmplGripUp);
}
function tmplGripMove(e){
  if(!tmplDrag) return;
  if(!tmplDrag.longPressed){
    if(Math.abs(e.clientY - tmplDrag.startY) > 8){ tmplGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const sections = state.practiceTemplates[tmplDrag.loc].sections;
  const reorderableKeys = sections.filter(s=>s.key!=='warmup').map(s=>s.key);
  let overKey = null;
  reorderableKeys.forEach(k=>{
    const el = document.querySelector(`.tmpl-row[data-key="${k}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overKey = k;
  });
  if(!overKey || overKey===tmplDrag.key) return;
  const fromIdx = sections.findIndex(s=>s.key===tmplDrag.key);
  const toIdx = sections.findIndex(s=>s.key===overKey);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = sections.splice(fromIdx,1);
  sections.splice(toIdx,0,moved);
  render();
  const key = tmplDrag.key;
  setTimeout(()=>{ const row=document.querySelector(`.tmpl-row[data-key="${key}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function tmplGripCancel(){
  if(tmplDrag) clearTimeout(tmplDrag.timer);
  tmplDrag = null;
  document.removeEventListener('pointermove', tmplGripMove);
  document.removeEventListener('pointerup', tmplGripUp);
}
function tmplGripUp(){
  tmplGripCancel();
  render();
}

/* ============ EXERCISES (grid + filters) ============ */
function matchesFilters(ex){
  if(state.filters.bookmarkedOnly && !state.bookmarks.has(ex.id)) return false;
  if(state.sectionFilter && ex.section !== state.sectionFilter) return false;
  if(state.filters.durations.size){
    const d = ex.duration || 10;
    let bucket;
    if(d<=5) bucket='5';
    else if(d<=10) bucket='10';
    else if(d<=15) bucket='15';
    else bucket='20';
    if(!state.filters.durations.has(bucket)) return false;
  }
  if(state.filters.tags.size){
    const tags = allTagsFor(ex);
    let hit=false;
    for(const t of state.filters.tags){ if(tags.includes(t)){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.difficulty.size && !state.filters.difficulty.has(ex.difficulty)) return false;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const hay = (ex.name+' '+(ex.description||'')+' '+(ex.category||'')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderExercises(){
  const list = EXERCISES.filter(matchesFilters);

    ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase))

        <button onclick="clearBookmarkFilter()">Show all</button>

function isExerciseInAnyPhase(id){
  if(PHASES.some(p => state.phaseData[p.key].includes(id))) return true;
  return state.extraSections.some(s => s.exercises.includes(id));
}
/* Where an exercise actually IS in the session right now, if anywhere — as opposed to
   targetPhaseKeyFor(), which only guesses where it *would* go on add (from state.pickingPhase or
   its current Section field). Using the guess for removal is the bug behind "remove sometimes
   doesn't work": an exercise sitting in a custom section, or whose Section was edited after being
   added, guesses a different phase than the one it's actually sitting in, so the toggle thinks
   it's not in the session and adds a second copy instead of removing the real one. */
function findPhaseKeyContaining(id){
  const p = PHASES.find(p => state.phaseData[p.key].includes(id));
  if(p) return p.key;
  const s = state.extraSections.find(s => s.exercises.includes(id));
  return s ? s.key : null;
}
function phaseCount(key){
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].length;
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.length : 0;
}
function targetPhaseKeyFor(ex){
  return guessPhaseForSection(ex.section) || state.pickingPhase;
}
/* Small visual thumbnail for an exercise row — quick "what am I doing" scan, echoing a coach's own session-sheet doodles */
function peiThumbHtml(ex){
  if(!ex) return `<div class="pei-thumb" style="background:var(--chalk-dim);"></div>`;
  const st = secStyle(ex.section);
  if(ex.mediaUrl) return `<div class="pei-thumb">${mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false)}</div>`;
  return `<div class="pei-thumb" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`;
}
function isExerciseInPhase(id, key){
  if(!key) return false;
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].includes(id);
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.includes(id) : false;
}

function onSearch(v){ state.search = v; renderSoft(); }
function clearSearch(){
  state.search = '';
  renderSoft();
  const el = document.getElementById('searchInput');
  if(el) el.focus();
}
function setSectionFilter(s){ state.sectionFilter = s; render(); }
function setViewMode(mode){ state.viewMode = mode; render(); }
function toggleBookmark(e, id){
  e.stopPropagation();
  if(state.bookmarks.has(id)) state.bookmarks.delete(id); else state.bookmarks.add(id);
  render();
}

/* Toggle add/remove for an exercise. Removal always targets wherever it's actually sitting
   (findPhaseKeyContaining); only adding falls back to the guessed target phase, since there's
   nowhere to look up yet. */
function quickAdd(e, id){
  e.stopPropagation();
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  if(needsStartSessionConfirm()){
    // Show an in-app confirm sheet instead of window.confirm() -- native confirm() is silently
    // swallowed with no UI at all in iOS Safari's "Add to Home Screen" standalone mode, which
    // made tapping Add appear to do nothing.
    state.pendingQuickAdd = { id, targetKey };
    renderOverlay();
    return;
  }
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}
/* Adding an exercise while browsing Explore Exercises directly (not via the guided Build ->
   "Add exercise" flow) silently starts building a session in the background — confusing if the
   coach didn't mean to start one yet. Confirm with them the first time, when the builder is
   otherwise completely empty; once it has anything in it, just keep adding normally. */
function needsStartSessionConfirm(){
  if(state.pickingPhase) return false; // already explicitly in the guided Build flow
  if(currentTotalMinutes().count > 0) return false; // a session is already in progress
  return true;
}
function confirmQuickAddYes(){
  const pending = state.pendingQuickAdd;
  if(!pending) return;
  state.pendingQuickAdd = null;
  const ex = exById(pending.id);
  if(pending.wasDraft) saveDraftExercise(true);
  addToPhase(pending.targetKey, pending.id);
  showToast(`Started a new practice — added "${ex.name}" to ${phaseLabel(pending.targetKey)}`);
}
function confirmQuickAddNo(){
  state.pendingQuickAdd = null;
  renderOverlay();
}
function guessPhaseForSection(section){
  const p = PHASES.find(p=>p.section===section);
  return p ? p.key : null;
}
function phaseLabel(key){
  const p = PHASES.find(p=>p.key===key);
  if(p) return p.label;
  const extra = state.extraSections.find(s=>s.key===key);
  return extra ? extra.label : key;
}
function addToPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    if(!state.phaseData[key].includes(id)) state.phaseData[key].push(id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s && !s.exercises.includes(id)) s.exercises.push(id);
  }
  render();
}
function removeFromPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    state.phaseData[key] = state.phaseData[key].filter(x=>x!==id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s) s.exercises = s.exercises.filter(x=>x!==id);
  }
  render();
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* soft render: skip full topbar/bottomnav rebuild for typing responsiveness */
function renderSoft(){
  // Re-rendering swaps out the whole #content subtree, which would normally yank focus (and the
  // text cursor) out of whatever field the coach is actively typing in -- e.g. the search box,
  // where every keystroke calls this. Capture the focused element's id + cursor position first,
  // then restore both after the new DOM is in, so typing feels continuous instead of dropping
  // focus after the first character.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  document.getElementById('content').innerHTML = screens[state.screen]();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

  <div class="detail-block"><h4>Coaching points</h4><p contenteditable="true" onblur="updateExerciseField('${ex.id}','coachingPoints',this.innerText)">${escHtml(ex.coachingPoints||'—')}</p></div><div class="divider"></div>
  <div class="detail-block"><h4>Variations</h4><p contenteditable="true" onblur="updateExerciseField('${ex.id}','variations',this.innerText)">${escHtml(ex.variations||'—')}</p></div><div class="divider"></div>
  <div class="detail-block" style="padding-top:4px;">
    <div class="detail-block-head"><h4 style="margin:0;">Tags</h4><button class="add-tag-trigger" onclick="openTagPicker('${ex.id}')">${ICONS.plus} Add tags</button></div>

      <div class="loc-select-pill">

        <select onchange="updateExerciseField('${ex.id}','location',this.value)">
          <option value="both" ${ex.location==='both'?'selected':''}>Indoor or Outdoor</option>
          <option value="indoor" ${ex.location==='indoor'?'selected':''}>Indoor only</option>
          <option value="outdoor" ${ex.location==='outdoor'?'selected':''}>Outdoor only</option>

      ${tags.map(t=>`<span class="tagpill">${escHtml(t)}</span>`).join('')}

  ${similar.length ? `
  <div class="detail-block" style="padding-top:4px;">
    <h4>Similar exercises</h4>
    <div class="similar-row">
      ${similar.map(s=>{
        const sst = secStyle(s.section);
        const thumb = s.mediaUrl
          ? `<div class="sim-thumb" style="background:${sst.color};">${mediaTagHtml(s.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false)}</div>`
