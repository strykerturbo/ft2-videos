function toggleSessionBalanceInfo(){ state.sessionBalanceInfoOpen = !state.sessionBalanceInfoOpen; render(); }

/* ============ TRAINING-PROFILE-AWARE DISCOVERY & QUICK PICK ============ */
/* Maps a tag VALUE (e.g. "Speed", "Possession", "Decision Making") to the single Training
   Dimension score field it belongs to, by checking it against the coach's own Valid Values
   vocabulary (state.validValues) -- never a hardcoded table, so it can't drift out of sync
   with the actual tag categories. Returns null when the value isn't a Technical/Tactical/
   Physical/Cognitive tag at all (a Format value like "1v1", or an Engagement value), or when
   it's legitimately valid under more than one dimension (e.g. "Reaction" is valid under both
   Physical and Cognitive) -- either way there's no single unambiguous dimension to rank by,
   so callers just skip the score-based ranking boost for that value rather than guess. */
const DIMENSION_TAG_CATEGORIES = TRAINING_DIMENSION_DEFS.map(d => ({validKey:d.validKey, scoreKey:d.scoreKey}));
function dimensionForTagValue(value){
  if(!value) return null;
  const matches = DIMENSION_TAG_CATEGORIES.filter(c => (state.validValues[c.validKey]||[]).includes(value));
  return matches.length === 1 ? matches[0].scoreKey : null;
}
/* Which Training Dimension score(s) should rank the exercise list right now -- the coach's own
   signal of "training priority", read from what they've actually done, never invented: the
   Training Focus chips in the Filters sheet if any are active (each one already IS one of the
   4 dimensions), otherwise the active per-section Quick Filter value if it maps unambiguously
   to a single dimension via dimensionForTagValue(). Multiple active Training Focus dimensions
   rank by their combined score. */
function activeRankingDimensions(){
  if(state.filters.focusCategories.size){
    const map = {};
    TRAINING_DIMENSION_DEFS.forEach(d => { map[d.tagFieldKey] = d.scoreKey; });
    return [...state.filters.focusCategories].map(k=>map[k]).filter(Boolean);
  }
  if(state.pickingPhase && state.quickFilterValue){
    const dim = dimensionForTagValue(state.quickFilterValue);
    return dim ? [dim] : [];
  }
  return [];
}
/* The current practice's least-emphasized Training Dimension (reusing the batch-46 duration-
   weighted practice profile) -- a gentle secondary ranking nudge while picking exercises for
   an in-progress practice, never a hard rule. Returns null for an empty practice (nothing to
   be under-represented relative to yet). A dimension with no data at all (score:null --
   literally zero exercises have trained it so far) is treated the same as a real 0 for this
   specific "what's most under-represented" comparison, since both mean "nothing here yet".
   Tie-break: TRAINING_DIMENSIONS is walked in its fixed Technical/Tactical/Physical/Cognitive
   order and only a STRICTLY lower value replaces the current minimum, so when two or more
   dimensions are tied for least-emphasized, the earliest one in that fixed order wins --
   deterministic, not a claim that one is "more" under-emphasized than the other.
   Memoized per practice-composition signature (which exercises are in which phase/section --
   not scroll position or any other render state), so repeated calls within one render pass --
   including from renderOverlay()-only call sites that skip the full render(), e.g.
   balanceAddExercise()/toggleFilters()/openTagPicker() -- don't redo the same computation. The
   cache key is rebuilt from the actual phase/section exercise lists, so it can never go stale:
   any real composition change immediately produces a different signature. */
let _leastEmphasizedCache = null; // {sig, key}
function leastEmphasizedDimension(){
  const sig = JSON.stringify([PHASES.map(p=>state.phaseData[p.key]), state.extraSections.map(s=>s.exercises)]);
  if(_leastEmphasizedCache && _leastEmphasizedCache.sig === sig) return _leastEmphasizedCache.key;
  const items = currentPracticeTrainingItems();
  let result = null;
  if(items.length){
    const profile = practiceTrainingProfile(items);
    let min = null;
    profile.forEach(d => {
      const v = d.score === null ? 0 : d.score;
      if(min === null || v < min.value) min = {key:d.key, value:v};
    });
    result = min ? min.key : null;
  }
  _leastEmphasizedCache = {sig, key: result};
  return result;
}
/* Combined ranking priority for one exercise in the currently-shown list. Explicit coach
   intent (an active Training Focus / Quick Filter dimension, weight x3) dominates over the
   softer practice-balance nudge (weight x1, and only applied when it isn't already the
   explicit dimension, to avoid double-counting) -- so the coach's actual request always wins
   and the balance signal only orders among exercises that already satisfy it. This function
   only decides the ORDER of an already-filtered list; matchesFilters() alone decides what's
   in it, per the coach's explicit "ranking, not filtering" instruction. */
function exerciseRankingScore(ex, rankDims, balanceDim){
  let score = 0;
  rankDims.forEach(k => { const v = clampScore(ex[k]); if(v !== null) score += v*3; });
  if(balanceDim && !rankDims.includes(balanceDim)){
    const v = clampScore(ex[balanceDim]);
    if(v !== null) score += v*1;
  }
  return score;
}

/* ---- Balance My Practice ---- */
/* Up to 3 exercise recommendations aimed at strengthening whichever Training Dimension the
   current practice is currently lightest on. Always respects the section being picked, the
   active Quick Filter (if any), and prefers excluding exercises already in the practice --
   but only "when possible": if excluding them would leave fewer than 3 candidates, they're
   included after all rather than returning a starved list. Duration is a soft tiebreaker
   (closer to the practice's remaining time budget ranks higher among equally-scored
   candidates), never a hard cutoff -- an empty remaining budget just turns that tiebreaker
   off instead of producing zero recommendations. */
/* Given a Training Dimension key, returns the PHASES key most associated with training it --
   used only when Balance My Practice is opened without an active picking-phase context (i.e.
   from the Review page, batch 55, rather than from inside "+ Add Exercise" for a specific
   section as before). Reuses Quick Pick's own SECTION_PRIMARY_DIMENSIONS mapping (declared
   further down this file) rather than inventing a second one -- prefers a section where the
   dimension is that section's PRIMARY (first-listed) focus before falling back to any section
   where it's only a secondary one, so e.g. a practice that's lightest on Physical routes to
   Athletic (Physical is its sole/primary focus) rather than Duels (where Physical is only
   secondary to Tactical). */
function bestSectionKeyForDimension(dim){
  const primary = PHASES.find(p => (SECTION_PRIMARY_DIMENSIONS[p.key]||[])[0] === dim);
  if(primary) return primary.key;
  const secondary = PHASES.find(p => (SECTION_PRIMARY_DIMENSIONS[p.key]||[]).includes(dim));
  return secondary ? secondary.key : (PHASES[0]?.key || null);
}
/* Recomputes Balance My Practice's recommendation set and freezes it into state.balanceSnapshot,
   exactly like refreshQuickPickResults() does for Quick Pick (batch 58) -- otherwise recomputing
   fresh on every render (including right after tapping [+ Add]) could change which exercises are
   shown, or even silently retarget which section/dimension is being balanced, mid-interaction. */
function refreshBalanceResults(){
  state.balanceOffset = 0; // any fresh (non-"next") recompute restarts the Refresh Exercises cycle at the top
  state.balanceCardIndex = 0;
  state.balanceSnapshot = computeBalanceRecommendations();
}
/* Shared ranking pass -- same dimension/duration-fit scoring Balance My Session has always used,
   just returning the FULL ordered candidate list instead of only the top 3, so "Refresh
   Exercises" can step to the next window of the same ranking instead of recomputing an identical
   top 3 every time. */
function rankedBalanceCandidates(){
  const dim = leastEmphasizedDimension();
  if(!dim) return {dim:null, section:null, phaseKey:null, ranked:[]};
  const phaseKey = bestSectionKeyForDimension(dim);
  const phase = PHASES.find(p=>p.key===phaseKey);
  const section = phase ? phase.section : state.sectionFilter;
  if(!section) return {dim, section:null, phaseKey:null, ranked:[]};

  const alreadyIn = new Set();
  PHASES.forEach(p => state.phaseData[p.key].forEach(id=>alreadyIn.add(id)));
  state.extraSections.forEach(s => s.exercises.forEach(id=>alreadyIn.add(id)));

  const {total} = currentTotalMinutes();
  const remaining = Math.max(0, state.targetDuration - total);

  // Balance My Session is Review-only (batch 55) -- there's no active Quick Filter concept
  // on that page, so the pool is always the full section (no leftover-filter scoping).
  let pool = EXERCISES.filter(ex => ex.section === section);

  let candidates = pool.filter(ex => !alreadyIn.has(ex.id));
  if(candidates.length < 3) candidates = pool; // "exclude already-included when possible"

  const ranked = candidates
    .map(ex => ({ex, dimScore: clampScore(ex[dim]) ?? 0}))
    .sort((a,b) => {
      if(b.dimScore !== a.dimScore) return b.dimScore - a.dimScore;
      if(remaining>0){
        const da = Math.abs((a.ex.duration||10)-remaining);
        const db = Math.abs((b.ex.duration||10)-remaining);
        if(da !== db) return da-db;
      }
      return a.ex.name.localeCompare(b.ex.name);
    })
    .map(s=>s.ex);

  return {dim, section, phaseKey, ranked};
}
function computeBalanceRecommendations(){
  const {dim, section, phaseKey, ranked} = rankedBalanceCandidates();
  if(!section) return {dim, section:null, phaseKey:null, items:[]};
  return {dim, section, phaseKey, items: ranked.slice(0,3)};
}
/* "Refresh Exercises": steps forward through the same ranked list, 3 at a time, wrapping back to
   the top once it runs past the end -- never a different ranking, just the next window of it. */
function refreshBalanceNext(){
  const {dim, section, phaseKey, ranked} = rankedBalanceCandidates();
  if(!section || !ranked.length){ refreshBalanceResults(); renderOverlay(); return; }
  state.balanceOffset = (state.balanceOffset + 3) % ranked.length;
  state.balanceCardIndex = 0;
  const items = [];
  for(let i=0;i<3 && i<ranked.length;i++) items.push(ranked[(state.balanceOffset+i) % ranked.length]);
  state.balanceSnapshot = {dim, section, phaseKey, items};
  renderOverlay();
}
/* Same one-card-at-a-time pager as Quick Pick's stepQuickPickCard()/qpSwipe -- see the comments
   there. Stepping past the last of the current 3 rolls into refreshBalanceNext()'s next window
   instead of wrapping back to a card already seen; stepping "previous" from the first card just
   wraps within the current 3. */
function stepBalanceCard(delta){
  const items = (state.balanceSnapshot || computeBalanceRecommendations()).items;
  const n = items.length;
  if(n <= 1) return;
  const next = state.balanceCardIndex + delta;
  if(next >= n){ refreshBalanceNext(); return; }
  state.balanceCardIndex = next < 0 ? n-1 : next;
  renderOverlay();
}
let balanceSwipe = null;
function balanceSwipeStart(e){ balanceSwipe = {x: e.clientX, y: e.clientY}; }
function balanceSwipeEnd(e){
  if(!balanceSwipe) return;
  const dx = e.clientX - balanceSwipe.x, dy = e.clientY - balanceSwipe.y;
  balanceSwipe = null;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) stepBalanceCard(dx < 0 ? 1 : -1);
}
/* Short, data-traceable "why this fits" sentence -- every clause maps directly to a real field
   on the exercise (its score for the dimension being balanced, and, when a Quick Filter is
   active, whether it actually carries that tag) rather than any generic praise language. */
function balanceRecommendationReason(ex, dim){
  const dimMeta = TRAINING_DIMENSIONS.find(d=>d.key===dim);
  const label = dimMeta ? dimMeta.label : '';
  const score = clampScore(ex[dim]);
  const hasScore = score !== null;
  const tier = hasScore && score>=4 ? 'Strong ' : (hasScore && score>=3 ? 'Good ' : '');
  let sentence = hasScore ? `${tier}${label} Score (${score})` : `No ${label} Score recorded yet`;
  return sentence + '.';
}
function openBalanceSheet(){ state.balanceSheetOpen = true; state.quickPickOpen = false; state.quickPickCustomizeOpen = false; refreshBalanceResults(); renderOverlay(); }
function closeBalanceSheet(){ state.balanceSheetOpen = false; state.balanceSnapshot = null; renderOverlay(); }
function balanceAddExercise(id){
  const ex = exById(id);
  if(!ex) return;
  // Toggle, exactly like quickPickAddExercise(): tapping an already-added card removes it again
  // from wherever it's actually sitting, rather than only ever adding.
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    renderOverlay();
    return;
  }
  // Add to the section frozen in state.balanceSnapshot at open time, not a freshly-recomputed
  // one -- otherwise adding this exercise could shift the practice's least-emphasized dimension
  // and silently redirect the very next Add to a different section mid-interaction.
  const targetKey = (state.balanceSnapshot && state.balanceSnapshot.phaseKey) || bestSectionKeyForDimension(leastEmphasizedDimension());
  if(!targetKey) return;
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
  renderOverlay(); // keep the sheet open, just refresh each card's Added state
}
function balanceCardHtml(ex, i, dim){
  const inPhase = isExerciseInAnyPhase(ex.id);
  // Always pin the dimension this recommendation is actually ranked on into slot 1, so the
  // displayed scores can never disagree with the 'why it fits' text below them (a plain
  // top-2-by-magnitude sort could otherwise bump the relevant dimension out when 2+ others
  // happen to tie or beat it) -- fill the remaining slot with the exercise's next-strongest
  // other dimension for context.
  const dimMeta = TRAINING_DIMENSIONS.find(d=>d.key===dim);
  const pinnedScore = dimMeta ? clampScore(ex[dim]) : null;
  const pinned = pinnedScore !== null ? [{label:dimMeta.label, score:pinnedScore}] : [];
  const others = TRAINING_DIMENSIONS
    .filter(d => d.key!==dim)
    .map(d => ({label:d.label, score:clampScore(ex[d.key])}))
    .filter(d => d.score !== null)
    .sort((a,b) => b.score-a.score);
  const topScores = [...pinned, ...others].slice(0,2);
  const tags = allTagsFor(ex).slice(0,5);
  return `
  <div class="balance-card">
    <div class="balance-card-head">
      <div class="balance-card-num">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div class="balance-card-name" onclick="openDetail('${escJsAttr(ex.id)}')" style="cursor:pointer;">${escHtml(ex.name)}</div>
        <div class="balance-card-meta">${ex.duration||10} min</div>
      </div>
      <button class="balance-add-btn ${inPhase?'added':''}" onclick="balanceAddExercise('${escJsAttr(ex.id)}')">${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}</button>
    </div>
    ${topScores.length ? `<div class="balance-card-scores">${topScores.map(d=>`<span>${d.label} <b>${d.score}</b></span>`).join('')}</div>` : ''}
    ${tags.length ? `<div class="tag-wrap" style="margin-top:6px;">${tags.map(t=>`<span class="tagpill">${escHtml(t)}</span>`).join('')}</div>` : ''}
    <div class="balance-card-reason">"${escHtml(balanceRecommendationReason(ex, dim))}"</div>
  </div>`;
}
function renderBalanceSheetHtml(){
  const {dim, section, items} = state.balanceSnapshot || computeBalanceRecommendations();
  const dimMeta = dim ? TRAINING_DIMENSIONS.find(d=>d.key===dim) : null;
  const label = dimMeta ? dimMeta.label : '';
  const idx = Math.min(state.balanceCardIndex, Math.max(0, items.length-1)); // defensive clamp, same reasoning as renderQuickPickSheetHtml()'s idx
  return `
  <div class="sheet-backdrop" onclick="closeBalanceSheet()"></div>
  <div class="sheet balance-sheet">
    <div class="sheet-handle"></div>
    <div class="qp-sheet-header">
      <h3 class="balance-sheet-title">${ICONS.target}<span>Balance My Session</span></h3>
      <button class="qp-close-btn" onclick="closeBalanceSheet()" title="Close" aria-label="Close">${ICONS.x}</button>
    </div>
    ${dim
      ? `<div class="balance-sub">This practice is currently lightest on <b>${label}</b> &mdash; here are a few exercises that could help.</div>`
      : `<div class="balance-sub">Add a couple of exercises first so there's a practice profile to balance against.</div>`}
    ${(section && items.length) ? `<div class="balance-target-heading">${balanceTargetHeadingText(section, items.length)}</div>` : ''}
    ${items.length>1 ? `<div class="qp-pager">
      <button class="qp-pager-arrow" onclick="stepBalanceCard(-1)" title="Previous suggestion" aria-label="Previous suggestion">${ICONS.back}</button>
      <div class="qp-dots">${items.map((ex2,d)=>`<span class="qp-dot ${d===idx?'active':''}"></span>`).join('')}</div>
      <button class="qp-pager-arrow" onclick="stepBalanceCard(1)" title="Next suggestion" aria-label="Next suggestion">${ICONS.chevronRight}</button>
    </div>` : ''}
    ${items.length ? `<div class="qp-results" onpointerdown="balanceSwipeStart(event)" onpointerup="balanceSwipeEnd(event)">${balanceCardHtml(items[idx], idx, dim)}</div>` : (dim ? `<div class="empty-state" style="padding:16px 0;">${ICONS.empty}<p>No matching ${section?escHtml(section)+' ':''}exercises found right now.</p></div>` : '')}
    <div class="sheet-footer">
      <button class="btn btn-primary" style="flex:1;" onclick="closeBalanceSheet()">Done</button>
    </div>
  </div>`;
}
/* "Add [this exercise / one of these two / one of these three] to [Section]" -- states plainly,
   once, right above the recommendation cards, which section these picks belong to (previously
   the section only appeared as small text under each card's own name, easy to miss and repeated
   once per card instead of said once up front). */
function balanceTargetHeadingText(section, count){
  const countWords = {1:'this exercise', 2:'one of these two exercises', 3:'one of these three exercises'};
  const phrase = countWords[count] || `one of these ${count} exercises`;
  return `Add ${phrase} to ${escHtml(section)}`;
}

/* ============ QUICK PICK ============
   "Give me 3 good exercises for this part of my practice" -- a fast, section-aware, one-click
   alternative to browsing the full list, living entirely inside the existing "+ Add Exercise"
   flow (never a separate page, never a bottom-nav item, never a second "build by training
   intent" workflow). Deliberately distinct from two other existing features it can look similar
   to at a glance:
     - Filters = "I want to precisely search the database" (exhaustive, multi-criteria, coach
       reads every result). Quick Pick never duplicates that interface -- it always returns
       exactly 3 (or fewer, if that's really all there is) and stays a single tap to use.
     - Balance My Practice = "which ONE dimension is this practice lightest on, and what could
       help with specifically that" (always ranks by the single most under-represented
       dimension). Quick Pick's primary signal is instead "what does THIS SECTION typically
       train" (see SECTION_PRIMARY_DIMENSIONS below) -- the practice's lightest dimension is only
       ever a secondary nudge here, exactly the same reduced weight leastEmphasizedDimension()
       already gets from exerciseRankingScore() elsewhere in this file.
   Fully deterministic -- no LLM, no randomness. Every ranking factor below reads a real field
   already on the exercise record or the current practice/session state, so any result can be
   traced back to quickPickReason() below, which only ever describes data that's actually true of
   that exercise. */

// Which Training Dimension score(s) a section's exercises are chosen for -- Quick Pick's PRIMARY
// ranking signal for that section. Not derived from the data (the repository has no "this section
// trains this dimension" field) -- a fixed coaching judgment call, matching the two examples given
// explicitly (Athletic -> Physical; Rondos -> Tactical + Cognitive) and extended to the remaining
// four sections with the same reasoning: Warmup is technical ball-mastery work; Duels are 1v1
// contests (tactical decision-making expressed physically); SSGs and Scrimmage are game-realistic
// small-sided play (tactical primary, physical secondary). A coach can always override this for one
// Quick Pick via Customize > Training Dimension.
const SECTION_PRIMARY_DIMENSIONS = {
  warmup:    ['technicalScore'],
  athletic:  ['physicalScore'],
  duels:     ['tacticalScore','physicalScore'],
  rondos:    ['tacticalScore','cognitiveScore'],
  ssg:       ['tacticalScore','physicalScore'],
  scrimmage: ['tacticalScore','physicalScore'],
};
/* This section's suggested minutes, from the coach's own Settings > Training Session Default
   Settings split (sectionDefaultPcts, batch 51) applied to the current session's target length --
   the closest thing this app already tracks to a per-section time budget, reused rather than
   inventing a new one. Never a hard cap (see quickPickScore()'s soft duration-fit bonus below). */
function sectionPlannedMinutes(phaseKey){
  const pct = sectionDefaultPcts[phaseKey] || 0;
  return Math.max(5, Math.round(state.targetDuration * pct / 100));
}
function sectionRemainingMinutes(phaseKey){
  const used = (state.phaseData[phaseKey]||[]).reduce((a,id)=>a+(exById(id)?.duration||10),0);
  return Math.max(0, sectionPlannedMinutes(phaseKey) - used);
}
// What Quick Pick shows as "SECTION • N MIN" and soft-prioritizes duration around -- remaining
// budget for this section if there's any left, otherwise its full planned share (never 0/blank).
function quickPickTargetMinutes(phaseKey){
  return sectionRemainingMinutes(phaseKey) || sectionPlannedMinutes(phaseKey);
}
/* Planned minutes for a CUSTOM/extra section -- only meaningful when it came from a template
   that gave it a percentage (see applyTemplateToBuilder()); a manually-added extra section has
   no allocation at all, so this returns null rather than inventing one. null means "show actual
   minutes only, no progress bar" everywhere this is used -- never a fabricated target. */
function extraSectionPlannedMinutes(s){
  if(!s || !s.pct) return null;
  return Math.max(5, Math.round(state.targetDuration * s.pct / 100));
}
/* Small reusable actual-vs-planned progress bar, same visual language as the existing session-
   level bar (.progress-track/.progress-fill/.over, see renderBuild()'s header) just sized for an
   inline phase row. Returns null (render plain minutes text instead) when there's no planned
   value to compare against. */
function phaseProgressBarHtml(actual, planned){
  if(!planned) return null;
  const pct = Math.min(100, Math.round((actual/planned)*100));
  const over = actual > planned;
  return `<div class="phase-progress-row"><div class="progress-track" style="height:5px;"><div class="progress-fill ${over?'over':''}" style="width:${pct}%;"></div></div></div>`;
}
// Distinct Format Tag values that actually appear on exercises in one section, in canonical Valid
// Values order (same derivation as filterValueOptions(), just pre-scoped to a section) -- this is
// how Duels naturally offers 1v1/2v1/2v2 and Rondos naturally offers 4v2/5v2/6v3 in Customize,
// without a hardcoded per-section list that could drift from the real repository.
function formatOptionsForSection(section){
  const canonical = state.validValues['Format Tags'] || [];
  const used = new Set();
  EXERCISES.filter(ex => ex.section === section).forEach(ex => (ex.formatTags||[]).forEach(v => { if(v) used.add(v); }));
  const ordered = canonical.filter(v => used.has(v));
  const extra = [...used].filter(v => !canonical.includes(v)).sort((a,b)=>a.localeCompare(b));
  return [...ordered, ...extra];
}

function openQuickPick(){
  // Always starts fresh -- "immediately return exactly 3 recommendations," never a leftover
  // Customize choice from a previous phase or a previous open.
  state.quickPickCustom = {focus:null, dimension:null, time:null, format:null};
  state.quickPickCustomizeOpen = false;
  state.quickPickInfoOpen = false;
  state.quickPickOpen = true;
  state.balanceSheetOpen = false;
  state.filtersOpen = false;
  refreshQuickPickResults();
  renderOverlay();
}
function closeQuickPick(){
  state.quickPickOpen = false;
  state.quickPickCustomizeOpen = false;
  state.quickPickInfoOpen = false;
  state.quickPickSnapshot = null;
  renderOverlay();
}
function toggleQuickPickInfo(){ state.quickPickInfoOpen = !state.quickPickInfoOpen; renderOverlay(); }
function openQuickPickCustomize(){ state.quickPickCustomizeOpen = true; renderOverlay(); }
function closeQuickPickCustomize(){ state.quickPickCustomizeOpen = false; renderOverlay(); }
// Tapping an already-active chip again clears it back to "Any" -- same toggle feel as the rest of
// this app's single-select chip rows (e.g. Quick Filters' setQuickFilter()).
function setQuickPickCustomVal(field, value){
  state.quickPickCustom[field] = (state.quickPickCustom[field] === value) ? null : value;
  renderOverlay();
}
function resetQuickPickCustomize(){
  state.quickPickCustom = {focus:null, dimension:null, time:null, format:null};
  renderOverlay();
}
function applyQuickPickCustomize(){
  state.quickPickCustomizeOpen = false;
  refreshQuickPickResults();
  renderOverlay();
}
function quickPickAddExercise(id){
  const ex = exById(id);
  if(!ex) return;
  if(state.replaceContext){ performReplace(id); return; }
  // Toggle: tapping an already-added card's button removes it again, mirroring quickAdd()'s
  // own add-or-remove behavior everywhere else in the app -- removal always targets wherever
  // the exercise is actually sitting, not just state.pickingPhase (it may have been added to a
  // different phase since).
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    renderOverlay();
    return;
  }
  const targetKey = state.pickingPhase;
  if(!targetKey) return;
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
  renderOverlay(); // keep the sheet open, just refresh this card's Added state
}
/* Combined ranking score for one candidate exercise. Same weight convention as the existing
   exerciseRankingScore(): an explicit signal (this section's primary dimension(s), or the coach's
   own Customize > Training Dimension override) counts x3 per score point; the softer practice-
   balance nudge counts x1, and only when it isn't already one of the primary dimensions (so it's
   never double-counted). A Customize Focus/Format tag match and a close duration fit each add a
   smaller, capped bonus -- present, but never able to outrank a real Training Dimension score
   advantage on their own. */
function quickPickScore(ex, ctx){
  let score = 0;
  ctx.primaryDims.forEach(k => { const v = clampScore(ex[k]); if(v !== null) score += v*3; });
  if(ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null) score += v*1;
  }
  if(ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) score += 4;
  if(ctx.formatTag && (ex.formatTags||[]).includes(ctx.formatTag)) score += 4;
  if(ctx.targetMin > 0){
    const diff = Math.abs((ex.duration||10) - ctx.targetMin);
    score += Math.max(0, 2 - diff/5); // full +2 at an exact match, fading to 0 by ~10min away
  }
  return score;
}
/* Short, data-traceable "why this fits" line -- every clause maps to a real field on the exercise
   (its own Training Dimension score, an actual tag it carries, its actual duration), same
   discipline as the existing balanceRecommendationReason(). Never invents a benefit the exercise's
   own tags/scores don't support, never shows a raw ranking number (the 0-5 Training Dimension
   scores themselves already appear plainly in .balance-card-scores just above -- this line names
   the dimension, not the number). At most one clause per priority tier below, at most 2 total,
   joined short rather than as a sentence:
     1. Exact/close duration fit
     2. An explicit Quick Pick customization match (dimension override, Focus tag, or Format tag)
     3. The section's own default primary dimension(s) -- "Strong"/"Good", same thresholds as
        balanceRecommendationReason() (score>=4 / >=3), combined as "Strong X + Y" when 2 both qualify
     4. The practice-balance dimension this session is currently lightest on
     5/6. Graceful fallback -- whether it's new to this session, and/or its single best dimension,
        and/or (last resort) just its section -- always something true, never nothing. */
function quickPickReason(ex, ctx){
  const dimLabel = k => (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label || '';
  const clauses = [];

  // 1. Duration fit
  const dur = ex.duration || 10;
  if(ctx.targetMin > 0 && Math.abs(dur-ctx.targetMin) <= 2){
    clauses.push(`Fits your ${ctx.targetMin}-min ${ctx.phaseLabel || ex.section} block`);
  }

  // 2. Explicit customization match -- at most one clause from this tier, whichever applies first
  if(clauses.length < 2){
    let customClause = null;
    if(ctx.dimensionOverride && ctx.primaryDims.length){
      const v = clampScore(ex[ctx.primaryDims[0]]);
      if(v !== null && v >= 3) customClause = `Matches your ${dimLabel(ctx.primaryDims[0])} focus`;
    }
    if(!customClause && ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) customClause = `Matches your ${ctx.focusTag} focus`;
    if(!customClause && ctx.formatTag && ctx.formatTag !== ctx.focusTag && (ex.formatTags||[]).includes(ctx.formatTag)) customClause = `Matches your ${ctx.formatTag} focus`;
    if(customClause) clauses.push(customClause);
  }

  // 3. Section's own default primary dimension(s) -- only when not already covered by an
  // explicit override above (that's tier 2's job)
  if(clauses.length < 2 && !ctx.dimensionOverride && ctx.primaryDims.length){
    const scored = ctx.primaryDims.map(k=>({k, v:clampScore(ex[k])})).filter(d=>d.v!==null).sort((a,b)=>b.v-a.v);
    const strong = scored.filter(d=>d.v>=4);
    const good = scored.filter(d=>d.v>=3);
    if(strong.length >= 2) clauses.push(`Strong ${strong.slice(0,2).map(d=>dimLabel(d.k)).join(' + ')}`);
    else if(strong.length === 1) clauses.push(`Strong ${dimLabel(strong[0].k)}`);
    else if(good.length) clauses.push(`Good ${dimLabel(good[0].k)}`);
  }

  // 4. Practice-balance complement
  if(clauses.length < 2 && ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null && v >= 3) clauses.push(`Builds up ${dimLabel(ctx.balanceDim)} (currently lightest)`);
  }

  // 5/6. Fallback -- only reached when nothing above applied. Candidates are already excluded
  // when already-in-session wherever possible (see computeQuickPicks()), so "new to this
  // session" is checked directly rather than assumed, and is never claimed when it isn't true.
  if(!clauses.length){
    if(!isExerciseInAnyPhase(ex.id)) clauses.push('New to this session');
    if(clauses.length < 2){
      const best = TRAINING_DIMENSIONS.map(d=>({label:d.label, v:clampScore(ex[d.key])})).filter(d=>d.v!==null).sort((a,b)=>b.v-a.v)[0];
      if(best && best.v >= 3) clauses.push(`Good ${best.label}`);
      else if(!clauses.length) clauses.push(`Good fit for ${ex.section}`);
    }
  }

  return clauses.slice(0,2).join(' · ');
}
/* Up to 3 recommendations for the section currently being picked for -- always section-scoped
   (rule 4: only ever the current section's own exercises), applies the coach's optional Customize
   choices if any are active, prefers exercises not already in the practice ("when possible" --
   falls back to including them rather than starving the list below 3, exactly like
   computeBalanceRecommendations() already does), and ranks the remainder by quickPickScore(). */
/* Recomputes Quick Pick's recommendation set and freezes it into state.quickPickSnapshot.
   Called only when the sheet opens or Customize is applied (a genuine change of criteria) --
   NEVER on a plain re-render, so tapping [+ Add] on a result doesn't cause computeQuickPicks()'s
   own "exclude already-in-practice when possible" rule to immediately kick the just-added
   exercise out of its own card and swap in a 4th suggestion. */
function refreshQuickPickResults(){
  state.quickPickOffset = 0; // any fresh (non-"next") recompute restarts the Refresh Exercises cycle at the top
  state.quickPickCardIndex = 0;
  state.quickPickSnapshot = computeQuickPicks();
}
/* Shared ranking pass -- same pool/filter/score logic Quick Pick has always used, just returning
   the FULL ordered candidate list (and the ctx it was scored with) instead of only the top 3, so
   "Refresh Exercises" can step to the next window of the same ranking instead of recomputing an
   identical top 3 every time. */
function rankedQuickPickCandidates(){
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  if(!phase) return {section:null, ctx:null, ranked:[], poolSize:0};
  const section = phase.section;
  const c = state.quickPickCustom;
  const primaryDims = c.dimension ? [c.dimension] : (SECTION_PRIMARY_DIMENSIONS[phaseKey] || []);
  const balanceDim = leastEmphasizedDimension();
  const targetMin = quickPickTargetMinutes(phaseKey);

  let pool = EXERCISES.filter(ex => ex.section === section);
  if(c.focus) pool = pool.filter(ex => allTagsFor(ex).includes(c.focus));
  if(c.format) pool = pool.filter(ex => (ex.formatTags||[]).includes(c.format));
  if(c.time){
    // Same 3-bucket convention as matchesFilters()' own Duration filter: <=5, <=10, else "15+".
    pool = pool.filter(ex => {
      const d = ex.duration||10;
      const bucket = d<=5 ? '5' : (d<=10 ? '10' : '15');
      return bucket === c.time;
    });
  }

  const alreadyIn = new Set();
  PHASES.forEach(p => state.phaseData[p.key].forEach(id=>alreadyIn.add(id)));
  state.extraSections.forEach(s => s.exercises.forEach(id=>alreadyIn.add(id)));

  let candidates = pool.filter(ex => !alreadyIn.has(ex.id));
  if(candidates.length < 3) candidates = pool; // prefer unused, but don't starve the list below 3

  const ctx = {primaryDims, balanceDim, targetMin, focusTag: c.focus, formatTag: c.format, phaseLabel: phase.label, dimensionOverride: !!c.dimension};
  const ranked = candidates
    .map(ex => ({ex, score: quickPickScore(ex, ctx)}))
    .sort((a,b) => b.score-a.score || a.ex.name.localeCompare(b.ex.name))
    .map(s=>s.ex);

  return {section, ctx, ranked, poolSize: pool.length};
}
function computeQuickPicks(){
  const {section, ctx, ranked, poolSize} = rankedQuickPickCandidates();
  if(!section) return {section:null, targetMin:0, primaryDims:[], balanceDim:null, items:[], poolSize:0};
  return {section, targetMin:ctx.targetMin, primaryDims:ctx.primaryDims, balanceDim:ctx.balanceDim, items: ranked.slice(0,3), poolSize};
}
/* "Refresh Exercises": steps forward through the same ranked list, 3 at a time, wrapping back to
   the top once it runs past the end -- never a different ranking, just the next window of it. */
function refreshQuickPickNext(){
  const {section, ctx, ranked, poolSize} = rankedQuickPickCandidates();
  if(!section || !ranked.length){ refreshQuickPickResults(); renderOverlay(); return; }
  state.quickPickOffset = (state.quickPickOffset + 3) % ranked.length;
  state.quickPickCardIndex = 0;
  const items = [];
  for(let i=0;i<3 && i<ranked.length;i++) items.push(ranked[(state.quickPickOffset+i) % ranked.length]);
  state.quickPickSnapshot = {section, targetMin:ctx.targetMin, primaryDims:ctx.primaryDims, balanceDim:ctx.balanceDim, items, poolSize};
  renderOverlay();
}
/* One card shows at a time (the pager dots + arrows above it, or a left/right flick, move
   between them) -- stepping past the last card of the current 3 rolls straight into
   refreshQuickPickNext()'s next window of the ranked pool rather than wrapping back to a card
   you already saw, since that's a genuinely new/different suggestion instead of a repeat.
   Stepping "previous" from the first card wraps within the current 3 -- there's no previous
   pool window to go back to, only forward ("Refresh Exercises" never runs in reverse). */
function stepQuickPickCard(delta){
  const items = (state.quickPickSnapshot || computeQuickPicks()).items;
  const n = items.length;
  if(n <= 1) return;
  const next = state.quickPickCardIndex + delta;
  if(next >= n){ refreshQuickPickNext(); return; }
  state.quickPickCardIndex = next < 0 ? n-1 : next;
  renderOverlay();
}
/* A left/right flick over the current card steps to the next/previous one -- see
   stepQuickPickCard() above. Pointer events (not native touch/drag) to match how this app
   already handles every other gesture. Ignores small movements and anything more vertical than
   horizontal, so it never hijacks a normal scroll or a tap on the card's own Add button. */
let qpSwipe = null;
function qpSwipeStart(e){ qpSwipe = {x: e.clientX, y: e.clientY}; }
function qpSwipeEnd(e){
  if(!qpSwipe) return;
  const dx = e.clientX - qpSwipe.x, dy = e.clientY - qpSwipe.y;
  qpSwipe = null;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) stepQuickPickCard(dx < 0 ? 1 : -1);
}
function quickPickCardHtml(ex, i, ctx){
  const inPhase = isExerciseInAnyPhase(ex.id);
  // Pin whichever dimension(s) actually drove this recommendation into the displayed scores
  // first (same "never contradict the reason text" rule balanceCardHtml() already follows), then
  // fill any remaining slot with the exercise's next-strongest other dimension for context.
  const pinnedKeys = new Set(ctx.primaryDims);
  const pinned = ctx.primaryDims
    .map(k => ({label: (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label, score: clampScore(ex[k])}))
    .filter(d => d.score !== null);
  const others = TRAINING_DIMENSIONS
    .filter(d => !pinnedKeys.has(d.key))
    .map(d => ({label:d.label, score:clampScore(ex[d.key])}))
    .filter(d => d.score !== null)
    .sort((a,b) => b.score-a.score);
  const topScores = [...pinned, ...others].slice(0,2);
  const tags = allTagsFor(ex).slice(0,3);
  return `
  <div class="balance-card qp-fixed-card">
    <div class="balance-card-head">
      <div class="balance-card-num">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div class="balance-card-name" onclick="openDetail('${escJsAttr(ex.id)}')" style="cursor:pointer;">${escHtml(ex.name)}</div>
        <div class="balance-card-meta">${ex.duration||10} min</div>
      </div>
      <button class="balance-add-btn qp-add-btn ${inPhase?'added':''}" onclick="quickPickAddExercise('${escJsAttr(ex.id)}')">${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}</button>
    </div>
    ${topScores.length ? `<div class="balance-card-scores">${topScores.map(d=>`<span>${d.label} <b>${d.score}</b></span>`).join('')}</div>` : ''}
    ${tags.length ? `<div class="tag-wrap" style="margin-top:6px;">${tags.map(t=>`<span class="tagpill">${escHtml(t)}</span>`).join('')}</div>` : ''}
    <div class="balance-card-reason">"${escHtml(quickPickReason(ex, ctx))}"</div>
  </div>`;
}

function renderQuickPickSheetHtml(){
  if(state.quickPickCustomizeOpen) return renderQuickPickCustomizeHtml();
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  const result = state.quickPickSnapshot || computeQuickPicks(); // frozen at open/Customize-apply (batch 58) -- see refreshQuickPickResults()
  const label = phase ? phase.label : '';
  const ctx = {primaryDims: result.primaryDims, balanceDim: result.balanceDim, targetMin: result.targetMin, focusTag: state.quickPickCustom.focus, formatTag: state.quickPickCustom.format, phaseLabel: label, dimensionOverride: !!state.quickPickCustom.dimension};
  const n = result.items.length;
  const idx = Math.min(state.quickPickCardIndex, Math.max(0, n-1)); // defensive clamp -- the index is always reset alongside a new snapshot, but never trust a stale index against a snapshot that's since shrunk
  return `
  <div class="sheet-backdrop" onclick="closeQuickPick()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="qp-sheet-header">

    ${n ? `<div class="balance-sub qp-sub-dark">Here ${n===1?'is':'are'} ${n} suggested exercise${n===1?'':'s'} based on the ${escHtml(label)} section, targeting about ${result.targetMin} min.</div>` : ''}

      <button class="qp-pager-arrow" onclick="stepQuickPickCard(-1)" title="Previous suggestion" aria-label="Previous suggestion">${ICONS.back}</button>
      <div class="qp-dots">${result.items.map((ex2,d)=>`<span class="qp-dot ${d===idx?'active':''}"></span>`).join('')}</div>

    </div>` : ''}
    ${n ? `<div class="qp-results" onpointerdown="qpSwipeStart(event)" onpointerup="qpSwipeEnd(event)">${quickPickCardHtml(result.items[idx], idx, ctx)}</div>` : `
    <div class="empty-state" style="padding:16px 0;">${ICONS.empty}<p>Couldn't find a strong match.</p></div>`}
    ${(n>0 && n<3) ? `<div class="qp-fewer-note">Only ${n} strong match${n===1?'':'es'} right now${(state.quickPickCustom.focus||state.quickPickCustom.format||state.quickPickCustom.time||state.quickPickCustom.dimension)?' for your Customize choices':''} -- showing what's available.</div>` : ''}
    <div class="sheet-footer" style="flex-direction:column;gap:8px;">
      ${n ? `<button class="btn btn-ghost qp-customize-btn" style="width:100%;" onclick="openQuickPickCustomize()">${ICONS.filter}<span>Customize</span></button>` : ''}
      <button class="btn btn-primary" style="width:100%;" onclick="closeQuickPick()">Done</button>
    </div>
  </div>`;
}

function nextExerciseId(){
  let max = 0;
  EXERCISES.forEach(e => { const m = /EX(\d+)/.exec(e.id); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return 'EX' + String(max+1).padStart(3,'0');
}

function createNewExercise(){
  const section = state.pickingPhase
    ? (PHASES.find(p=>p.key===state.pickingPhase)?.section || state.sectionFilter || 'Warmup')
    : (state.sectionFilter || 'Warmup');
  const id = nextExerciseId();
  const ex = {
    id, name:'New Exercise', section, category:null, difficulty:null, duration:10,
    setup:'', description:'', coachingPoints:'', variations:'',
    technicalTags:[], tacticalTags:[], formatTags:[], physicalTags:[], cognitiveTags:[], engagementTags:[],
    source:'Coach-created', mediaUrl:null, videoUrl:null,
  };
  // Held as a draft (not yet in the shared EXERCISES repository) until the coach explicitly saves it.
  state.draftExercise = ex;
  openDetail(id);
}
function saveDraftExercise(silent){
  if(!state.draftExercise) return;
  EXERCISES.unshift(state.draftExercise);
  // Also keep a durable copy separate from EXERCISES itself, since a live sheet sync replaces
  // EXERCISES wholesale -- this is the only thing that lets a coach-created exercise survive a
  // reload or a resync instead of silently vanishing while still showing "added to your library".
  state.localExercises.unshift(state.draftExercise);
  state.draftExercise = null;
  if(!silent) showToast('Exercise added to your library');
  render();
}
function discardDraftExercise(){
  state.draftExercise = null;
  nav('exercises');
}
function backFromDetail(){
  if(state.draftExercise){
    // In-app modal, not native confirm() -- confirm() is silently swallowed with no UI at all in
    // iOS Safari's "Add to Home Screen" standalone mode, same reasoning as pendingQuickAdd below.
    state.confirmDiscardExerciseOpen = true;
    renderOverlay();
    return;
  }
  if(state.fromReview){ nav('review'); return; }
  if(state.fromSavedSession){ nav('sessionDetail', {viewingSessionId: state.fromSavedSessionId, fromSavedSession:false, editingSavedSessionId:null}); return; }
  if(state.fromHome){ nav('home', {fromHome:false}); return; }
  if(state.fromBuildList){ nav('build', {fromBuildList:false}); return; }
  // Always back to Explore Exercises -- when fromBuild is true, state.pickingPhase is still set
  // (they're set together, only ever in pickForPhase()), so this naturally lands the coach back
  // on the same Building Session picker screen they came from rather than the full phase grid.
  nav('exercises');
}
function cancelDiscardExercise(){ state.confirmDiscardExerciseOpen = false; renderOverlay(); }
function confirmDiscardExerciseAndBack(){
  state.confirmDiscardExerciseOpen = false;
  state.draftExercise = null;
  backFromDetail();
}

   Practice Templates are a coach's own named library of section/percentage splits -- as many as

function getTemplate(id){ return state.practiceTemplates.find(t=>t.id===id); }
function templateSum(id){
  const t = getTemplate(id);

function adjustTemplatePct(id, key, delta){
  const t = getTemplate(id); if(!t) return;
  const s = t.sections.find(s=>s.key===key);
  if(!s) return;
  s.pct = Math.max(0, Math.min(100, s.pct + delta));
  render();
}
function toggleTemplateSection(id, key){

  const s = t.sections.find(s=>s.key===key);

}
function addTemplateCustomSection(id){

}

  const s = t.sections.find(s=>s.key===key);

function removeTemplateSection(id, key){

/* Applying a template is what actually changes what the coach sees on the Build page -- only ever
   triggered explicitly (the "Load a template" sheet on Build, below), never automatically just
   because a template got edited/saved -- so editing a template never yanks a section out from
   under a coach who's mid-build. */
function applyTemplateToBuilder(id){
  const tmpl = getTemplate(id);
  if(!tmpl) return;
  state.enabledPhaseKeys = new Set(tmpl.sections.filter(s=>s.standard && s.enabled!==false).map(s=>s.key));
  state.phaseOrder = tmpl.sections.filter(s=>s.standard).map(s=>s.key);
  if(tmpl.duration) state.targetDuration = tmpl.duration;
  const templateCustoms = tmpl.sections.filter(s=>!s.standard && s.enabled!==false);
  templateCustoms.forEach(tc=>{
    let es = state.extraSections.find(es=>es.key===tc.key);
    if(!es){
      es = {key:tc.key, label:tc.label, exercises:[], templateManaged:true, pct:tc.pct};
      state.extraSections.push(es);
    } else {
      es.label = tc.label;
      es.pct = tc.pct; // keep its planned-minutes share in sync with the template (see extraSectionPlannedMinutes())
    }
  });
  state.extraSections = state.extraSections.filter(es=>{
    if(!es.templateManaged) return true;
    const stillWanted = templateCustoms.find(tc=>tc.key===es.key);
    return !!stillWanted || es.exercises.length>0;
  });
}

/* Long-press-and-drag reorder for Settings template rows. Warmup is excluded entirely -- it's
   never the drag source and never a valid drop target -- so it's structurally impossible for a
   swap to land anything above it; it stays pinned first without any extra bookkeeping.
   A short setTimeout distinguishes a deliberate long-press-drag from an ordinary tap/scroll:
   if the pointer moves more than a few px before the timer fires, the gesture is treated as a
   scroll instead and the drag is cancelled. */
let tmplDrag = null;
function tmplGripDown(e, id, key){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!tmplDrag) return;
    tmplDrag.longPressed = true;
    const row = document.querySelector(`.tmpl-row[data-key="${key}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  tmplDrag = {id, key, timer, startY, longPressed:false};
  document.addEventListener('pointermove', tmplGripMove);
  document.addEventListener('pointerup', tmplGripUp);
}
function tmplGripMove(e){
  if(!tmplDrag) return;
  if(!tmplDrag.longPressed){
    if(Math.abs(e.clientY - tmplDrag.startY) > 8){ tmplGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const tmpl = getTemplate(tmplDrag.id);
  if(!tmpl) return;
  const sections = tmpl.sections;
  const reorderableKeys = sections.filter(s=>s.key!=='warmup').map(s=>s.key);
  let overKey = null;
  reorderableKeys.forEach(k=>{
    const el = document.querySelector(`.tmpl-row[data-key="${k}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overKey = k;
  });
  if(!overKey || overKey===tmplDrag.key) return;
  const fromIdx = sections.findIndex(s=>s.key===tmplDrag.key);
  const toIdx = sections.findIndex(s=>s.key===overKey);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = sections.splice(fromIdx,1);
  sections.splice(toIdx,0,moved);
  render();
  const key = tmplDrag.key;
  setTimeout(()=>{ const row=document.querySelector(`.tmpl-row[data-key="${key}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function tmplGripCancel(){
  if(tmplDrag) clearTimeout(tmplDrag.timer);
  tmplDrag = null;
  document.removeEventListener('pointermove', tmplGripMove);
  document.removeEventListener('pointerup', tmplGripUp);
}
function tmplGripUp(){
  tmplGripCancel();
  render();
}

/* ============ EXERCISES (grid + filters) ============ */
function matchesFilters(ex){
  if(state.replaceContext && ex.id === state.replaceContext.oldId) return false; // can't "replace" with itself
  if(state.filters.bookmarkedOnly && !state.bookmarks.has(ex.id)) return false;
  if(state.sectionFilter && ex.section !== state.sectionFilter) return false;
  if(state.filters.durations.size){
    const d = ex.duration || 10;
    let bucket;
    if(d<=5) bucket='5';
    else if(d<=10) bucket='10';
    else bucket='15';
    if(!state.filters.durations.has(bucket)) return false;
  }
  if(state.filters.tags.size){
    const tags = allTagsFor(ex);
    let hit=false;
    for(const t of state.filters.tags){ if(tags.includes(t)){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.focusCategories.size){
    let hit=false;
    for(const cat of state.filters.focusCategories){ if((ex[cat]||[]).length){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.location.size){
    const loc = String(ex.location||'').trim().toLowerCase();
    let hit=false;
    for(const v of state.filters.location){ if(loc===v.toLowerCase()){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.difficulty.size && !state.filters.difficulty.has(ex.difficulty)) return false;
  // Quick Filter (the "+ Add Exercise" picking screen's lightweight single-select row) -- only
  // ever active while actively picking for a phase, matched against any tag field.
  if(state.pickingPhase && state.quickFilterValue && !allTagsFor(ex).includes(state.quickFilterValue)) return false;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const hay = (ex.name+' '+(ex.description||'')+' '+(ex.category||'')+' '+(ex.section||'')+' '+(ex.setup||'')+' '+(ex.coachingPoints||'')+' '+(ex.variations||'')+' '+allTagsFor(ex).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderExercises(){
  const list = EXERCISES.filter(matchesFilters);
  // Training-Profile-aware ranking: an active Training Focus / Quick Filter dimension, plus (while
  // picking, with exercises already in the practice) a gentle nudge toward whatever dimension the
  // practice is currently lightest on. This only reorders an already-filtered list -- it can never
  // hide anything matchesFilters() already let through. Falls back to the original behavior
  // (alpha order on "All", source order otherwise) when no ranking signal is active.
  const rankDims = activeRankingDimensions();
  const balanceDim = state.pickingPhase ? leastEmphasizedDimension() : null;
  if(rankDims.length || balanceDim){
    list.sort((a,b) => {
      const diff = exerciseRankingScore(b, rankDims, balanceDim) - exerciseRankingScore(a, rankDims, balanceDim);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    });
  } else if(!state.sectionFilter) list.sort((a,b)=>a.name.localeCompare(b.name)); // "All" chip -> alpha order
  const pickingLabel = state.pickingPhase
    ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase))
    : null; // merely filtering by section while browsing should never surface the Building Session box
  const {count: builderCount} = currentTotalMinutes();
  // Quick Filters only apply to the guided "+ Add Exercise" picking flow -- general library
  // browsing (pickingLabel null) keeps the original All/Warmup/.../Scrimmage chip row untouched.
  const quickFilterValues = state.pickingPhase ? (QUICK_FILTERS_BY_PHASE[state.pickingPhase] || []) : null;
  // Section's total exercise count regardless of any active search/Quick Filter narrowing -- used
  // only by the compact section heading below, so it always reads e.g. "18 exercises" for the
  // section as a whole (the separate ex-count-line further down still reflects the narrowed list).
  const pickingPhaseObj = state.pickingPhase ? PHASES.find(p=>p.key===state.pickingPhase) : null;
  const sectionTotalCount = pickingPhaseObj ? EXERCISES.filter(e=>e.section===pickingPhaseObj.section).length : 0;

  const replacingEx = state.replaceContext ? exById(state.replaceContext.oldId) : null;
  return `
  <div class="section-pad" style="padding-bottom:4px;">
    ${renderSessionBuilderBox(pickingLabel)}
    ${replacingEx ? `

    ${(!pickingLabel && state.filters.bookmarkedOnly) ? `

        <button onclick="clearBookmarkFilter()">Show all</button>
      </div>` : ''}

    ${pickingLabel ? `<div class="ex-section-heading"><span class="esh-name">${escHtml(pickingLabel)}</span><span class="esh-count">${sectionTotalCount} exercise${sectionTotalCount===1?'':'s'}</span></div>` : ''}

    ${pickingLabel ? `
    <div class="discovery-row">
      <div class="searchbar">
        ${ICONS.search}
        <input id="searchInput" placeholder="Search exercises, tags, setup..." value="${escAttr(state.search)}" oninput="onSearch(this.value)">
        ${state.search ? `<button class="search-clear-btn" onclick="clearSearch()" title="Clear search">${ICONS.x}</button>` : ''}
      </div>
      <button class="qp-filter-btn" onclick="toggleFilters(true)" title="Filters" aria-label="Filters">${ICONS.filter}${activeFilterCount()?`<span class="chip-count-dot">${activeFilterCount()}</span>`:''}</button>
    </div>
    <button class="qp-pill" onclick="openQuickPick()" title="Quick Pick: 3 exercises picked for you" aria-label="Quick Pick">${ICONS.sparkles}<span>Quick Pick — let us suggest 3 exercises</span>${ICONS.chevronRight}</button>
    <div class="quickfilter-row">
      <button class="qf-chip ${!state.quickFilterValue?'active':''}" onclick="setQuickFilter(null)">All</button>
      ${quickFilterValues.map(v => `<button class="qf-chip ${state.quickFilterValue===v?'active':''}" onclick="setQuickFilter('${v}')">${escHtml(v)}</button>`).join('')}
    </div>
    <div class="ex-count-line-row">
      <div class="ex-count-line">
        ${state.quickFilterValue
          ? `<div class="ex-count-eyebrow">${escHtml(pickingLabel).toUpperCase()} &middot; ${escHtml(state.quickFilterValue).toUpperCase()}</div><div>${list.length} exercise${list.length===1?'':'s'}</div>`
          : `<div>${list.length} ${escHtml(pickingLabel)} exercise${list.length===1?'':'s'}</div>`}
      </div>
      <div class="view-toggle-compact">
        <button class="vtc-btn ${state.viewMode!=='list'?'active':''}" onclick="setViewMode('tile')" title="Tile view" aria-label="Tile view">${ICONS.grid}</button>
        <button class="vtc-btn ${state.viewMode==='list'?'active':''}" onclick="setViewMode('list')" title="List view" aria-label="List view">${ICONS.list}</button>
      </div>
    </div>` : `
    <div class="searchbar">
      ${ICONS.search}
      <input id="searchInput" placeholder="Search exercises, tags, setup..." value="${escAttr(state.search)}" oninput="onSearch(this.value)">
      ${state.search ? `<button class="search-clear-btn" onclick="clearSearch()" title="Clear search">${ICONS.x}</button>` : ''}
    </div>
    <div class="filter-chip-row">
      <button class="sec-chip ${!state.sectionFilter?'active':''}" style="${!state.sectionFilter?`background:var(--pitch);border-color:var(--pitch);color:white;`:''}" onclick="setSectionFilter(null)">${ICONS.grid}<span>All</span></button>

    </div>
    <div class="view-toggle">
      <button class="view-toggle-btn ${state.viewMode!=='list'?'active':''}" onclick="setViewMode('tile')">${ICONS.grid}<span>Tile</span></button>

/* While actively picking exercises for a phase, already-added ones are pinned to the top of
   the list instead of staying wherever the ranking/ordering logic happens to put them --
   adding an exercise can shift the practice's least-emphasized Training Dimension (see
   leastEmphasizedDimension()), which re-sorts the whole list and made a just-added exercise
   seem to "jump away." This only regroups the already-filtered/sorted `list` into two blocks
   (added first, then the rest) -- it never changes what's in the list or its within-group
   order, so ranking/filtering behavior is completely unaffected. */
function renderPickingExerciseList(list){
  const added = list.filter(ex => isExerciseInAnyPhase(ex.id));
  const rest = list.filter(ex => !isExerciseInAnyPhase(ex.id));
  if(!added.length) return rest.map(exCard).join('');
  // Collapsed by default (batch 60): a compact "[check] N in [Section]" toggle row instead of full
  // pinned cards, so the coach reaches the browsable library immediately instead of scrolling past
  // exercises they've already added. Tapping it expands back into the exact same pinned-cards+
  // divider layout this function always had -- still only regrouping the already-filtered/sorted
  // `list` into two blocks, never changing what's in it or its within-group order.
  const sectionLabel = state.pickingPhase ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase)) : '';
  const expanded = !!state.showAddedInPractice;
  const toggle = `<div class="ex-added-toggle-row"><button class="ex-added-toggle" onclick="toggleAddedInPractice()">${ICONS.check}<span>${added.length} exercise${added.length===1?'':'s'} in ${escHtml(sectionLabel)}</span>${expanded?ICONS.chevronUp:ICONS.chevronDown}</button></div>`;
  if(!expanded) return toggle + rest.map(exCard).join('');
  const divider = rest.length ? `<div class="ex-pinned-divider" style="grid-column:1/-1;"></div>` : '';
  return toggle + added.map(exCard).join('') + divider + rest.map(exCard).join('');
}
function toggleAddedInPractice(){
  state.showAddedInPractice = !state.showAddedInPractice;
  render();
}

function isExerciseInAnyPhase(id){
  // While browsing to add an exercise to an already-SAVED session, "the current session" means
  // that saved session, not the live build-a-new-session draft -- redirect the check there.
  if(state.editingSavedSessionId) return isExerciseInSavedSession(state.editingSavedSessionId, id);
  if(PHASES.some(p => state.phaseData[p.key].includes(id))) return true;
  return state.extraSections.some(s => s.exercises.includes(id));
}
/* Where an exercise actually IS in the session right now, if anywhere — as opposed to
   targetPhaseKeyFor(), which only guesses where it *would* go on add (from state.pickingPhase or
   its current Section field). Using the guess for removal is the bug behind "remove sometimes
   doesn't work": an exercise sitting in a custom section, or whose Section was edited after being
   added, guesses a different phase than the one it's actually sitting in, so the toggle thinks
   it's not in the session and adds a second copy instead of removing the real one. */
function findPhaseKeyContaining(id){
  const p = PHASES.find(p => state.phaseData[p.key].includes(id));
  if(p) return p.key;
  const s = state.extraSections.find(s => s.exercises.includes(id));
  return s ? s.key : null;
}
function phaseCount(key){
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].length;
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.length : 0;
}
function targetPhaseKeyFor(ex){
  return guessPhaseForSection(ex.section) || state.pickingPhase;
}
/* Small visual thumbnail for an exercise row — quick "what am I doing" scan, echoing a coach's own session-sheet doodles */
function peiThumbHtml(ex){
  // ex is undefined when this id no longer resolves in EXERCISES (the exercise it pointed to was
  // removed/renamed upstream) -- a blank chalk-dim box here used to look like an empty loading
  // state rather than the actual problem, leaving the coach unable to tell why a row had no name.
  if(!ex) return `<div class="pei-thumb"><div class="build-ex-image-fallback">${ICONS.image}<span class="build-ex-image-fallback-label">Missing</span></div></div>`;
  const st = secStyle(ex.section);

  if(ex.mediaUrl) return `<div class="pei-thumb">${mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false, noMedia)}</div>`;
  return `<div class="pei-thumb">${noMedia}</div>`;
}
function isExerciseInPhase(id, key){
  if(!key) return false;
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].includes(id);
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.includes(id) : false;
}

let searchDebounceTimer = null;

/* Toggle add/remove for an exercise. Removal always targets wherever it's actually sitting
   (findPhaseKeyContaining); only adding falls back to the guessed target phase, since there's
   nowhere to look up yet. */
function quickAdd(e, id){
  e.stopPropagation();
  if(state.replaceContext){
    performReplace(id);
    return;
  }
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  if(needsStartSessionConfirm()){
    // Show an in-app confirm sheet instead of window.confirm() -- native confirm() is silently
    // swallowed with no UI at all in iOS Safari's "Add to Home Screen" standalone mode, which
    // made tapping Add appear to do nothing.
    state.pendingQuickAdd = { id, targetKey };
    renderOverlay();
    return;
  }
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}
/* Adding an exercise while browsing Explore Exercises directly (not via the guided Build ->
   "Add exercise" flow) silently starts building a session in the background — confusing if the
   coach didn't mean to start one yet. Confirm with them the first time, when the builder is
   otherwise completely empty; once it has anything in it, just keep adding normally. */
function needsStartSessionConfirm(){
  if(state.pickingPhase) return false; // already explicitly in the guided Build flow
  if(currentTotalMinutes().count > 0) return false; // a session is already in progress
  return true;
}
function confirmQuickAddYes(){
  const pending = state.pendingQuickAdd;
  if(!pending) return;
  state.pendingQuickAdd = null;
  const ex = exById(pending.id);
  if(pending.wasDraft) saveDraftExercise(true);
  addToPhase(pending.targetKey, pending.id);
  showToast(`Started a new practice — added "${ex.name}" to ${phaseLabel(pending.targetKey)}`);
}
function confirmQuickAddNo(){
  state.pendingQuickAdd = null;
  renderOverlay();
}
function guessPhaseForSection(section){
  const p = PHASES.find(p=>p.section===section);
  return p ? p.key : null;
}
function phaseLabel(key){
  const p = PHASES.find(p=>p.key===key);
  if(p) return p.label;
  const extra = state.extraSections.find(s=>s.key===key);
  return extra ? extra.label : key;
}
function addToPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    if(!state.phaseData[key].includes(id)) state.phaseData[key].push(id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s && !s.exercises.includes(id)) s.exercises.push(id);
  }
  // Scrimmage is the last of the six standard phases -- landing an exercise there is a natural
  // "you're probably done" signal, so nudge toward Review immediately instead of waiting for the
  // coach to notice on their own. Every add path (quickAdd, detailToggle, Quick Pick, Balance,
  // the pending-confirm flow) funnels through this one function, so this covers all of them.
  if(key==='scrimmage') state.showReviewPrompt = true;
  render();
}
function goToReviewFromBuild(){
  state.showReviewPrompt = false;
  nav('review');
}
function removeFromPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    state.phaseData[key] = state.phaseData[key].filter(x=>x!==id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s) s.exercises = s.exercises.filter(x=>x!==id);
  }
  render();
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// For values (ids from the spreadsheet/synced sessions) interpolated into a single-quoted JS
// string literal inside an inline event-handler attribute, e.g. onclick="fn('${escJsAttr(x)}')".
// escAttr() alone only protects the outer double-quoted HTML attribute -- a bare ' in the value
// would still close the inner JS string early and let anything after it execute as script.
function escJsAttr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* soft render: skip full topbar/bottomnav rebuild for typing responsiveness */
function renderSoft(){
  // Re-rendering swaps out the whole #content subtree, which would normally yank focus (and the
  // text cursor) out of whatever field the coach is actively typing in -- e.g. the search box,
  // where every keystroke calls this. Capture the focused element's id + cursor position first,
  // then restore both after the new DOM is in, so typing feels continuous instead of dropping
  // focus after the first character.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  document.getElementById('content').innerHTML = screens[state.screen]();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

          <button class="ios-alert-btn" onclick="cancelDiscardExercise()">Cancel</button>
        </div>
      </div>

function detailToggle(id){
  if(state.replaceContext){
    performReplace(id);
    return;
  }
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  const wasDraft = state.draftExercise && state.draftExercise.id===id;
  if(needsStartSessionConfirm()){
    state.pendingQuickAdd = { id, targetKey, wasDraft };
    renderOverlay();
    return;
  }
  if(wasDraft) saveDraftExercise(true);
  addToPhase(targetKey, id);
  showToast(wasDraft ? `Saved & added "${ex.name}" to ${phaseLabel(targetKey)}` : `Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}

/* All valid tag values already in use, grouped by category -- lets a coach pick a known tag
   from the "Add tags" sheet instead of retyping free text that might not quite match an
   existing one. Recomputed on demand (cheap at this dataset size) so it always reflects
   whatever's currently loaded, including a fresh live-sheet sync. */
function computeTagVocab(){
  const cats = ['technicalTags','tacticalTags','formatTags','physicalTags','cognitiveTags','engagementTags'];
  const sets = {}; cats.forEach(c => sets[c] = new Set());
  EXERCISES.forEach(e => cats.forEach(c => (e[c]||[]).forEach(t => { if(t) sets[c].add(t); })));
  const out = {};
  cats.forEach(c => out[c] = Array.from(sets[c]).sort((a,b)=>a.localeCompare(b)));
  return out;
}
function openTagPicker(id){ state.tagPickerId = id; renderOverlay(); }
function closeTagPicker(){ state.tagPickerId = null; renderOverlay(); }
function toggleExerciseTagAt(id, category, idx){
  const ex = exById(id);
  if(!ex) return;
  const vocab = computeTagVocab();
  const tag = (vocab[category]||[])[idx];
  if(!tag) return;
  const arr = ex[category] || (ex[category] = []);
  const i = arr.indexOf(tag);
  if(i>-1) arr.splice(i,1); else arr.push(tag);
  render();
}
function renderTagPickerSheet(){
  if(!state.tagPickerId) return '';
  const ex = exById(state.tagPickerId);
  if(!ex) return '';
  const vocab = computeTagVocab();
  const CATS = [
    {key:'technicalTags', label:'Technical'},
    {key:'tacticalTags', label:'Tactical'},
    {key:'formatTags', label:'Format'},
    {key:'physicalTags', label:'Physical'},
    {key:'cognitiveTags', label:'Cognitive'},
    {key:'engagementTags', label:'Engagement'},
  ];
  return `
  <div class="sheet-backdrop" onclick="closeTagPicker()"></div>
  <div class="sheet tag-picker-sheet">
    <div class="sheet-handle"></div>
    <h3>Add tags</h3>
    ${CATS.map(c => (vocab[c.key]&&vocab[c.key].length) ? `
    <div class="tp-cat-label">${c.label}</div>
    <div class="optrow">
      ${vocab[c.key].map((t,i) => `<button class="opt ${(ex[c.key]||[]).includes(t)?'active':''}" onclick="toggleExerciseTagAt('${escJsAttr(ex.id)}','${c.key}',${i})">${escHtml(t)}</button>`).join('')}
    </div>` : '').join('')}
    <div class="sheet-footer">
      <button class="btn btn-primary" onclick="closeTagPicker()">Done</button>
    </div>
  </div>`;
}

/* Generic in-place exercise field editor, used by contenteditable blur handlers.
   Render is deferred to the next tick: if the same user gesture also targets another
   element (e.g. tapping "Back" right after editing a field), the blur-triggered re-render
   would otherwise destroy that element before its click event is delivered. */
function updateExerciseField(id, field, rawVal, kind, doRender){
  const ex = exById(id);
  if(!ex) return;
  let val = rawVal;
  if(kind==='number'){
    const n = parseInt(String(rawVal).replace(/[^0-9]/g,''),10);
    val = isNaN(n) ? null : n;
  } else {
    val = (typeof rawVal === 'string') ? rawVal.trim() : rawVal;
    if(val === '' || val === '—') val = (field==='videoUrl'||field==='mediaUrl') ? null : ex[field];
  }
  ex[field] = val;
  if(doRender !== false) setTimeout(render, 0);
}

function updateExerciseFormat(id, value){
  const ex = exById(id);
  if(!ex) return;
  ex.formatTags = value ? [value] : [];
  render();
}

/* ============ TIME-SPLIT GUIDANCE ============ */
/* Collapsible: always shows a colored one-line summary (planned vs target), expands to a
   direct comparison between what's actually been chosen and the suggested phase-group split.
   Defaults to the live in-progress draft (Build/Review) when called with no arguments; saved
   Session Detail passes its own frozen total/target/group-minutes instead, so the exact same
   panel and math serve both a live draft and a historical record. */
// Shared by renderTimeComparisonPanel() below and the Review page's compact row (batch 65) --
// the "Session Balance" breakdown, independent of whatever triggers showing it. The header bar's
// segments are sized by each group's share of the actual total (not the target), so it always
// reads as "how your built time is currently split" -- a session well under target still fills
// the bar edge-to-edge instead of leaving a confusing empty tail.
function timeComparisonBodyHtml(total, target, groups){
  const suggestedMins = suggestedSplitMinutes(target);
  const barSegs = PHASE_GROUPS.map(s => `<div style="width:${total>0 ? Math.max(0, groups[s.key]/total*100) : 0}%;background:${s.bg};"></div>`).join('');
  const rows = PHASE_GROUPS.map((s,i) => {
    const actual = groups[s.key];
    const t = suggestedMins[i];
    const met = t<=0 || actual>=t;
    const over = t>0 && actual>t;
    const pct = t>0 ? Math.min(100, Math.round(actual/t*100)) : (actual>0?100:0);
    const statusHtml = met
      ? `<span class="sb-check" title="On target">${ICONS.check}</span>`
      : `<span class="sb-diff" style="color:${s.color};">+${t-actual} min</span>`;
    return `
    <div class="sb-row">
      <div class="sb-row-top">
        <div class="sb-row-left">
          <span class="sb-dot" style="background:${s.bg};"></span>
          <div>
            <div class="sb-row-label">${escHtml(s.label)}</div>
            <div class="sb-row-sublabel">${escHtml(s.sublabel)}</div>
          </div>
        </div>
        <div class="sb-row-status">${statusHtml}</div>
      </div>
      <div class="sb-row-bottom">
        <div class="sb-row-mins">${actual} / ${t} min${over?` <span class="phase-over-tag">Over</span>`:''}</div>
        <div class="progress-track sb-row-track"><div class="sb-row-fill" style="width:${pct}%;background:${s.bg};"></div></div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="tp-body sb-body">
      <div class="sb-header">
        <div class="sb-header-title">Session Balance
          <button class="qp-info-btn" onclick="toggleSessionBalanceInfo()" title="What is Session Balance?" aria-label="What is Session Balance?">i</button>
        </div>
        <div class="sb-total">${total} min</div>
      </div>
      ${state.sessionBalanceInfoOpen ? `<div class="qp-info-panel">Shows how this practice's time splits across Activate (Warmup + Athletic), Develop (Duels, Rondos, Small Sided Games), and Play (Scrimmage), against the suggested split for a session this long.</div>` : ''}
      <div class="sb-bar">${barSegs}</div>
      <div class="sb-rows">${rows}</div>
    </div>`;
}
function renderTimeComparisonPanel(totalOverride, targetOverride, groupsOverride){
  const total = totalOverride !== undefined ? totalOverride : currentTotalMinutes().total;
  const target = targetOverride !== undefined ? targetOverride : state.targetDuration;
  const over = total > target;
  const diff = over ? total-target : target-total;
  const diffColor = total===0 ? 'var(--ink-soft)' : (over ? 'var(--warn)' : 'var(--turf)');
  const groups = groupsOverride || computeGroupMinutes();

  return `
  <div class="time-panel">
    <button class="time-panel-header" onclick="toggleSplitExpanded()">
      <div class="tp-summary">
        <span style="color:${diffColor};"><b>${total}</b> min planned</span>
        <span class="tp-sep">&middot;</span>
        <span style="color:${diffColor};font-weight:700;">${total===0 ? `${target} min target` : (over?`+${diff} over`:`${diff} min left`)}</span>
      </div>
      <span class="tp-chevron ${state.splitExpanded?'open':''}">${ICONS.chevronRight}</span>
    </button>
    ${state.splitExpanded ? timeComparisonBodyHtml(total, target, groups) : ''}
  </div>`;
}

function toggleCustomDurationEdit(){

function commitCustomDuration(rawVal){

  if(!isNaN(n) && n>0) state.targetDuration = Math.max(15, n);
  state.editingDuration = false;
