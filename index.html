<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT2 — Fast Tigers Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  /* Fast Tigers own identity: tiger amber + night-pitch charcoal-navy, on warm paper (not another club's colors) */
  --pitch:#1C2333;
  --pitch-dark:#10141F;
  --chalk:#F7F1E6;
  --chalk-dim:#EFE6D3;
  --turf:#2F8F6E;
  --turf-dim:#DCEEE6;
  --cone:#F2A93B;
  --cone-dim:#FCEACB;
  --warn:#D6493A;
  --warn-dim:#F8DCD7;
  --ink:#241E16;
  --ink-soft:#6B6259;
  --line:#E3D8C4;
  --white:#FFFFFF;
  --radius:16px;
  --radius-sm:10px;

  /* Section family colors: Warmup/Athletic = pitch green (activation), Duels/Rondos/SSG = night-pitch navy (tactical), Scrimmage = tiger amber (distinct, the flagship phase) */
  --sec-warmup:#4FAE86;
  --sec-athletic:#257A5C;
  --sec-duels:#2A3346;
  --sec-rondos:#1C2333;
  --sec-ssg:#10141F;
  --sec-scrimmage:#F2A93B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:#DCD8CC;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#shell{
  max-width:430px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  background:var(--chalk);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.15);
}
.display{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
}
.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-size:12px;
  color:var(--turf);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;
  background:var(--pitch);
  background-image:repeating-linear-gradient(115deg, rgba(242,169,59,0.06) 0 3px, transparent 3px 22px);
  color:var(--white);
  position:relative;
}
.topbar .brand{
  display:flex;align-items:center;gap:8px;
}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--cone);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:white;
}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.02em;}
.topbar-icons{display:flex;gap:14px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,0.12);
  border:none;color:white;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.icon-btn svg{width:19px;height:19px;}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--turf);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:white;
  border:2px solid rgba(255,255,255,0.4);
}
.badge-dot{
  position:absolute;top:-2px;right:-2px;
  width:10px;height:10px;border-radius:50%;
  background:var(--cone);border:1.5px solid var(--pitch);
}

/* ---------- content area ---------- */
#content{
  flex:1;
  overflow-y:auto;
  padding-bottom:86px;
  background:var(--chalk);
}
#content::-webkit-scrollbar{width:0;}

.section-pad{padding:16px 18px;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--pitch);
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 6px 12px;
  box-shadow:0 -4px 18px rgba(0,0,0,0.18);
}
.navitem{
  background:none;border:none;color:rgba(255,255,255,0.55);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.04em;
  padding:7px 8px;border-radius:10px;
}
.navitem.active{color:white;}
.navitem svg{width:22px;height:22px;}
.navitem.build-fab{
  background:var(--cone);color:var(--pitch-dark);
  width:58px;height:58px;border-radius:50%;
  margin-top:-30px;
  box-shadow:0 4px 14px rgba(242,169,59,0.55);
  justify-content:center;
}
.navitem.build-fab svg{width:38px;height:38px;}
.navitem.build-fab span{display:none;}

/* ---------- home ---------- */
.main-actions-row{display:flex;gap:8px;margin-top:6px;}
.mac-tile{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:white;border:1.5px solid var(--line);border-radius:14px;
  padding:14px 5px;text-align:center;min-height:98px;
}
.mac-tile.primary{
  background:var(--pitch);border-color:var(--pitch);
  background-image:repeating-linear-gradient(115deg, rgba(242,169,59,0.1) 0 3px, transparent 3px 20px);
  position:relative;overflow:hidden;
}
.mact-icon{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--chalk-dim);color:var(--pitch);
}
.mact-icon svg{width:20px;height:20px;}
.mac-tile.primary .mact-icon{background:rgba(255,255,255,0.18);color:white;}
.mact-icon.alt-blue{background:var(--turf-dim);color:var(--turf);}
.mact-icon.alt-gold{background:var(--cone-dim);color:#8a5010;}
.mact-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--ink);line-height:1.2;}
.mac-tile.primary .mact-label{color:white;}
.mact-stat{font-size:10.5px;color:var(--ink-soft);margin-top:-4px;font-variant-numeric:tabular-nums;}
.mac-tile.primary .mact-stat{color:rgba(255,255,255,0.72);}

.feed-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.feed-item.linked{cursor:pointer;}
.feed-item.linked:active{background:var(--chalk-dim);}
.feed-thumb{
  width:46px;height:46px;border-radius:10px;background:var(--turf-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.feed-thumb svg{width:22px;height:22px;color:var(--turf);}
.feed-item .ftitle{font-size:14.5px;font-weight:600;}
.feed-item .fsub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.feed-item .fchevron{margin-left:auto;align-self:center;color:var(--ink-soft);flex-shrink:0;}
.feed-item .fchevron svg{width:16px;height:16px;}
.feed-tag{
  display:inline-block;font-size:11px;font-weight:700;color:var(--turf);
  text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;
}

/* ---------- section headers ---------- */
.sh{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 10px;
}
.sh h2{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin:0;color:var(--pitch);}
.sh a.see-all{font-size:12.5px;color:var(--turf);font-weight:600;padding:4px;}

/* ---------- search / filters ---------- */
.searchbar{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
}
.searchbar svg{width:18px;height:18px;color:var(--ink-soft);flex-shrink:0;}
.searchbar input{
  border:none;outline:none;flex:1;font-size:15px;background:transparent;color:var(--ink);
}
.filter-chip-row{
  display:flex;flex-wrap:nowrap;gap:7px;padding:12px 0 6px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-chip-row::-webkit-scrollbar{display:none;}
.sec-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:54px;min-height:54px;flex-shrink:0;
  padding:8px 2px 7px;border-radius:11px;border:1px solid var(--line);
  background:var(--white);font-size:11px;font-weight:700;color:var(--ink-soft);
  text-align:center;line-height:1.15;
}
.sec-chip svg{width:18px;height:18px;}
.sec-chip.active{border-width:1.5px;}
.sec-chip.morefilters{width:50px;position:relative;}
.sec-chip.morefilters svg{width:19px;height:19px;}
.chip-count-dot{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;
  background:var(--cone);color:var(--pitch-dark);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.picking-banner{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--cone-dim);border:1px solid var(--cone);
  border-radius:12px;padding:10px 14px;margin-bottom:6px;
}
.picking-banner .ptxt{font-size:13.5px;font-weight:600;color:#8a3d16;}
.picking-banner button{
  background:var(--cone);color:white;border:none;border-radius:8px;
  padding:9px 14px;font-size:13px;font-weight:700;
}

/* ---------- exercise grid ---------- */
.ex-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;
}
.ex-card{
  background:var(--white);border-radius:14px;border:1px solid var(--line);
  overflow:hidden;text-align:left;padding:0;position:relative;
}
.new-ex-card{
  border:1.5px dashed var(--turf);background:var(--turf-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;min-height:184px;color:var(--turf);
}
.new-ex-icon{
  width:40px;height:40px;border-radius:50%;background:var(--turf);color:white;
  display:flex;align-items:center;justify-content:center;
}
.new-ex-icon svg{width:18px;height:18px;}
.new-ex-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-align:center;line-height:1.2;color:var(--turf);}
.ex-thumb{
  height:84px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--pitch);
}
.ex-thumb svg{width:36px;height:36px;opacity:0.85;}
.ex-thumb .dur{
  position:absolute;top:6px;left:6px;
  background:rgba(0,0,0,0.4);color:white;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:8px;
}
.loc-badge{
  position:absolute;bottom:6px;left:6px;
  background:rgba(0,0,0,0.4);color:white;
  width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
}
.loc-badge svg{width:11px;height:11px;}
.ex-bookmark{
  position:absolute;top:4px;right:4px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.92);border:none;
  display:flex;align-items:center;justify-content:center;
}
.ex-bookmark svg{width:15px;height:15px;color:var(--ink);}
.ex-bookmark.on svg{color:var(--cone);}
.ex-body{padding:11px 12px 12px;}
.ex-sect{font-size:11px;font-weight:700;color:var(--turf);text-transform:uppercase;letter-spacing:0.05em;}
.ex-name{font-size:14px;font-weight:700;line-height:1.25;margin:4px 0 8px;min-height:36px;}
.ex-addbtn{
  width:100%;border:1px solid var(--pitch);background:white;color:var(--pitch);
  border-radius:9px;padding:10px 0;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.ex-addbtn svg{width:12px;height:12px;}
.ex-addbtn.added{background:var(--turf);border-color:var(--turf);color:white;}

/* empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
}
.empty-state svg{width:40px;height:40px;color:var(--line);margin-bottom:11px;}
.empty-state p{font-size:14px;margin:0;line-height:1.5;}

/* ---------- bottom sheet (filters) ---------- */
.sheet-backdrop{
  position:absolute;inset:0;background:rgba(20,26,22,0.45);
  z-index:40;
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--white);border-radius:20px 20px 0 0;
  max-height:82%;overflow-y:auto;
  padding:6px 18px 20px;
  z-index:41;
  box-shadow:0 -10px 30px rgba(0,0,0,0.2);
}
.sheet-handle{
  width:36px;height:4px;background:var(--line);border-radius:3px;
  margin:10px auto 14px;
}
.sheet h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.03em;color:var(--pitch);}
.sheet h3:first-of-type{margin-top:0;}
.optrow{display:flex;gap:8px;flex-wrap:wrap;}
.opt{
  padding:10px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--chalk);font-size:13.5px;font-weight:600;color:var(--ink-soft);
}
.opt.active{background:var(--turf);border-color:var(--turf);color:white;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;}
.toggle-row span{font-size:14.5px;font-weight:600;}
.switch{width:46px;height:26px;border-radius:14px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--turf);}
.switch .dot{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:white;transition:left .15s;}
.switch.on .dot{left:22px;}
.sheet-footer{display:flex;gap:10px;margin-top:18px;}
.btn{
  border:none;border-radius:12px;padding:15px 0;font-weight:700;font-size:14.5px;
  flex:1;text-align:center;
}
.btn-primary{background:var(--pitch);color:white;}
.btn-ghost{background:var(--chalk-dim);color:var(--ink);}

/* ---------- detail page ---------- */
.detail-header{
  background:var(--pitch);color:white;padding:16px 18px 20px;position:relative;
}
.backbtn{
  background:rgba(255,255,255,0.15);border:none;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:white;margin-bottom:14px;
}
.backbtn svg{width:19px;height:19px;}
.detail-header .dpill{
  display:inline-block;background:rgba(255,255,255,0.15);color:var(--white);
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:5px 10px;border-radius:8px;margin-bottom:8px;
}
.section-select-wrap{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:9px;padding:6px 11px;margin-bottom:8px;min-height:34px;
}
.section-select-wrap svg{width:14px;height:14px;flex-shrink:0;}
select.section-select{
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:0;cursor:pointer;
}
select.section-select option{color:var(--ink);background:white;text-transform:none;}
.section-select-cat{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;opacity:0.85;}
.draft-pill{background:rgba(0,0,0,0.28) !important;margin-left:8px;margin-bottom:0;}
.back-to-session-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.18);color:white;border:none;border-radius:20px;
  padding:8px 14px 8px 11px;font-size:13px;font-weight:700;min-height:34px;
}
.back-to-session-pill svg{width:13px;height:13px;}
.draft-actions{display:flex;gap:10px;padding:14px 18px 0;}
.draft-hint{padding:0 18px 6px;font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.draft-hint svg{width:10px;height:10px;flex-shrink:0;opacity:0.7;}
.detail-header h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;line-height:1.08;margin:0 0 12px;font-weight:700;}
.stat-row{display:flex;gap:10px;}
.stat{background:rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;flex:1;}
.stat .snum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;}
.stat .slbl{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.7);}
.snum-row{display:flex;align-items:baseline;gap:4px;}
.snum-editable{outline:none;border-radius:4px;min-width:10px;display:inline-block;}
.snum-editable:hover{background:rgba(255,255,255,0.15);}
.snum-editable:focus{background:rgba(255,255,255,0.25);box-shadow:0 0 0 1.5px currentColor;}
.snum-suffix{font-size:12px;font-weight:600;}
select.diff-select{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  width:100%;padding:4px 0;cursor:pointer;min-height:30px;
}
select.diff-select option{color:var(--ink);background:white;}

.diagram-box{
  margin:16px 18px 0;
  height:150px;border-radius:14px;
  background:var(--turf);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.diagram-box svg{width:100%;height:100%;}

.detail-block{padding:15px 18px;}
.detail-block h4{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--pitch);margin:0 0 7px;
}
.detail-block p{font-size:14.5px;line-height:1.6;margin:0;color:var(--ink);white-space:pre-line;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;}
.tagpill{
  background:var(--chalk-dim);border:1px solid var(--line);color:var(--ink-soft);
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;
}
.divider{height:1px;background:var(--line);margin:0 18px;}

.detail-actions{
  display:flex;gap:10px;padding:16px 18px 4px;
}
.iconbtn-lg{
  width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:white;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.iconbtn-lg svg{width:21px;height:21px;color:var(--ink);}
.iconbtn-lg.on{background:var(--cone-dim);border-color:var(--cone);}
.iconbtn-lg.on svg{color:var(--cone);}
.add-session-btn{
  flex:1;background:var(--pitch);color:white;border:none;border-radius:12px;padding:15px 0;
  font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-session-btn svg{width:17px;height:17px;}
.add-session-btn.added{background:var(--turf);}

.similar-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.sim-card{
  flex-shrink:0;width:120px;background:white;border:1px solid var(--line);border-radius:12px;padding:9px;
}
.sim-card .sname{font-size:12.5px;font-weight:700;line-height:1.25;margin-top:7px;}
.sim-thumb{height:48px;border-radius:8px;background:var(--pitch);display:flex;align-items:center;justify-content:center;}
.sim-thumb svg{width:20px;height:20px;color:rgba(255,255,255,0.85);}

/* ---------- build a session ---------- */
.duration-target{
  display:flex;gap:8px;margin-top:4px;
}
.dtarget{
  flex:1;padding:13px 0;text-align:center;border-radius:10px;border:1px solid var(--line);
  background:white;font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--ink-soft);
  min-height:46px;
}
.dtarget.active{background:var(--pitch);border-color:var(--pitch);color:white;}
.dtarget-input{
  flex:1;min-width:0;padding:13px 4px;text-align:center;border-radius:10px;border:1.5px solid var(--turf);
  background:var(--turf-dim);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--ink);
  outline:none;min-height:46px;
}

/* compact, de-emphasized practice-settings row */
.practice-settings-row{display:flex;gap:10px;margin-top:14px;}
.practice-setting-group{flex:1;min-width:0;}
.ps-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.duration-target.compact{gap:5px;}
.dtarget.compact{
  padding:7px 0;font-size:12px;min-height:30px;border-radius:8px;
}
.dtarget-input.compact{padding:7px 2px;font-size:12px;min-height:30px;border-radius:8px;}

.addsection-btn{

}

.session-row .srchevron svg{width:16px;height:16px;}

.recent-clickable:hover{background:var(--chalk-dim);}

.sd-meta-row{display:flex;gap:10px;margin-top:14px;}

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzR2bbo2OHUynqc909lmhoITROdzOzCh_VTvcwcNDe7OarCA0MDjlfo4rhxrL1nghQYzg/exec';

const DIFF_TEXT_MAP = {Beginner:1, Intermediate:3, Advanced:5};
function parseDifficultyField(v){
  if(v===undefined || v===null || v==='') return null;
  const trimmed = String(v).trim();
  if(DIFF_TEXT_MAP[trimmed] !== undefined) return DIFF_TEXT_MAP[trimmed];
  const n = parseInt(trimmed, 10);
  return isNaN(n) ? null : n;
}
function splitTags(v){
  if(!v) return [];
  return String(v).split(';').map(s=>s.trim()).filter(Boolean);
}
function csvRowToExercise(row){
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  return {
    id: (row['Exercise ID']||'').trim(),
    name: (row['Exercise Name']||'').trim(),

    setup: row['Setup']?.trim() || null,
    description: row['Description']?.trim() || null,
    coachingPoints: row['Coaching Points']?.trim() || null,

    physicalTags: splitTags(row['Physical Tags']),
    cognitiveTags: splitTags(row['Cognitive Tags']),
    engagementTags: splitTags(row['Engagement Tags']),
    source: row['Source']?.trim() || null,
    location: row['Location']?.trim() || 'both',
    mediaUrl: row['Diagram URL']?.trim() || null,
    videoUrl: row['Video URL']?.trim() || null,
  };
}

// Apps Script returns raw JSON cell values (not always strings — e.g. Duration may already be a
// number), so this coerces defensively rather than assuming .trim() is safe like the CSV path can.
function jsonRowToExercise(row){
  const str = (v) => (v===null || v===undefined) ? '' : String(v).trim();
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  return {
    id: str(row['Exercise ID']),
    name: str(row['Exercise Name']),
    section: str(row['Section']),
    category: str(row['Category']) || null,
    difficulty: parseDifficultyField(row['Difficulty']),
    duration: num(row['Duration (min)']),
    setup: str(row['Setup']) || null,
    description: str(row['Description']) || null,
    coachingPoints: str(row['Coaching Points']) || null,
    variations: str(row['Variations']) || null,
    technicalTags: splitTags(row['Technical Tags']),
    tacticalTags: splitTags(row['Tactical Tags']),
    formatTags: splitTags(row['Format Tags']),
    physicalTags: splitTags(row['Physical Tags']),
    cognitiveTags: splitTags(row['Cognitive Tags']),
    engagementTags: splitTags(row['Engagement Tags']),
    source: str(row['Source']) || null,
    location: str(row['Location']) || 'both',
    mediaUrl: str(row['Diagram URL']) || null,
    videoUrl: str(row['Video URL']) || null,
  };
}

async function syncExercisesFromSheet(){
  let rows = null;
  let usedSource = null;

  // Preferred: Apps Script Web App — works even though the sheet itself is private.
  if(APPS_SCRIPT_URL){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        rows = data.map(jsonRowToExercise);
        usedSource = 'Apps Script';
      }
    } catch(err){
      console.warn('Apps Script sync skipped:', err.message);
    }
  }

  // Fallback: direct CSV export — only works if the sheet is shared "Anyone with the link — Viewer".
  if(!rows){
    try{
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
      const csvText = await res.text();
      if(typeof Papa === 'undefined') throw new Error('CSV parser not loaded');
      const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
      const csvRows = parsed.data.filter(r => (r['Exercise Name']||'').trim());
      if(csvRows.length){
        rows = csvRows.map(csvRowToExercise);
        usedSource = 'CSV export';
      }
    } catch(err){
      console.warn('CSV sheet sync skipped:', err.message);
    }
  }

  // Neither source worked (offline, opened as a local file, CSP blocking external fetch on a
  // hosted Artifact copy, etc.) — silently keep the bundled data, no error shown to the coach.
  if(!rows) return;

  // Keep any locally-attached media (e.g. animated diagrams built directly in the app) for
  // exercises the sheet doesn't have a Diagram URL for yet, matched by name.
  const localMediaByName = {};
  EXERCISES.forEach(e => { if(e.mediaUrl) localMediaByName[e.name] = e.mediaUrl; });

  const fresh = rows.map(e => {
    if(!e.mediaUrl && localMediaByName[e.name]) e.mediaUrl = localMediaByName[e.name];
    return normalizeExerciseRecord(e);
  });

  EXERCISES.length = 0;
  EXERCISES.push(...fresh);
  render();
  showToast(`Synced with your live exercise sheet (${usedSource})`);
}

/* Renders an exercise's media as the right tag: <video> for MP4/WebM/MOV exports (e.g. from
   tactical-board.com), <img> for GIF/PNG/JPEG/etc. extraStyle sizes the element/wrapper.
   autoplay (default true) controls playback: the Detail page passes true so a coach sees the
   drill actually run as soon as they open it; every thumbnail context (grid cards, build-list
   rows, session review, similar-exercises) passes false so the same video shows only its first
   frame as a still — no small autoplaying videos competing for attention in a scrolling list,
   and far less bandwidth than playing every visible video at once. A small play badge marks
   still frames as tappable-to-watch so it doesn't read as a broken image. */
function isVideoUrl(url){
  return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
}
function mediaTagHtml(url, altText, extraStyle, autoplay){
  if(autoplay === undefined) autoplay = true;
  const style = extraStyle || '';
  if(isVideoUrl(url)){
    if(autoplay){
      return `<video src="${escAttr(url)}" autoplay muted loop playsinline style="${style}"></video>`;
    }
    return `<div class="media-still-wrap" style="${style}">
      <video src="${escAttr(url)}#t=0.1" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;"></video>
      <div class="media-play-badge">${ICONS.play}</div>
    </div>`;
  }
  return `<img src="${escAttr(url)}" alt="${escAttr(altText||'')}" style="${style}">`;
}

function matchesFilters(ex){
  if(state.filters.bookmarkedOnly && !state.bookmarks.has(ex.id)) return false;
  if(state.sectionFilter && ex.section !== state.sectionFilter) return false;
  if(state.filters.durations.size){
    const d = ex.duration || 10;
    let bucket;
    if(d<=5) bucket='5';
    else if(d<=10) bucket='10';
    else if(d<=15) bucket='15';
    else bucket='20';
    if(!state.filters.durations.has(bucket)) return false;
  }
  if(state.filters.tags.size){
    const tags = allTagsFor(ex);
    let hit=false;
    for(const t of state.filters.tags){ if(tags.includes(t)){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.difficulty.size && !state.filters.difficulty.has(ex.difficulty)) return false;
  if(state.search.trim()){

  return true;
}

function isExerciseInAnyPhase(id){
  if(PHASES.some(p => state.phaseData[p.key].includes(id))) return true;
  return state.extraSections.some(s => s.exercises.includes(id));
}
/* Where an exercise actually IS in the session right now, if anywhere — as opposed to
   targetPhaseKeyFor(), which only guesses where it *would* go on add (from state.pickingPhase or
   its current Section field). Using the guess for removal is the bug behind "remove sometimes
   doesn't work": an exercise sitting in a custom section, or whose Section was edited after being
   added, guesses a different phase than the one it's actually sitting in, so the toggle thinks
   it's not in the session and adds a second copy instead of removing the real one. */
function findPhaseKeyContaining(id){
  const p = PHASES.find(p => state.phaseData[p.key].includes(id));
  if(p) return p.key;
  const s = state.extraSections.find(s => s.exercises.includes(id));
  return s ? s.key : null;
}
function phaseCount(key){
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].length;
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.length : 0;
}
function targetPhaseKeyFor(ex){
  return state.pickingPhase || guessPhaseForSection(ex.section);
}
/* Small visual thumbnail for an exercise row — quick "what am I doing" scan, echoing a coach's own session-sheet doodles */
function peiThumbHtml(ex){
  if(!ex) return `<div class="pei-thumb" style="background:var(--chalk-dim);"></div>`;
  const st = secStyle(ex.section);
  if(ex.mediaUrl) return `<div class="pei-thumb">${mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false)}</div>`;
  return `<div class="pei-thumb" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`;
}
function isExerciseInPhase(id, key){
  if(!key) return false;
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].includes(id);
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.includes(id) : false;
}

function onSearch(v){ state.search = v; renderSoft(); }
function setSectionFilter(s){ state.sectionFilter = s; render(); }
function toggleBookmark(e, id){
  e.stopPropagation();
  if(state.bookmarks.has(id)) state.bookmarks.delete(id); else state.bookmarks.add(id);
  render();
}

/* Toggle add/remove for an exercise. Removal always targets wherever it's actually sitting
   (findPhaseKeyContaining); only adding falls back to the guessed target phase, since there's
   nowhere to look up yet. */
function quickAdd(e, id){
  e.stopPropagation();
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  if(!confirmStartSessionIfNeeded(ex.name)) return;
  addToPhase(targetKey, id);
  showToast(`${state.justStartedSession ? 'Started a new practice — added' : 'Added'} "${ex.name}" to ${phaseLabel(targetKey)}`);
  state.justStartedSession = false;
}
/* Adding an exercise while browsing Explore Exercises directly (not via the guided Build ->
   "Add exercise" flow) silently starts building a session in the background — confusing if the
   coach didn't mean to start one yet. Confirm with them the first time, when the builder is
   otherwise completely empty; once it has anything in it, just keep adding normally. */
function confirmStartSessionIfNeeded(exName){
  if(state.pickingPhase) return true; // already explicitly in the guided Build flow
  if(currentTotalMinutes().count > 0) return true; // a session is already in progress
  const ok = confirm(`Start a new practice session and add "${exName}" to it?`);
  if(ok) state.justStartedSession = true;
  return ok;
}
function guessPhaseForSection(section){
  const p = PHASES.find(p=>p.section===section);
  return p ? p.key : null;
}
function phaseLabel(key){
  const p = PHASES.find(p=>p.key===key);
  if(p) return p.label;
  const extra = state.extraSections.find(s=>s.key===key);
  return extra ? extra.label : key;
}
function addToPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    if(!state.phaseData[key].includes(id)) state.phaseData[key].push(id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s && !s.exercises.includes(id)) s.exercises.push(id);
  }
  render();
}
function removeFromPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    state.phaseData[key] = state.phaseData[key].filter(x=>x!==id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s) s.exercises = s.exercises.filter(x=>x!==id);
  }
  render();
}

function detailToggle(id){

  if(wasDraft) saveDraftExercise(true);
  addToPhase(targetKey, id);

/* Generic in-place exercise field editor, used by contenteditable blur handlers.
   Render is deferred to the next tick: if the same user gesture also targets another
   element (e.g. tapping "Back" right after editing a field), the blur-triggered re-render
   would otherwise destroy that element before its click event is delivered. */
function updateExerciseField(id, field, rawVal, kind, doRender){
  const ex = exById(id);
  if(!ex) return;
  let val = rawVal;
  if(kind==='number'){
    const n = parseInt(String(rawVal).replace(/[^0-9]/g,''),10);
    val = isNaN(n) ? null : n;
  } else {
    val = (typeof rawVal === 'string') ? rawVal.trim() : rawVal;
    if(val === '' || val === '—') val = (field==='videoUrl'||field==='mediaUrl') ? null : ex[field];
  }
  ex[field] = val;
  if(doRender !== false) setTimeout(render, 0);
}

/* ============ TIME-SPLIT GUIDANCE ============ */
/* Collapsible: always shows a colored one-line summary (planned vs target), expands to a
   direct comparison between what's actually been chosen and the suggested phase-group split. */
function renderTimeComparisonPanel(){
  const {total} = currentTotalMinutes();
  const target = state.targetDuration;
  const over = total > target;
  const diff = over ? total-target : target-total;
  const diffColor = total===0 ? 'var(--ink-soft)' : (over ? 'var(--warn)' : 'var(--turf)');
  const groups = computeGroupMinutes();

  const actualSegs = SUGGESTED_SPLIT.map(s => `<div style="width:${Math.max(0, groups[s.key]/target*100)}%;background:${s.color};"></div>`).join('');
  const suggestedSegs = SUGGESTED_SPLIT.map(s => `<div style="width:${s.pct}%;background:${s.color};"></div>`).join('');

  return `
  <div class="time-panel">
    <button class="time-panel-header" onclick="toggleSplitExpanded()">
      <div class="tp-summary">
        <span style="color:${diffColor};"><b>${total}</b> min planned</span>
        <span class="tp-sep">&middot;</span>
        <span style="color:${diffColor};font-weight:700;">${total===0 ? `${target} min target` : (over?`+${diff} over`:`${diff} min left`)}</span>
      </div>
      <span class="tp-chevron ${state.splitExpanded?'open':''}">${ICONS.chevronRight}</span>
    </button>
    ${state.splitExpanded ? `
    <div class="tp-body">
      <div class="tp-row-label">Your session</div>
      <div class="split-bar">${actualSegs}</div>
      <div class="tp-row-label" style="margin-top:9px;">Suggested split</div>
      <div class="split-bar">${suggestedSegs}</div>
      <div class="split-legend" style="margin-top:10px;">
        ${SUGGESTED_SPLIT.map(s => `<div class="split-legend-item"><i style="background:${s.color};"></i>${s.label} &middot; ${groups[s.key]}m <span>(sugg. ~${Math.round(target*s.pct/100)}m)</span></div>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

/* ============ BUILD A SESSION ============ */
function setTargetDuration(v){ state.targetDuration = v; state.editingDuration = false; render(); }
function setPracticeLocation(loc){ state.practiceLocation = loc; render(); }
function toggleCustomDurationEdit(){
  state.editingDuration = true;
  render();
  setTimeout(()=>{ const el=document.getElementById('customDurInput'); if(el){ el.focus(); el.select(); } }, 0);
}
function commitCustomDuration(rawVal){
  const n = parseInt(String(rawVal).replace(/[^0-9]/g,''),10);
  if(!isNaN(n) && n>0) state.targetDuration = Math.max(15, n);
  state.editingDuration = false;
  setTimeout(render, 0);
}
function defaultSessionName(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) + ' Practice';
}
function setSessionName(v){ state.sessionName = v; }
function toggleSplitExpanded(){ state.splitExpanded = !state.splitExpanded; render(); }
function computeGroupMinutes(){
  const sum = (ids) => (ids||[]).reduce((a,id)=>a+(exById(id)?.duration||10),0);
  return {
    warmupAthletic: sum(state.phaseData.warmup) + sum(state.phaseData.athletic),
    duels: sum(state.phaseData.duels),
    rondos: sum(state.phaseData.rondos),
    ssg: sum(state.phaseData.ssg),
    scrimmage: sum(state.phaseData.scrimmage),
  };
}

function currentTotalMinutes(){
  let total = 0, count = 0;
  PHASES.forEach(p => {
    state.phaseData[p.key].forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  state.extraSections.forEach(s => {
    s.exercises.forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  return {total, count};
}

function addExtraSection(){
  const n = state.extraSections.length + 1;
  state.extraSections.push({key:'extra'+Date.now(), label:'Extra Section '+n, exercises:[]});
  render();
}
function renameExtraSection(key, val){
  const s = state.extraSections.find(s=>s.key===key);
  if(s) s.label = val.trim() || s.label;
  setTimeout(render, 0);
}
function removeExtraSection(key){
  state.extraSections = state.extraSections.filter(s=>s.key!==key);
  render();
}

function pickForPhase(key){
  const p = PHASES.find(p=>p.key===key);
  nav('exercises', {pickingPhase:key, fromBuild:true, sectionFilter: p ? p.section : null, search:''});
}
/* Switch which phase is being filled WITHOUT leaving the exercise list — lets a coach fill several
   phases back to back instead of bouncing to the Build screen between every add. */
function switchPickingPhase(key){
  const p = PHASES.find(p=>p.key===key);
  state.pickingPhase = key;
  state.sectionFilter = p ? p.section : null;
  render();
  const c = document.getElementById('content'); if(c) c.scrollTop = 0;
}
/* Clear "what's next" step so a coach can move phase-by-phase start to finish without having to
   figure out on their own which dot to tap: advances to the next standard phase in order, or —
   once on the last one (or a custom section, which has no fixed "next") — goes to Review. */
function nextPickingPhase(){
  const idx = PHASES.findIndex(p => p.key === state.pickingPhase);
  if(idx > -1 && idx < PHASES.length - 1){
    switchPickingPhase(PHASES[idx+1].key);
  } else {
    nav('review');
  }
}
/* Compact strip shown while picking: tap any dot to jump to that phase, plus a live progress readout
   so the coach can see overall session progress without leaving the exercise list. */
function renderPickingProgressStrip(pickingLabel){
  const {total, count} = currentTotalMinutes();
  const pct = Math.min(100, Math.round((total/state.targetDuration)*100));
  const over = total > state.targetDuration;
  const idx = PHASES.findIndex(p => p.key === state.pickingPhase);
  const nextPhaseObj = (idx > -1 && idx < PHASES.length - 1) ? PHASES[idx+1] : null;
  const nextBtnLabel = nextPhaseObj ? `Next: ${nextPhaseObj.label}` : 'Review session';
  return `
  <div class="session-builder-box">
    <div class="sbb-header">
      <div class="sbb-title">${ICONS.ball} Building Session</div>
      <button class="sbb-full-view" onclick="nav('build')">${ICONS.back} Full session</button>
    </div>
    <div class="sbb-current">Adding to: <b>${pickingLabel}</b></div>
    <div class="pps-dots">
      ${PHASES.map(p => {
        const has = state.phaseData[p.key].length > 0;
        const active = state.pickingPhase === p.key;
        const st = secStyle(p.section);
        const bg = has ? st.color : 'var(--chalk-dim)';
        const fg = has ? (st.textOn==='dark'?'var(--pitch-dark)':'white') : 'var(--ink-soft)';
        return `<button class="pps-dot ${active?'active':''}" style="background:${bg};color:${fg};${active?`box-shadow:0 0 0 2px white, 0 0 0 3.5px ${st.color};`:''}" onclick="switchPickingPhase('${p.key}')" title="${escAttr(p.label)}">${st.icon}</button>`;
      }).join('')}
      ${state.extraSections.map(s => {
        const has = s.exercises.length > 0;
        const active = state.pickingPhase === s.key;
        return `<button class="pps-dot ${active?'active':''}" style="background:${has?'var(--pitch)':'var(--chalk-dim)'};color:${has?'white':'var(--ink-soft)'};${active?`box-shadow:0 0 0 2px white, 0 0 0 3.5px var(--pitch);`:''}" onclick="switchPickingPhase('${s.key}')" title="${escAttr(s.label)}">${ICONS.doc}</button>`;
      }).join('')}
    </div>
    <div class="pps-progress">
      <div class="progress-track" style="height:6px;"><div class="progress-fill ${over?'over':''}" style="width:${pct}%;"></div></div>
      <div class="pps-caption"><span><b>${total}</b>/${state.targetDuration} min</span><span>${count} exercise${count===1?'':'s'} total</span></div>
    </div>
    <button class="pps-next-btn" onclick="nextPickingPhase()">${nextBtnLabel} ${ICONS.chevronRight}</button>
  </div>`;
}


function extractBullets(ex, maxBullets){
  maxBullets = maxBullets || 3;
  const sentences = [];
  [ex.description, ex.variations].forEach(text => {
    if(!text) return;
    text.split(/(?<=[.!?])\s+/).forEach(s => {
      const t = s.trim();
      if(t) sentences.push(t);
    });
  });
  return sentences.slice(0, maxBullets);
}

function buildExRowHtml(id, removeCall){
  const ex = exById(id);
  if(!ex) return '';
  const st = secStyle(ex.section);
  const bullets = extractBullets(ex, 3);
  const img = ex.mediaUrl
    ? mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false)
    : `<div class="build-ex-image-fallback" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`;
  return `
  <div class="build-ex-row">
    <button class="build-ex-remove" onclick="${removeCall}" title="Remove ${escAttr(ex.name)}">${ICONS.trash}</button>
    <div class="build-ex-image">${img}</div>
    <div class="build-ex-info">
      <div class="build-ex-name">${escHtml(ex.name)}</div>
      ${bullets.length ? `<ul class="build-ex-bullets">${bullets.map(b=>`<li>${escHtml(b)}</li>`).join('')}</ul>` : ''}
    </div>
  </div>`;
}

function renderBuild(){
  const presets = [60,75,90];
  const isCustomActive = !presets.includes(state.targetDuration);
  const filledPhaseCount = PHASES.filter(p => state.phaseData[p.key].length).length;
  const firstEmptyPhase = PHASES.find(p => !state.phaseData[p.key].length);

  const phaseBoxHtml = (p) => {
    const ids = state.phaseData[p.key];
    const st = secStyle(p.section);
    const mins = ids.reduce((a,id)=>a+(exById(id)?.duration||10),0);
    const isNextUp = firstEmptyPhase && p.key === firstEmptyPhase.key;
    return `
    <div class="phase-box ${isNextUp?'next-up':''}">
      <div class="phase-box-header">
        <div class="pb-icon" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>
        <div class="phase-box-title">${p.label}${isNextUp?' <span class="next-up-pill">Start here</span>':''}</div>
        <div class="phase-box-time">${mins}m</div>
        <button class="phase-box-edit" onclick="pickForPhase('${p.key}')" title="Edit ${escAttr(p.label)} exercises">${ICONS.pencil}</button>
      </div>
      ${ids.length ? `<div class="build-ex-list">${ids.map(id=>buildExRowHtml(id, `removeFromPhase('${p.key}','${id}')`)).join('')}</div>` : `<div class="build-ex-empty">No exercises yet</div>`}
      <button class="build-add-btn" onclick="pickForPhase('${p.key}')">${ICONS.plus} Add exercise</button>
    </div>`;
  };

  const extraBoxHtml = (s) => {
    const mins = s.exercises.reduce((a,id)=>a+(exById(id)?.duration||10),0);
    return `
    <div class="phase-box">
      <div class="phase-box-header">
        <input class="extra-box-title-input" value="${escAttr(s.label)}" onblur="renameExtraSection('${s.key}', this.value)" onkeydown="if(event.key==='Enter')this.blur()">
        <div class="phase-box-time">${mins}m</div>
        <button class="phase-box-edit" onclick="pickForPhase('${s.key}')" title="Edit exercises">${ICONS.pencil}</button>
        <button class="phase-box-del" onclick="removeExtraSection('${s.key}')" title="Remove section">${ICONS.trash}</button>
      </div>
      ${s.exercises.length ? `<div class="build-ex-list">${s.exercises.map(id=>buildExRowHtml(id, `removeFromPhase('${s.key}','${id}')`)).join('')}</div>` : `<div class="build-ex-empty">No exercises yet</div>`}
      <button class="build-add-btn" onclick="pickForPhase('${s.key}')">${ICONS.plus} Add exercise</button>
    </div>`;
  };

  const {count} = currentTotalMinutes();

  return `
  <div class="section-pad">
    <div class="eyebrow">New Training Session</div>
    <input class="session-name-input" placeholder="Name this session (e.g. Tue U11 Practice)" value="${escAttr(state.sessionName)}" oninput="setSessionName(this.value)">
    <div class="build-progress-line">
      <div class="progress-track" style="height:5px;"><div class="progress-fill" style="width:${Math.round(filledPhaseCount/PHASES.length*100)}%;"></div></div>
      <span>${filledPhaseCount} of ${PHASES.length} phases planned${firstEmptyPhase ? ` — start with ${firstEmptyPhase.label}` : ' — ready to review'}</span>
    </div>

    <div class="practice-settings-row">
      <div class="practice-setting-group">
        <div class="ps-label">Practice Duration</div>
        <div class="duration-target compact">
          ${presets.map(v => `<button class="dtarget compact ${state.targetDuration===v?'active':''}" onclick="setTargetDuration(${v})">${v}</button>`).join('')}
          ${state.editingDuration
            ? `<input id="customDurInput" class="dtarget-input compact" type="text" inputmode="numeric" pattern="[0-9]*" value="${isCustomActive?state.targetDuration:''}" placeholder="#" onblur="commitCustomDuration(this.value)" onkeydown="if(event.key==='Enter')this.blur()">`
            : `<button class="dtarget compact ${isCustomActive?'active':''}" onclick="toggleCustomDurationEdit()">${isCustomActive?state.targetDuration:'+'}</button>`}
        </div>
      </div>
      <div class="practice-setting-group">
        <div class="ps-label">Location</div>
        <div class="location-toggle">
          <button class="loc-btn ${state.practiceLocation==='outdoor'?'active':''}" onclick="setPracticeLocation('outdoor')">${ICONS.sun} Outdoor</button>
          <button class="loc-btn ${state.practiceLocation==='indoor'?'active':''}" onclick="setPracticeLocation('indoor')">${ICONS.home} Indoor</button>
        </div>
      </div>
    </div>

    ${renderTimeComparisonPanel()}

    <div class="phase-grid">
      ${PHASES.map(p=>phaseBoxHtml(p)).join('')}
      ${state.extraSections.map(s=>extraBoxHtml(s)).join('')}
    </div>

    <div class="addsection-row">
      <button class="addsection-btn" onclick="addExtraSection()">+ Add custom section</button>
    </div>
  </div>
  <div class="build-cta">
    <button class="btn btn-primary" onclick="nav('review')">Review session</button>
  </div>
  `;
}

/* ============ SESSION REVIEW (current in-progress builder) ============ */
function completeSession(){
  const {total, count} = currentTotalMinutes();
  if(count===0){ showToast('Add at least one exercise first'); return; }
  const phasesSnapshot = [];
  PHASES.forEach(p => {
    if(state.phaseData[p.key].length){
      phasesSnapshot.push({
        label: p.label, section: p.section,
        exercises: state.phaseData[p.key].map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10}; })
      });
    }
  });
  state.extraSections.forEach(s => {
    if(s.exercises.length){
      phasesSnapshot.push({
        label: s.label, section: null,
        exercises: s.exercises.map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10}; })
      });
    }
  });
  const id = 'S' + Date.now();
  const name = state.sessionName.trim() || `${dayName()} Session — ${state.savedSessions.length+1}`;
  state.savedSessions.push({
    id, name,
    totalMin: total, exCount: count, createdAt: Date.now(), createdBy: CURRENT_USER,
    targetDuration: state.targetDuration, phases: phasesSnapshot,
  });
  // reset builder
  PHASES.forEach(p => state.phaseData[p.key] = []);
  state.extraSections = [];
  state.sessionName = defaultSessionName();
  showToast('Session saved!');
  nav('home');
}
function dayName(){
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
}

function renderReview(){
  const {total, count} = currentTotalMinutes();
  const usedPhases = PHASES.filter(p => state.phaseData[p.key].length);
  const usedExtras = state.extraSections.filter(s => s.exercises.length);

  if(count===0){
    return `
    <div class="section-pad">
      <div class="empty-state">
        ${ICONS.empty}
        <p>No exercises added yet.<br>Head to Build a Session to get started.</p>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="nav('build')">Build a Session</button>
    </div>`;
  }

  return `
  <div class="section-pad">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <div>
        <div class="eyebrow">Session Review (unsaved)</div>
        ${state.sessionName.trim() ? `<h2 style="font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:2px 0 0;">${escHtml(state.sessionName)}</h2>` : ''}
      </div>
      <button class="phase-box-edit" style="margin-top:3px;" onclick="nav('build')" title="Edit session">${ICONS.pencil}</button>
    </div>
    <div class="review-total">
      <div class="rnum">${total}</div>
      <div class="rlbl">Total minutes &middot; ${count} exercises</div>
    </div>

    <div class="phase-strip">
      ${usedPhases.map((p,i)=>{
        const st = secStyle(p.section);
        return `
        <div class="phase-card">
          <div class="phase-line">
            <div class="phase-num" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${PHASES.indexOf(p)+1}</div>
            ${i===usedPhases.length-1 && usedExtras.length===0 ? '' : '<div class="phase-connector"></div>'}
          </div>
          <div class="phase-content">
            <div class="phase-title-row">
              <div class="phase-title" style="display:flex;align-items:center;gap:6px;"><span style="color:${st.color};display:flex;">${st.icon}</span>${p.label}</div>
              <div class="phase-time">${state.phaseData[p.key].reduce((a,id)=>a+(exById(id)?.duration||10),0)} min</div>
            </div>
            <div class="phase-exlist">
              ${state.phaseData[p.key].map(id=>{
                const ex=exById(id);
                return `<div class="phase-ex-item">${peiThumbHtml(ex)}<span class="peiname">${ex?ex.name:''}</span><span class="peidur">${ex?.duration||10}m</span></div>`;
              }).join('')}
            </div>
          </div>
        </div>`;}).join('')}
      ${usedExtras.map((s,i)=>`
        <div class="phase-card">
          <div class="phase-line"><div class="phase-num">${PHASES.length+i+1}</div></div>
          <div class="phase-content">
            <div class="phase-title-row"><div class="phase-title">${s.label}</div><div class="phase-time">${s.exercises.reduce((a,id)=>a+(exById(id)?.duration||10),0)} min</div></div>
            <div class="phase-exlist">
              ${s.exercises.map(id=>{const ex=exById(id);return `<div class="phase-ex-item">${peiThumbHtml(ex)}<span class="peiname">${ex?ex.name:''}</span><span class="peidur">${ex?.duration||10}m</span></div>`;}).join('')}
            </div>
          </div>
        </div>`).join('')}
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="completeSession()">Complete session</button>
  </div>`;
}

/* ============ SAVED SESSIONS LIST + DETAIL ============ */
function openSessionDetail(id){ nav('sessionDetail', {viewingSessionId:id}); }

function renderSessions(){
  if(!state.savedSessions.length){
    return `
    <div class="section-pad">
      <div class="eyebrow">Sessions</div>
      <div class="empty-state">
        ${ICONS.empty}
        <p>No sessions saved yet.<br>Build one and hit "Complete session" to see it here.</p>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="nav('build')">Build a Session</button>
    </div>`;
  }
  return `
  <div class="section-pad">
    <div class="eyebrow">All Sessions</div>
    <div class="sh" style="margin-top:2px;"><h2>${state.savedSessions.length} saved</h2></div>
    ${state.savedSessions.slice().reverse().map(s => `
      <button class="session-row" onclick="openSessionDetail('${s.id}')">
        <div class="srthumb">${ICONS.ball}</div>
        <div>
          <div class="srname">${s.name}</div>
          <div class="srmeta">${ICONS.user} ${s.createdBy} &middot; ${formatWhen(s.createdAt)}</div>
          <div class="srmeta">${s.totalMin} min &middot; ${s.exCount} exercises</div>
        </div>
        <div class="srchevron">${ICONS.chevronRight}</div>
      </button>`).join('')}
  </div>`;
}

function renderSessionDetail(){
  const s = state.savedSessions.find(s=>s.id===state.viewingSessionId);
  if(!s) return `<div class="empty-state">${ICONS.empty}<p>Session not found.</p></div>`;
  return `
  <div class="detail-header" style="background:var(--pitch);">
    <button class="backbtn" onclick="nav('sessions')">${ICONS.back}</button>
    <div class="dpill">${ICONS.ball} Saved Session</div>
    <h1>${s.name}</h1>
    <div class="stat-row">
      <div class="stat"><div class="snum">${s.totalMin}</div><div class="slbl">Minutes</div></div>
      <div class="stat"><div class="snum">${s.exCount}</div><div class="slbl">Exercises</div></div>
      <div class="stat"><div class="snum">${s.targetDuration}</div><div class="slbl">Target</div></div>
    </div>
  </div>
  <div class="section-pad">
    <div class="sd-meta-row">
      <div class="sd-meta"><div class="smnum">${s.createdBy}</div><div class="smlbl">Added by</div></div>
      <div class="sd-meta"><div class="smnum">${formatWhen(s.createdAt)}</div><div class="smlbl">Date &amp; time</div></div>
    </div>

    <div class="phase-strip" style="margin-top:22px;">
      ${s.phases.map((p,i)=>{
        const st = secStyle(p.section);
        return `
        <div class="phase-card">
          <div class="phase-line">
            <div class="phase-num" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${i+1}</div>
            ${i===s.phases.length-1?'':'<div class="phase-connector"></div>'}
          </div>
          <div class="phase-content">
            <div class="phase-title-row">
              <div class="phase-title" style="display:flex;align-items:center;gap:6px;"><span style="color:${st.color};display:flex;">${st.icon}</span>${p.label}</div>
              <div class="phase-time">${p.exercises.reduce((a,e)=>a+e.duration,0)} min</div>
            </div>
            <div class="phase-exlist">
              ${p.exercises.map(e=>`<div class="phase-ex-item">${peiThumbHtml(exById(e.id))}<span class="peiname">${e.name}</span><span class="peidur">${e.duration}m</span></div>`).join('')}
            </div>
          </div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

/* ============ ROUTER / RENDER ============ */
const screens = {
  home: renderHome,
  exercises: renderExercises,
  detail: renderDetail,
  build: renderBuild,
  review: renderReview,
  sessions: renderSessions,
  sessionDetail: renderSessionDetail,
};

function render(){
  renderTopbar();
  document.getElementById('content').innerHTML = screens[state.screen]();
  renderBottomnav();
  renderOverlay();
}

render();
syncExercisesFromSheet();

/* Select all existing text the moment an editable field gets focus, so typing immediately
   replaces it instead of requiring a manual select-all or delete first. Delegated on #content
   (a stable element that persists across re-renders) so it covers every editable field, including
   ones added later, without wiring up each one individually. */
document.getElementById('content').addEventListener('focusin', (e) => {
  const el = e.target;
  if(el.isContentEditable){
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } else if(el.tagName === 'INPUT' && (el.type === 'text' || el.type === '')){
    el.select();
  }
});

</script>
