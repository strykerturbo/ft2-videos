function matchesFilters(ex){
  if(state.filters.bookmarkedOnly && !state.bookmarks.has(ex.id)) return false;
  if(state.sectionFilter && ex.section !== state.sectionFilter) return false;
  if(state.filters.durations.size){
    const d = ex.duration || 10;
    let bucket;
    if(d<=5) bucket='5';
    else if(d<=10) bucket='10';
    else bucket='15';
    if(!state.filters.durations.has(bucket)) return false;
  }
  if(state.filters.tags.size){
    const tags = allTagsFor(ex);
    let hit=false;
    for(const t of state.filters.tags){ if(tags.includes(t)){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.focusCategories.size){
    let hit=false;
    for(const cat of state.filters.focusCategories){ if((ex[cat]||[]).length){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.location.size){
    const loc = String(ex.location||'').trim().toLowerCase();
    let hit=false;
    for(const v of state.filters.location){ if(loc===v.toLowerCase()){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.difficulty.size && !state.filters.difficulty.has(ex.difficulty)) return false;
  // Quick Filter (the "+ Add Exercise" picking screen's lightweight single-select row) -- only
  // ever active while actively picking for a phase, matched against any tag field.
  if(state.pickingPhase && state.quickFilterValue && !allTagsFor(ex).includes(state.quickFilterValue)) return false;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const hay = (ex.name+' '+(ex.description||'')+' '+(ex.category||'')+' '+(ex.section||'')+' '+(ex.setup||'')+' '+(ex.coachingPoints||'')+' '+(ex.variations||'')+' '+allTagsFor(ex).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderExercises(){
  const list = EXERCISES.filter(matchesFilters);
  // Training-Profile-aware ranking: an active Training Focus / Quick Filter dimension, plus (while
  // picking, with exercises already in the practice) a gentle nudge toward whatever dimension the
  // practice is currently lightest on. This only reorders an already-filtered list -- it can never
  // hide anything matchesFilters() already let through. Falls back to the original behavior
  // (alpha order on "All", source order otherwise) when no ranking signal is active.
  const rankDims = activeRankingDimensions();
  const balanceDim = state.pickingPhase ? leastEmphasizedDimension() : null;
  if(rankDims.length || balanceDim){
    list.sort((a,b) => {
      const diff = exerciseRankingScore(b, rankDims, balanceDim) - exerciseRankingScore(a, rankDims, balanceDim);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    });
  } else if(!state.sectionFilter) list.sort((a,b)=>a.name.localeCompare(b.name)); // "All" chip -> alpha order
  const pickingLabel = state.pickingPhase
    ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase))
    : null; // merely filtering by section while browsing should never surface the Building Session box
  const {count: builderCount} = currentTotalMinutes();
  // Quick Filters only apply to the guided "+ Add Exercise" picking flow -- general library
  // browsing (pickingLabel null) keeps the original All/Warmup/.../Scrimmage chip row untouched.
  const quickFilterValues = state.pickingPhase ? (QUICK_FILTERS_BY_PHASE[state.pickingPhase] || []) : null;
  // Section's total exercise count regardless of any active search/Quick Filter narrowing -- used
  // only by the compact section heading below, so it always reads e.g. "18 exercises" for the
  // section as a whole (the separate ex-count-line further down still reflects the narrowed list).
  const pickingPhaseObj = state.pickingPhase ? PHASES.find(p=>p.key===state.pickingPhase) : null;
  const sectionTotalCount = pickingPhaseObj ? EXERCISES.filter(e=>e.section===pickingPhaseObj.section).length : 0;

  return `
  <div class="section-pad" style="padding-bottom:4px;">
    ${renderSessionBuilderBox(pickingLabel)}
    ${(!pickingLabel && state.filters.bookmarkedOnly) ? `
      <div class="info-banner gold">
        <div class="ptxt">${ICONS.bookmarkFilled} Showing bookmarked exercises only</div>
        <button onclick="clearBookmarkFilter()">Show all</button>
      </div>` : ''}

    ${pickingLabel ? `<div class="ex-section-heading"><span class="esh-name">${escHtml(pickingLabel)}</span><span class="esh-count">${sectionTotalCount} exercise${sectionTotalCount===1?'':'s'}</span></div>` : ''}

    ${pickingLabel ? `
    <div class="discovery-row">
      <div class="searchbar">
        ${ICONS.search}
        <input id="searchInput" placeholder="Search exercises, tags, setup..." value="${escAttr(state.search)}" oninput="onSearch(this.value)">
        ${state.search ? `<button class="search-clear-btn" onclick="clearSearch()" title="Clear search">${ICONS.x}</button>` : ''}
      </div>
      <button class="qp-iconbtn" onclick="openQuickPick()" title="Quick Pick" aria-label="Quick Pick">${ICONS.sparkles}</button>
      <button class="qp-filter-btn" onclick="toggleFilters(true)" title="Filters" aria-label="Filters">${ICONS.filter}${activeFilterCount()?`<span class="chip-count-dot">${activeFilterCount()}</span>`:''}</button>
    </div>
    <div class="quickfilter-row">
      <button class="qf-chip ${!state.quickFilterValue?'active':''}" onclick="setQuickFilter(null)">All</button>
      ${quickFilterValues.map(v => `<button class="qf-chip ${state.quickFilterValue===v?'active':''}" onclick="setQuickFilter('${v}')">${escHtml(v)}</button>`).join('')}
    </div>
    <div class="ex-count-line-row">
      <div class="ex-count-line">
        ${state.quickFilterValue
          ? `<div class="ex-count-eyebrow">${escHtml(pickingLabel).toUpperCase()} &middot; ${escHtml(state.quickFilterValue).toUpperCase()}</div><div>${list.length} exercise${list.length===1?'':'s'}</div>`
          : `<div>${list.length} ${escHtml(pickingLabel)} exercise${list.length===1?'':'s'}</div>`}
      </div>
      <div class="view-toggle-compact">
        <button class="vtc-btn ${state.viewMode!=='list'?'active':''}" onclick="setViewMode('tile')" title="Tile view" aria-label="Tile view">${ICONS.grid}</button>
        <button class="vtc-btn ${state.viewMode==='list'?'active':''}" onclick="setViewMode('list')" title="List view" aria-label="List view">${ICONS.list}</button>
      </div>
    </div>` : `
    <div class="searchbar">
      ${ICONS.search}
      <input id="searchInput" placeholder="Search exercises, tags, setup..." value="${escAttr(state.search)}" oninput="onSearch(this.value)">
      ${state.search ? `<button class="search-clear-btn" onclick="clearSearch()" title="Clear search">${ICONS.x}</button>` : ''}
    </div>
    <div class="filter-chip-row">
      <button class="sec-chip ${!state.sectionFilter?'active':''}" style="${!state.sectionFilter?`background:var(--pitch);border-color:var(--pitch);color:white;`:''}" onclick="setSectionFilter(null)">${ICONS.grid}<span>All</span></button>
      ${SECTION_LIST.map(s => {
        const active = state.sectionFilter===s;
        const st = secStyle(s);
        const style = active ? `background:${st.color};border-color:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};` : '';
        return `<button class="sec-chip ${active?'active':''}" style="${style}" onclick="setSectionFilter('${s}')">${st.icon}<span>${s}</span></button>`;
      }).join('')}
      <button class="sec-chip morefilters" onclick="toggleFilters(true)">${ICONS.filter}${activeFilterCount()?`<span class="chip-count-dot">${activeFilterCount()}</span>`:''}</button>
    </div>
    <div class="view-toggle">
      <button class="view-toggle-btn ${state.viewMode!=='list'?'active':''}" onclick="setViewMode('tile')">${ICONS.grid}<span>Tile</span></button>
      <button class="view-toggle-btn ${state.viewMode==='list'?'active':''}" onclick="setViewMode('list')">${ICONS.list}<span>List</span></button>
    </div>`}

    <div class="ex-grid ${state.viewMode==='list'?'list-mode':''}">
      ${pickingLabel ? renderPickingExerciseList(list) : list.map(exCard).join('')}
      ${newExerciseTileHtml()}
    </div>
    ${list.length===0 ? `<div class="empty-state" style="grid-column:1/-1;">${ICONS.empty}<p>No exercises match those filters.<br>Try clearing a filter or search term.</p></div>` : ''}
  </div>`;
}
/* While actively picking exercises for a phase, already-added ones are pinned to the top of
   the list instead of staying wherever the ranking/ordering logic happens to put them --
   adding an exercise can shift the practice's least-emphasized Training Dimension (see
   leastEmphasizedDimension()), which re-sorts the whole list and made a just-added exercise
   seem to "jump away." This only regroups the already-filtered/sorted `list` into two blocks
   (added first, then the rest) -- it never changes what's in the list or its within-group
   order, so ranking/filtering behavior is completely unaffected. */
function renderPickingExerciseList(list){
  const added = list.filter(ex => isExerciseInAnyPhase(ex.id));
  const rest = list.filter(ex => !isExerciseInAnyPhase(ex.id));
  if(!added.length) return rest.map(exCard).join('');
  // Collapsed by default (batch 60): a compact "[check] N in [Section]" toggle row instead of full
  // pinned cards, so the coach reaches the browsable library immediately instead of scrolling past
  // exercises they've already added. Tapping it expands back into the exact same pinned-cards+
  // divider layout this function always had -- still only regrouping the already-filtered/sorted
  // `list` into two blocks, never changing what's in it or its within-group order.
  const sectionLabel = state.pickingPhase ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase)) : '';
  const expanded = !!state.showAddedInPractice;
  const toggle = `<div class="ex-added-toggle-row"><button class="ex-added-toggle" onclick="toggleAddedInPractice()">${ICONS.check}<span>${added.length} exercise${added.length===1?'':'s'} in ${escHtml(sectionLabel)}</span>${expanded?ICONS.chevronUp:ICONS.chevronDown}</button></div>`;
  if(!expanded) return toggle + rest.map(exCard).join('');
  const divider = rest.length ? `<div class="ex-pinned-divider" style="grid-column:1/-1;"></div>` : '';
  return toggle + added.map(exCard).join('') + divider + rest.map(exCard).join('');
}
function toggleAddedInPractice(){
  state.showAddedInPractice = !state.showAddedInPractice;
  render();
}
function newExerciseTileHtml(){
  return `
  <button class="ex-card new-ex-card" onclick="createNewExercise()">
    <div class="new-ex-icon">${ICONS.plus}</div>
    <div class="new-ex-label">New<br>Exercise</div>
  </button>`;
}

function activeFilterCount(){
  return state.filters.durations.size + state.filters.tags.size + state.filters.difficulty.size + state.filters.focusCategories.size + state.filters.location.size;
}

function exCard(ex){
  const inPhase = isExerciseInAnyPhase(ex.id);
  const isBookmarked = state.bookmarks.has(ex.id);
  const st = secStyle(ex.section);
  const cardTags = allTagsFor(ex).slice(0,3);
  return `
  <div class="ex-card ${inPhase?'added':''}" onclick="openDetail('${ex.id}')" style="cursor:pointer;">
    <button class="ex-thumb" style="border:none;width:100%;padding:0;background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};" onclick="openDetail('${ex.id}')">
      ${ex.mediaUrl ? mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;position:absolute;inset:0;', false, `<div class="thumb-placeholder">${st.icon}<span class="thumb-placeholder-label">Diagram coming soon</span></div>`) : `<div class="thumb-placeholder">${st.icon}<span class="thumb-placeholder-label">Diagram coming soon</span></div>`}
      ${inPhase ? `<span class="added-badge">${ICONS.check}</span>` : ''}
    </button>
    <button class="ex-bookmark ${isBookmarked?'on':''}" onclick="toggleBookmark(event,'${ex.id}')">${isBookmarked?ICONS.bookmarkFilled:ICONS.bookmark}</button>
    <div class="ex-body">
      <div class="ex-sect">${ex.section}${ex.duration?' · '+ex.duration+' min':''}</div>
      <div class="ex-name" onclick="openDetail('${ex.id}')" style="cursor:pointer;">${ex.name}</div>
      ${cardTags.length ? `<div class="ex-card-tags">${cardTags.map(t=>`<span class="tagpill sm">${escHtml(t)}</span>`).join('')}</div>` : ''}
      <button class="ex-addbtn ${inPhase?'added':''}" onclick="quickAdd(event,'${ex.id}')">
        ${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}
      </button>
    </div>
  </div>`;
}

function isExerciseInAnyPhase(id){
  // While browsing to add an exercise to an already-SAVED session, "the current session" means
  // that saved session, not the live build-a-new-session draft -- redirect the check there.
  if(state.editingSavedSessionId) return isExerciseInSavedSession(state.editingSavedSessionId, id);
  if(PHASES.some(p => state.phaseData[p.key].includes(id))) return true;
  return state.extraSections.some(s => s.exercises.includes(id));
}
/* Where an exercise actually IS in the session right now, if anywhere — as opposed to
   targetPhaseKeyFor(), which only guesses where it *would* go on add (from state.pickingPhase or
   its current Section field). Using the guess for removal is the bug behind "remove sometimes
   doesn't work": an exercise sitting in a custom section, or whose Section was edited after being
   added, guesses a different phase than the one it's actually sitting in, so the toggle thinks
   it's not in the session and adds a second copy instead of removing the real one. */
function findPhaseKeyContaining(id){
  const p = PHASES.find(p => state.phaseData[p.key].includes(id));
  if(p) return p.key;
  const s = state.extraSections.find(s => s.exercises.includes(id));
  return s ? s.key : null;
}
function phaseCount(key){
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].length;
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.length : 0;
}
function targetPhaseKeyFor(ex){
  return guessPhaseForSection(ex.section) || state.pickingPhase;
}
/* Small visual thumbnail for an exercise row — quick "what am I doing" scan, echoing a coach's own session-sheet doodles */
function peiThumbHtml(ex){
  if(!ex) return `<div class="pei-thumb" style="background:var(--chalk-dim);"></div>`;
  const st = secStyle(ex.section);
  const noMedia = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`;
  if(ex.mediaUrl) return `<div class="pei-thumb">${mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false, noMedia)}</div>`;
  return `<div class="pei-thumb">${noMedia}</div>`;
}
function isExerciseInPhase(id, key){
  if(!key) return false;
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].includes(id);
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.includes(id) : false;
}

let searchDebounceTimer = null;
function openSearch(){
  // Clear any active section filter / guided-picking context first so this genuinely searches
  // the entire exercise library, not whatever subset a leftover filter happened to be scoped to.
  nav('exercises', {fromBuild:false, fromSavedSession:false, editingSavedSessionId:null, pickingPhase:null, sectionFilter:null, quickFilterValue:null});
  setTimeout(()=>{ const el = document.getElementById('searchInput'); if(el) el.focus(); }, 0);
}
function onSearch(v){
  state.search = v;
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderSoft, 150);
}
function clearSearch(){
  state.search = '';
  renderSoft();
  const el = document.getElementById('searchInput');
  if(el) el.focus();
}
function setSectionFilter(s){ state.sectionFilter = s; render(); }
function setQuickFilter(v){ state.quickFilterValue = v; render(); }
function setViewMode(mode){ state.viewMode = mode; render(); }
function toggleBookmark(e, id){
  e.stopPropagation();
  if(state.bookmarks.has(id)) state.bookmarks.delete(id); else state.bookmarks.add(id);
  render();
}

/* Toggle add/remove for an exercise. Removal always targets wherever it's actually sitting
   (findPhaseKeyContaining); only adding falls back to the guessed target phase, since there's
   nowhere to look up yet. */
function quickAdd(e, id){
  e.stopPropagation();
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  if(needsStartSessionConfirm()){
    // Show an in-app confirm sheet instead of window.confirm() -- native confirm() is silently
    // swallowed with no UI at all in iOS Safari's "Add to Home Screen" standalone mode, which
    // made tapping Add appear to do nothing.
    state.pendingQuickAdd = { id, targetKey };
    renderOverlay();
    return;
  }
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}
/* Adding an exercise while browsing Explore Exercises directly (not via the guided Build ->
   "Add exercise" flow) silently starts building a session in the background — confusing if the
   coach didn't mean to start one yet. Confirm with them the first time, when the builder is
   otherwise completely empty; once it has anything in it, just keep adding normally. */
function needsStartSessionConfirm(){
  if(state.pickingPhase) return false; // already explicitly in the guided Build flow
  if(currentTotalMinutes().count > 0) return false; // a session is already in progress
  return true;
}
function confirmQuickAddYes(){
  const pending = state.pendingQuickAdd;
  if(!pending) return;
  state.pendingQuickAdd = null;
  const ex = exById(pending.id);
  if(pending.wasDraft) saveDraftExercise(true);
  addToPhase(pending.targetKey, pending.id);
  showToast(`Started a new practice — added "${ex.name}" to ${phaseLabel(pending.targetKey)}`);
}
function confirmQuickAddNo(){
  state.pendingQuickAdd = null;
  renderOverlay();
}
function guessPhaseForSection(section){
  const p = PHASES.find(p=>p.section===section);
  return p ? p.key : null;
}
function phaseLabel(key){
  const p = PHASES.find(p=>p.key===key);
  if(p) return p.label;
  const extra = state.extraSections.find(s=>s.key===key);
  return extra ? extra.label : key;
}
function addToPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    if(!state.phaseData[key].includes(id)) state.phaseData[key].push(id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s && !s.exercises.includes(id)) s.exercises.push(id);
  }
  render();
}
function removeFromPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    state.phaseData[key] = state.phaseData[key].filter(x=>x!==id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s) s.exercises = s.exercises.filter(x=>x!==id);
  }
  render();
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* soft render: skip full topbar/bottomnav rebuild for typing responsiveness */
function renderSoft(){
  // Re-rendering swaps out the whole #content subtree, which would normally yank focus (and the
  // text cursor) out of whatever field the coach is actively typing in -- e.g. the search box,
  // where every keystroke calls this. Capture the focused element's id + cursor position first,
  // then restore both after the new DOM is in, so typing feels continuous instead of dropping
  // focus after the first character.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  document.getElementById('content').innerHTML = screens[state.screen]();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ============ FILTER SHEET ============ */
function toggleFilters(open){ state.filtersOpen = open; if(open){ state.quickPickOpen = false; state.quickPickCustomizeOpen = false; } renderOverlay(); }
function toggleSetVal(setName, val){

}
function clearFilters(){
  state.filters.durations = new Set();
  state.filters.tags = new Set();
  state.filters.difficulty = new Set();
  state.filters.focusCategories = new Set();
  state.filters.location = new Set();

}
function applyFilters(){ state.filtersOpen = false; render(); }

        <button class="btn btn-primary" style="background:var(--warn);border-color:var(--warn);" onclick="confirmDeleteSessionNow()">Delete session</button>
      </div>
    </div>`;
  }
  if(state.confirmDeleteTemplateId){
    const dt = getTemplate(state.confirmDeleteTemplateId);
    html += `
    <div class="sheet-backdrop" onclick="cancelDeleteTemplate()"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Delete "${escHtml(dt ? dt.name : 'this template')}"?</h3>
      <div style="font-size:var(--fs-base);color:var(--ink-soft);margin:-4px 0 4px;">This can't be undone.</div>

function detailToggle(id){
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  const wasDraft = state.draftExercise && state.draftExercise.id===id;
  if(needsStartSessionConfirm()){
    state.pendingQuickAdd = { id, targetKey, wasDraft };
    renderOverlay();
    return;
  }
  if(wasDraft) saveDraftExercise(true);
  addToPhase(targetKey, id);
  showToast(wasDraft ? `Saved & added "${ex.name}" to ${phaseLabel(targetKey)}` : `Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}

/* All valid tag values already in use, grouped by category -- lets a coach pick a known tag
   from the "Add tags" sheet instead of retyping free text that might not quite match an
   existing one. Recomputed on demand (cheap at this dataset size) so it always reflects
   whatever's currently loaded, including a fresh live-sheet sync. */
function computeTagVocab(){
  const cats = ['technicalTags','tacticalTags','formatTags','physicalTags','cognitiveTags','engagementTags'];
  const sets = {}; cats.forEach(c => sets[c] = new Set());
  EXERCISES.forEach(e => cats.forEach(c => (e[c]||[]).forEach(t => { if(t) sets[c].add(t); })));
  const out = {};
  cats.forEach(c => out[c] = Array.from(sets[c]).sort((a,b)=>a.localeCompare(b)));
  return out;
}
function openTagPicker(id){ state.tagPickerId = id; renderOverlay(); }
function closeTagPicker(){ state.tagPickerId = null; renderOverlay(); }
function toggleExerciseTagAt(id, category, idx){
  const ex = exById(id);
  if(!ex) return;
  const vocab = computeTagVocab();
  const tag = (vocab[category]||[])[idx];
  if(!tag) return;
  const arr = ex[category] || (ex[category] = []);
  const i = arr.indexOf(tag);
  if(i>-1) arr.splice(i,1); else arr.push(tag);
  render();
}
function renderTagPickerSheet(){
  if(!state.tagPickerId) return '';
  const ex = exById(state.tagPickerId);
  if(!ex) return '';
  const vocab = computeTagVocab();
  const CATS = [
    {key:'technicalTags', label:'Technical'},
    {key:'tacticalTags', label:'Tactical'},
    {key:'formatTags', label:'Format'},
    {key:'physicalTags', label:'Physical'},
    {key:'cognitiveTags', label:'Cognitive'},
    {key:'engagementTags', label:'Engagement'},
  ];
  return `
  <div class="sheet-backdrop" onclick="closeTagPicker()"></div>
  <div class="sheet tag-picker-sheet">
    <div class="sheet-handle"></div>
    <h3>Add tags</h3>
    ${CATS.map(c => (vocab[c.key]&&vocab[c.key].length) ? `
    <div class="tp-cat-label">${c.label}</div>
    <div class="optrow">
      ${vocab[c.key].map((t,i) => `<button class="opt ${(ex[c.key]||[]).includes(t)?'active':''}" onclick="toggleExerciseTagAt('${ex.id}','${c.key}',${i})">${escHtml(t)}</button>`).join('')}
    </div>` : '').join('')}

      <button class="btn btn-primary" onclick="closeTagPicker()">Done</button>

}

/* Generic in-place exercise field editor, used by contenteditable blur handlers.
   Render is deferred to the next tick: if the same user gesture also targets another
   element (e.g. tapping "Back" right after editing a field), the blur-triggered re-render
   would otherwise destroy that element before its click event is delivered. */
function updateExerciseField(id, field, rawVal, kind, doRender){
  const ex = exById(id);
  if(!ex) return;
  let val = rawVal;
  if(kind==='number'){
    const n = parseInt(String(rawVal).replace(/[^0-9]/g,''),10);
    val = isNaN(n) ? null : n;
  } else {
    val = (typeof rawVal === 'string') ? rawVal.trim() : rawVal;
    if(val === '' || val === '—') val = (field==='videoUrl'||field==='mediaUrl') ? null : ex[field];
  }
  ex[field] = val;
  if(doRender !== false) setTimeout(render, 0);
}

function updateExerciseFormat(id, value){
  const ex = exById(id);
  if(!ex) return;
  ex.formatTags = value ? [value] : [];
  render();
}

/* ============ TIME-SPLIT GUIDANCE ============ */
/* Collapsible: always shows a colored one-line summary (planned vs target), expands to a
   direct comparison between what's actually been chosen and the suggested phase-group split.
   Defaults to the live in-progress draft (Build/Review) when called with no arguments; saved
   Session Detail passes its own frozen total/target/group-minutes instead, so the exact same
   panel and math serve both a live draft and a historical record. */
// Shared by renderTimeComparisonPanel() below and the Review page's compact row (batch 65) --
// the actual-vs-suggested split bars + legend, independent of whatever triggers showing them.
function timeComparisonBodyHtml(total, target, groups){
  const suggestedMins = suggestedSplitMinutes(target);
  const actualSegs = PHASE_GROUPS.map(s => `<div style="width:${Math.max(0, groups[s.key]/target*100)}%;background:${s.color};"></div>`).join('');
  const suggestedSegs = PHASE_GROUPS.map(s => `<div style="width:${s.pct}%;background:${s.color};"></div>`).join('');
  return `
    <div class="tp-body">
      <div class="tp-row-label">Your session</div>
      <div class="split-bar">${actualSegs}</div>
      <div class="tp-row-label" style="margin-top:9px;">Suggested split</div>
      <div class="split-bar">${suggestedSegs}</div>
      <div class="split-legend" style="margin-top:10px;">
        ${PHASE_GROUPS.map((s,i) => `<div class="split-legend-item"><i style="background:${s.color};"></i>${s.label} &middot; ${groups[s.key]}m <span>(sugg. ~${suggestedMins[i]}m)</span></div>`).join('')}
      </div>
    </div>`;
}
function renderTimeComparisonPanel(totalOverride, targetOverride, groupsOverride){
  const total = totalOverride !== undefined ? totalOverride : currentTotalMinutes().total;
  const target = targetOverride !== undefined ? targetOverride : state.targetDuration;
  const over = total > target;
  const diff = over ? total-target : target-total;
  const diffColor = total===0 ? 'var(--ink-soft)' : (over ? 'var(--warn)' : 'var(--turf)');
  const groups = groupsOverride || computeGroupMinutes();

  return `
  <div class="time-panel">
    <button class="time-panel-header" onclick="toggleSplitExpanded()">
      <div class="tp-summary">
        <span style="color:${diffColor};"><b>${total}</b> min planned</span>
        <span class="tp-sep">&middot;</span>
        <span style="color:${diffColor};font-weight:700;">${total===0 ? `${target} min target` : (over?`+${diff} over`:`${diff} min left`)}</span>
      </div>
      <span class="tp-chevron ${state.splitExpanded?'open':''}">${ICONS.chevronRight}</span>
    </button>
    ${state.splitExpanded ? timeComparisonBodyHtml(total, target, groups) : ''}
  </div>`;
}

// just keeps the existing ability to change them without reintroducing the old page-dominating UI.

function commitCustomDuration(rawVal){
  const n = parseInt(String(rawVal).replace(/[^0-9]/g,''),10);
  if(!isNaN(n) && n>0) state.targetDuration = Math.max(15, n);
  state.editingDuration = false;
  setTimeout(render, 0);
}
function defaultSessionName(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) + ' Practice';
}
// YYYY-MM-DD in the coach's own local time (not UTC) -- what an <input type="date"> needs, and
// what state.practiceDate/state.setupDate are stored as throughout.
function todayISODate(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// Compact "SAT, SEP 12" style label for the Build Practice page's practice-summary line, from a
// YYYY-MM-DD state.practiceDate. Parses year/month/day directly (never `new Date(isoString)`) so a
// coach west of UTC doesn't see the date roll back a day -- the same off-by-one that ISO-string
// date parsing is prone to.
function formatPracticeDateShort(iso){
  if(!iso) return '';
  const parts = iso.split('-').map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return '';
  const d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}
// Fills in Practice Setup's own draft fields fresh -- called whenever Setup is entered to start a
// brand-new practice. Duration/location default to whatever was last used (state.targetDuration/
// state.practiceLocation already persist across sessions today -- this preserves that instead of
// hardcoding a fresh default), matching how the Build page's own settings already behave.
function initSetupDraft(){
  state.setupName = defaultSessionName();
  state.setupDate = todayISODate();
  state.setupDuration = state.targetDuration;
  state.setupLocation = state.practiceLocation;
  state.setupSelectedTemplateId = null;
  state.setupEditingDuration = false;
}
// The up-to-3 templates Practice Setup surfaces directly on the page, in priority order: most
// recently used, then most frequently used, then (for anything never used) the library's own
// order -- Array.prototype.sort is stable, so ties fall back to that order rather than anything
// fabricated. lastUsedAt/useCount are only ever set by real use (markTemplateUsed below), never
// seeded with fake numbers.
function rankedSetupTemplates(){
  return state.practiceTemplates.slice().sort((a,b) => {
    const aUsed = a.lastUsedAt||0, bUsed = b.lastUsedAt||0;
    if(aUsed !== bUsed) return bUsed - aUsed;
    const aCount = a.useCount||0, bCount = b.useCount||0;
    if(aCount !== bCount) return bCount - aCount;
    return 0;
  }).slice(0,3);
}
// Real usage tracking -- called whenever a template is actually used to start or configure a
// practice (both from Practice Setup's CTA and the Build page's existing "Load a template").
function markTemplateUsed(id){
  const t = getTemplate(id);
  if(!t) return;
  t.lastUsedAt = Date.now();
  t.useCount = (t.useCount||0) + 1;
}
function setSessionName(v){ state.sessionName = v; }
function toggleSplitExpanded(){ state.splitExpanded = !state.splitExpanded; render(); }
function computeGroupMinutes(){
  const sum = (ids) => (ids||[]).reduce((a,id)=>a+(exById(id)?.duration||10),0);
  const g = {};
  PHASE_GROUPS.forEach(group => { g[group.key] = group.phaseKeys.reduce((a,k)=>a+sum(state.phaseData[k]),0); });
  return g;
}
/* Same shape as computeGroupMinutes() above, but reads from a SAVED session's own frozen
   `phases` snapshot (matched by each entry's `.section` name, not a live phaseData phase key)
   instead of the live draft -- lets Session Detail show the identical time-comparison panel for
   a completed session. A custom/extra section (section:null, not one of the 6 standard PHASES)
   contributes to no group, matching reviewPhaseGroups()/sessionDetailPhaseGroups() below. */
function computeGroupMinutesFromPhases(phases){
  const g = {};
  PHASE_GROUPS.forEach(group => { g[group.key] = 0; });
  (phases||[]).forEach(p => {
    const phaseObj = PHASES.find(ph => ph.section === p.section);
    if(!phaseObj) return;
    const group = PHASE_GROUPS.find(gr => gr.phaseKeys.includes(phaseObj.key));
    if(group) g[group.key] += (p.exercises||[]).reduce((a,e)=>a+(e.duration||10),0);
  });
  return g;
}

function currentTotalMinutes(){
  let total = 0, count = 0;
  PHASES.forEach(p => {
    state.phaseData[p.key].forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  state.extraSections.forEach(s => {
    s.exercises.forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  return {total, count};
}

function addExtraSection(){
  const n = state.extraSections.length + 1;
  state.extraSections.push({key:'extra'+Date.now(), label:'Extra Section '+n, exercises:[]});

}
function renameExtraSection(key, val){
  const s = state.extraSections.find(s=>s.key===key);
  if(s) s.label = val.trim() || s.label;

function removeExtraSection(key){

function pickForPhase(key){

  nav('exercises', {pickingPhase:key, fromBuild:true, fromReview:false, fromSavedSession:false, editingSavedSessionId:null, sectionFilter: p ? p.section : null, search:'', quickFilterValue:null, balanceSheetOpen:false, quickPickOpen:false, quickPickCustomizeOpen:false, showAddedInPractice:false});
}
/* Switch which phase is being filled WITHOUT leaving the exercise list — lets a coach fill several
   phases back to back instead of bouncing to the Build screen between every add. */
function switchPickingPhase(key){

/* Clear "what's next" step so a coach can move phase-by-phase start to finish without having to
   figure out on their own which dot to tap: advances to the next standard phase in order, or —
   once on the last one (or a custom section, which has no fixed "next") — goes to Review. */
function nextPickingPhase(){
  const idx = PHASES.findIndex(p => p.key === state.pickingPhase);
  if(idx > -1 && idx < PHASES.length - 1){
    switchPickingPhase(PHASES[idx+1].key);
  } else {
    nav('review');

}

function extractBullets(ex, maxBullets){
  maxBullets = maxBullets || 3;
  const sentences = [];
  [ex.description, ex.variations].forEach(text => {
    if(!text) return;
    text.split(/(?<=[.!?])\s+/).forEach(s => {
      const t = s.trim();
      if(t) sentences.push(t);
    });
  });
  return sentences.slice(0, maxBullets);
}

function buildExRowHtml(id, key, removeCall, showGrip){
  const ex = exById(id);
  if(!ex) return '';
  const st = secStyle(ex.section);
  const bullets = extractBullets(ex, 3);
  const exFallback = `<div class="build-ex-image-fallback" style="background:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`;
  const img = ex.mediaUrl
    ? mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false, exFallback)
    : exFallback;
  return `
  <div class="build-ex-row" data-ex-id="${id}">
    ${showGrip ? `<span class="build-ex-grip" onpointerdown="exGripDown(event,'${key}','${id}')" title="Long-press and drag to reorder">${ICONS.grip}</span>` : ''}
    <button class="build-ex-remove" onclick="${removeCall}" title="Remove ${escAttr(ex.name)}">${ICONS.trash}</button>
    <div class="build-ex-image">${img}</div>
    <div class="build-ex-info">
      <div class="build-ex-name-row"><div class="build-ex-name">${escHtml(ex.name)}</div><span class="build-ex-dur">${ex.duration||10}m</span></div>
      ${bullets.length ? `<ul class="build-ex-bullets">${bullets.map(b=>`<li>${escHtml(b)}</li>`).join('')}</ul>` : ''}
    </div>
  </div>`;
}

/* Long-press-and-drag reorder for exercises already added to a Building Session section -- same
   gesture/timing as the template-section reorder in Settings (tmplGripDown et al.), just operating
   over an exercise-id array instead of a sections array. Scoped per section (data-list-key) so
   dragging in one section's list can't match rows in another section that happens to contain the
   same exercise. Only shown once a section has 2+ exercises -- nothing to reorder with just one. */
function exerciseListFor(key){
  if(state.phaseData[key]) return state.phaseData[key];
  const es = state.extraSections.find(s=>s.key===key);
  return es ? es.exercises : null;
}
let exDrag = null;
function exGripDown(e, key, id){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!exDrag) return;
    exDrag.longPressed = true;
    const row = document.querySelector(`.build-ex-list[data-list-key="${key}"] .build-ex-row[data-ex-id="${id}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  exDrag = {key, id, timer, startY, longPressed:false};
  document.addEventListener('pointermove', exGripMove);
  document.addEventListener('pointerup', exGripUp);
}
function exGripMove(e){
  if(!exDrag) return;
  if(!exDrag.longPressed){
    if(Math.abs(e.clientY - exDrag.startY) > 8){ exGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const list = exerciseListFor(exDrag.key);
  if(!list) return;
  let overId = null;
  list.forEach(exId=>{
    const el = document.querySelector(`.build-ex-list[data-list-key="${exDrag.key}"] .build-ex-row[data-ex-id="${exId}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overId = exId;
  });
  if(!overId || overId===exDrag.id) return;
  const fromIdx = list.indexOf(exDrag.id);
  const toIdx = list.indexOf(overId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = list.splice(fromIdx,1);
  list.splice(toIdx,0,moved);
  render();
  const id = exDrag.id, key = exDrag.key;
  setTimeout(()=>{ const row=document.querySelector(`.build-ex-list[data-list-key="${key}"] .build-ex-row[data-ex-id="${id}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function exGripCancel(){
  if(exDrag) clearTimeout(exDrag.timer);
  exDrag = null;
  document.removeEventListener('pointermove', exGripMove);
  document.removeEventListener('pointerup', exGripUp);
}
function exGripUp(){
  exGripCancel();
  render();
}

// Review-page reordering: same long-press-then-drag mechanism as exGripDown/Move/Up/Cancel above,
// but scoped by a phase-GROUP key (e.g. "activate") instead of a single phase key, since a
// group's list on this page can blend exercises from 2-3 real phases into one visual card and
// the coach can drag freely across that whole blend. A drag never changes which real phase an
// exercise belongs to (see reviewExGripMove) -- only its position in the Review-page display,
// and the relative order of same-phase exercises, which is what actually carries into Save.
let reviewExDrag = null;
function reviewExGripDown(e, groupKey, id){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!reviewExDrag) return;
    reviewExDrag.longPressed = true;
    const row = document.querySelector(`.phase-exlist[data-list-key="${groupKey}"] .phase-ex-item[data-ex-id="${id}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  reviewExDrag = {groupKey, id, timer, startY, longPressed:false};
  document.addEventListener('pointermove', reviewExGripMove);
  document.addEventListener('pointerup', reviewExGripUp);
}
function reviewExGripMove(e){
  if(!reviewExDrag) return;
  if(!reviewExDrag.longPressed){
    if(Math.abs(e.clientY - reviewExDrag.startY) > 8){ reviewExGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const groupKey = reviewExDrag.groupKey;
  const flat = reviewGroupFlatOrder(groupKey);
  let overId = null;
  flat.forEach(it=>{
    const el = document.querySelector(`.phase-exlist[data-list-key="${groupKey}"] .phase-ex-item[data-ex-id="${it.id}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overId = it.id;
  });
  if(!overId || overId===reviewExDrag.id) return;
  const phaseKeyById = new Map(flat.map(it=>[it.id, it.phaseKey]));
  const ids = flat.map(it=>it.id);
  const fromIdx = ids.indexOf(reviewExDrag.id);
  const toIdx = ids.indexOf(overId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = ids.splice(fromIdx,1);
  ids.splice(toIdx,0,moved);
  state.reviewGroupOrder[groupKey] = ids;
  // Re-sync each real phase's own array to the new relative order of just its own items, so a
  // same-phase reorder persists normally into the saved session on completeSession(). A custom
  // section is its own single "phase" here, so it just gets the reordered list directly.
  const group = PHASE_GROUPS.find(g=>g.key===groupKey);
  if(group){
    group.phaseKeys.forEach(key=>{
      state.phaseData[key] = ids.filter(id=>phaseKeyById.get(id)===key);
    });
  } else {
    const extra = state.extraSections.find(s=>s.key===groupKey);
    if(extra) extra.exercises = ids;
  }
  render();
  const id = reviewExDrag.id;
  setTimeout(()=>{ const row=document.querySelector(`.phase-exlist[data-list-key="${groupKey}"] .phase-ex-item[data-ex-id="${id}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function reviewExGripCancel(){
  if(reviewExDrag) clearTimeout(reviewExDrag.timer);
  reviewExDrag = null;
  document.removeEventListener('pointermove', reviewExGripMove);
  document.removeEventListener('pointerup', reviewExGripUp);
}
function reviewExGripUp(){
  reviewExGripCancel();
  render();
}

function renderBuild(){
  const presets = [60,75,90];
  const isCustomActive = !presets.includes(state.targetDuration);
  const activePhases = orderedPhases().filter(p => state.enabledPhaseKeys.has(p.key));
  const {total, count} = currentTotalMinutes();
  const pct = state.targetDuration ? Math.min(100, Math.round((total/state.targetDuration)*100)) : 0;
  const over = total > state.targetDuration;
  const remain = state.targetDuration - total;

  // Numbered practice-plan cards (batch 69): "01 WARMUP", "02 ATHLETIC", etc., in whatever order
  // the coach's own Settings > phase order currently is (orderedPhases()/enabledPhaseKeys are a
  // persistent coach preference, unrelated to this one practice, and untouched here) -- for a coach
  // who's never reordered anything this is exactly the canonical 01-06 Warmup..Scrimmage sequence.
  // "Start here" is now a one-time cue on phase #1 only, and only while the whole practice is still
  // empty -- it does not chase whichever phase is next like the old "next-up" pointer did, since the
  // builder is a planner a coach can jump around in, not a six-step wizard.
  const phaseBoxHtml = (p, idx) => {
    const ids = state.phaseData[p.key];
    const st = secStyle(p.section);
    const mins = ids.reduce((a,id)=>a+(exById(id)?.duration||10),0);
    const isEmpty = ids.length === 0;
    const isFirstPhaseWhileEmpty = count===0 && idx===0;
    // Empty sections start (and stay) collapsed -- there's nothing to expand yet, so no chevron
    // is shown at all. Once the first exercise is added, a chevron appears and the box defaults
    // to expanded so the coach immediately sees what they just added.
    const isCollapsed = isEmpty ? true : state.collapsedPhases.has(p.key);
    const suggested = sectionPlannedMinutes(p.key); // reuses the coach's own existing Settings > Training Session split -- see PHASE TIME GUIDANCE in the batch 69 report for why this, not a second hardcoded distribution
    const numStr = String(idx+1).padStart(2,'0');

    let minsHtml;
    if(isEmpty){
      minsHtml = `<span class="pcard-mins empty">0 MIN</span>`;
    } else if(mins >= suggested){
      // Meets or exceeds its guideline share -- a plain checkmark, no color implying "done right,"
      // just "on pace." Never a warning color either way (per PHASE TIME GUIDANCE: deviation is fine).
      minsHtml = `<span class="pcard-mins"><span>${mins} min</span>${ICONS.check}</span>`;
    } else {
      minsHtml = `<span class="pcard-mins"><span>${mins} min</span><span class="pcard-sugg">&middot; ${suggested} min suggested</span></span>`;
    }

    let subLine = '';

      </div>
      ${subLine}
      ${isCollapsed ? '' : (ids.length ? `<div class="build-ex-list" data-list-key="${p.key}">${ids.map(id=>buildExRowHtml(id, p.key, `removeFromPhase('${p.key}','${id}')`, ids.length>1)).join('')}</div>` : '')}

  const extraBoxHtml = (s) => {
    const mins = s.exercises.reduce((a,id)=>a+(exById(id)?.duration||10),0);

    return `

        <div class="phase-box-toprow">
          <input class="extra-box-title-input" value="${escAttr(s.label)}" onblur="renameExtraSection('${s.key}', this.value)" onkeydown="if(event.key==='Enter')this.blur()">
          <button class="phase-collapse-btn ${isCollapsed?'collapsed':''}" onclick="togglePhaseCollapsed('${s.key}')" title="${isCollapsed?'Expand':'Collapse'} ${escAttr(s.label)}">${ICONS.chevronRight}</button>
        </div>
        <div class="phase-box-subrow">
          <div class="phase-box-time">${mins}m</div>

          </div>
        </div>
      </div>
      ${isCollapsed ? '' : (s.exercises.length ? `<div class="build-ex-list" data-list-key="${s.key}">${s.exercises.map(id=>buildExRowHtml(id, s.key, `removeFromPhase('${s.key}','${id}')`, s.exercises.length>1)).join('')}</div>` : `<div class="build-ex-empty">No exercises yet</div>`)}
    </div>`;
  };

  const dateLabel = formatPracticeDateShort(state.practiceDate).toUpperCase();
  const locLabel = state.practiceLocation === 'indoor' ? 'INDOOR' : 'OUTDOOR';

  // REVIEW button (batch 71): back to a single static "Review Session" label -- secondary/

  const ctaLabel = 'Review Session';
  const ctaDisabled = count===0;

  return `

    </div>

      <span>${dateLabel} &middot; ${state.targetDuration} MIN &middot; ${locLabel}</span>
      <button class="bp-meta-edit-btn" onclick="toggleBuildDetails()" title="Edit duration or location" aria-label="Edit duration or location">${ICONS.pencil}</button>

    <div class="bp-details-panel">
      <div class="practice-settings-row" style="margin-top:0;">
        <div class="practice-setting-group">
          <div class="ps-label">Practice Duration</div>
          <div class="duration-target compact">
            ${presets.map(v => `<button class="dtarget compact ${state.targetDuration===v?'active':''}" onclick="setTargetDuration(${v})">${v}</button>`).join('')}
            ${state.editingDuration
              ? `<input id="customDurInput" class="dtarget-input compact" type="text" inputmode="numeric" pattern="[0-9]*" value="${isCustomActive?state.targetDuration:''}" placeholder="#" onblur="commitCustomDuration(this.value)" onkeydown="if(event.key==='Enter')this.blur()">`
              : `<button class="dtarget compact ${isCustomActive?'active':''}" onclick="toggleCustomDurationEdit()">${isCustomActive?state.targetDuration:'+'}</button>`}

    <div class="bp-progress">

        <span class="bp-progress-label">${total} / ${state.targetDuration} MIN PLANNED</span>
        ${total>0 ? `<span class="bp-progress-remaining ${over?'over':''}">${over ? `+${-remain} MIN OVER` : `${remain} MIN REMAINING`}</span>` : ''}
      </div>
      <div class="progress-track" style="height:6px;margin-top:7px;"><div class="progress-fill ${over?'over':''}" style="width:${pct}%;"></div></div>

/* ============ SESSION REVIEW (current in-progress builder) ============ */
function completeSession(){
  const {total, count} = currentTotalMinutes();
  if(count===0){ showToast('Add at least one exercise first'); return; }
  const phasesSnapshot = [];
  PHASES.forEach(p => {
    if(state.phaseData[p.key].length){
      phasesSnapshot.push({
        label: p.label, section: p.section,
        exercises: state.phaseData[p.key].map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10, technicalScore: ex?.technicalScore ?? null, tacticalScore: ex?.tacticalScore ?? null, physicalScore: ex?.physicalScore ?? null, cognitiveScore: ex?.cognitiveScore ?? null, hasScoreSnapshot: true}; })
      });
    }
  });
  state.extraSections.forEach(s => {
    if(s.exercises.length){
      phasesSnapshot.push({
        label: s.label, section: null,
        exercises: s.exercises.map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10, technicalScore: ex?.technicalScore ?? null, tacticalScore: ex?.tacticalScore ?? null, physicalScore: ex?.physicalScore ?? null, cognitiveScore: ex?.cognitiveScore ?? null, hasScoreSnapshot: true}; })
      });
    }
  });
  // A random suffix (not just the timestamp) keeps two coaches' ids from ever colliding if they
  // both happen to save in the same millisecond -- astronomically unlikely, but free to guard
  // against now that ids are shared across everyone's devices instead of just one browser.
  const id = 'S' + Date.now() + Math.random().toString(36).slice(2,7);
  const name = state.sessionName.trim() || `${dayName()} Session — ${state.savedSessions.length+1}`;
  const newSession = {
    id, name,
    totalMin: total, exCount: count, createdAt: Date.now(), createdBy: state.coachName,
    targetDuration: state.targetDuration, phases: phasesSnapshot,
    practiceDate: state.practiceDate, location: state.practiceLocation, templateId: state.activeTemplateId,
    rating: 0, comment: '', favorited: false, visibility: 'shared',
  };
  state.savedSessions.push(newSession);
  // reset builder
  PHASES.forEach(p => state.phaseData[p.key] = []);
  state.extraSections = [];
  state.reviewGroupOrder = {};
  state.sessionName = defaultSessionName();
  state.practiceDate = todayISODate();
  state.activeTemplateId = null;
  showToast('Session saved!');
  nav('home');
  pushSessionToSheet(newSession);
}

/* Groups the live in-progress draft's phaseData into the 3 PHASE_GROUPS for the Session Review
   summary -- flattens each group's constituent phases (e.g. Warmup + Athletic) into one combined
   exercise list, in PHASES order, and skips any group with nothing in it yet (mirrors the old
   per-phase behavior of only showing a card once it has exercises). Each item keeps its original
   phaseKey so the remove control still targets the correct underlying phase. */
// The natural, unreordered sequence for a group (or a custom/extra section, which behaves like a
// single-phase "group" of one): its phaseKeys' own arrays back to back.
function reviewGroupNaturalOrder(groupKey){
  const group = PHASE_GROUPS.find(g=>g.key===groupKey);
  if(group){
    const items = [];
    group.phaseKeys.forEach(key => { state.phaseData[key].forEach(id => items.push({id, phaseKey:key})); });
    return items;
  }
  const extra = state.extraSections.find(s=>s.key===groupKey);
  return extra ? extra.exercises.map(id => ({id, phaseKey:groupKey})) : [];
}
// A group's actual display sequence -- the coach's drag-reordered order from
// state.reviewGroupOrder if one has been set (reviewExGripMove below), falling back to the
// natural phase-by-phase order, and gracefully absorbing any exercise added/removed since the
// custom order was last saved (dropped ids are skipped, new ids are appended at the end).
function reviewGroupFlatOrder(groupKey){
  const natural = reviewGroupNaturalOrder(groupKey);
  const custom = state.reviewGroupOrder[groupKey];
  if(!custom || !custom.length) return natural;
  const byId = new Map(natural.map(it=>[it.id,it]));
  const ordered = custom.map(id=>byId.get(id)).filter(Boolean);
  natural.forEach(it => { if(!custom.includes(it.id)) ordered.push(it); });
  return ordered;
}
function reviewPhaseGroups(){
  return PHASE_GROUPS.map(group => {
    const items = reviewGroupFlatOrder(group.key);
    const mins = items.reduce((a,it)=>a+(exById(it.id)?.duration||10),0);
    return {...group, items, mins};
  }).filter(group => group.items.length);
}

// already-in-progress practice's name/date/duration/location/template. Unlike initSetupDraft()

  const hasExistingPractice = currentTotalMinutes().count > 0;

    PHASES.forEach(p => state.phaseData[p.key] = []);

// Recompute a saved session's headline stats after its phases are edited -- mirrors the same
// count/sum completeSession() does when a session is first saved.
function recomputeSavedSessionStats(s){
  let count = 0, total = 0;
  s.phases.forEach(p => { count += p.exercises.length; p.exercises.forEach(e => { total += e.duration||10; }); });
  s.exCount = count;
  s.totalMin = total;
}
// Editing exercises on an already-saved session is fully separate from the live build-a-new-
// session draft (state.phaseData/extraSections) -- a saved session's exercises are frozen
// snapshot objects, not just ids, so these mutate s.phases directly instead of routing through
// addToPhase/removeFromPhase.
function removeExerciseFromSavedSession(sessionId, exerciseId){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  if(!s) return;
  let removedName = '';
  s.phases.forEach(p => {
    const idx = p.exercises.findIndex(e=>e.id===exerciseId);
    if(idx!==-1){ removedName = p.exercises[idx].name; p.exercises.splice(idx,1); }
  });
  s.phases = s.phases.filter(p => p.exercises.length);
  recomputeSavedSessionStats(s);
  if(removedName){ showToast(`Removed "${removedName}" from ${s.name}`); pushSessionToSheet(s); }
  render();
}
function addExerciseToSavedSession(sessionId, exerciseId){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  const ex = exById(exerciseId);
  if(!s || !ex) return;
  if(s.phases.some(p => p.exercises.some(e=>e.id===exerciseId))){ showToast(`"${ex.name}" is already in this session`); return; }
  const phaseObj = PHASES.find(p=>p.section===ex.section);
  let target = s.phases.find(p => p.section === ex.section);
  if(!target){
    target = {label: phaseObj ? phaseObj.label : (ex.section||'Other'), section: ex.section||null, exercises: []};
    s.phases.push(target);
  }
  target.exercises.push({id: ex.id, name: ex.name, duration: ex.duration||10, technicalScore: ex.technicalScore ?? null, tacticalScore: ex.tacticalScore ?? null, physicalScore: ex.physicalScore ?? null, cognitiveScore: ex.cognitiveScore ?? null, hasScoreSnapshot: true});
  recomputeSavedSessionStats(s);
  showToast(`Added "${ex.name}" to ${s.name}`);
  render();
  pushSessionToSheet(s);
}
function isExerciseInSavedSession(sessionId, exerciseId){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  return !!(s && s.phases.some(p => p.exercises.some(e=>e.id===exerciseId)));
}
// Enter "add an exercise to this saved session" mode -- browses the exercise library scoped to
// nothing in particular (unlike the guided Build flow's pickForPhase, a saved session's phase
// cards can span multiple real phases, so there's no single section to filter to up front).
function addExerciseToSavedSessionFlow(sessionId){
  nav('exercises', {editingSavedSessionId:sessionId, fromSavedSession:true, fromSavedSessionId:sessionId, fromBuild:false, fromReview:false, pickingPhase:null, sectionFilter:null, search:'', quickFilterValue:null});
}

// 'mine' = every session you created (Shared or Private); 'community' = every Shared session
// from everyone in the group, your own included -- see the My Sessions / Community toggle below.
function setSessionsViewMode(mode){ state.sessionsViewMode = mode; render(); }
function sessionRowHtml(s){
  const isOwner = s.createdBy === state.coachName;
  return `
      <div class="session-row" role="button" tabindex="0" onclick="openSessionDetail('${s.id}')">
        <div class="srthumb">${ICONS.ball}</div>
        <div style="flex:1;min-width:0;">
          <div class="srname">${escHtml(s.name)}</div>
          <div class="srmeta">${ICONS.user} ${isOwner?'You':escHtml(s.createdBy)} &middot; ${formatWhen(s.createdAt)}${s.visibility==='private'?` &middot; ${ICONS.lock} Private`:''}</div>
          <div class="srmeta">${s.totalMin} min &middot; ${s.exCount} exercises${s._syncPending?' &middot; <span style="color:var(--warn);">Not synced yet</span>':''}</div>
        </div>
        ${isOwner ? `<button class="session-fav-btn ${s.favorited?'on':''}" onclick="event.stopPropagation(); toggleSessionFavorite('${s.id}')" title="${s.favorited?'Remove favorite':'Favorite this session'}">${s.favorited?ICONS.bookmarkFilled:ICONS.bookmark}</button>` : ''}
        ${isOwner ? `<button class="session-del-btn" onclick="event.stopPropagation(); requestDeleteSession('${s.id}')" title="Delete session">${ICONS.trash}</button>` : ''}
        <div class="srchevron">${ICONS.chevronRight}</div>
      </div>`;
}
function renderSessions(){
  const mode = state.sessionsViewMode || 'mine';
  const mine = state.savedSessions.filter(s => s.createdBy === state.coachName);
  const community = state.savedSessions.filter(s => s.visibility !== 'private');
  const list = (mode==='mine' ? mine : community).slice().reverse().sort((a,b) => (b.favorited?1:0) - (a.favorited?1:0));

  const toggle = `
    <div class="view-toggle" style="margin-top:10px;">
      <button class="view-toggle-btn ${mode==='mine'?'active':''}" onclick="setSessionsViewMode('mine')">${ICONS.user} My Sessions</button>
      <button class="view-toggle-btn ${mode==='community'?'active':''}" onclick="setSessionsViewMode('community')">${ICONS.globe} Community</button>
    </div>
    ${state.sessionsSyncSource==='offline' ? `<div class="sync-banner">${ICONS.image}<span>Couldn't reach the shared session sheet just now — showing the last known list. Reopen this tab once you're back online to refresh it.</span></div>` : ''}`;

  if(!list.length){
    return `
    <div class="section-pad">
      <div class="eyebrow">Sessions</div>
      ${toggle}
      <div class="empty-state">
        ${ICONS.empty}
        <p>${mode==='mine' ? 'No sessions saved yet.<br>Build one and hit "Save Session" to see it here.' : 'No shared sessions from the group yet.<br>Sessions you and your friends mark Shared will show up here.'}</p>
      </div>
      ${mode==='mine' ? `<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="nav('build')">Build a Session</button>` : ''}
    </div>`;
  }
  return `
  <div class="section-pad">
    <div class="eyebrow">${mode==='mine' ? 'My Sessions' : 'Community'}</div>
    <div class="sh" style="margin-top:2px;"><h2>${list.length} ${mode==='mine'?'saved':'shared'}</h2></div>
    ${toggle}
    <div style="margin-top:14px;">
      ${list.map(sessionRowHtml).join('')}
    </div>
  </div>`;
}

function setSessionRating(id, val){
  const s = state.savedSessions.find(s=>s.id===id);
  if(s){ s.rating = (s.rating===val) ? 0 : val; pushSessionToSheet(s); } // tap the same star again to clear the rating
  render();
}
function setSessionComment(id, val){
  const s = state.savedSessions.find(s=>s.id===id);
  if(s){ s.comment = val; pushSessionToSheet(s); }
}
/* Same grouping as reviewPhaseGroups(), but for a SAVED session's frozen `phases` snapshot
   (matched by `.section` name back to a PHASES entry, since a snapshot doesn't carry phase
   keys) instead of the live draft. A custom/extra section (section:null) belongs to no group
   and is rendered separately, exactly as it already was before this batch. */
function sessionDetailPhaseGroups(s){
  return PHASE_GROUPS.map(group => {
    const items = [];
    s.phases.forEach(p => {
      const phaseObj = PHASES.find(ph => ph.section === p.section);
      if(phaseObj && group.phaseKeys.includes(phaseObj.key)) items.push(...p.exercises);
    });
    const mins = items.reduce((a,e)=>a+(e.duration||10),0);
    return {...group, items, mins};
  }).filter(group => group.items.length);
}
function renderSessionDetail(){
  const s = state.savedSessions.find(s=>s.id===state.viewingSessionId);
  if(!s) return `<div class="empty-state">${ICONS.empty}<p>Session not found.</p></div>`;
  // A session browsed in from Community that belongs to a different coach is view-only: no edit,
  // no add/discard, no favorite/rate/comment, no visibility toggle -- those all mutate a record
  // that isn't yours (several of them, like favorited/rating, are single shared fields on the
  // session itself, not per-viewer, so letting a non-owner touch them would silently overwrite
  // the owner's own state).
  const isOwner = s.createdBy === state.coachName;
  const editing = isOwner && state.editingSessionDetail;
  const isPrivate = s.visibility === 'private';
  const practiceProfile = practiceTrainingProfile(savedSessionTrainingItems(s));
  const groups = sessionDetailPhaseGroups(s);
  const extras = s.phases.filter(p => !PHASES.some(ph=>ph.section===p.section));
  return `
  <div class="detail-header" style="background:var(--pitch);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <button class="backbtn" style="margin-bottom:0;" onclick="nav('sessions')">${ICONS.back}</button>
      <div style="display:flex;align-items:center;gap:8px;">
        ${isOwner ? `<button class="dh-icon-btn ${s.favorited?'on':''}" onclick="toggleSessionFavorite('${s.id}')" title="${s.favorited?'Remove favorite':'Favorite this session'}">${s.favorited?ICONS.bookmarkFilled:ICONS.bookmark}</button>` : ''}
        ${isOwner ? `<button class="dh-icon-btn" onclick="toggleEditSessionDetail()" title="${editing?'Done editing':'Edit session details'}">${editing?ICONS.check:ICONS.pencil}</button>` : ''}
        ${isOwner
          ? `<button class="session-state-tag saved" style="position:static;border:none;cursor:pointer;" onclick="toggleSessionVisibility('${s.id}')" title="Tap to make this ${isPrivate?'Shared':'Private'}">${isPrivate?ICONS.lock:ICONS.globe} ${isPrivate?'Private':'Shared'}</button>`
          : `<div class="session-state-tag saved" style="position:static;">${ICONS.user} By ${escHtml(s.createdBy)}</div>`}
      </div>
    </div>
    <div class="dpill" style="margin-top:14px;">${ICONS.soccerBallPhoto} Saved Session</div>
    ${editing
      ? `<h1 class="editable-title" contenteditable="true" onblur="renameSavedSession('${s.id}', this.innerText)">${escHtml(s.name)}</h1>`
      : `<h1>${escHtml(s.name)}</h1>`}
    <div class="stat-row">
      <div class="stat"><div class="snum">${s.totalMin}</div><div class="slbl">Minutes</div></div>
      <div class="stat"><div class="snum">${s.exCount}</div><div class="slbl">Exercises</div></div>
      <div class="stat">${editing
        ? `<div class="snum-row"><span class="snum-editable" contenteditable="true" onblur="setSavedSessionDuration('${s.id}', this.innerText)">${s.targetDuration}</span></div>`
        : `<div class="snum">${s.targetDuration}</div>`}<div class="slbl">Target</div></div>
    </div>
  </div>
  <div class="section-pad">
    <div class="rate-session-box">
      <div class="rate-session-title">Rate this Session</div>
      <div class="star-row">
        ${[1,2,3,4,5].map(n=>`<button class="star-btn ${s.rating>=n?'filled':''}" ${isOwner?`onclick="setSessionRating('${s.id}',${n})"`:'style="cursor:default;"'}>${ICONS.star}</button>`).join('')}
      </div>
      ${isOwner
        ? `<textarea class="rate-comment" rows="3" placeholder="Add any notes about how this session went..." onblur="setSessionComment('${s.id}', this.value)">${escHtml(s.comment||'')}</textarea>`
        : (s.comment ? `<div class="rate-comment" style="min-height:auto;color:var(--ink-soft);">${escHtml(s.comment)}</div>` : '')}
    </div>

    <div class="sd-meta-row">
      <div class="sd-meta"><div class="smnum">${s.createdBy}</div><div class="smlbl">Added by</div></div>
      <div class="sd-meta"><div class="smnum">${formatWhen(s.createdAt)}</div><div class="smlbl">Date &amp; time</div></div>
    </div>

    <div class="sd-total-time" style="margin-top:22px;">${s.totalMin} min total</div>

    <div class="phase-strip sd-phases" style="margin-top:22px;">
      ${groups.map((g,i)=>`
        <div class="phase-card">
          <div class="phase-line">
            <div class="phase-num" style="background:${g.color};color:${g.textOn==='dark'?'var(--pitch-dark)':'white'};">${i+1}</div>
            ${i===groups.length-1 && extras.length===0 ? '' : '<div class="phase-connector"></div>'}
          </div>
          <div class="phase-content">
            <div class="phase-title-row">
              <div class="phase-title">${g.label}</div>
              <div class="phase-time">${g.mins} min</div>
            </div>
            <div class="phase-group-sub">${escHtml(g.sublabel)}</div>
            <div class="phase-exlist">
              ${g.items.map(e=>`<div class="phase-ex-item" onclick="openDetailFromSavedSession('${e.id}','${s.id}')" style="cursor:pointer;">${peiThumbHtml(exById(e.id))}<span class="peiname">${e.name}</span><span class="peidur">${e.duration}m</span>${editing?`<button class="phase-ex-remove" onclick="event.stopPropagation(); removeExerciseFromSavedSession('${s.id}','${e.id}')" title="Discard ${escAttr(e.name)}">${ICONS.trash}</button>`:''}</div>`).join('')}
            </div>
            ${editing?`<button class="pcard-add-btn" onclick="addExerciseToSavedSessionFlow('${s.id}')">+ Add Exercise</button>`:''}
          </div>
        </div>`).join('')}
      ${extras.map((p,i)=>`
        <div class="phase-card">
          <div class="phase-line"><div class="phase-num">${groups.length+i+1}</div></div>
          <div class="phase-content">
            <div class="phase-title-row"><div class="phase-title">${p.label}</div><div class="phase-time">${p.exercises.reduce((a,e)=>a+e.duration,0)} min</div></div>
            <div class="phase-exlist">
              ${p.exercises.map(e=>`<div class="phase-ex-item" onclick="openDetailFromSavedSession('${e.id}','${s.id}')" style="cursor:pointer;">${peiThumbHtml(exById(e.id))}<span class="peiname">${e.name}</span><span class="peidur">${e.duration}m</span>${editing?`<button class="phase-ex-remove" onclick="event.stopPropagation(); removeExerciseFromSavedSession('${s.id}','${e.id}')" title="Discard ${escAttr(e.name)}">${ICONS.trash}</button>`:''}</div>`).join('')}
            </div>
            ${editing?`<button class="pcard-add-btn" onclick="addExerciseToSavedSessionFlow('${s.id}')">+ Add Exercise</button>`:''}
          </div>
        </div>`).join('')}
      ${editing && groups.length===0 && extras.length===0 ? `
        <div class="phase-card">
          <div class="phase-content">
            <button class="pcard-add-btn" onclick="addExerciseToSavedSessionFlow('${s.id}')">+ Add Exercise</button>
          </div>
        </div>` : ''}
    </div>

    <div class="pprof-block" style="margin-top:22px;">
      ${trainingProfileHeadingHtml()}
      ${trainingProfileInfoPanelHtml()}
      <div class="pprof-rows">${practiceProfile.map(practiceProfileRowHtml).join('')}</div>
      <div class="pprof-interpretation">${practiceProfileInterpretation(practiceProfile)}</div>
    </div>
  </div>`;
}

/* ============ PERSISTENCE ============
   A reload -- from the OS reclaiming a backgrounded phone browser tab/PWA, not from anything this
   app itself triggers -- previously meant losing an in-progress draft session, every saved session,
   and every bookmark, since none of it lived anywhere but memory. Every render() call now snapshots
   the meaningful state to localStorage, and it's restored once on load before the first render. */
const APP_STATE_STORAGE_KEY = 'ft2-app-state-v1';
function saveAppStateToStorage(){
  try{
    const snapshot = {
      phaseData: state.phaseData,
      extraSections: state.extraSections,
      sessionName: state.sessionName,
      targetDuration: state.targetDuration,
      practiceLocation: state.practiceLocation,
      practiceDate: state.practiceDate,
      activeTemplateId: state.activeTemplateId,
      savedSessions: state.savedSessions,
      bookmarks: [...state.bookmarks],
      enabledPhaseKeys: [...state.enabledPhaseKeys],
      phaseOrder: state.phaseOrder,
      practiceTemplates: state.practiceTemplates,
      sectionDefaultPcts: {...sectionDefaultPcts},
      // Navigation context -- so a reload lands the coach back on the screen they were actually
      // on (mid-build, picking exercises, reviewing) instead of bouncing to Home even though the
      // underlying data survived. Validated against live data below before being trusted.
      screen: state.screen,
      detailId: state.detailId,
      pickingPhase: state.pickingPhase,
      sectionFilter: state.sectionFilter,
      quickFilterValue: state.quickFilterValue,
      viewingSessionId: state.viewingSessionId,
      fromBuild: state.fromBuild,
      fromReview: state.fromReview,
      fromSavedSession: state.fromSavedSession,
      fromSavedSessionId: state.fromSavedSessionId,
      editingSavedSessionId: state.editingSavedSessionId,
      reviewGroupOrder: state.reviewGroupOrder,
    };
    localStorage.setItem(APP_STATE_STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){ /* storage unavailable (private browsing, quota, etc.) -- app still works, just won't persist */ }
}
function loadAppStateFromStorage(){
  try{
    const raw = localStorage.getItem(APP_STATE_STORAGE_KEY);
    if(!raw) return;
    const snap = JSON.parse(raw);
    if(snap.phaseData){
      // Merge onto the current phaseData skeleton, key by key, so a PHASES entry that didn't exist
      // yet when this draft was saved still ends up as a valid empty array instead of missing.
      PHASES.forEach(p => { state.phaseData[p.key] = snap.phaseData[p.key] || []; });
    }
    if(Array.isArray(snap.extraSections)) state.extraSections = snap.extraSections;
    if(typeof snap.sessionName === 'string' && snap.sessionName.trim()) state.sessionName = snap.sessionName;
    if(typeof snap.targetDuration === 'number' && snap.targetDuration > 0) state.targetDuration = snap.targetDuration;
    if(snap.practiceLocation === 'indoor' || snap.practiceLocation === 'outdoor') state.practiceLocation = snap.practiceLocation;
    if(typeof snap.practiceDate === 'string' && snap.practiceDate) state.practiceDate = snap.practiceDate;
    if(typeof snap.activeTemplateId === 'string' || snap.activeTemplateId === null) state.activeTemplateId = snap.activeTemplateId ?? null;
    if(Array.isArray(snap.savedSessions)) state.savedSessions = snap.savedSessions;
    if(Array.isArray(snap.bookmarks)) state.bookmarks = new Set(snap.bookmarks);
    if(Array.isArray(snap.enabledPhaseKeys) && snap.enabledPhaseKeys.length) state.enabledPhaseKeys = new Set(snap.enabledPhaseKeys);
    if(Array.isArray(snap.phaseOrder) && snap.phaseOrder.length) state.phaseOrder = snap.phaseOrder;
    if(Array.isArray(snap.practiceTemplates)){
      state.practiceTemplates = snap.practiceTemplates;
    } else if(snap.practiceTemplates && typeof snap.practiceTemplates === 'object'){
      // Migrate from the old fixed outdoor/indoor-slot shape (before templates became a named
      // library) so nobody's already-saved template configuration silently vanishes.
      const migrated = [];
      if(snap.practiceTemplates.outdoor) migrated.push({id:'tmpl-outdoor-default', name:'Outdoor Practice', location:'outdoor', duration:snap.practiceTemplates.outdoor.duration||75, sections:snap.practiceTemplates.outdoor.sections||defaultTemplateSections()});
      if(snap.practiceTemplates.indoor) migrated.push({id:'tmpl-indoor-default', name:'Indoor Practice', location:'indoor', duration:snap.practiceTemplates.indoor.duration||75, sections:snap.practiceTemplates.indoor.sections||defaultTemplateSections()});
      if(migrated.length) state.practiceTemplates = migrated;
    }
    if(snap.sectionDefaultPcts && typeof snap.sectionDefaultPcts === 'object'){
      PHASES.forEach(p => { if(typeof snap.sectionDefaultPcts[p.key] === 'number') sectionDefaultPcts[p.key] = snap.sectionDefaultPcts[p.key]; });
    }

    // Restore navigation context last, once savedSessions/etc. above are already in place, so the
    // screen-specific data a restored screen depends on (a saved session's id, an exercise's id)
    // can actually be checked against real, current data rather than trusted blindly.
    if(typeof snap.screen === 'string' && screens[snap.screen]){
      let restoredScreen = snap.screen;
      state.detailId = snap.detailId ?? null;
      state.pickingPhase = snap.pickingPhase ?? null;
      state.sectionFilter = snap.sectionFilter ?? null;
      state.quickFilterValue = snap.quickFilterValue ?? null;
      state.viewingSessionId = snap.viewingSessionId ?? null;
      state.fromBuild = !!snap.fromBuild;
      state.fromReview = !!snap.fromReview;
      state.fromSavedSessionId = snap.fromSavedSessionId ?? null;
      state.fromSavedSession = !!snap.fromSavedSession && state.savedSessions.some(s => s.id === state.fromSavedSessionId);
      state.editingSavedSessionId = (snap.editingSavedSessionId && state.savedSessions.some(s => s.id === snap.editingSavedSessionId)) ? snap.editingSavedSessionId : null;
      if(snap.reviewGroupOrder && typeof snap.reviewGroupOrder === 'object') state.reviewGroupOrder = snap.reviewGroupOrder;
      if(restoredScreen === 'detail' && !exById(state.detailId)) restoredScreen = 'home';
      if(restoredScreen === 'sessionDetail' && !state.savedSessions.some(s => s.id === state.viewingSessionId)) restoredScreen = 'sessions';
      state.screen = restoredScreen;
    }
  }catch(e){ /* corrupted/incompatible saved data (e.g. from an older version of this app) -- fall back to defaults rather than crash */ }
}

/* ============ ROUTER / RENDER ============ */
const screens = {
  home: renderHome,
  exercises: renderExercises,
  detail: renderDetail,
  practiceSetup: renderPracticeSetup,
  build: renderBuild,
  review: renderReview,
  sessions: renderSessions,
  sessionDetail: renderSessionDetail,
  settings: renderSettings,
};

function render(){
  const bottomnavEl = document.getElementById('bottomnav');
  if(!state.coachName){
    // Gate the whole app behind "who's coaching" -- no nav makes sense before that's known.
    document.getElementById('topbar').innerHTML = `<div class="brand"><div class="logo-badge">FT2</div><div class="brand-lockup"><div class="bl-line1">Fast Tigers</div><div class="bl-line2">Futbol Training</div></div></div>`;
    bottomnavEl.innerHTML = '';
    bottomnavEl.style.display = 'none';
    document.getElementById('content').innerHTML = renderWhoIsCoaching();
    renderOverlay();
    return;
  }
  bottomnavEl.style.display = '';
  renderTopbar();
  document.getElementById('content').innerHTML = screens[state.screen]();
  renderBottomnav();
  renderOverlay();
  saveAppStateToStorage();
}

initTheme();
loadAppStateFromStorage();
state.coachName = loadCoachName();
render();
syncExercisesFromSheet();
if(state.coachName) syncSessionsFromSheet();

/* Select all existing text the moment an editable field gets focus, so typing immediately
   replaces it instead of requiring a manual select-all or delete first. Delegated on #content
   (a stable element that persists across re-renders) so it covers every editable field, including
   ones added later, without wiring up each one individually. */
document.getElementById('content').addEventListener('focusin', (e) => {
  const el = e.target;
  if(el.isContentEditable){
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } else if(el.tagName === 'INPUT' && (el.type === 'text' || el.type === '')){
    el.select();
  }
});

</script>
