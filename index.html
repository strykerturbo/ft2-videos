/* ============ RECOMMENDATION ENGINE V1 (deterministic, rules-based) ============
   Powers Home > Custom Session only. Coach objective -> Focus Area -> metadata priorities -> candidate
   exercises -> score -> rank -> distribute across the FT2 phases -> progression + variety -> duration ->
   validate/repair -> recommended session. No LLM and no randomness: the same request and the same
   exercise repository always give the same session. It only READS the repository's own fields (Focus
   Areas, the four tag families and their 0-5 scores, Section, Difficulty, Age Group, Duration, Location)
   and never changes or invents exercise metadata. Pure logic: nothing here touches the DOM or `state`
   apart from reading which phases the coach has switched on. Every tunable number lives in the
   configuration objects directly below. */

// ---- configuration ----------------------------------------------------------------------------
const RECOMMENDATION_WEIGHTS = {   // the 100-point scale one exercise is scored on
  focusArea:30, technical:10, tactical:15, physical:5, cognitive:10,
  age:10, difficulty:5, sessionStyle:5, phase:5, location:3, variety:2,
};
const REC_FOCUS_POINTS = {primary:30, secondary:20};         // a Focus Areas match: selected one / a secondary one
const REC_TAG_MATCH = {strong:1.0, supporting:0.5};          // how much one matching tag counts
const REC_AGE_POINTS = {listed:10, withinRange:8, unspecified:7, oneOutside:4, outside:0};
const REC_MATCH_LABELS = {strongPct:75, goodPct:50};         // share of the points this focus could award
const REC_SIMILARITY_PENALTIES = {exactSame:-100, veryClose:-20, sameFormat:-5, sameTactical:-3, sameEngagement:-2, veryCloseNameOverlap:0.6};
// Standing practice rules from the coach: 10-15 min of a session are left free for breaks and transitions,
// and Athletic work stays near a quarter of the planned activity time (never below 20% or above 30%).
// Shuffle: a seed (1, 2, 3...) nudges every exercise's ranking by a small, repeatable amount so near-equal choices come out
// in a different order. Seed 0 (the default) adds nothing. The same seed always gives the same session.
const REC_SHUFFLE_JITTER = 16;
const REC_TIME_BUFFER = {min:10, max:15};
// The Activate part (Warmup + Athletic together) averages 25% of the planned activity time, give or take 5 minutes, and is
// built from exactly one Warmup exercise and at most two Athletic exercises.
const REC_ACTIVATE_SHARE = {ideal:0.25, toleranceMin:5};
// How much it costs (in score points per minute) when a phase's exercises run over / under the minutes allotted to it.
const REC_SLOT_PENALTY = {over:15, under:5};
const REC_PHASE_LIMITS = {warmup:1, athletic:2};   // most exercises the generator puts in a phase (others: 3)
// Where each style sends the time after Activate (relative shares of Duels / Rondos / SSGs / Scrimmage; Activate is pinned separately).
const REC_STYLE_RULES = {
  technical:{label:'More Technical', phasePcts:{duels:15, rondos:25, ssg:15, scrimmage:15},
    preferredDifficulty:[1,2], favorTechnicalTags:['Ball Mastery','Passing','Receiving','First Touch','Dribbling','Turning','Shooting'],
    favorFormats:['Individual','1v1','2v2','2v1','3v1','4v1']},
  balanced:{label:'Balanced', phasePcts:null, preferredDifficulty:[2], favorTechnicalTags:[], favorFormats:[]},
  game_based:{label:'More Game-Based', phasePcts:{duels:5, rondos:15, ssg:25, scrimmage:25},
    preferredDifficulty:[2,3], favorCognitiveTags:['Decision Making','Scanning','Spatial Awareness'],
    favorSections:['Rondos','SSGs','Scrimmage'], favorEngagement:['Team Competition','Scoring'], favorTactical:['Transition Attacking','Transition Defending']},
};
// How well a Section suits each FT2 phase (0-5), used for the phase component. Exercises are always filed in the
// phase their own Section belongs to, so this ranks within that, it never moves an exercise to another phase.
const REC_PHASE_FIT = {
  Activate:{Warmup:5, Athletic:5, Duels:4, Rondos:2, SSGs:1, Scrimmage:0},
  Develop:{Warmup:1, Athletic:2, Duels:4, Rondos:5, SSGs:5, Scrimmage:3},
  Apply:{Warmup:0, Athletic:1, Duels:2, Rondos:3, SSGs:5, Scrimmage:5},
  Scrimmage:{Warmup:0, Athletic:0, Duels:1, Rondos:2, SSGs:4, Scrimmage:5},
};
// The engine's four internal groups and the app phases (Sections) that belong to each. `group` is internal
// only (it keys REC_PHASE_FIT); what a coach reads is `label`, which is the real three phases -- Activate,
// Develop, Play -- since Small-Sided Games belong to Develop. `msgName` is how a note names a group.
const REC_PROGRESSION = [
  {group:'Activate', label:'Activate', msgName:'Activate', phaseKeys:['warmup','athletic'], intent:'Recognize'},
  {group:'Develop', label:'Develop', msgName:'Develop', phaseKeys:['duels','rondos'], intent:'Execute'},
  {group:'Apply', label:'Develop', msgName:'Small-Sided Games', phaseKeys:['ssg'], intent:'Apply'},
  {group:'Scrimmage', label:'Play', msgName:'Scrimmage', phaseKeys:['scrimmage'], intent:'Transfer'},
];
function recGroupForPhaseKey(key){ const g = REC_PROGRESSION.find(x => x.phaseKeys.includes(key)); return g ? g.group : 'Develop'; }

// The exercise tag families, and which dimension each repository tag belongs to.
const REC_TAG_FIELDS = {technical:'technicalTags', tactical:'tacticalTags', physical:'physicalTags', cognitive:'cognitiveTags'};
const REC_DIMS = {technical:{key:'technicalScore', label:'Technical'}, tactical:{key:'tacticalScore', label:'Tactical'}, physical:{key:'physicalScore', label:'Physical'}, cognitive:{key:'cognitiveScore', label:'Cognitive'}};
const REC_TAG_DIMENSION = {};
Object.entries({
  technical:['Passing','Receiving','First Touch','Dribbling','Ball Mastery','Turning','Shooting','Finishing','Shielding','Juggling','Volley'],
  tactical:['Possession','Support','Creating Space','Combination Play','Playing Forward','Penetration','Breaking Lines','Build Out','1v1 Attacking','1v1 Defending','Pressure','Cover','Compactness','Defending Space','Protecting Goal','Transition Attacking','Transition Defending','Switching Play','Width'],
  physical:['Speed','Acceleration/Deceleration','Agility','Reaction','Coordination','Balance','Endurance','Strength','Power'],
  cognitive:['Scanning','Decision Making','Spatial Awareness','Anticipation','Creativity','Communication','Problem Solving'],
}).forEach(([dim, tags]) => tags.forEach(t => { REC_TAG_DIMENSION[t.toLowerCase()] = dim; }));
// The repository spells it "Spacial Awareness"; the rules say "Spatial". Both are accepted everywhere.
function recNormTag(t){ return String(t || '').trim().toLowerCase().replace('spacial', 'spatial'); }
function recNormFocus(f){ return String(f || '').trim().toLowerCase().replace(/\s+and\s+/g, ' & '); }
function recRealTags(list){ return (list || []).map(recNormTag).filter(t => t && t !== 'none'); }

// The 8 controlled Focus Areas and the metadata that should earn extra relevance for each.
const REC_FOCUS_METADATA = {
  'Keep the Ball':{strong:['Possession','Support','Creating Space','Combination Play','Playing Forward'], supporting:['Passing','Receiving','First Touch','Scanning','Decision Making','Spatial Awareness'],
    concepts:['Possession','Support play','Passing and receiving','Awareness']},
  'Play Forward':{strong:['Playing Forward','Penetration','Breaking Lines','Creating Space','Combination Play','Build Out'], supporting:['Passing','Receiving','Support','Scanning','Decision Making','Spatial Awareness'],
    concepts:['Playing forward','Breaking lines','Creating space','Decision-making']},
  'Create & Score':{strong:['Penetration','Combination Play','1v1 Attacking','Shooting','Finishing','Creating Space'], supporting:['Decision Making','Scanning','Creativity','Speed','Acceleration/Deceleration'],
    concepts:['Creating chances','Combination play','Shooting and finishing','Attacking movement']},
  'Beat Players':{strong:['1v1 Attacking','Dribbling','Ball Mastery','Creating Space'], supporting:['Speed','Acceleration/Deceleration','Agility','Decision Making','Creativity'],
    concepts:['1v1 attacking','Dribbling','Close control','Change of speed']},
  'Defend Together':{strong:['1v1 Defending','Pressure','Cover','Compactness','Defending Space','Protecting Goal'], supporting:['Communication','Spatial Awareness','Decision Making','Anticipation'],
    concepts:['Pressure and cover','Compactness','Defending space','Communication']},
  'Win It Back':{strong:['Pressure','1v1 Defending','Transition Defending','Defending Space','Compactness'], supporting:['Reaction','Anticipation','Decision Making','Speed','Acceleration/Deceleration','Agility'],
    concepts:['Pressing','Winning the ball','Reacting to turnovers','Anticipation']},
  'Transition Quickly':{strong:['Transition Attacking','Transition Defending'], supporting:['Reaction','Decision Making','Anticipation','Speed','Acceleration/Deceleration','Agility','Spatial Awareness'],
    concepts:['Quick transitions','Reacting to turnovers','Decision-making','Speed of play']},
  'Master the Ball':{strong:['Ball Mastery','Dribbling','First Touch','Receiving','Turning','Passing','Shooting','Finishing'], supporting:['Coordination','Balance','Decision Making','Scanning'],
    concepts:['Close control','First touch','Dribbling','Technique']},
};
// ---- Focus Area -> metadata ---------------------------------------------------------------------
/* mapFocusAreaToMetadata(focusArea[, secondaryFocusAreas]): the strong/supporting tag sets the engine scores against.
   `focusArea` is one of the 8 repository Focus Areas. Returns null for anything else. */
function mapFocusAreaToMetadata(focusArea, secondaryFocusAreas){
  const key = Object.keys(REC_FOCUS_METADATA).find(k => recNormFocus(k) === recNormFocus(focusArea));
  if(!key) return null;
  const base = REC_FOCUS_METADATA[key];
  const strong = new Set(base.strong.map(recNormTag));
  const supporting = new Set(base.supporting.map(recNormTag));
  strong.forEach(t => supporting.delete(t));
  const dims = {};
  Object.keys(REC_TAG_FIELDS).forEach(d => { dims[d] = [...strong, ...supporting].some(t => REC_TAG_DIMENSION[t] === d); });
  return {focusArea:key, secondaryFocusAreas:(secondaryFocusAreas || []).map(recNormFocus), strong, supporting, dimensionsWithTags:dims, concepts:base.concepts};
}

// ---- component scores (each returns points on its slice of the 100) ------------------------------
function recFocusFit(ex, meta){
  const mine = (ex.focusAreas || []).map(recNormFocus);
  if(mine.includes(recNormFocus(meta.focusArea))) return REC_FOCUS_POINTS.primary;
  if(meta.secondaryFocusAreas.some(f => mine.includes(f))) return REC_FOCUS_POINTS.secondary;
  return 0;
}
/* One dimension (technical/tactical/physical/cognitive): the exercise's tags in that family decide RELEVANCE (a strong
   tag counts 1.0, a supporting tag 0.5, normalized so a pile of vaguely related tags can't beat a few highly relevant
   ones); its 0-5 score only says how strongly that dimension is DEVELOPED, so a high score without a relevant tag earns nothing. */
function recDimensionFit(ex, dim, meta){
  const W = RECOMMENDATION_WEIGHTS[dim];
  const tags = recRealTags(ex[REC_TAG_FIELDS[dim]]);
  const matched = [];
  const vals = tags.map(t => {
    const v = meta.strong.has(t) ? REC_TAG_MATCH.strong : meta.supporting.has(t) ? REC_TAG_MATCH.supporting : 0;
    if(v > 0) matched.push(t);
    return v;
  });
  const best = vals.length ? Math.max(...vals) : 0;
  const mean = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  const relevance = best === 0 ? 0 : 0.6*best + 0.4*mean;
  const raw = clampScore(ex[REC_DIMS[dim].key]);
  const strength = raw === null ? 0.5 : raw/5;
  return {points:W * relevance * (0.4 + 0.6*strength), matched, score:raw};
}
function calculateAgeFit(exercise, ageGroup){
  const P = REC_AGE_POINTS, age = parseInt(String(ageGroup).replace(/\D/g,''), 10);
  const listed = (exercise.ageGroups || []).map(a => parseInt(String(a).replace(/\D/g,''), 10)).filter(n => !isNaN(n));
  if(!listed.length || isNaN(age)) return {points:P.unspecified, status:'unspecified'};
  if(listed.includes(age)) return {points:P.listed, status:'listed'};
  const lo = Math.min(...listed), hi = Math.max(...listed);
  if(age > lo && age < hi) return {points:P.withinRange, status:'withinRange'};
  const gap = age < lo ? lo - age : age - hi;
  return gap === 1 ? {points:P.oneOutside, status:'oneOutside'} : {points:P.outside, status:'outside'};
}
function calculateDifficultyFit(exercise, context){
  const W = RECOMMENDATION_WEIGHTS.difficulty, pref = REC_STYLE_RULES[context.sessionStyle].preferredDifficulty;
  const d = exercise.difficulty;
  if(typeof d !== 'number') return W*0.6;
  if(pref.includes(d)) return W;
  const nearest = Math.min(...pref.map(p => Math.abs(p - d)));
  return nearest === 1 ? W*0.6 : W*0.2;
}
function calculateSessionStyleFit(exercise, sessionStyle){
  const W = RECOMMENDATION_WEIGHTS.sessionStyle, rule = REC_STYLE_RULES[sessionStyle];
  const sc = k => { const v = clampScore(exercise[REC_DIMS[k].key]); return v === null ? 0.5 : v/5; };
  const tags = {technical:recRealTags(exercise.technicalTags), tactical:recRealTags(exercise.tacticalTags), cognitive:recRealTags(exercise.cognitiveTags), engagement:recRealTags(exercise.engagementTags), format:(exercise.formatTags||[]).map(f => String(f).toLowerCase())};
  const has = (list, key) => (list || []).some(t => tags[key].includes(recNormTag(t)) || tags[key].includes(String(t).toLowerCase()));
  let v;
  if(sessionStyle === 'technical'){
    v = 0.4*sc('technical') + 0.3*(has(rule.favorTechnicalTags, 'technical') ? 1 : 0) + 0.3*(has(rule.favorFormats, 'format') ? 1 : 0);
  } else if(sessionStyle === 'game_based'){
    v = 0.25*sc('tactical') + 0.25*sc('cognitive') + 0.2*(has(rule.favorCognitiveTags, 'cognitive') ? 1 : 0)
      + 0.15*((rule.favorSections.includes(exercise.section) || has(rule.favorTactical, 'tactical')) ? 1 : 0) + 0.15*(has(rule.favorEngagement, 'engagement') ? 1 : 0);
  } else {
    const vals = Object.keys(REC_DIMS).map(sc);
    v = 0.5*(vals.reduce((a,b)=>a+b,0)/vals.length) + 0.5*(1 - (Math.max(...vals) - Math.min(...vals)));   // a mix, not a spike
  }
  return W * Math.max(0, Math.min(1, v));
}
function calculatePhaseFit(exercise, phase){
  const row = REC_PHASE_FIT[phase] || REC_PHASE_FIT.Develop;
  const v = row[exercise.section];
  return RECOMMENDATION_WEIGHTS.phase * ((typeof v === 'number' ? v : 2)/5);
}
function calculateLocationFit(exercise, location){
  const W = RECOMMENDATION_WEIGHTS.location, loc = String(exercise.location || 'both').toLowerCase();
  if(location === 'either') return W;
  return loc === location ? W : (loc === 'both' ? W*0.66 : 0);
}
function recLocationCompatible(exercise, location){
  const loc = String(exercise.location || 'both').toLowerCase();
  return !((location === 'outdoor' && loc === 'indoor') || (location === 'indoor' && loc === 'outdoor'));
}

/* scoreExerciseForObjective(exercise, context): the full 100-point score plus every component, for explaining.
   context = {meta, ageGroup, location, sessionStyle, phaseGroup}. Variety starts neutral here; the selection step
   adjusts it against what is already in the session. */
function scoreExerciseForObjective(exercise, context){
  const W = RECOMMENDATION_WEIGHTS, meta = context.meta;
  const fit = {};
  Object.keys(REC_TAG_FIELDS).forEach(d => { fit[d] = recDimensionFit(exercise, d, meta); });
  const age = calculateAgeFit(exercise, context.ageGroup);
  const d = {
    focusAreaMatch:recFocusFit(exercise, meta),
    technicalFit:fit.technical.points, tacticalFit:fit.tactical.points, physicalFit:fit.physical.points, cognitiveFit:fit.cognitive.points,
    ageFit:age.points, difficultyFit:calculateDifficultyFit(exercise, context), sessionStyleFit:calculateSessionStyleFit(exercise, context.sessionStyle),
    phaseFit:calculatePhaseFit(exercise, context.phaseGroup), locationFit:calculateLocationFit(exercise, context.location), varietyScore:W.variety,
  };
  const total = Object.keys(d).reduce((a,k) => a + d[k], 0);
  // what this Focus Area could award at most (a dimension with no relevant tags configured can't score), so the
  // Strong / Good / Fair label means the same thing for every Focus Area
  const attainable = W.focusArea + W.age + W.difficulty + W.sessionStyle + W.phase + W.location + W.variety
    + Object.keys(REC_TAG_FIELDS).reduce((a,k) => a + (meta.dimensionsWithTags[k] ? W[k] : 0), 0);
  const matchPct = Math.max(0, Math.min(100, total/attainable*100));
  const matched = [...new Set(Object.keys(fit).flatMap(k => fit[k].matched))];
  return {
    totalScore:Math.round(total*10)/10, matchPct:Math.round(matchPct), label: matchPct >= REC_MATCH_LABELS.strongPct ? 'Strong' : matchPct >= REC_MATCH_LABELS.goodPct ? 'Good' : 'Fair',
    ...Object.fromEntries(Object.entries(d).map(([k,v]) => [k, Math.round(v*10)/10])),
    ageStatus:age.status, matchedTags:matched, similarityPenalty:0,
    dimensionScores:{technical:fit.technical.score, tactical:fit.tactical.score, physical:fit.physical.score, cognitive:fit.cognitive.score},
    primaryFocusMatch:recFocusFit(exercise, meta) === REC_FOCUS_POINTS.primary,
  };
}
/* The eligible exercises (location-compatible; age is a ranking signal, not a filter), best match first. Ties break on
   name so the order never changes between runs. */
function recShuffleJitter(seed, id){
  if(!seed) return 0;
  let h = 2166136261;
  const str = seed + ':' + id;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return ((h % 10000)/10000 - 0.5) * 2 * REC_SHUFFLE_JITTER;
}
function rankExercisesForObjective(exercises, context){
  return exercises
    .map(ex => { const details = scoreExerciseForObjective(ex, context); details.rankScore = details.totalScore + recShuffleJitter(context.shuffleSeed, ex.id); return {ex, details}; })
    .sort((a,b) => b.details.rankScore - a.details.rankScore || String(a.ex.name).localeCompare(String(b.ex.name)));
}

// ---- similarity / variety ------------------------------------------------------------------------
function recFormatKey(ex){ return (ex.formatTags||[]).filter(t => t && String(t).toLowerCase() !== 'none').map(t => String(t).toLowerCase()).sort().join('|'); }
function recFirst(list){ const r = recRealTags(list); return r.length ? r[0] : ''; }
/* calculateSimilarity(a, b) -> {penalty, reasons}: a deterministic read of how alike two exercises are, from their
   Name, Section, Format, Focus Areas, Technical/Tactical and Engagement tags. */
const recSimilarityCache = new Map();   // pair -> result, for one generation (cleared when a request is understood)
function calculateSimilarity(a, b){
  const key = a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id;
  let r = recSimilarityCache.get(key);
  if(!r){ r = recComputeSimilarity(a, b); recSimilarityCache.set(key, r); }
  return r;
}
function recComputeSimilarity(a, b){
  const P = REC_SIMILARITY_PENALTIES;
  if(a.id === b.id) return {penalty:P.exactSame, reasons:['same exercise']};
  let penalty = 0; const reasons = [];
  const sameSection = a.section === b.section;
  const overlap = (x, y) => { const sy = new Set(recRealTags(y)); return recRealTags(x).filter(t => sy.has(t)).length; };
  const focusShared = (a.focusAreas||[]).map(recNormFocus).filter(f => (b.focusAreas||[]).map(recNormFocus).includes(f)).length;
  const veryClose = sameSection && (exNameSimilarity(a.name, b.name) >= P.veryCloseNameOverlap
    || (recFormatKey(a) && recFormatKey(a) === recFormatKey(b) && overlap(a.tacticalTags, b.tacticalTags) >= 2 && overlap(a.technicalTags, b.technicalTags) >= 1 && focusShared >= 1));
  if(veryClose){ penalty += P.veryClose; reasons.push('very similar'); }
  else if(recFormatKey(a) && recFormatKey(a) === recFormatKey(b)){ penalty += P.sameFormat; reasons.push('same format'); }
  if(recFirst(a.tacticalTags) && recFirst(a.tacticalTags) === recFirst(b.tacticalTags)){ penalty += P.sameTactical; reasons.push('same tactical emphasis'); }
  if(recFirst(a.engagementTags) && recFirst(a.engagementTags) === recFirst(b.engagementTags)){ penalty += P.sameEngagement; reasons.push('same engagement style'); }
  return {penalty, reasons};
}
function recVarietyPenalty(ex, others){
  return others.reduce((a, o) => a + calculateSimilarity(ex, o).penalty, 0);
}

// ---- time ----------------------------------------------------------------------------------------
/* Minutes for each phase, in whole 5-minute blocks. Activate (Warmup + Athletic) is pinned to its share of the planned time
   with exactly one 5-minute Warmup block and the rest Athletic; the remaining phases split what's left by the style's
   shares (or the coach's Settings split), each switched-on phase getting at least one block when the session is long enough. */
function allocatePhaseMinutes(duration, phases, pctMap){
  const units = Math.max(1, Math.round(duration/5));
  const wi = phases.findIndex(p => p.key === 'warmup'), ai = phases.findIndex(p => p.key === 'athletic');
  const alloc = phases.map(() => 0);
  let left = units;
  if(wi !== -1 || ai !== -1){
    const activate = Math.min(left, Math.max((wi !== -1 && ai !== -1) ? 2 : 1, Math.round(units * REC_ACTIVATE_SHARE.ideal)));
    if(wi !== -1){ alloc[wi] = 1; }
    if(ai !== -1){ alloc[ai] = activate - (wi !== -1 ? 1 : 0); }
    else if(wi !== -1){ alloc[wi] = activate; }
    left -= activate;
  }
  const rest = phases.map((p, i) => (i === wi || i === ai) ? -1 : i).filter(i => i !== -1);
  const pcts = rest.map(i => (pctMap && pctMap[phases[i].key] != null) ? pctMap[phases[i].key] : (sectionDefaultPcts[phases[i].key] || 0));
  const total = pcts.reduce((a,b)=>a+b,0) || 1;
  const live = pcts.map(v => v > 0);
  const base = live.map(l => l ? 1 : 0);
  const useBase = left >= base.reduce((a,b)=>a+b,0);
  const got = useBase ? base.slice() : rest.map(() => 0);
  left -= got.reduce((a,b)=>a+b,0);
  const ideal = pcts.map(v => v/total*(left + got.reduce((a,b)=>a+b,0)));
  while(left > 0){
    let best = -1, bestGap = -Infinity;
    rest.forEach((_, k) => { if(!live[k]) return; const gap = ideal[k] - got[k]; if(gap > bestGap + 1e-9){ bestGap = gap; best = k; } });
    if(best === -1) break;
    got[best]++; left--;
  }
  rest.forEach((i, k) => { alloc[i] = got[k]; });
  return alloc.map(u => u*5);
}
function recJoinAnd(items){
  if(items.length <= 1) return items.join('');
  if(items.length === 2) return items.join(' and ');
  return items.slice(0,-1).join(', ') + ' and ' + items[items.length-1];
}

// ---- selection -----------------------------------------------------------------------------------
/* selectExercisesForPhase(candidates, phase, context, selectedExercises): every sensible way to fill ONE phase -- nothing, or
   1-3 of its best-ranked candidates. `phase` = {key, label, section, minutes}; `candidates` = ranked entries {ex, details};
   `selectedExercises` = exercises already chosen for the session, which the variety penalties compare against. Each option
   carries its minutes and a value that rewards strong, varied exercises and a good fit to the phase's minutes. */
function selectExercisesForPhase(candidates, phase, context, selectedExercises){
  const dur = r => r.ex.duration || 10;
  const inPhase = candidates.filter(r => r.ex.section === phase.section);
  const pool = inPhase.slice(0, 8);
  const perLen = {};
  inPhase.forEach(r => { const d = dur(r); perLen[d] = perLen[d] || 0; if(perLen[d] < 2 && !pool.includes(r)) pool.push(r); if(perLen[d] < 2) perLen[d]++; });
  const chosenExercises = selectedExercises || [];
  // Value is per minute, not per exercise: an exercise earns its score for every 5 minutes it fills. Otherwise two weaker 5-minute
  // exercises would always out-score one stronger 10-minute exercise, and long exercises (10-minute warm-ups, 15-20 minute games)
  // would almost never be chosen.
  const UNIT = 5;
  const options = [{pick:[], sum:0, value: phase.minutes > 0 ? -(100 + 3*(sectionDefaultPcts[phase.key]||0)) * Math.max(1, phase.minutes/UNIT) : 0}];
  const add = pick => {
    const sum = pick.reduce((a,r)=>a+dur(r),0);
    let value = pick.reduce((a,r)=>a + r.details.rankScore*dur(r)/UNIT + recVarietyPenalty(r.ex, chosenExercises),0);
    for(let i = 0; i < pick.length; i++) for(let j = i+1; j < pick.length; j++) value += calculateSimilarity(pick[i].ex, pick[j].ex).penalty;
    // Warmup and Athletic share one Activate time budget (see chooseSessionPlan), so neither is held to its own slot: the
    // Warmup can be 5 or 10 minutes and Athletic takes up whatever is left of Activate.
    const sharesActivate = phase.key === 'warmup' || phase.key === 'athletic';
    if(!sharesActivate) value -= REC_SLOT_PENALTY.over*Math.max(0, sum - phase.minutes) + REC_SLOT_PENALTY.under*Math.max(0, phase.minutes - sum);
    value -= 12*(pick.length-1);
    const same = options.find(o => o.sum === sum && o.pick.length);
    if(!same) options.push({pick, sum, value});
    else if(value > same.value + 1e-9){ same.pick = pick; same.value = value; }
  };
  const maxPicks = REC_PHASE_LIMITS[phase.key] || 3;   // e.g. exactly one Warmup, at most two Athletic
  for(let i = 0; i < pool.length; i++){
    add([pool[i]]);
    if(maxPicks < 2) continue;
    for(let j = i+1; j < pool.length; j++){
      add([pool[i], pool[j]]);
      if(maxPicks < 3) continue;
      for(let k = j+1; k < pool.length; k++) add([pool[i], pool[j], pool[k]]);
    }
  }
  return options;
}
/* Picks one option per phase so the activities add up to between `floor` and `target` minutes with the best total, and
   optionally pins the Activate pair (Warmup + Athletic together) to its share of the planned time. Tiny dynamic program over whole minutes; ties
   prefer the longer plan, then the earlier option, so it is fully deterministic. */
function chooseSessionPlan(optionsPerPhase, floor, target, share){
  const fixed = share ? share.indices.filter(i => i !== -1) : [];
  let layer = new Map([[0, {value:0, picks:[]}]]);
  optionsPerPhase.forEach((options, pi) => {
    if(fixed.includes(pi)) return;
    const next = new Map();
    layer.forEach((st, total) => {
      options.forEach((opt, oi) => {
        const t = total + opt.sum;
        if(t > target) return;
        const v = st.value + opt.value;
        const cur = next.get(t);
        if(!cur || v > cur.value + 1e-9) next.set(t, {value:v, picks:[...st.picks, [pi, oi]]});
      });
    });
    layer = next;
  });
  // every way to fill the pinned phases together (Warmup x Athletic)
  let combos = [{sum:0, value:0, picks:[]}];
  fixed.forEach(pi => {
    const next = [];
    combos.forEach(c => optionsPerPhase[pi].forEach((o, oi) => next.push({sum:c.sum + o.sum, value:c.value + o.value, picks:[...c.picks, [pi, oi]]})));
    combos = next;
  });
  let best = null;
  combos.forEach(c => {
    layer.forEach((st, rest) => {
      const total = rest + c.sum;
      if(total > target) return;
      let score = st.value + c.value - (total >= floor ? 0 : 300*(floor - total));
      if(fixed.length){
        const dev = Math.abs(c.sum - share.ideal*total);                 // minutes away from the ideal Activate time
        score -= 300*Math.max(0, dev - share.toleranceMin) + 2*dev;
      }
      if(!best || score > best.score + 1e-9 || (Math.abs(score - best.score) < 1e-9 && total > best.total)) best = {score, total, picks:[...st.picks, ...c.picks]};
    });
  });
  const chosen = optionsPerPhase.map(() => 0);
  if(best) best.picks.forEach(([pi, oi]) => { chosen[pi] = oi; });
  return chosen;
}

// ---- profile, explanation, validation -------------------------------------------------------------
function recSessionProfile(session){
  return practiceTrainingProfile(session.phases.flatMap(p => p.items.map(i => ({duration:i.ex.duration||10, scores:i.ex}))));
}
function recProfileObject(session){
  const o = {}; recSessionProfile(session).forEach(p => { o[p.key.replace('Score','')] = p.score; }); return o;
}
function explainExerciseRecommendation(exercise, context, details){
  const focus = context.meta.focusArea;
  const lead = details.label === 'Strong' ? `Strong match for ${focus}` : details.label === 'Good' ? `Good fit for ${focus}` : `Best available fit in this phase for ${focus}`;
  const parts = [];
  if(details.primaryFocusMatch) parts.push(`is tagged ${focus}`);
  const tags = details.matchedTags.slice(0,3).map(t => t.replace('spatial','spatial'));
  if(tags.length) parts.push(`works on ${recJoinAnd(tags)}`);
  const strongDim = Object.keys(REC_DIMS).filter(k => typeof details.dimensionScores[k] === 'number' && details.dimensionScores[k] >= 4).slice(0,2).map(k => `${REC_DIMS[k].label} (${details.dimensionScores[k]}/5)`);
  if(strongDim.length) parts.push(`strongly trains ${recJoinAnd(strongDim)}`);
  if(!parts.length) return `${lead}. It has few direct links to this focus, so treat it as a placeholder you may want to swap.`;
  let s = `${lead} because it ${recJoinAnd(parts)}.`;
  if(details.ageStatus === 'listed') s += ` It's listed for ${context.ageGroup}.`;
  else if(details.ageStatus === 'withinRange' || details.ageStatus === 'unspecified') s += ` It should suit ${context.ageGroup}.`;
  else s += ` It isn't listed for ${context.ageGroup}, so check it suits your players.`;
  return s;
}
function explainSessionRecommendation(session, context){
  const present = REC_PROGRESSION.filter(g => session.phases.some(p => g.phaseKeys.includes(p.phase.key) && p.items.length));
  const tagCount = {};
  session.phases.forEach(p => p.items.forEach(i => i.details.matchedTags.forEach(t => { tagCount[t] = (tagCount[t]||0)+1; })));
  const top = Object.entries(tagCount).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,5).map(([t]) => t.replace(/\b\w/g, c => c.toUpperCase()));
  const prof = recProfileObject(session);
  const fmt = v => (typeof v === 'number' ? v.toFixed(1) : '–');
  const style = REC_STYLE_RULES[context.sessionStyle];
  return {
    steps:[
      {title:'Your objective', body:context.meta.focusArea, sub:context.focusDescriptor || ''},
      {title:'We matched exercises to', body:(top.length ? top : context.meta.concepts).join(' · ')},
      {title:'We ranked exercises by', body:`Objective fit · Age (${context.ageGroup}) · Difficulty · Session style (${style.label}) · Phase · Training balance`},
      {title:'We built progression', body:present.map(g => g.label).filter((l,i,a) => a.indexOf(l) === i).join(' → ')},
      {title:'We balanced the session', body:`Technical ${fmt(prof.technical)} · Tactical ${fmt(prof.tactical)} · Physical ${fmt(prof.physical)} · Cognitive ${fmt(prof.cognitive)}`},
      {title:'You make the final call', body:'Change, remove or reorder any exercise before you save'},
    ],
    whys:session.phases.flatMap(p => p.items.map(i => ({name:i.ex.name, label:i.details.label, why:i.why}))),
  };
}
/* validateGeneratedSession(session, context) -> {valid, hardFailures, issues}. Hard failures can never be shown to the
   coach; the others are quality issues that are repaired when possible and otherwise shown as notes. */
function validateGeneratedSession(session, context){
  const issues = [];
  const items = session.phases.flatMap(p => p.items);
  const hard = (code, text) => issues.push({key:code, hard:true, ok:false, text});
  const soft = (code, text) => issues.push({key:code, hard:false, ok:false, text});
  if(!items.length) hard('noExercises', 'No exercises could be selected for this request.');
  if(items.some(i => !recLocationCompatible(i.ex, context.location))) hard('location', 'An exercise does not suit the chosen location.');
  if(items.some(i => !session.phases.find(p => p.items.includes(i)) || i.ex.section !== session.phases.find(p => p.items.includes(i)).phase.section)) hard('phaseMismatch', 'An exercise is in the wrong phase.');
  const ids = items.map(i => i.ex.id);
  if(new Set(ids).size !== ids.length) hard('duplicate', 'The same exercise was selected twice.');
  const lo = Math.max(5, context.duration - REC_TIME_BUFFER.max), hi = context.duration - REC_TIME_BUFFER.min;
  if(session.totalMin < lo || session.totalMin > hi) soft('duration', `The activities add up to ${session.totalMin} min; aim for ${lo}–${hi} so a ${context.duration}-min session still has room for breaks.`);
  // phases
  const has = g => session.phases.some(p => g.phaseKeys.includes(p.phase.key) && p.items.length);
  const available = g => session.phases.some(p => g.phaseKeys.includes(p.phase.key) && p.hasCandidates);
  REC_PROGRESSION.forEach(g => {
    const required = g.group !== 'Scrimmage' || context.duration >= 75 || context.sessionStyle === 'game_based';
    if(required && !has(g) && g.phaseKeys.some(k => session.phases.some(p => p.phase.key === k))){
      soft('phase' + g.group, available(g) ? `There wasn't room for ${g.group === 'Scrimmage' ? 'a Scrimmage' : g.msgName} in a session this length once time is left for breaks.` : `Your library has no suitable exercise for ${g.msgName}.`);
    }
  });
  const withFocus = items.filter(i => i.details.primaryFocusMatch).length;
  if(items.length && withFocus === 0) soft('focus', `None of the exercises are tagged ${context.meta.focusArea} in your library.`);
  else if(items.length && withFocus/items.length < 0.4) soft('focusShare', `Only ${withFocus} of ${items.length} exercises are tagged ${context.meta.focusArea}; the rest support it.`);
  const offAge = items.filter(i => i.details.ageStatus === 'oneOutside' || i.details.ageStatus === 'outside').length;
  if(offAge) soft('age', `${offAge} exercise${offAge>1?'s':''} ${offAge>1?'aren\'t':'isn\'t'} listed for ${context.ageGroup} in your library — it was the best available fit.`);
  // variety
  let veryClosePairs = 0;
  for(let i = 0; i < items.length; i++) for(let j = i+1; j < items.length; j++) if(calculateSimilarity(items[i].ex, items[j].ex).penalty <= REC_SIMILARITY_PENALTIES.veryClose) veryClosePairs++;
  if(veryClosePairs) soft('variety', 'Some exercises are very similar — you may want more variety.');
  // progression: the game phases should not be easier than the activation phases
  const avgDiff = keys => { const xs = session.phases.filter(p => keys.includes(p.phase.key)).flatMap(p => p.items).map(i => i.ex.difficulty).filter(v => typeof v === 'number'); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
  const early = avgDiff(['warmup','athletic']), late = avgDiff(['ssg','scrimmage']);
  if(early !== null && late !== null && late < early - 0.5) soft('progression', 'The later game phases are easier than the early phases — consider swapping an exercise so the session builds up.');
  // Activate (Warmup + Athletic) share, and the Warmup / Athletic exercise limits
  const act = session.phases.filter(p => p.phase.key === 'warmup' || p.phase.key === 'athletic');
  if(act.length && session.totalMin > 0){
    const actMin = act.reduce((a,p) => a + p.totalMin, 0), want = REC_ACTIVATE_SHARE.ideal*session.totalMin;
    if(Math.abs(actMin - want) > REC_ACTIVATE_SHARE.toleranceMin + 0.01) soft('activate', `The Activate part is ${actMin} min (about ${Math.round(actMin/session.totalMin*100)}% of the session); aim for roughly ${Math.round(REC_ACTIVATE_SHARE.ideal*100)}%.`);
    const w = session.phases.find(p => p.phase.key === 'warmup'), a = session.phases.find(p => p.phase.key === 'athletic');
    if((w && w.items.length > REC_PHASE_LIMITS.warmup) || (a && a.items.length > REC_PHASE_LIMITS.athletic)) soft('activateCount', 'The Activate part has more Warmup or Athletic exercises than usual.');
  }
  // training balance against the requested style
  const prof = recProfileObject(session), vals = Object.values(prof).filter(v => typeof v === 'number');
  if(vals.length === 4){
    const top = Object.keys(prof).sort((a,b) => prof[b]-prof[a])[0];
    if(context.sessionStyle === 'balanced' && (Math.max(...vals) - Math.min(...vals) > 3 || Math.min(...vals) < 1)) soft('balance', 'This session leans heavily toward one training area for a Balanced session.');
    if(context.sessionStyle === 'technical' && top !== 'technical' && prof.technical < prof.tactical) soft('balance', 'This session is more tactical than technical for a More Technical session.');
    if(context.sessionStyle === 'game_based' && top === 'technical' && prof.technical - Math.max(prof.tactical, prof.cognitive) > 1) soft('balance', 'This session is more technical than game-based.');
  }
  return {valid:!issues.some(i => i.hard), hardFailures:issues.filter(i => i.hard), issues};
}

// ---- assembly: the five stages the coach watches ---------------------------------------------------
// 1. Understand the request: Focus Area -> metadata, style, age, location, time.
function genUnderstandRequest(g){
  const cfg = g.cfg;
  recSimilarityCache.clear();
  const area = csFocusArea(cfg.focusArea);
  const meta = area ? mapFocusAreaToMetadata(area.title, []) : null;
  if(!meta) throw new Error('That focus area is not available.');
  if(!REC_STYLE_RULES[cfg.sessionStyle]) throw new Error('Session style is not recognised.');
  if(!/^U\d+$/.test(String(cfg.ageGroup))) throw new Error('Age group is not recognised.');
  const phases = orderedPhases().filter(p => state.enabledPhaseKeys.has(p.key));
  if(!phases.length) throw new Error('No session phases are turned on.');
  g.context = {cfg, meta, ageGroup:cfg.ageGroup, duration:cfg.duration, location:cfg.location, sessionStyle:cfg.sessionStyle, phases,
    focusLabel:area.title, focusDescriptor:area.descriptor, shuffleSeed:cfg.shuffleSeed || 0};
}
// 2. Find candidates: the repository's exercises that can be used here (a known Section, a compatible location).
function genFindCandidates(g){
  const sections = new Set(PHASES.map(p => p.section));
  g.candidates = EXERCISES.filter(ex => sections.has(ex.section) && recLocationCompatible(ex, g.context.location));
  if(!g.candidates.length) throw new Error('No exercises in your library fit this request.');
}
// 3. Score and rank every candidate for the phase it belongs in.
function genRankExercises(g){
  g.ranked = {};
  g.context.phases.forEach(ph => {
    const phaseGroup = recGroupForPhaseKey(ph.key);
    g.ranked[ph.key] = rankExercisesForObjective(g.candidates.filter(ex => ex.section === ph.section), {...g.context, phaseGroup});
  });
}
// 4. Build: split the time across phases, choose each phase's exercises together, then improve variety across the whole session.
/* assembleRecommendedSession(rankedByPhase, context) -> the proposed session (not yet validated). */
function assembleRecommendedSession(rankedByPhase, context){
  const phases = context.phases;
  const target = Math.max(5, context.duration - REC_TIME_BUFFER.min);   // minutes of actual activities to plan
  const floor = Math.max(5, context.duration - REC_TIME_BUFFER.max);    // fewest we accept
  const minutes = allocatePhaseMinutes(target, phases, REC_STYLE_RULES[context.sessionStyle].phasePcts);
  const phaseObjs = phases.map((ph, i) => ({...ph, minutes:minutes[i]}));
  let optionsByPhase = phaseObjs.map(ph => selectExercisesForPhase(rankedByPhase[ph.key], ph, context, []));
  const activateIdx = [phases.findIndex(p => p.key === 'warmup'), phases.findIndex(p => p.key === 'athletic')];
  const chosen = chooseSessionPlan(optionsByPhase, floor, target, activateIdx.some(i => i !== -1) ? {indices:activateIdx, ...REC_ACTIVATE_SHARE} : null);
  // variety sweeps: re-pick each phase's exercises, now knowing the others, without changing its minutes
  for(let sweep = 0; sweep < 2; sweep++){
    phaseObjs.forEach((ph, i) => {
      const others = phaseObjs.flatMap((p, j) => j === i ? [] : optionsByPhase[j][chosen[j]].pick.map(r => r.ex));
      const opts = selectExercisesForPhase(rankedByPhase[ph.key], ph, context, others);
      const sum = optionsByPhase[i][chosen[i]].sum;
      let bestIdx = -1;
      opts.forEach((o, k) => { if(o.sum === sum && (bestIdx === -1 || o.value > opts[bestIdx].value + 1e-9)) bestIdx = k; });
      if(bestIdx !== -1){ optionsByPhase[i] = opts; chosen[i] = bestIdx; }
    });
  }
  const session = {
    cfg:context.cfg, focusLabel:context.focusLabel, repositoryFocusArea:context.meta.focusArea, label:context.cfg.title,
    ctx:{ageGroup:context.ageGroup, duration:context.duration, location:context.cfg.location, sessionStyle:context.sessionStyle},
    phases:phaseObjs.map((ph, i) => ({
      phase:phases[i], minutes:ph.minutes, hasCandidates:rankedByPhase[ph.key].length > 0, note:'',
      items:optionsByPhase[i][chosen[i]].pick.map(r => ({ex:r.ex, score:r.details.totalScore, label:r.details.label, details:r.details})),
    })),
  };
  return session;
}
// 4. Build stage
function genBuildSession(g){ g.session = assembleRecommendedSession(g.ranked, g.context); }
function recRefreshSession(session){
  session.phases.forEach(p => { p.totalMin = p.items.reduce((b,i) => b + (i.ex.duration||10), 0); });
  session.totalMin = session.phases.reduce((a,p) => a + p.totalMin, 0);
}
/* Repairs what validateGeneratedSession() found by swapping in the next-best candidates: always the SAME Section and the
   SAME length as the exercise it replaces, so the timing, the Athletic share and the phase structure are never disturbed. */
function repairGeneratedSession(g, issues){
  const {context, session} = g;
  const used = new Set(session.phases.flatMap(p => p.items.map(i => i.ex.id)));
  const itemsNow = () => session.phases.flatMap(p => p.items);
  const swap = (entry, item, accept) => {
    const others = itemsNow().filter(i => i !== item).map(i => i.ex);
    const alts = (g.ranked[entry.phase.key] || []).filter(r => !used.has(r.ex.id) && r.ex.section === item.ex.section && (r.ex.duration||10) === (item.ex.duration||10) && accept(r, item));
    if(!alts.length) return false;
    alts.sort((a,b) => (b.details.rankScore + recVarietyPenalty(b.ex, others)) - (a.details.rankScore + recVarietyPenalty(a.ex, others)) || String(a.ex.name).localeCompare(String(b.ex.name)));
    const alt = alts[0];
    used.delete(item.ex.id); used.add(alt.ex.id);
    Object.assign(item, {ex:alt.ex, score:alt.details.totalScore, label:alt.details.label, details:alt.details});
    return true;
  };
  const codes = new Set(issues.map(i => i.key));
  // age: replace exercises that are one or more ages outside their listed range
  if(codes.has('age')) session.phases.forEach(entry => entry.items.forEach(item => {
    if(item.details.ageStatus === 'oneOutside' || item.details.ageStatus === 'outside') swap(entry, item, r => r.details.ageStatus !== 'oneOutside' && r.details.ageStatus !== 'outside' && r.details.totalScore >= item.details.totalScore - 30);
  }));
  // focus: make sure the Focus Area is properly represented
  if(codes.has('focus') || codes.has('focusShare')){
    for(let guard = 0; guard < 4; guard++){
      const items = itemsNow();
      if(items.filter(i => i.details.primaryFocusMatch).length/items.length >= 0.4) break;
      let did = false;
      session.phases.forEach(entry => entry.items.filter(i => !i.details.primaryFocusMatch).sort((a,b) => a.details.totalScore - b.details.totalScore).forEach(item => {
        if(!did) did = swap(entry, item, r => r.details.primaryFocusMatch && r.details.totalScore >= item.details.totalScore - 25);
      }));
      if(!did) break;
    }
  }
  // variety: replace the weaker half of the most alike pair
  if(codes.has('variety')){
    for(let guard = 0; guard < 4; guard++){
      const items = itemsNow(); let worst = null;
      for(let i = 0; i < items.length; i++) for(let j = i+1; j < items.length; j++){
        const p = calculateSimilarity(items[i].ex, items[j].ex).penalty;
        if(p <= REC_SIMILARITY_PENALTIES.veryClose && (!worst || p < worst.p)) worst = {p, a:items[i], b:items[j]};
      }
      if(!worst) break;
      const weaker = worst.a.details.totalScore <= worst.b.details.totalScore ? worst.a : worst.b;
      const entry = session.phases.find(e => e.items.includes(weaker));
      const keep = weaker === worst.a ? worst.b : worst.a;
      if(!swap(entry, weaker, r => calculateSimilarity(r.ex, keep.ex).penalty > REC_SIMILARITY_PENALTIES.veryClose && r.details.totalScore >= weaker.details.totalScore - 30)) break;
    }
  }
  // balance: move toward the requested style by swapping one exercise at a time
  if(codes.has('balance')){
    const goal = () => {
      const p = recProfileObject(session); if(Object.values(p).some(v => typeof v !== 'number')) return 0;
      if(context.sessionStyle === 'technical') return p.technical - p.tactical;
      if(context.sessionStyle === 'game_based') return (p.tactical + p.cognitive)/2 - p.technical;
      const vs = Object.values(p); return -(Math.max(...vs) - Math.min(...vs));
    };
    for(let guard = 0; guard < 4; guard++){
      const before = goal(); let did = false;
      outer: for(const entry of session.phases) for(const item of entry.items.slice().sort((a,b) => a.details.totalScore - b.details.totalScore)){
        const old = {ex:item.ex, score:item.score, label:item.label, details:item.details}, oldId = item.ex.id;
        if(swap(entry, item, r => r.details.totalScore >= item.details.totalScore - 20)){
          if(goal() > before + 0.05){ did = true; break outer; }
          used.delete(item.ex.id); used.add(oldId); Object.assign(item, old);   // didn't help -- put it back
        }
      }
      if(!did) break;
    }
  }
  recRefreshSession(session);
}
// 5. Finalize: validate, repair with next-best candidates, re-validate, then explain. Never returns an invalid session.
function genFinalizeSession(g){
  const {context, session} = g;
  recRefreshSession(session);
  let result = validateGeneratedSession(session, context);
  for(let attempt = 0; attempt < 3 && result.issues.length; attempt++){
    repairGeneratedSession(g, result.issues);
    result = validateGeneratedSession(session, context);
  }
  if(!result.valid) throw new Error(result.hardFailures[0].text);
  session.phases.forEach(p => p.items.forEach(i => { i.why = explainExerciseRecommendation(i.ex, context, i.details); }));
  session.validation = result;
  session.checks = result.issues;          // whatever couldn't be fixed is shown to the coach as a note
  session.profile = recSessionProfile(session);
  session.explanation = explainSessionRecommendation(session, context);
}
const GEN_STAGES = [genUnderstandRequest, genFindCandidates, genRankExercises, genBuildSession, genFinalizeSession];
/* Runs all five stages in one go and returns the recommended session (used by tests; the Step 3 screen runs the same
   stages one at a time so the coach can watch them complete). */
function generateCustomSession(cfg){
  const g = {cfg};
  GEN_STAGES.forEach(fn => fn(g));
  return g.session;
}

/* ============ WORKFLOW NAVIGATION (2026-10) ============
   Session Setup -> Build Session -> Session Review is the app's one primary workflow, with Find
   Exercises and Exercise Detail nested one level under Build Session (not peer stages). Every
   screen in it gets the same shape: a small, visually-subordinate "Back to X" link naming where
   it returns to, the literal screen name as the Page Title (never a coach-entered name -- that
   stays page content below it), and identical "Next: X ->" wording on every forward step so the
   coach's place in the workflow is always legible. Find Exercises/Exercise Detail only ever get
   the back link, never a bottom "Next" CTA -- they're a subtask, not a stage to advance past. */
function navBackRowHtml(label, onclick){
  return `<button class="nav-back-link" onclick="${onclick}">${ICONS.back}<span>Back to ${escHtml(label)}</span></button>`;
}
function navPageTitleHtml(title, subtitle, step){
  return `<h1 class="nav-page-title"${step ? ` data-step="${escAttr(step)}"` : ''}>${escHtml(title).replace(/\n/g, '<br>')}</h1>${subtitle ? `<div class="nav-page-sub">${escHtml(subtitle)}</div>` : ''}`;
}
function navNextCtaHtml(label, onclick, disabled){
  return `<button class="btn btn-primary" ${disabled?'disabled':''} onclick="${onclick}"><span>Next: ${escHtml(label)}</span>${ICONS.chevronRight}</button>`;
}
/* Fills #workflowFooter (docked directly above the permanent bottom nav -- see #bottomDock)
   with whichever forward CTA belongs to the current screen, or '' on every screen that isn't
   part of this one workflow. render() calls this on every render and toggles #shell's
   has-workflow-cta class on the result, which is what drives #content's extra scroll clearance
   (see its CSS) -- so a screen gaining/losing its CTA (e.g. Build Session's count hitting 0)
   automatically keeps that clearance in sync without any extra bookkeeping. */
function workflowFooterHtml(){
  if(state.screen === 'practiceSetup'){
    return navNextCtaHtml('Build Session', 'startFromSetup()');
  }
  if(state.screen === 'build'){
    const {count} = currentTotalMinutes();
    return navNextCtaHtml('Session Review', 'goToReviewFromBuild()', count===0);
  }
  if(state.screen === 'quickStartCustom'){
    return navNextCtaHtml('Session Setup', 'csGoToSetup()', !csFocusArea(state.csFocusAreaId));
  }
  if(state.screen === 'customSessionSetup' && csFocusArea(state.csFocusAreaId)){
    return navNextCtaHtml('Generate Session', 'csGoToGenerate()');
  }
  if((state.screen === 'review' || state.screen === 'customSessionReview') && currentTotalMinutes().count > 0){
    // No CTA at all for the count===0 empty-review state -- that screen already shows its own
    // "Build a Session" redirect as regular content, and there's nothing to save yet.
    return `<button class="btn btn-primary" onclick="completeSession()">Save Session</button>`;
  }
  return '';
}

/* ============ CUSTOM SESSION GENERATOR (4 steps) ============
   Home > Build a Custom Session is its own workflow, deliberately separate from Start New Session
   (which keeps its own Session Setup > Build > Review and is untouched by any of this):
     1 What do you want to work on?  ->  2 Session Setup  ->  3 Generating  ->  4 Your Session
     -> "Build This Session" hands the result to the existing Build Session as an ordinary draft.
   It has its own step state (customSessionStep) -- never the Start New Session workflow's.
   The route name quickStartCustom is the existing Custom Session entry point and is now Step 1. */
const FOCUS_AREAS = [
  {id:'keep_the_ball', title:'Keep the Ball', descriptor:'Possession • passing • support', icon:'ballOutline', bg:'var(--sky-dim)'},
  {id:'play_forward', title:'Play Forward', descriptor:'Penetrate • break lines • progress', icon:'arrowRight', bg:'var(--mint-dim)'},
  {id:'create_and_score', title:'Create & Score', descriptor:'Chances • combination • finishing', icon:'target', bg:'var(--cone-dim)'},
  {id:'beat_players', title:'Beat Players', descriptor:'1v1 attacking • dribbling', icon:'swords', bg:'var(--claret-dim)'},
  {id:'defend_together', title:'Defend Together', descriptor:'Pressure • cover • compactness', icon:'shield', bg:'var(--set-purple-dim)'},
  {id:'win_it_back', title:'Win It Back', descriptor:'Pressing • tackling • regaining', icon:'circleArrows', bg:'var(--turf-dim)'},
  {id:'transition_quickly', title:'Transition Quickly', descriptor:'React • attack • defend', icon:'bolt', bg:'var(--sky-dim)'},
  {id:'master_the_ball', title:'Master the Ball', descriptor:'Dribbling • first touch • technique', icon:'ball', bg:'var(--mint-dim)'},
];
// Accepts the id or the exact repository Focus Area name.
function csFocusArea(idOrTitle){ return FOCUS_AREAS.find(a => a.id === idOrTitle || a.title === idOrTitle) || null; }
// Entering from Home keeps any earlier in-progress choice.
function startCustomSession(){
  state.csFocusAreaId = null;      // always start with nothing chosen -- the coach picks, then it highlights
  state.customSessionStep = 1;
  nav('quickStartCustom');
}
function csSelectFocus(focusId){
  state.csFocusAreaId = focusId;
  render();
}
function csGoToSetup(){
  if(!csFocusArea(state.csFocusAreaId)) return;
  csInitSetup();
  state.customSessionStep = 2;
  nav('customSessionSetup');   // nothing is saved here -- this is still an in-progress session
}
function csBackToStep1(){
  state.customSessionStep = 1;
  nav('quickStartCustom');     // Step 2's values stay exactly as they are
}
function csBackToStep2(){
  cancelCustomGeneration();
  state.customSessionStep = 2;
  nav('customSessionSetup');
}

/* Step 2 (Session Setup) values live in the cs* fields -- never the Start New Session setup* fields. */
const CS_DURATIONS = [60, 75, 90];
const CS_LOCATIONS = [['outdoor','Outdoor'], ['indoor','Indoor'], ['either','Either']];
const CS_AGE_GROUPS = ['U8','U9','U10','U11','U12'];
const CS_STYLES = [['technical','More Technical'], ['balanced','Balanced'], ['game_based','More Game-Based']];
const CS_DEFAULT_AGE = 'U10';
function csAutoTitle(){
  const f = csFocusArea(state.csFocusAreaId);
  return f ? `${f.title} Session` : 'Custom Session';
}
// Fills any Step 2 value the coach hasn't set yet with its default; keeps the auto title current until they edit it.
function csInitSetup(){
  if(!state.csDate) state.csDate = todayISODate();
  const sc = scheduleFor(state.csDate);
  if(!state.csStartTime) state.csStartTime = (sc && sc.start) || state.practiceStartTime || '17:00';
  if(!CS_DURATIONS.includes(state.csDuration)) state.csDuration = (sc && CS_DURATIONS.includes(sc.duration)) ? sc.duration : (CS_DURATIONS.includes(state.targetDuration) ? state.targetDuration : 75);
  if(!CS_LOCATIONS.some(l => l[0] === state.csLocation)) state.csLocation = sc ? sc.location : ((state.practiceLocation === 'indoor') ? 'indoor' : 'outdoor');
  if(!CS_AGE_GROUPS.includes(state.csAgeGroup)) state.csAgeGroup = CS_DEFAULT_AGE;
  if(!CS_STYLES.some(st => st[0] === state.csSessionStyle)) state.csSessionStyle = 'balanced';
  if(!state.csTitleEdited || !String(state.csTitle||'').trim()){ state.csTitle = csAutoTitle(); state.csTitleEdited = false; }
}
/* Everything the generator (Steps 3-4) needs, in one place. */
function customSessionConfig(){
  csInitSetup();
  return {
    focusArea: state.csFocusAreaId,
    title: String(state.csTitle||'').trim() || csAutoTitle(),
    date: state.csDate,
    startTime: state.csStartTime,
    duration: state.csDuration,
    location: state.csLocation,
    ageGroup: state.csAgeGroup,
    sessionStyle: state.csSessionStyle,
  };
}
function setCsTitle(v){ state.csTitle = v; }   // no re-render while typing
function commitCsTitle(el){
  // No re-render here: a blur caused by tapping the bottom CTA must not swap the button out from under the tap.
  const t = String(el.value||'').trim();
  if(!t || t === csAutoTitle()){ state.csTitleEdited = false; state.csTitle = csAutoTitle(); el.value = state.csTitle; }
  else { state.csTitleEdited = true; state.csTitle = t; }
}
function setCsDate(v){
  if(v){
    state.csDate = v;
    const sc = scheduleFor(v), t = state.csTouched || {};
    if(sc){
      if(!t.start) state.csStartTime = sc.start;
      if(!t.dur && CS_DURATIONS.includes(sc.duration)) state.csDuration = sc.duration;
      if(!t.loc) state.csLocation = sc.location;
    }
  }
  render();
}
function setCsStartTime(v){ if(v){ state.csStartTime = v; (state.csTouched = state.csTouched || {}).start = true; } render(); }
function setCsDuration(v){ state.csDuration = v; (state.csTouched = state.csTouched || {}).dur = true; render(); }
function setCsLocation(v){ state.csLocation = v; (state.csTouched = state.csTouched || {}).loc = true; render(); }
function setCsAgeGroup(v){ state.csAgeGroup = v; render(); }
function setCsSessionStyle(v){ state.csSessionStyle = v; render(); }
function csGoToGenerate(){
  if(!csFocusArea(state.csFocusAreaId)){ csBackToStep1(); return; }
  csInitSetup();
  const cfg = customSessionConfig();       // blank title falls back to the auto title
  state.csTitle = cfg.title;
  // Step 4 is a Session Review of the live draft, so generating replaces whatever draft is there --
  // ask first unless that draft is exactly the previous Custom Session result, untouched since it was generated
  // (any exercise the coach added, removed, swapped or reordered since counts as their work).
  if(currentTotalMinutes().count > 0 && !csDraftUntouched()){ state.confirmGenerateOpen = true; renderOverlay(); return; }
  runCustomGeneration();
}
/* Shuffle: ask the engine for a different suggestion with the same settings (the next shuffle seed), keeping the coach's
   session title. Asks first if the coach has changed the generated session, since shuffling replaces those changes. */
function csShuffle(){
  if(!state.csReviewCfg) return;
  if(currentTotalMinutes().count > 0 && !csDraftUntouched()){ state.confirmShuffleOpen = true; renderOverlay(); return; }
  doCsShuffle();
}
function cancelShuffleModal(){ state.confirmShuffleOpen = false; renderOverlay(); }
function confirmShuffle(){ state.confirmShuffleOpen = false; renderOverlay(); doCsShuffle(); }
function doCsShuffle(){
  const base = state.csReviewCfg;
  if(!base) return;
  const before = csDraftSignature();
  let seed = base.shuffleSeed || 0;
  for(let tries = 0; tries < 6; tries++){
    seed++;
    try{
      const session = generateCustomSession({...base, shuffleSeed:seed, title:(state.sessionName || '').trim() || base.title});
      applyGeneratedSessionToDraft(session);
      if(csDraftSignature() !== before){ showToast('Shuffled — here\'s a different suggestion'); return; }
    }catch(err){ break; }
  }
  showToast('Couldn\'t find a different session for these settings');
}
function toggleCsHow(){ state.csHowOpen = !state.csHowOpen; render(); }
function csDraftSignature(){
  return JSON.stringify([PHASES.map(p => state.phaseData[p.key]), state.extraSections.map(s => s.exercises)]);
}
function csDraftUntouched(){ return !!(state.csDraftGenerated && state.csGeneratedSig && state.csGeneratedSig === csDraftSignature()); }
function cancelGenerateModal(){ state.confirmGenerateOpen = false; renderOverlay(); }
function confirmGenerate(){ state.confirmGenerateOpen = false; renderOverlay(); runCustomGeneration(); }
/* Loads a generated session into the live draft so Step 4 can be the normal Session Review of it
   (same rows, remove/reorder, time breakdown, profile and Save Session). Nothing is saved yet. */
function applyGeneratedSessionToDraft(session){
  resetBuilderDraft();
  PHASES.forEach(ph => { state.phaseData[ph.key] = []; });
  session.phases.forEach(entry => {
    entry.items.forEach(i => {
      // always by the exercise's own Section from the Sheet (the phase it was generated for already matches)
      const key = guessPhaseForSection(i.ex.section) || entry.phase.key;
      if(!state.phaseData[key].includes(i.ex.id)) state.phaseData[key].push(i.ex.id);
      state.enabledPhaseKeys.add(key);
    });
  });
  const cfg = session.cfg;
  state.targetDuration = cfg.duration;
  if(cfg.location === 'indoor' || cfg.location === 'outdoor') state.practiceLocation = cfg.location;   // "Either" keeps the app's current default
  state.sessionName = cfg.title;
  if(cfg.date) state.practiceDate = cfg.date;
  if(cfg.startTime) state.practiceStartTime = cfg.startTime;
  state.csReviewCfg = {...cfg};
  state.csDraftGenerated = true;
  state.csGeneratedSig = csDraftSignature();
  state.csReviewNotes = (session.checks || []).filter(c => !c.ok && c.text).map(c => c.text);
  state.csReviewExplain = session.explanation || null;
  state.csHowOpen = false;
  state.csPlannedByPhase = {};
  session.phases.forEach(entry => { if(entry.items.length) state.csPlannedByPhase[entry.phase.key] = entry.totalMin; });
}

/* ---- Step 3: the Generating Session screen runs the engine's five real stages (see GEN_STAGES) one at a
   time, repainting between them so each checkmark appears as that stage actually finishes. ---- */
const GEN_MIN_DISPLAY_MS = 3000;   // Step 3 is always shown for at least this long, even if the engine is instant
const GEN_FINAL_HOLD_MS = 300;     // after the last check lands, so the coach sees all five before Step 4 opens
const GEN_STAGE_INFO = [
  {title:'Understanding your request', sub:'Analyzing your objective, focus area, age group, session style, duration, and location.'},
  {title:'Finding the best exercises', sub:'Searching the FT2 exercise library for the best matches.'},
  {title:'Scoring & ranking exercises', sub:'Evaluating exercises for objective fit, age group, session style, and session balance.'},
  {title:'Building your session', sub:'Selecting and distributing exercises across FT2 phases.'},
  {title:'Finalizing your session', sub:'Putting the finishing touches on your personalized session.'},
];
let customGenRun = 0;   // bumped whenever a run starts or is cancelled, so a stale run can never navigate
function customGenWait(ms){ return new Promise(r => setTimeout(r, ms)); }
function customGenIdle(){ return {status:'idle', currentStage:0, completedStages:[], startedAt:null, completedAt:null, generatedSession:null, error:null}; }
async function runCustomGeneration(){
  const run = ++customGenRun;
  const cfg = customSessionConfig();
  const gen = state.customGeneration = {...customGenIdle(), status:'generating', currentStage:1, startedAt:Date.now()};
  state.customSessionStep = 3;
  nav('customSessionGenerating');
  const alive = () => run === customGenRun && state.screen === 'customSessionGenerating';
  const sliceMs = GEN_MIN_DISPLAY_MS / GEN_STAGES.length;   // each stage stays visible long enough to read when the engine is fast
  const g = {cfg};
  try{
    for(let i = 0; i < GEN_STAGES.length; i++){
      gen.currentStage = i + 1;
      render();
      const t0 = Date.now();
      await customGenWait(30);                 // let the active state paint before the stage's work begins
      if(!alive()) return;
      GEN_STAGES[i](g);                        // the real work for this stage
      const spent = Date.now() - t0;
      if(spent < sliceMs) await customGenWait(sliceMs - spent);
      if(!alive()) return;
      gen.completedStages.push(i + 1);
      gen.currentStage = i + 2;
      render();
    }
    const elapsed = Date.now() - gen.startedAt;
    await customGenWait(Math.max(GEN_FINAL_HOLD_MS, GEN_MIN_DISPLAY_MS - elapsed));
    if(!alive()) return;
    gen.status = 'complete';
    gen.completedAt = Date.now();
    gen.generatedSession = g.session;
    applyGeneratedSessionToDraft(g.session);    // Step 4 only ever opens with a finished session already loaded
    state.customSessionStep = 4;
    nav('customSessionReview');
  }catch(err){
    if(run !== customGenRun) return;
    gen.status = 'error';
    gen.error = String((err && err.message) || err);
    render();                                   // the coach's Step 1 and 2 choices are untouched, so Try Again just re-runs
  }
}
function retryCustomGeneration(){ runCustomGeneration(); }
function cancelCustomGeneration(){ customGenRun++; state.customGeneration = customGenIdle(); }

function renderCustomSessionSetup(){
  const f = csFocusArea(state.csFocusAreaId);

  csInitSetup();

  const titleCtl = `<input class="su-title-input" type="text" placeholder="Name this session" value="${escAttr(state.csTitle)}" oninput="setCsTitle(this.value)" onblur="commitCsTitle(this)" aria-label="Session title" autocomplete="off">`;
  const dateCtl = `
    <label class="su-date-field">
      <span class="su-date-value">${escHtml(setupDateLabel(state.csDate))}</span>

      <input type="date" class="su-date-input" value="${state.csDate}" aria-label="Date" onclick="try{this.showPicker()}catch(e){}" onchange="setCsDate(this.value)">
    </label>`;
  return `
  <div class="section-pad su-page cs-page">
    ${navBackRowHtml('Intent', 'csBackToStep1()')}
    ${navPageTitleHtml('Session Setup', 'Set the details for your session. These help FT2 find the best exercises for your needs.', 'STEP 2 OF 4')}
    <div class="cs-carry">
      <span class="cs-cat-icon" style="background:${f.bg};">${ICONS[f.icon]}</span>
      <span class="cs-cat-text">
        <span class="cs-carry-focus">${escHtml(f.title)}</span>

      </span>
      <button class="cs-carry-change" onclick="csBackToStep1()">Edit</button>
    </div>
    <div class="su-group">
      ${setupRowHtml(ICONS.pencil, 'Session Title', titleCtl)}
      ${setupRowHtml(ICONS.calendar, 'Date', dateCtl)}
      ${setupRowHtml(ICONS.clock, 'Start Time', startTimeFieldHtml(state.csStartTime, 'setCsStartTime'))}
      ${setupRowHtml(ICONS.clock, 'Session Duration', csSegHtml(CS_DURATIONS.map(d => [d, String(d)]), state.csDuration, 'setCsDuration'))}
      ${setupRowHtml(ICONS.mapPin, 'Location', csSegHtml(CS_LOCATIONS, state.csLocation, 'setCsLocation'))}
      ${setupRowHtml(ICONS.user, 'Age Group', csSegHtml(CS_AGE_GROUPS.map(a => [a, a]), state.csAgeGroup, 'setCsAgeGroup'))}

/* ============ EXERCISES (grid + filters) ============ */
/* While adding to a session (Find Exercises), typing in the search box looks across EVERY section --
   not just the one being filled -- since a coach searching by name shouldn't need to know which
   section an exercise is filed under. The section chips/tag filters still apply when the box is
   empty. A found exercise is added to its own section's phase (targetPhaseKeyFor()), so it lands
   where it belongs. Not applied during "Replace Exercise", which is deliberately scoped to the
   replaced exercise's own section. */
function searchSpansSections(){
  return !!(state.pickingPhase && !state.replaceContext && state.search.trim());
}
function matchesFilters(ex){
  if(state.replaceContext && ex.id === state.replaceContext.oldId) return false; // can't "replace" with itself
  if(state.filters.bookmarkedOnly && !state.bookmarks.has(ex.id)) return false;
  if(state.sectionFilter && !searchSpansSections() && ex.section !== state.sectionFilter) return false;
  if(state.filters.durations.size){
    const d = ex.duration || 10;
    let bucket;
    if(d<=5) bucket='5';
    else if(d<=10) bucket='10';
    else bucket='15';
    if(!state.filters.durations.has(bucket)) return false;
  }
  if(state.filters.tags.size){
    const tags = allTagsFor(ex);
    let hit=false;
    for(const t of state.filters.tags){ if(tags.includes(t)){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.focusCategories.size){
    let hit=false;
    for(const cat of state.filters.focusCategories){ if((ex[cat]||[]).length){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.location.size){
    const loc = String(ex.location||'').trim().toLowerCase();
    let hit=false;
    for(const v of state.filters.location){ if(loc===v.toLowerCase()){hit=true;break;} }
    if(!hit) return false;
  }
  if(state.filters.difficulty.size && !state.filters.difficulty.has(ex.difficulty)) return false;
  // Quick Filter (the "+ Add Exercise" picking screen's lightweight single-select row) -- only
  // ever active while actively picking for a phase, matched against any tag field.
  if(state.pickingPhase && state.quickFilterValue && !allTagsFor(ex).includes(state.quickFilterValue)) return false;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    const hay = (ex.name+' '+(ex.description||'')+' '+(ex.category||'')+' '+(ex.section||'')+' '+(ex.setup||'')+' '+(ex.coachingPoints||'')+' '+(ex.variations||'')+' '+allTagsFor(ex).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderExercises(){
  const list = EXERCISES.filter(matchesFilters);
  // Training-Profile-aware ranking: an active Training Focus / Quick Filter dimension, plus (while
  // picking, with exercises already in the practice) a gentle nudge toward whatever dimension the
  // practice is currently lightest on. This only reorders an already-filtered list -- it can never
  // hide anything matchesFilters() already let through. Falls back to the original behavior
  // (alpha order on "All", source order otherwise) when no ranking signal is active.
  const rankDims = activeRankingDimensions();
  const balanceDim = state.pickingPhase ? leastEmphasizedDimension() : null;
  if(rankDims.length || balanceDim){
    list.sort((a,b) => {
      const diff = exerciseRankingScore(b, rankDims, balanceDim) - exerciseRankingScore(a, rankDims, balanceDim);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);

  // Quick Filters only apply to the guided "+ Add Exercise" picking flow -- general library

  const pickingPhaseObj = state.pickingPhase ? PHASES.find(p=>p.key===state.pickingPhase) : null;

      : `<div class="ex-section-heading"><span class="esh-name">${escHtml(pickingLabel)}</span><span class="esh-count">${sectionTotalCount} exercise${sectionTotalCount===1?'':'s'}</span></div>`) : ''}

    ${pickingLabel ? `
    <div class="discovery-row">
      <div class="searchbar">
        ${ICONS.search}

        ${state.search ? `<button class="search-clear-btn" onclick="clearSearch()" title="Clear search">${ICONS.x}</button>` : ''}
      </div>

    </div>

          : state.quickFilterValue

    </div>
    <div class="filter-chip-row">

      ${SECTION_LIST.map(s => {
        const active = state.sectionFilter===s;
        const st = secStyle(s);
        const style = active ? `background:${st.bg};border-color:${st.color};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};` : '';
        return `<button class="sec-chip ${active?'active':''}" style="${style}" onclick="setSectionFilter('${s}')">${st.icon}<span>${s}</span></button>`;
      }).join('')}

      <button class="view-toggle-btn ${state.viewMode!=='list'?'active':''}" onclick="setViewMode('tile')">${ICONS.grid}<span>Tile</span></button>
      <button class="view-toggle-btn ${state.viewMode==='list'?'active':''}" onclick="setViewMode('list')">${ICONS.list}<span>List</span></button>
    </div>`}

    <div class="ex-grid ${state.viewMode==='list'?'list-mode':''}">
      ${pickingLabel ? renderPickingExerciseList(list) : list.map(exCard).join('')}
      ${newExerciseTileHtml()}
    </div>
    ${list.length===0 ? `<div class="empty-state" style="grid-column:1/-1;">${ICONS.empty}<p>No exercises match those filters.<br>Try clearing a filter or search term.</p></div>` : ''}
  </div>`;
}
/* While actively picking exercises for a phase, already-added ones are pinned to the top of
   the list instead of staying wherever the ranking/ordering logic happens to put them --
   adding an exercise can shift the practice's least-emphasized Training Dimension (see
   leastEmphasizedDimension()), which re-sorts the whole list and made a just-added exercise
   seem to "jump away." This only regroups the already-filtered/sorted `list` into two blocks
   (added first, then the rest) -- it never changes what's in the list or its within-group
   order, so ranking/filtering behavior is completely unaffected. */
function renderPickingExerciseList(list){
  const added = list.filter(ex => isExerciseInAnyPhase(ex.id));
  const rest = list.filter(ex => !isExerciseInAnyPhase(ex.id));
  if(!added.length) return rest.map(exCard).join('');
  // Collapsed by default (batch 60): a compact "[check] N in [Section]" toggle row instead of full
  // pinned cards, so the coach reaches the browsable library immediately instead of scrolling past
  // exercises they've already added. Tapping it expands back into the exact same pinned-cards+
  // divider layout this function always had -- still only regrouping the already-filtered/sorted
  // `list` into two blocks, never changing what's in it or its within-group order.
  const sectionLabel = state.pickingPhase ? (PHASES.find(p=>p.key===state.pickingPhase)?.label || phaseLabel(state.pickingPhase)) : '';
  const expanded = !!state.showAddedInPractice;
  const toggle = `<div class="ex-added-toggle-row"><button class="ex-added-toggle" onclick="toggleAddedInPractice()">${ICONS.check}<span>${added.length} exercise${added.length===1?'':'s'} in ${escHtml(sectionLabel)}</span>${expanded?ICONS.chevronUp:ICONS.chevronDown}</button></div>`;
  if(!expanded) return toggle + rest.map(exCard).join('');
  const divider = rest.length ? `<div class="ex-pinned-divider" style="grid-column:1/-1;"></div>` : '';
  return toggle + added.map(exCard).join('') + divider + rest.map(exCard).join('');
}
function toggleAddedInPractice(){
  state.showAddedInPractice = !state.showAddedInPractice;
  render();
}
function newExerciseTileHtml(){

}

function activeFilterCount(){
  return state.filters.durations.size + state.filters.tags.size + state.filters.difficulty.size + state.filters.focusCategories.size + state.filters.location.size;
}

function exCard(ex){

      ${ex.mediaUrl ? mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;position:absolute;inset:0;', false, `<div class="thumb-placeholder">${st.icon}<span class="thumb-placeholder-label">Diagram coming soon</span></div>`) : `<div class="thumb-placeholder">${st.icon}<span class="thumb-placeholder-label">Diagram coming soon</span></div>`}
      ${inPhase ? `<span class="added-badge">${ICONS.check}</span>` : ''}
    </button>

      <div class="ex-name" onclick="openDetail('${escJsAttr(ex.id)}')" style="cursor:pointer;">${escHtml(ex.name)}</div>
      ${cardTags.length ? `<div class="ex-card-tags">${cardTags.map(t=>`<span class="tagpill sm">${escHtml(t)}</span>`).join('')}</div>` : ''}

        ${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}
