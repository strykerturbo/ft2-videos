function isExerciseInAnyPhase(id){
  // While browsing to add an exercise to an already-SAVED session, "the current session" means
  // that saved session, not the live build-a-new-session draft -- redirect the check there.
  if(state.editingSavedSessionId) return isExerciseInSavedSession(state.editingSavedSessionId, id);
  if(PHASES.some(p => state.phaseData[p.key].includes(id))) return true;
  return state.extraSections.some(s => s.exercises.includes(id));
}
/* Where an exercise actually IS in the session right now, if anywhere — as opposed to
   targetPhaseKeyFor(), which only guesses where it *would* go on add (from state.pickingPhase or
   its current Section field). Using the guess for removal is the bug behind "remove sometimes
   doesn't work": an exercise sitting in a custom section, or whose Section was edited after being
   added, guesses a different phase than the one it's actually sitting in, so the toggle thinks
   it's not in the session and adds a second copy instead of removing the real one. */
function findPhaseKeyContaining(id){
  const p = PHASES.find(p => state.phaseData[p.key].includes(id));
  if(p) return p.key;
  const s = state.extraSections.find(s => s.exercises.includes(id));
  return s ? s.key : null;
}
function phaseCount(key){
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].length;
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.length : 0;
}
function targetPhaseKeyFor(ex){
  return guessPhaseForSection(ex.section) || state.pickingPhase;
}
/* Small visual thumbnail for an exercise row — quick "what am I doing" scan, echoing a coach's own session-sheet doodles */
function peiThumbHtml(ex){
  // ex is undefined when this id no longer resolves in EXERCISES (the exercise it pointed to was
  // removed/renamed upstream) -- a blank chalk-dim box here used to look like an empty loading
  // state rather than the actual problem, leaving the coach unable to tell why a row had no name.
  if(!ex) return `<div class="pei-thumb"><div class="build-ex-image-fallback">${ICONS.image}<span class="build-ex-image-fallback-label">Missing</span></div></div>`;
  const st = secStyle(ex.section);
  const noMedia = `<div class="pei-thumb-fallback" style="background:${st.bg};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}<span class="pei-thumb-fallback-label">Coming soon</span></div>`;
  if(ex.mediaUrl) return `<div class="pei-thumb">${mediaTagHtml(ex.mediaUrl, '', 'width:100%;height:100%;object-fit:cover;', false, noMedia)}</div>`;
  return `<div class="pei-thumb">${noMedia}</div>`;
}
function isExerciseInPhase(id, key){
  if(!key) return false;
  if(PHASES.some(p=>p.key===key)) return state.phaseData[key].includes(id);
  const s = state.extraSections.find(s=>s.key===key);
  return s ? s.exercises.includes(id) : false;
}

let searchDebounceTimer = null;
function openSearch(){
  // Clear any active section filter / guided-picking context first so this genuinely searches
  // the entire exercise library, not whatever subset a leftover filter happened to be scoped to.
  nav('exercises', {fromBuild:false, fromSavedSession:false, editingSavedSessionId:null, pickingPhase:null, sectionFilter:null, quickFilterValue:null});
  setTimeout(()=>{ const el = document.getElementById('searchInput'); if(el) el.focus(); }, 0);
}
function onSearch(v){
  state.search = v;
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderSoft, 150);
}
function clearSearch(){
  state.search = '';
  renderSoft();
  const el = document.getElementById('searchInput');
  if(el) el.focus();
}
function setSectionFilter(s){ state.sectionFilter = s; render(); }
function setQuickFilter(v){ state.quickFilterValue = v; render(); }
function setViewMode(mode){ state.viewMode = mode; render(); }
function toggleBookmark(e, id){
  e.stopPropagation();
  if(state.bookmarks.has(id)) state.bookmarks.delete(id); else state.bookmarks.add(id);
  render();
}

/* Toggle add/remove for an exercise. Removal always targets wherever it's actually sitting
   (findPhaseKeyContaining); only adding falls back to the guessed target phase, since there's
   nowhere to look up yet. */
function quickAdd(e, id){
  e.stopPropagation();
  if(state.replaceContext){
    performReplace(id);
    return;
  }
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  if(needsStartSessionConfirm()){
    // Show an in-app confirm sheet instead of window.confirm() -- native confirm() is silently
    // swallowed with no UI at all in iOS Safari's "Add to Home Screen" standalone mode, which
    // made tapping Add appear to do nothing.
    state.pendingQuickAdd = { id, targetKey };
    renderOverlay();
    return;
  }
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}
/* Adding an exercise while browsing Explore Exercises directly (not via the guided Build ->
   "Add exercise" flow) silently starts building a session in the background — confusing if the
   coach didn't mean to start one yet. Confirm with them the first time, when the builder is
   otherwise completely empty; once it has anything in it, just keep adding normally. */
function needsStartSessionConfirm(){
  if(state.pickingPhase) return false; // already explicitly in the guided Build flow
  if(currentTotalMinutes().count > 0) return false; // a session is already in progress
  return true;
}
function confirmQuickAddYes(){
  const pending = state.pendingQuickAdd;
  if(!pending) return;
  state.pendingQuickAdd = null;
  const ex = exById(pending.id);
  if(pending.wasDraft) saveDraftExercise(true);
  addToPhase(pending.targetKey, pending.id);
  showToast(`Started a new practice — added "${ex.name}" to ${phaseLabel(pending.targetKey)}`);
}
function confirmQuickAddNo(){
  state.pendingQuickAdd = null;
  renderOverlay();
}
function guessPhaseForSection(section){
  const p = PHASES.find(p=>p.section===section);
  return p ? p.key : null;
}
function phaseLabel(key){
  const p = PHASES.find(p=>p.key===key);
  if(p) return p.label;
  const extra = state.extraSections.find(s=>s.key===key);
  return extra ? extra.label : key;
}
function addToPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    if(!state.phaseData[key].includes(id)) state.phaseData[key].push(id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s && !s.exercises.includes(id)) s.exercises.push(id);
  }
  // Scrimmage is the last of the six standard phases -- landing an exercise there is a natural
  // "you're probably done" signal, so nudge toward Review immediately instead of waiting for the
  // coach to notice on their own. Every add path (quickAdd, detailToggle, Quick Pick, Balance,
  // the pending-confirm flow) funnels through this one function, so this covers all of them.
  if(key==='scrimmage') state.showReviewPrompt = true;
  render();
}
// The fixed "Next: Session Review" footer CTA is the one and only way from Build to Review (the
// "looks complete" banner is feedback only); it also dismisses that banner on the way out.
function goToReviewFromBuild(){
  state.showReviewPrompt = false;
  nav('review');
}
function removeFromPhase(key, id){
  if(PHASES.some(p=>p.key===key)){
    state.phaseData[key] = state.phaseData[key].filter(x=>x!==id);
  } else {
    const s = state.extraSections.find(s=>s.key===key);
    if(s) s.exercises = s.exercises.filter(x=>x!==id);
  }
  render();
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// For values (ids from the spreadsheet/synced sessions) interpolated into a single-quoted JS
// string literal inside an inline event-handler attribute, e.g. onclick="fn('${escJsAttr(x)}')".
// escAttr() alone only protects the outer double-quoted HTML attribute -- a bare ' in the value
// would still close the inner JS string early and let anything after it execute as script.
function escJsAttr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* soft render: skip full topbar/bottomnav rebuild for typing responsiveness */
function renderSoft(){
  // Re-rendering swaps out the whole #content subtree, which would normally yank focus (and the
  // text cursor) out of whatever field the coach is actively typing in -- e.g. the search box,
  // where every keystroke calls this. Capture the focused element's id + cursor position first,
  // then restore both after the new DOM is in, so typing feels continuous instead of dropping
  // focus after the first character.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  document.getElementById('content').innerHTML = screens[state.screen]();
  initLazyMedia(); // renderSoft() is the search-as-you-type path -- the new thumbnails need arming too
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function toggleFilters(open){ state.filtersOpen = open; if(open){ state.quickPickOpen = false; state.quickPickCustomizeOpen = false; } renderOverlay(); }
function toggleSetVal(setName, val){
  const s = state.filters[setName];
  if(s.has(val)) s.delete(val); else s.add(val);
  renderOverlay();
}
function clearFilters(){
  state.filters.durations = new Set();
  state.filters.tags = new Set();
  state.filters.difficulty = new Set();
  state.filters.focusCategories = new Set();
  state.filters.location = new Set();
  renderOverlay();
}

function openDetailFromReview(id){ nav('detail', {detailId:id, fromReview:true, fromCustomReview:state.screen === 'customSessionReview', fromBuild:false, fromSavedSession:false, fromHome:false}); }
function openDetailFromSavedSession(id, sessionId, savedName){
  const sess = state.savedSessions.find(x=>x.id===sessionId);
  let entry = null;
  if(sess) sess.phases.forEach(p => p.exercises.forEach(e => { if(!entry && e.id===id && (savedName===undefined || e.name===savedName)) entry = e; }));
  const ex = resolveSavedExercise(entry || {id, name: savedName});
  if(!ex){ showToast('That exercise is no longer in the library'); return; }
  id = ex.id;
  nav('detail', {detailId:id, fromSavedSession:true, fromSavedSessionId:sessionId, fromBuild:false, fromReview:false, fromHome:false}); }

function detailToggle(id){
  if(state.replaceContext){
    performReplace(id);
    return;
  }
  if(state.editingSavedSessionId){
    if(isExerciseInSavedSession(state.editingSavedSessionId, id)) removeExerciseFromSavedSession(state.editingSavedSessionId, id);
    else addExerciseToSavedSession(state.editingSavedSessionId, id);
    return;
  }
  const ex = exById(id);
  const currentKey = findPhaseKeyContaining(id);
  if(currentKey){
    removeFromPhase(currentKey, id);
    showToast(`Removed "${ex.name}" from ${phaseLabel(currentKey)}`);
    return;
  }
  const targetKey = targetPhaseKeyFor(ex);
  if(!targetKey){ showToast('No matching phase for this exercise'); return; }
  const wasDraft = state.draftExercise && state.draftExercise.id===id;
  if(needsStartSessionConfirm()){
    state.pendingQuickAdd = { id, targetKey, wasDraft };
    renderOverlay();
    return;
  }
  if(wasDraft) saveDraftExercise(true);
  addToPhase(targetKey, id);
  showToast(wasDraft ? `Saved & added "${ex.name}" to ${phaseLabel(targetKey)}` : `Added "${ex.name}" to ${phaseLabel(targetKey)}`);
}

/* All valid tag values already in use, grouped by category -- lets a coach pick a known tag
   from the "Add tags" sheet instead of retyping free text that might not quite match an
   existing one. Recomputed on demand (cheap at this dataset size) so it always reflects
   whatever's currently loaded, including a fresh live-sheet sync. */
function computeTagVocab(){
  const cats = ['technicalTags','tacticalTags','formatTags','physicalTags','cognitiveTags','engagementTags'];
  const sets = {}; cats.forEach(c => sets[c] = new Set());
  EXERCISES.forEach(e => cats.forEach(c => (e[c]||[]).forEach(t => { if(t) sets[c].add(t); })));
  const out = {};
  cats.forEach(c => out[c] = Array.from(sets[c]).sort((a,b)=>a.localeCompare(b)));
  return out;
}
function openTagPicker(id){ state.tagPickerId = id; renderOverlay(); }
function closeTagPicker(){ state.tagPickerId = null; renderOverlay(); }
function toggleExerciseTagAt(id, category, idx){
  const ex = exById(id);
  if(!ex) return;
  const vocab = computeTagVocab();
  const tag = (vocab[category]||[])[idx];
  if(!tag) return;
  const arr = ex[category] || (ex[category] = []);
  const i = arr.indexOf(tag);
  if(i>-1) arr.splice(i,1); else arr.push(tag);
  render();
}
function renderTagPickerSheet(){

/* Generic in-place exercise field editor, used by contenteditable blur handlers.

   element (e.g. tapping "Back" right after editing a field), the blur-triggered re-render
   would otherwise destroy that element before its click event is delivered. */
function updateExerciseField(id, field, rawVal, kind, doRender){
  const ex = exById(id);
  if(!ex) return;
  let val = rawVal;
  if(kind==='number'){

    val = (typeof rawVal === 'string') ? rawVal.trim() : rawVal;
    if(val === '' || val === '—') val = (field==='videoUrl'||field==='mediaUrl') ? null : ex[field];
  }
  ex[field] = val;
  if(doRender !== false) setTimeout(render, 0);
}

/* Collapsible: always shows a colored one-line summary (planned vs target), expands to a
   direct comparison between what's actually been chosen and the suggested phase-group split.
   Defaults to the live in-progress draft (Build/Review) when called with no arguments; saved
   Session Detail passes its own frozen total/target/group-minutes instead, so the exact same
   panel and math serve both a live draft and a historical record. */
// Shared by renderTimeComparisonPanel() below and the Review page's compact row (batch 65) --
// the "Session Balance" breakdown, independent of whatever triggers showing it. The header bar's
// segments are sized by each group's share of the actual total (not the target), so it always
// reads as "how your built time is currently split" -- a session well under target still fills
// the bar edge-to-edge instead of leaving a confusing empty tail.
function timeComparisonBodyHtml(total, target, groups, livePlan){
  const suggestedMins = (livePlan && state.csPlannedByPhase)
    ? PHASE_GROUPS.map(g => g.phaseKeys.reduce((a,k) => a + sectionPlannedMinutes(k), 0))   // same per-phase plan the phase strip uses
    : suggestedSplitMinutes(target);
  const barSegs = PHASE_GROUPS.map(s => `<div style="width:${total>0 ? Math.max(0, groups[s.key]/total*100) : 0}%;background:${s.bg};"></div>`).join('');
  const rows = PHASE_GROUPS.map((s,i) => {
    const actual = groups[s.key];
    const t = suggestedMins[i];
    const met = t<=0 || actual>=t;
    const over = t>0 && actual>t;
    const pct = t>0 ? Math.min(100, Math.round(actual/t*100)) : (actual>0?100:0);
    const statusHtml = met
      ? `<span class="sb-check" title="On target">${ICONS.check}</span>`
      : `<span class="sb-diff" style="color:${s.color};">+${t-actual} min</span>`;
    return `
    <div class="sb-row">
      <div class="sb-row-top">
        <div class="sb-row-left">
          <span class="sb-dot" style="background:${s.bg};"></span>
          <div>
            <div class="sb-row-label">${escHtml(s.label)}</div>
            <div class="sb-row-sublabel">${escHtml(s.sublabel)}</div>
          </div>
        </div>
        <div class="sb-row-status">${statusHtml}</div>
      </div>
      <div class="sb-row-bottom">
        <div class="sb-row-mins">${actual} / ${t} min${over?` <span class="phase-over-tag">Over</span>`:''}</div>
        <div class="progress-track sb-row-track"><div class="sb-row-fill" style="width:${pct}%;background:${s.bg};"></div></div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="tp-body sb-body">
      <div class="sb-header">
        <div class="sb-header-title">Session Balance
          <button class="qp-info-btn" onclick="toggleSessionBalanceInfo()" title="What is Session Balance?" aria-label="What is Session Balance?">i</button>
        </div>
        <div class="sb-total">${total} min</div>
      </div>
      ${state.sessionBalanceInfoOpen ? `<div class="qp-info-panel">Shows how this practice's time splits across Activate (Warmup + Athletic), Develop (Duels, Rondos, Small Sided Games), and Play (Scrimmage), against the suggested split for a session this long.</div>` : ''}
      <div class="sb-bar">${barSegs}</div>
      <div class="sb-rows">${rows}</div>
    </div>`;
}
function renderTimeComparisonPanel(totalOverride, targetOverride, groupsOverride){
  const total = totalOverride !== undefined ? totalOverride : currentTotalMinutes().total;
  const target = targetOverride !== undefined ? targetOverride : state.targetDuration;
  const over = total > target;
  const diff = over ? total-target : target-total;
  const diffColor = total===0 ? 'var(--ink-soft)' : (over ? 'var(--warn)' : 'var(--turf)');
  const groups = groupsOverride || computeGroupMinutes();

  return `
  <div class="time-panel">
    <button class="time-panel-header" onclick="toggleSplitExpanded()">
      <div class="tp-summary">
        <span style="color:${diffColor};"><b>${total}</b> min planned</span>
        <span class="tp-sep">&middot;</span>
        <span style="color:${diffColor};font-weight:700;">${total===0 ? `${target} min target` : (over?`+${diff} over`:`${diff} min left`)}</span>
      </div>
      <span class="tp-chevron ${state.splitExpanded?'open':''}">${ICONS.chevronRight}</span>
    </button>
    ${state.splitExpanded ? timeComparisonBodyHtml(total, target, groups, groupsOverride === undefined) : ''}
  </div>`;
}

function defaultSessionName(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) + ' Practice';
}
// YYYY-MM-DD in the coach's own local time (not UTC) -- what an <input type="date"> needs, and
// what state.practiceDate/state.setupDate are stored as throughout.
function todayISODate(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// Compact "SAT, SEP 12" style label for the Build Practice page's practice-summary line, from a
// YYYY-MM-DD state.practiceDate. Parses year/month/day directly (never `new Date(isoString)`) so a
// coach west of UTC doesn't see the date roll back a day -- the same off-by-one that ISO-string
// date parsing is prone to.
function formatPracticeDateShort(iso){
  if(!iso) return '';
  const parts = iso.split('-').map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return '';
  const d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}
/* The club's regular practice nights (JS weekday: 1 = Mon, 2 = Tue, 4 = Thu). Picking one of these dates pre-fills the start time,
   length and location on Session Setup / Custom Session Step 2 -- but only for fields the coach hasn't already changed by hand. */
const PRACTICE_SCHEDULE = {
  1:{start:'17:00', duration:90, location:'outdoor'},   // Monday 5:00 - 6:30 PM, outdoor
  2:{start:'18:00', duration:60, location:'indoor'},    // Tuesday 6:00 - 7:00 PM, indoor
  4:{start:'17:00', duration:75, location:'outdoor'},   // Thursday 5:00 - 6:15 PM, outdoor
};
function scheduleFor(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'')); if(!m) return null;
  return PRACTICE_SCHEDULE[new Date(+m[1], +m[2]-1, +m[3]).getDay()] || null;
}
/* Start times are stored as 24-hour "HH:MM" text ('' = none set). */
function timeToMin(hhmm){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||'')); return m ? (+m[1])*60 + (+m[2]) : null; }
function minToTime(min){ const t = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }
function timeLabel(hhmm){
  const m = timeToMin(hhmm); if(m === null) return '';
  const h = Math.floor(m/60), mi = m % 60;
  return `${h%12 || 12}:${String(mi).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`;
}
// "5:00 \u2013 6:15 PM" (the AM/PM is only repeated when the two ends differ).
function timeRangeLabel(hhmm, offsetMin, lenMin){
  const a = timeToMin(hhmm); if(a === null) return '';
  const s1 = timeLabel(minToTime(a + offsetMin)), s2 = timeLabel(minToTime(a + offsetMin + lenMin));
  return s1.slice(-2) === s2.slice(-2) ? `${s1.slice(0, -3)} \u2013 ${s2}` : `${s1} \u2013 ${s2}`;
}
function startTimeFieldHtml(value, fn){
  return `
    <label class="su-date-field">
      <span class="su-date-value">${escHtml(timeLabel(value) || 'Set a time')}</span>
      <span class="su-date-chev">${ICONS.chevronRight}</span>
      <input type="time" class="su-date-input" value="${escAttr(value||'')}" aria-label="Start time" onclick="try{this.showPicker()}catch(e){}" onchange="${fn}(this.value)">
    </label>`;
}
// Fills in Practice Setup's own draft fields fresh -- called whenever Setup is entered to start a
// brand-new practice. Duration/location default to whatever was last used (state.targetDuration/
// state.practiceLocation already persist across sessions today -- this preserves that instead of
// hardcoding a fresh default), matching how the Build page's own settings already behave.
function initSetupDraft(){
  state.setupName = defaultSessionName();
  state.setupDate = todayISODate();
  state.setupStartTime = state.practiceStartTime;
  state.setupDuration = state.targetDuration;
  state.setupLocation = state.practiceLocation;
  state.setupTouched = {};
  applySetupSchedule();

  state.setupEditingDuration = false;
}
// The up-to-3 templates Practice Setup surfaces directly on the page, in priority order: most
// recently used, then most frequently used, then (for anything never used) the library's own
// order -- Array.prototype.sort is stable, so ties fall back to that order rather than anything
// fabricated. lastUsedAt/useCount are only ever set by real use (markTemplateUsed below), never
// seeded with fake numbers.
// Home screen's Featured Exercise -- deterministic per calendar day (not random per render), so
// it doesn't change every time Home re-renders but still rotates day to day. Returns null when
// the library is empty so Home can skip the section instead of crashing.
function featuredExercise(){
  // Only cycles through exercises that actually have a video (ex.videoUrl -- distinct from
  // ex.mediaUrl, which is just a diagram/image thumbnail) -- no point featuring one a coach can't
  // watch. Same deterministic day-of-year rotation as before, just scoped to that smaller pool.
  const withVideo = EXERCISES.filter(e => e.videoUrl);
  if(!withVideo.length) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return withVideo[dayOfYear % withVideo.length];
}
// Home screen's Recent Sessions -- same ranking idiom as rankedSetupTemplates() just below, but
// by actual save time (createdAt) rather than last-used, and scoped to the signed-in coach's own
// sessions (matching the "My Sessions" tile it sits under, not the shared Community pool).
function myRecentSessions(n){
  return state.savedSessions
    .filter(s => s.createdBy === state.coachName)
    .slice()
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0))
    .slice(0, n);
}
function rankedSetupTemplates(){
  return state.practiceTemplates.slice().sort((a,b) => {
    const aUsed = a.lastUsedAt||0, bUsed = b.lastUsedAt||0;
    if(aUsed !== bUsed) return bUsed - aUsed;
    const aCount = a.useCount||0, bCount = b.useCount||0;
    if(aCount !== bCount) return bCount - aCount;
    return 0;
  }).slice(0,3);
}
// Real usage tracking -- called whenever a template is actually used to start or configure a
// practice (both from Practice Setup's CTA and the Build page's existing "Load a template").
function markTemplateUsed(id){
  const t = getTemplate(id);
  if(!t) return;
  t.lastUsedAt = Date.now();
  t.useCount = (t.useCount||0) + 1;
}
function setSessionName(v){ state.sessionName = v; }
function toggleSplitExpanded(){ state.splitExpanded = !state.splitExpanded; render(); }
function computeGroupMinutes(){
  const sum = (ids) => (ids||[]).reduce((a,id)=>a+(exById(id)?.duration||10),0);
  const g = {};
  PHASE_GROUPS.forEach(group => { g[group.key] = group.phaseKeys.reduce((a,k)=>a+sum(state.phaseData[k]),0); });
  return g;
}
/* Same shape as computeGroupMinutes() above, but reads from a SAVED session's own frozen
   `phases` snapshot (matched by each entry's `.section` name, not a live phaseData phase key)
   instead of the live draft -- lets Session Detail show the identical time-comparison panel for
   a completed session. A custom/extra section (section:null, not one of the 6 standard PHASES)
   contributes to no group, matching reviewPhaseGroups()/sessionDetailPhaseGroups() below. */
function computeGroupMinutesFromPhases(phases){
  const g = {};
  PHASE_GROUPS.forEach(group => { g[group.key] = 0; });
  (phases||[]).forEach(p => {
    const phaseObj = PHASES.find(ph => ph.section === p.section);
    if(!phaseObj) return;
    const group = PHASE_GROUPS.find(gr => gr.phaseKeys.includes(phaseObj.key));
    if(group) g[group.key] += (p.exercises||[]).reduce((a,e)=>a+(e.duration||10),0);
  });
  return g;
}

function currentTotalMinutes(){
  let total = 0, count = 0;
  PHASES.forEach(p => {
    state.phaseData[p.key].forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  state.extraSections.forEach(s => {
    s.exercises.forEach(id => { const ex=exById(id); total += (ex?.duration||10); count++; });
  });
  return {total, count};
}

function returnScreenFor(returnTo){ return returnTo === 'customReview' ? 'customSessionReview' : returnTo; }
function pickerReturnsToCustomReview(){

function pickReplacementFor(key, oldId, returnTo){

  nav('exercises', {pickingPhase:key, pickReturnTo:returnTo === 'customReview' ? 'customReview' : null, fromBuild:returnTo==='build', fromReview:returnTo==='review', fromSavedSession:false, editingSavedSessionId:null, sectionFilter: p ? p.section : null, search:'', quickFilterValue:null, balanceSheetOpen:false, quickPickOpen:false, quickPickCustomizeOpen:false, showAddedInPractice:false});

/* Finishes a replace: swaps the new exercise id into the exact array slot the old one occupied
   (exerciseListFor() already resolves to the right array whether that slot is a standard phase or
   a custom section), so position, duration totals, and Training Profile all update for free on the
   next render -- only a currently-OPEN Balance sheet needs an explicit nudge, since its
   recommendation set is deliberately frozen (see refreshBalanceResults()). */
function performReplace(newId){
  const ctx = state.replaceContext;
  if(!ctx) return;
  const arr = exerciseListFor(ctx.key);
  const idx = arr ? arr.indexOf(ctx.oldId) : -1;
  if(idx > -1) arr[idx] = newId;
  if(state.balanceSheetOpen) refreshBalanceResults();
  state.replaceContext = null;
  const ex = exById(newId);
  showToast(ex ? `Replaced with "${ex.name}"` : 'Exercise replaced');
  nav(returnScreenFor(ctx.returnTo));
}
/* Switch which phase is being filled WITHOUT leaving the exercise list — lets a coach fill several
   phases back to back instead of bouncing to the Build screen between every add. */
function switchPickingPhase(key){
  const p = PHASES.find(p=>p.key===key);
  state.pickingPhase = key;
  state.sectionFilter = p ? p.section : null;
  state.quickFilterValue = null;
  state.balanceSheetOpen = false;
  state.quickPickOpen = false;
  state.quickPickCustomizeOpen = false;
  state.showAddedInPractice = false;
  render();
  const c = document.getElementById('content'); if(c) c.scrollTop = 0;
}
/* Clear "what's next" step so a coach can move phase-by-phase start to finish without having to
   figure out on their own which dot to tap: advances to the next standard phase in order, or —
   once on the last one (or a custom section, which has no fixed "next") — goes to Review. */
function nextPickingPhase(){
  const idx = PHASES.findIndex(p => p.key === state.pickingPhase);
  if(idx > -1 && idx < PHASES.length - 1){
    switchPickingPhase(PHASES[idx+1].key);
  } else {
    nav('review');
  }
}
/* Compact strip shown while picking: tap any dot to jump to that phase, plus a live progress readout

    </div>

    <div class="pps-nav-row">

function extractBullets(ex, maxBullets){
  maxBullets = maxBullets || 3;
  const sentences = [];
  [ex.description, ex.variations].forEach(text => {
    if(!text) return;
    text.split(/(?<=[.!?])\s+/).forEach(s => {
      const t = s.trim();
      if(t) sentences.push(t);
    });
  });
  return sentences.slice(0, maxBullets);
}

/* Long-press-and-drag reorder for exercises already added to a Building Session section -- same
   gesture/timing as the template-section reorder in Settings (tmplGripDown et al.), just operating
   over an exercise-id array instead of a sections array. Scoped per section (data-list-key) so
   dragging in one section's list can't match rows in another section that happens to contain the
   same exercise. Only shown once a section has 2+ exercises -- nothing to reorder with just one. */
function exerciseListFor(key){
  if(state.phaseData[key]) return state.phaseData[key];
  const es = state.extraSections.find(s=>s.key===key);
  return es ? es.exercises : null;
}
/* ============ SHARED DRAG-TO-REORDER ENGINE ============
   Used by both the Build page's per-phase exercise list (exGripDown/Move/Cancel/Up) and the
   Review page's per-phase-group list (reviewExGripDown/Move/Cancel/Up) -- same long-press ->
   live pointer-follow -> adjacent-swap-with-FLIP-animated-neighbor -> settle mechanism,
   parameterized only by how each screen resolves selectors and applies a swap to its own state
   shape (see the two configs below).

   The dragged row tracks the pointer directly via a live transform on every pointermove -- no
   waiting for a render(), unlike the previous version of this code (which only reacted once the
   pointer crossed into a neighbor's bounding box, then re-rendered the whole screen, so rows
   just teleported into their new slot with no animation). When the dragged row's visual center
   crosses an immediate DOM neighbor's midpoint, that one neighbor is physically swapped in the
   DOM and animated into its new slot with a FLIP transform, while the dragged row's own
   transform is rebased against its new natural position so it never jumps. The underlying array
   is updated via the config's onSwap() at the same moment, so it's always authoritative even
   though the full render() is deferred until drop -- nothing else on either page depends on row
   order mid-drag, so nothing else needs to update until then. */
const REORDER_EASE = 'cubic-bezier(0.22,0.61,0.36,1)';

function makeDragReorderController(config){
  let drag = null;

  function updateDraggedTransform(){
    const row = drag.row;
    row.style.transition = 'none';
    row.style.transform = 'translateY(0px)';
    const naturalTop = row.getBoundingClientRect().top;
    const desiredTop = drag.lastY - drag.pointerOffsetInRow;
    row.style.transform = `translateY(${desiredTop - naturalTop}px) scale(1.02)`;
  }

  function flipNeighbor(row, oldRect){
    const newRect = row.getBoundingClientRect();
    const dy = oldRect.top - newRect.top;
    if(!dy) return;
    row.style.transition = 'none';
    row.style.transform = `translateY(${dy}px)`;
    void row.offsetHeight; // force layout so the browser registers this starting point before we transition away from it
    row.style.transition = `transform 220ms ${REORDER_EASE}`;
    row.style.transform = '';
  }

  function doSwap(neighborRow){
    const neighborId = neighborRow.dataset.exId;
    const oldRect = neighborRow.getBoundingClientRect();
    const neighborFollows = !!(drag.row.compareDocumentPosition(neighborRow) & Node.DOCUMENT_POSITION_FOLLOWING);
    if(neighborFollows) neighborRow.after(drag.row);
    else neighborRow.before(drag.row);
    config.onSwap(drag.ctx, drag.id, neighborId);
    flipNeighbor(neighborRow, oldRect);
    updateDraggedTransform();
  }

  function checkSwaps(){
    // Looped so a fast drag that crosses several rows in one pointermove event still reorders
    // correctly instead of lagging a step behind.
    for(let guard=0; guard<50; guard++){
      const rows = [...drag.container.querySelectorAll(config.rowSelectorAll)];
      const idx = rows.indexOf(drag.row);
      if(idx===-1) break;
      const draggedRect = drag.row.getBoundingClientRect();
      const center = draggedRect.top + draggedRect.height/2;
      const next = rows[idx+1], prev = rows[idx-1];
      if(next && center > next.getBoundingClientRect().top + next.getBoundingClientRect().height/2){ doSwap(next); continue; }
      if(prev && center < prev.getBoundingClientRect().top + prev.getBoundingClientRect().height/2){ doSwap(prev); continue; }
      break;
    }
  }

  function acquireRow(){
    const container = document.querySelector(config.containerSelector(drag.ctx));
    const row = container && document.querySelector(config.rowSelector(drag.ctx, drag.id));
    if(!row) return false;
    drag.container = container;
    drag.row = row;
    row.classList.add('dragging');
    row.style.zIndex = '5';
    return true;
  }

  function down(e, ctx, id){
    e.preventDefault();
    const startY = e.clientY;
    drag = {ctx, id, startY, lastY:startY, longPressed:false, container:null, row:null, timer:null};
    drag.timer = setTimeout(()=>{
      if(!drag) return;
      drag.longPressed = true;
      if(!acquireRow()){ drag = null; return; }
      drag.pointerOffsetInRow = drag.lastY - drag.row.getBoundingClientRect().top;
      updateDraggedTransform();
      if(navigator.vibrate) navigator.vibrate(15);
    }, 320);
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  function move(e){
    if(!drag) return;
    drag.lastY = e.clientY;
    if(!drag.longPressed){
      if(Math.abs(e.clientY - drag.startY) > 8) cancel();
      return;
    }
    e.preventDefault();
    if(!drag.row || !drag.row.isConnected){
      // Something else re-rendered mid-drag (e.g. a toast) -- reacquire rather than operate on a
      // detached node, or bail out cleanly if the row is genuinely gone.
      if(!acquireRow()){ cancel(); return; }
      drag.pointerOffsetInRow = drag.lastY - drag.row.getBoundingClientRect().top;
    }
    updateDraggedTransform();
    checkSwaps();
  }

  function cancel(){
    if(drag) clearTimeout(drag.timer);
    drag = null;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  }

  function up(){
    const settling = drag && drag.longPressed && drag.row && drag.row.isConnected;
    if(settling){
      const row = drag.row;
      row.style.transition = `transform 220ms ${REORDER_EASE}`;
      row.style.transform = 'translateY(0px) scale(1)';
      setTimeout(render, 230);
    }
    cancel();
    if(!settling) render();
  }

  return {down, move, cancel, up};
}

const buildDragCtl = makeDragReorderController({
  containerSelector: key => `.build-ex-list[data-list-key="${CSS.escape(key)}"]`,
  rowSelector: (key, id) => `.build-ex-list[data-list-key="${CSS.escape(key)}"] .build-ex-row[data-ex-id="${CSS.escape(id)}"]`,
  rowSelectorAll: '.build-ex-row',
  onSwap(key, draggedId, neighborId){
    const list = exerciseListFor(key);
    if(!list) return;
    const fromIdx = list.indexOf(draggedId);
    const toIdx = list.indexOf(neighborId);
    if(fromIdx<0 || toIdx<0) return;
    const [moved] = list.splice(fromIdx,1);
    list.splice(toIdx,0,moved);
  },
});
function exGripDown(e, key, id){ buildDragCtl.down(e, key, id); }
function exGripMove(e){ buildDragCtl.move(e); }
function exGripCancel(){ buildDragCtl.cancel(); }
function exGripUp(){ buildDragCtl.up(); }

// Review-page reordering: same shared engine as exGripDown/Move/Up/Cancel above, but scoped by a
// phase-GROUP key (e.g. "activate") instead of a single phase key, since a group's list on this
// page can blend exercises from 2-3 real phases into one visual card and the coach can drag
// freely across that whole blend. A drag never changes which real phase an exercise belongs to
// (see onSwap below) -- only its position in the Review-page display, and the relative order of
// same-phase exercises, which is what actually carries into Save.
const reviewDragCtl = makeDragReorderController({
  containerSelector: groupKey => `.phase-exlist[data-list-key="${CSS.escape(groupKey)}"]`,
  rowSelector: (groupKey, id) => `.phase-exlist[data-list-key="${CSS.escape(groupKey)}"] .phase-ex-item[data-ex-id="${CSS.escape(id)}"]`,
  rowSelectorAll: '.phase-ex-item',
  onSwap(groupKey, draggedId, neighborId){
    const onCustomReview = state.screen === 'customSessionReview';
    const flat = reviewGroupFlatOrder(groupKey, onCustomReview);
    const phaseKeyById = new Map(flat.map(it=>[it.id, it.phaseKey]));
    // Custom Session keeps the workflow order, so an exercise can only be moved among others from its own section there.
    if(onCustomReview && phaseKeyById.get(draggedId) !== phaseKeyById.get(neighborId)) return;
    const ids = flat.map(it=>it.id);
    const fromIdx = ids.indexOf(draggedId);
    const toIdx = ids.indexOf(neighborId);
    if(fromIdx<0 || toIdx<0) return;
    const [moved] = ids.splice(fromIdx,1);
    ids.splice(toIdx,0,moved);
    state.reviewGroupOrder[groupKey] = ids;
    // Re-sync each real phase's own array to the new relative order of just its own items, so a
    // same-phase reorder persists normally into the saved session on completeSession(). A custom
    // section is its own single "phase" here, so it just gets the reordered list directly.
    const group = PHASE_GROUPS.find(g=>g.key===groupKey);
    if(group){
      group.phaseKeys.forEach(key=>{
        state.phaseData[key] = ids.filter(id=>phaseKeyById.get(id)===key);
      });
    } else {
      const extra = state.extraSections.find(s=>s.key===groupKey);
      if(extra) extra.exercises = ids;
    }
  },
});
function reviewExGripDown(e, groupKey, id){ reviewDragCtl.down(e, groupKey, id); }
function reviewExGripMove(e){ reviewDragCtl.move(e); }
function reviewExGripCancel(){ reviewDragCtl.cancel(); }
function reviewExGripUp(){ reviewDragCtl.up(); }

function renderBuild(){
  const presets = [60,75,90];
  const isCustomActive = !presets.includes(state.targetDuration);
  const activePhases = orderedPhases().filter(p => state.enabledPhaseKeys.has(p.key));
  const {total, count} = currentTotalMinutes();
  const pct = state.targetDuration ? Math.min(100, Math.round((total/state.targetDuration)*100)) : 0;
  const over = total > state.targetDuration;
  const remain = state.targetDuration - total;

  // Numbered practice-plan cards (batch 69): "01 WARMUP", "02 ATHLETIC", etc., in whatever order
  // the coach's own Settings > phase order currently is (orderedPhases()/enabledPhaseKeys are a
  // persistent coach preference, unrelated to this one practice, and untouched here) -- for a coach
  // who's never reordered anything this is exactly the canonical 01-06 Warmup..Scrimmage sequence.
  // "Start here" is now a one-time cue on phase #1 only, and only while the whole practice is still
  // empty -- it does not chase whichever phase is next like the old "next-up" pointer did, since the
  // builder is a planner a coach can jump around in, not a six-step wizard.
  const phaseBoxHtml = (p, idx) => {
    const ids = state.phaseData[p.key];
    const st = secStyle(p.section);
    const mins = ids.reduce((a,id)=>a+(exById(id)?.duration||10),0);
    const isEmpty = ids.length === 0;
    const isFirstPhaseWhileEmpty = count===0 && idx===0;
    // Empty phases start (and stay) collapsed -- there's nothing to expand yet, so no chevron is
    // shown at all. Once the first exercise is added, a chevron appears and the card defaults to
    // expanded so the coach immediately sees what they just added.
    const isCollapsed = isEmpty;       // exercises are always shown once a section has some (no collapse arrow any more)
    const suggested = sectionPlannedMinutes(p.key); // reuses the coach's own existing Settings > Training Session split -- see PHASE TIME GUIDANCE in the batch 69 report for why this, not a second hardcoded distribution
    const over = mins > suggested;
    // "Current" also covers the very first empty phase on a brand-new session (isFirstPhaseWhileEmpty)
    // -- the same emphasis ring that appears once a coach has actually picked into a phase now shows
    // proactively on Warmup's "Start here" cue too, instead of waiting for that first tap.
    const isCurrent = state.pickingPhase === p.key || isFirstPhaseWhileEmpty;
    const iconColor = st.textOn==='dark' ? 'var(--pitch-dark)' : 'white';
    const barBg = `color-mix(in srgb, ${st.color} 10%, var(--bg-surface))`; // soft section tint for the summary row -- distinct from the icon's full-strength color
    // Once a phase has exercises, its outer card gets a faint section-colored ring (instead of the
    // plain neutral border) -- a quiet "you've picked something for this section" confirmation,
    // independent of (and layered under) the stronger turf "current phase" ring above.
    const filledBorder = !isEmpty ? `border-color:color-mix(in srgb, ${st.color} 45%, var(--line));` : '';

    // Kept deliberately short so it always fits on ONE line next to the Add Exercise pill -- a
    // wrapped second line made the row taller, which stretched the icon square into a rectangle.
    // Over-target reads from the red time text (plus the red progress bar), not a trailing word.
    let subHtml = `${ids.length} exercise${ids.length===1?'':'s'}`;
    if(!isEmpty){
      subHtml = `<span class="${over ? 'phase-over-tag' : ''}" title="${over ? 'Over the suggested time' : 'Planned vs suggested time'}">${mins}/${suggested} min</span>`;
    } else if(isFirstPhaseWhileEmpty){
      subHtml = `<span class="prs-starthere">Start here</span>`;
    }

    // Tapping the icon/title area expands or collapses this phase's already-added exercises
    // inline (image + name + bullets per exercise, via the same buildExRowHtml() row custom
    // sections already use below) -- restored per the coach's own request, after a prior redesign
    // routed every tap straight to the picker instead. "+ Add Exercise" still always goes to the
    // picker. An empty phase has nothing to expand, so it shows no chevron -- only the pill does
    // anything until the first exercise lands.
    return `
    <div class="phase-row-wrap ${isCurrent?'current':''}" style="${filledBorder}">
      <div class="phase-row" style="background:${barBg};">
        <div class="phase-row-icon" style="background:${st.bg};color:${iconColor};">${st.icon}</div>
        <div class="phase-row-content">
          <div class="phase-row-main" style="cursor:default;">
            <div class="phase-row-body">
              <div class="phase-row-title">${p.label}</div>
              <div class="phase-row-sub">${subHtml}</div>
              ${phaseProgressBarHtml(mins, suggested) || ''}
            </div>
          </div>
          <button class="pcard-add-pill" style="background:color-mix(in srgb, ${st.color} 24%, transparent);color:${st.color};" onclick="pickForPhase('${p.key}')"><span class="pcard-add-plus">+</span><span class="pcard-add-text"><span>Add</span><span>Exercise</span></span></button>
        </div>
      </div>
      ${isCollapsed ? '' : (ids.length ? `<div class="build-ex-list" data-list-key="${p.key}">${ids.map(id=>buildExRowHtml(id, p.key, `removeFromPhase('${p.key}','${id}')`, ids.length>1)).join('')}</div>` : '')}
    </div>`;
  };

  const extraBoxHtml = (s) => {
    const mins = s.exercises.reduce((a,id)=>a+(exById(id)?.duration||10),0);
    const isCollapsed = false;
    const planned = extraSectionPlannedMinutes(s);
    const over = planned ? mins > planned : false;
    const isCurrent = state.pickingPhase === s.key;
    return `
    <div class="phase-box ${s.exercises.length?'filled':''} ${isCurrent?'current':''}">
      <div class="phase-box-header">
        <div class="phase-box-toprow">
          <input class="extra-box-title-input" value="${escAttr(s.label)}" onblur="renameExtraSection('${s.key}', this.value)" onkeydown="if(event.key==='Enter')this.blur()">
        </div>
        <div class="phase-box-subrow">
          <div class="phase-box-time">${planned ? `${mins} / ${planned} min${over?` <span class="phase-over-tag">Over</span>`:''}` : `${mins}m`}</div>
          <div class="phase-box-subrow-actions">
            <button class="phase-box-edit" onclick="pickForPhase('${s.key}')" title="Edit exercises">${ICONS.pencil}</button>

/* Session names are unique across every session this device can see (yours and the Community's), compared
   ignoring case and extra spaces. A name that's already taken gets " (2)", " (3)"... instead of blocking the
   save -- a coach saving on the sideline shouldn't be stopped by a name clash. excludeId = the session being
   renamed, so keeping its own name is never a clash. Older duplicates already saved are left as they are. */
function sessionNameKey(n){ return String(n||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function uniqueSessionName(name, excludeId){
  const base = String(name||'').trim().replace(/\s+/g,' ');
  const taken = new Set(state.savedSessions.filter(x => x.id !== excludeId).map(x => sessionNameKey(x.name)));
  if(!taken.has(sessionNameKey(base))) return base;
  let n = 2;
  while(taken.has(sessionNameKey(`${base} (${n})`))) n++;
  return `${base} (${n})`;
}
function completeSession(opts){
  const {total, count} = currentTotalMinutes();
  if(count===0){ showToast('Add at least one exercise first'); return; }
  const phasesSnapshot = [];
  PHASES.forEach(p => {
    if(state.phaseData[p.key].length){
      phasesSnapshot.push({
        label: p.label, section: p.section,
        exercises: state.phaseData[p.key].map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10, technicalScore: ex?.technicalScore ?? null, tacticalScore: ex?.tacticalScore ?? null, physicalScore: ex?.physicalScore ?? null, cognitiveScore: ex?.cognitiveScore ?? null, hasScoreSnapshot: true}; })
      });
    }
  });
  state.extraSections.forEach(s => {
    if(s.exercises.length){
      phasesSnapshot.push({
        label: s.label, section: null,
        exercises: s.exercises.map(id => { const ex=exById(id); return {id, name: ex?ex.name:'(missing)', duration: ex?.duration||10, technicalScore: ex?.technicalScore ?? null, tacticalScore: ex?.tacticalScore ?? null, physicalScore: ex?.physicalScore ?? null, cognitiveScore: ex?.cognitiveScore ?? null, hasScoreSnapshot: true}; })
      });
    }
  });
  // A random suffix (not just the timestamp) keeps two coaches' ids from ever colliding if they
  // both happen to save in the same millisecond -- astronomically unlikely, but free to guard
  // against now that ids are shared across everyone's devices instead of just one browser.
  const id = 'S' + Date.now() + Math.random().toString(36).slice(2,7);
  const wantedName = state.sessionName.trim() || `${dayName()} Session — ${state.savedSessions.length+1}`;
  const name = uniqueSessionName(wantedName);
  const newSession = {
    id, name,
    totalMin: total, exCount: count, createdAt: Date.now(), createdBy: state.coachName,
    targetDuration: state.targetDuration, phases: phasesSnapshot,
    practiceDate: state.practiceDate, startTime: state.practiceStartTime || '', location: state.practiceLocation, templateId: state.activeTemplateId,
    rating: 0, comment: '', favorited: false, visibility: 'shared',
    shareToken: newShareToken(),   // minted now so the very first save already carries it (Share Session is then one tap)
    // Only a Custom Session knows these; they let a shared link show "Play Forward - U10 - Balanced".
    focusArea: (state.csDraftGenerated && state.csReviewCfg && state.csReviewCfg.focusArea) || '',
    ageGroup: (state.csDraftGenerated && state.csReviewCfg && state.csReviewCfg.ageGroup) || '',
    sessionStyle: (state.csDraftGenerated && state.csReviewCfg && state.csReviewCfg.sessionStyle) || '',
  };
  state.savedSessions.push(newSession);
  // reset builder
  PHASES.forEach(p => state.phaseData[p.key] = []);
  state.extraSections = [];
  state.reviewGroupOrder = {};
  state.sessionName = defaultSessionName();
  state.practiceDate = todayISODate();
  state.activeTemplateId = null;
  state.showReviewPrompt = false;
  state.csDraftGenerated = false;
  state.csGeneratedSig = null;
  state.csReviewNotes = [];
  state.csReviewExplain = null;
  state.csPlannedByPhase = null;
  nav('home');
  pushSessionToSheet(newSession);
  if(opts && opts.skipConfirm){
    showToast(name !== wantedName.replace(/\s+/g,' ') ? `Saved as \u201c${name}\u201d \u2014 that name was taken` : 'Session saved!');
  } else {
    // Tell the coach it's saved, where to find it, and offer Print / Share right away.
    state.savedSheet = {sessionId:id, renamedFrom: name !== wantedName.replace(/\s+/g,' ') ? name : ''};
    renderOverlay();
    prefetchShareLink(id);      // get the share link ready in the background so Share Session is one tap
  }
}
function closeSavedSheet(){ state.savedSheet = null; renderOverlay(); }
function savedSheetDo(action){
  const sh = state.savedSheet; if(!sh) return;
  state.savedSheet = null; renderOverlay();
  if(action === 'print') openPrintSheet(sh.sessionId);
  else if(action === 'share') shareSavedSession(sh.sessionId);
  else if(action === 'view') openSessionDetail(sh.sessionId);
}

function resetBuilderDraft(){

/* "Duplicate Session": always confirmed first ("Make a copy of this session?" -- see renderOverlay(),
   which also warns when a draft in progress would be discarded), then seeds a
   brand-new, unsaved draft from a saved session's snapshot. The original saved session is only
   ever read here, never mutated -- and since the eventual completeSession() save always mints its
   own fresh id/timestamp regardless of what seeded the draft, nothing special is needed for that. */
function requestDuplicateSession(id){

  state.confirmDuplicateSessionId = id;

function cancelDuplicateSessionModal(){ state.confirmDuplicateSessionId = null; renderOverlay(); }

function duplicateSessionToBuilder(id){
  const src = state.savedSessions.find(s=>s.id===id);
  if(!src) return;
  state.pickingPhase = null; // never carry over a "current phase" highlight from whatever the coach was doing before -- self-contained regardless of whether a guard-modal reset already ran
  const enabledKeys = new Set();
  // Resolve each saved exercise to today's library entry (see resolveSavedExercise) -- copying the
  // saved ids straight across could pull in the wrong drills if the Sheet's ids have moved.
  let leftOut = 0;
  const resolveIds = (list) => list.map(e => resolveSavedExercise(e)).filter((ex, i) => { if(!ex) leftOut++; return !!ex; }).map(ex => ex.id);
  (src.phases||[]).forEach((entry, i) => {
    const p = entry.section ? PHASES.find(p=>p.section===entry.section) : null;
    if(p){
      state.phaseData[p.key] = resolveIds(entry.exercises);
      enabledKeys.add(p.key);
    } else {
      state.extraSections.push({key: 'extra'+Date.now()+i, label: entry.label, exercises: resolveIds(entry.exercises)});
    }
  });
  // Standard phases the source session didn't use at all stay enabled but empty, same as any
  // other fresh draft -- only phases it DID use are guaranteed turned on, matching
  // applyTemplateToBuilder()'s own "at least show what's actually in this" behavior.
  PHASES.forEach(p => { if(enabledKeys.has(p.key)) state.enabledPhaseKeys.add(p.key); });
  state.targetDuration = src.targetDuration || state.targetDuration;
  state.practiceLocation = src.location || state.practiceLocation;
  state.sessionName = `${src.name} — Copy`;
  nav('build');
  showToast(leftOut ? `Copied "${src.name}" — ${leftOut} exercise${leftOut>1?'s':''} no longer in the library left out` : `Duplicated "${src.name}" — edit and save when ready`);
}
function togglePhaseCollapsed(key){

/* Groups the live in-progress draft's phaseData into the 3 PHASE_GROUPS for the Session Review
   summary -- flattens each group's constituent phases (e.g. Warmup + Athletic) into one combined
   exercise list, in PHASES order, and skips any group with nothing in it yet (mirrors the old
   per-phase behavior of only showing a card once it has exercises). Each item keeps its original
   phaseKey so the remove control still targets the correct underlying phase. */
// The natural, unreordered sequence for a group (or a custom/extra section, which behaves like a
// single-phase "group" of one): its phaseKeys' own arrays back to back.
function reviewGroupNaturalOrder(groupKey){
  const group = PHASE_GROUPS.find(g=>g.key===groupKey);
  if(group){
    const items = [];
    group.phaseKeys.forEach(key => { state.phaseData[key].forEach(id => items.push({id, phaseKey:key})); });
    return items;
  }
  const extra = state.extraSections.find(s=>s.key===groupKey);
  return extra ? extra.exercises.map(id => ({id, phaseKey:groupKey})) : [];
}
// A group's actual display sequence -- the coach's drag-reordered order from
// state.reviewGroupOrder if one has been set (reviewExGripMove below), falling back to the
// natural phase-by-phase order, and gracefully absorbing any exercise added/removed since the
// custom order was last saved (dropped ids are skipped, new ids are appended at the end).
function reviewGroupFlatOrder(groupKey, byWorkflow){
  const natural = reviewGroupNaturalOrder(groupKey);
  const custom = state.reviewGroupOrder[groupKey];
  let ordered = natural;
  if(custom && custom.length){
    const byId = new Map(natural.map(it=>[it.id,it]));
    ordered = custom.map(id=>byId.get(id)).filter(Boolean);
    natural.forEach(it => { if(!custom.includes(it.id)) ordered.push(it); });
  }
  if(byWorkflow){
    // Custom Session's Review always lists a group in the regular workflow order -- Activate: Warmup then Athletic;
    // Develop: Duels, Rondos, then Small Sided Games; Play: Scrimmage -- keeping the coach's own order only among
    // exercises from the same section (Array.sort is stable).
    const group = PHASE_GROUPS.find(g => g.key === groupKey);
    if(group){
      const rank = it => { const i = group.phaseKeys.indexOf(it.phaseKey); return i === -1 ? group.phaseKeys.length : i; };
      ordered = ordered.slice().sort((a, b) => rank(a) - rank(b));
    }
  }
  return ordered;
}
function reviewPhaseGroups(byWorkflow){
  // Every group always shows, even with zero exercises -- a coach reviewing a session should
  // see the full six-phase structure and notice a gap, not have an empty group silently vanish
  // as if that part of the practice didn't exist.
  return PHASE_GROUPS.map(group => {
    const items = reviewGroupFlatOrder(group.key, byWorkflow);
    const mins = items.reduce((a,it)=>a+(exById(it.id)?.duration||10),0);
    return {...group, items, mins};
  });
}

/* ============ PRACTICE SETUP (batch 68) ============
   Lightweight setup screen between Home's "Build New Session" and the existing Build page. Only
   ever writes into the live/committed practice fields (sessionName, targetDuration,
   practiceLocation, practiceDate, activeTemplateId, phaseData, extraSections) at the moment the
   bottom CTA is tapped (startFromSetup) -- everything above that point lives in Setup's own draft
   fields (state.setup*) so back-navigation can never leave behind a stray mutated or accidental
   empty practice. */
function setSetupName(v){ state.setupName = v; }
function applySetupSchedule(){
  const sc = scheduleFor(state.setupDate), t = state.setupTouched || {};
  if(!sc) return;
  if(!t.start) state.setupStartTime = sc.start;
  if(!t.dur) state.setupDuration = sc.duration;
  if(!t.loc) state.setupLocation = sc.location;
}
function setSetupDate(v){ state.setupDate = v; applySetupSchedule(); render(); }
function setSetupStartTime(v){ if(v){ state.setupStartTime = v; (state.setupTouched = state.setupTouched || {}).start = true; } render(); }
function setSetupDuration(v){ state.setupDuration = v; state.setupEditingDuration = false; (state.setupTouched = state.setupTouched || {}).dur = true; render(); }
function toggleSetupCustomDurationEdit(){
  state.setupEditingDuration = true;

  setTimeout(()=>{ const el=document.getElementById('setupCustomDurInput'); if(el){ el.focus(); el.select(); } }, 0);
}
function commitSetupCustomDuration(rawVal){
  (state.setupTouched = state.setupTouched || {}).dur = true;
  const n = parseInt(String(rawVal).replace(/[^0-9]/g,''), 10);
  if(!isNaN(n) && n>0) state.setupDuration = Math.max(15, n);
  state.setupEditingDuration = false;
  setTimeout(render, 0);
}
function setSetupLocation(loc){ state.setupLocation = loc; (state.setupTouched = state.setupTouched || {}).loc = true; render(); }

// coach can freely change their mind before ever committing via the bottom CTA.
function selectSetupTemplate(id){

  render();
}

// Build Practice's "< Setup" button (batch 70): jump back to Practice Setup to tweak this
// already-in-progress practice's name/date/duration/location/template. Unlike initSetupDraft()
// (fresh-start defaults), this seeds Setup's draft fields from the CURRENT practice, and
// startFromSetup() above detects the in-progress practice and skips its usual exercise wipe.
function editPracticeSetup(){
  state.setupName = state.sessionName;
  state.setupDate = state.practiceDate;
  state.setupStartTime = state.practiceStartTime;
  state.setupDuration = state.targetDuration;
  state.setupLocation = state.practiceLocation;
  state.setupTouched = {start:true, dur:true, loc:true};   // editing a practice already in progress: never overwrite its values
  state.setupSelectedTemplateId = state.activeTemplateId;
  state.setupEditingDuration = false;
  nav('practiceSetup');
}
function startFromSetup(){
  const templateId = state.setupSelectedTemplateId;
  // Every pre-existing way to reach Practice Setup (Home's "Build New Session" when nothing's in
  // progress, or "Start New Session" from the in-progress guard, which wipes first) only ever lands
  // here with an empty practice. Batch 70 added a second way in -- editPracticeSetup(), the new
  // "< Setup" button on an already-in-progress Build Practice page -- so this reset now only runs
  // when there genuinely isn't a practice to lose yet, checked against real state (survives a
  // reload) rather than a separate flag that could drift out of sync with it.
  const hasExistingPractice = currentTotalMinutes().count > 0;

  if(!hasExistingPractice){
    // Clean slate of exercises -- same reset confirmDiscardSession()/startNewSessionDiscardingDraft()
    // already use, which never touches enabledPhaseKeys/phaseOrder since those are the coach's own
    // persistent Settings preference, not per-practice state (see PHASES's comment above).
    PHASES.forEach(p => state.phaseData[p.key] = []);
    state.extraSections = [];
    state.showReviewPrompt = false;
  }

  if(templateId && getTemplate(templateId)){
    applyTemplateToBuilder(templateId); // existing function -- exact same one the Build page's own "Load a template" uses
    markTemplateUsed(templateId);
  }

  // The coach's own choices on this Setup page take priority over a template's stored defaults
  // (a template's duration is just its typical/default length, not a hard requirement for today).
  state.sessionName = (state.setupName || '').trim() || defaultSessionName();
  state.practiceDate = state.setupDate || todayISODate();
  state.practiceStartTime = state.setupStartTime || state.practiceStartTime || '17:00';
  state.targetDuration = state.setupDuration;
  state.practiceLocation = state.setupLocation;
  state.activeTemplateId = templateId || null;

  state.setupSelectedTemplateId = null;
  nav('build');
}

// Recompute a saved session's headline stats after its phases are edited -- mirrors the same
// count/sum completeSession() does when a session is first saved.
function recomputeSavedSessionStats(s){
  let count = 0, total = 0;
  s.phases.forEach(p => { count += p.exercises.length; p.exercises.forEach(e => { total += e.duration||10; }); });
  s.exCount = count;
  s.totalMin = total;
}
// Editing exercises on an already-saved session is fully separate from the live build-a-new-
// session draft (state.phaseData/extraSections) -- a saved session's exercises are frozen
// snapshot objects, not just ids, so these mutate s.phases directly instead of routing through
// addToPhase/removeFromPhase.
function removeExerciseFromSavedSession(sessionId, exerciseId, savedName){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  if(!s) return;
  let removedName = '';
  s.phases.forEach(p => {
    const idx = p.exercises.findIndex(e=>e.id===exerciseId && (savedName===undefined || e.name===savedName));
    if(idx!==-1 && !removedName){ removedName = p.exercises[idx].name; p.exercises.splice(idx,1); }
  });
  s.phases = s.phases.filter(p => p.exercises.length);
  recomputeSavedSessionStats(s);
  if(removedName){ showToast(`Removed "${removedName}" from ${s.name}`); pushSessionToSheet(s); }
  render();
}
function addExerciseToSavedSession(sessionId, exerciseId){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  const ex = exById(exerciseId);
  if(!s || !ex) return;
  if(isExerciseInSavedSession(sessionId, exerciseId)){ showToast(`"${ex.name}" is already in this session`); return; }
  const phaseObj = PHASES.find(p=>p.section===ex.section);
  let target = s.phases.find(p => p.section === ex.section);
  if(!target){
    target = {label: phaseObj ? phaseObj.label : (ex.section||'Other'), section: ex.section||null, exercises: []};
    s.phases.push(target);
  }
  target.exercises.push({id: ex.id, name: ex.name, duration: ex.duration||10, technicalScore: ex.technicalScore ?? null, tacticalScore: ex.tacticalScore ?? null, physicalScore: ex.physicalScore ?? null, cognitiveScore: ex.cognitiveScore ?? null, hasScoreSnapshot: true});
  recomputeSavedSessionStats(s);
  showToast(`Added "${ex.name}" to ${s.name}`);
  render();
  pushSessionToSheet(s);
}
function isExerciseInSavedSession(sessionId, exerciseId){
  const s = state.savedSessions.find(s=>s.id===sessionId);
  return !!(s && s.phases.some(p => p.exercises.some(e => { const r = resolveSavedExercise(e); return r && r.id===exerciseId; })));
}

  const mode = state.sessionsViewMode || 'mine';
  const mine = state.savedSessions.filter(s => s.createdBy === state.coachName);
  const community = state.savedSessions.filter(s => s.visibility !== 'private');
  const all = (mode==='mine' ? mine : community).slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const shown = all.slice(0, 5);
  const {count: draftCount} = currentTotalMinutes();
  const hasDraft = draftCount > 0;

  const draftAge = (state.csDraftGenerated && state.csReviewCfg && state.csReviewCfg.ageGroup) || '';
  const draftMeta = [`${state.targetDuration} min`, draftAge ? escHtml(draftAge) : '', state.practiceLocation === 'indoor' ? 'Indoor' : 'Outdoor'].filter(Boolean).join(' &middot; ');
  const continueHtml = hasDraft ? `
    <section class="ss-section">
      <h2 class="ss-h2">Continue Session</h2>
      <button class="ss-continue" onclick="resumeDraftFromSessions()">
        <span class="ss-continue-body">
          <span class="ss-continue-top"><span class="ss-continue-name">${escHtml(state.sessionName.trim() || 'Untitled session')}</span><span class="ss-draft-pill">Draft</span></span>
          <span class="ss-continue-meta">${draftMeta} &middot; ${draftCount} exercise${draftCount===1?'':'s'}</span>
        </span>
        <span class="hm-chev">${ICONS.chevronRight}</span>
      </button>
    </section>` : '';

  const toggle = `
    <div class="view-toggle" style="margin-top:10px;">
      <button class="view-toggle-btn ${mode==='mine'?'active':''}" onclick="setSessionsViewMode('mine')">${ICONS.user} My Sessions</button>
      <button class="view-toggle-btn ${mode==='community'?'active':''}" onclick="setSessionsViewMode('community')">${ICONS.globe} Community</button>
    </div>
    ${state.sessionsSyncSource==='offline' ? `<div class="sync-banner">${ICONS.image}<span>Couldn't reach the shared session sheet just now — showing the last known list. Reopen this tab once you're back online to refresh it.</span></div>` : ''}`;

  const recentBody = shown.length
    ? `<div class="hm-list" style="margin-top:12px;">${shown.map(sessionsHubRowHtml).join('')}</div>
       <button class="ss-viewall" onclick="openSessionsAll()"><span>${mode==='mine' ? 'View All Sessions' : 'View All Community Sessions'}</span>${ICONS.chevronRight}</button>`
    : (mode==='mine'
        ? `<div class="ss-empty"><div class="ss-empty-title">No saved sessions yet.</div><div>Your completed sessions will appear here.</div></div>`
        : `<div class="ss-empty"><div class="ss-empty-title">Community Sessions</div><div>Sessions shared by the FT2 coaching community will appear here.</div></div>`);

  const hasTemplates = state.practiceTemplates.length > 0;
  const templatesHtml = `
    <section class="ss-section">
      <h2 class="ss-h2">Templates</h2>
      <div class="ss-sub">Reusable session structures to help you get started.</div>
      ${hasTemplates ? '' : `<div class="ss-empty" style="margin-top:12px;"><div class="ss-empty-title">No templates yet.</div><div>Create a template to save a session structure you can reuse.</div></div>`}
      <div class="settings-group" style="margin-top:12px;">
        ${hasTemplates ? `
        <button class="settings-row" onclick="openMyTemplatesFromSessions()">
          <span class="settings-row-icon purple">${ICONS.clipboard}</span>
          <span class="settings-row-text">
            <span class="settings-row-title">My Templates</span>
            <span class="settings-row-desc">Your saved session templates</span>
          </span>
          <span class="settings-row-chevron">${ICONS.chevronRight}</span>
        </button>` : ''}
        <button class="settings-row" onclick="createTemplateFromSessions()">
          <span class="settings-row-icon gold">${ICONS.plus}</span>
          <span class="settings-row-text">
            <span class="settings-row-title">${hasTemplates ? 'Create New Template' : '+ Create New Template'}</span>
            <span class="settings-row-desc">Build and save your own session template</span>
          </span>
          <span class="settings-row-chevron">${ICONS.chevronRight}</span>
        </button>
      </div>
    </section>`;

  return `
  <div class="section-pad ss-page">
    ${navPageTitleHtml('Sessions', 'Manage your sessions, drafts, and templates.')}
    ${continueHtml}
    <section class="ss-section">
      <h2 class="ss-h2">Recent Sessions</h2>
      ${toggle}
      ${recentBody}
    </section>
    ${templatesHtml}
  </div>`;
}
function renderSessionsAll(){
  const mode = state.sessionsViewMode || 'mine';
  const mine = state.savedSessions.filter(s => s.createdBy === state.coachName);
  const community = state.savedSessions.filter(s => s.visibility !== 'private');
  const list = (mode==='mine' ? mine : community).slice().reverse().sort((a,b) => (b.favorited?1:0) - (a.favorited?1:0));

function setSessionRating(id, val){
  const s = state.savedSessions.find(s=>s.id===id);
  if(s){ s.rating = (s.rating===val) ? 0 : val; pushSessionToSheet(s); } // tap the same star again to clear the rating
  render();
}
function setSessionComment(id, val){
  const s = state.savedSessions.find(s=>s.id===id);
  if(s){ s.comment = val; pushSessionToSheet(s); }
}
/* Same grouping as reviewPhaseGroups(), but for a SAVED session's frozen `phases` snapshot
   (matched by `.section` name back to a PHASES entry, since a snapshot doesn't carry phase
   keys) instead of the live draft. A custom/extra section (section:null) belongs to no group
   and is rendered separately, exactly as it already was before this batch. */
function sessionDetailPhaseGroups(s){
  return PHASE_GROUPS.map(group => {
    const items = [];
    s.phases.forEach(p => {
      const phaseObj = PHASES.find(ph => ph.section === p.section);
      if(phaseObj && group.phaseKeys.includes(phaseObj.key)) items.push(...p.exercises);
    });
    const mins = items.reduce((a,e)=>a+(e.duration||10),0);
    return {...group, items, mins};
  }).filter(group => group.items.length);
}

/* ============ PRINT / EXPORT ============
   Turns a SAVED session into a field-ready document: an actual PDF or a single shareable image, in a Pocket
   (4 x 5.5 in) or Full Page (8.5 x 11 in) layout. Everything is drawn on canvas pages from the saved session +
   the live exercise library (Setup / Activity / Coaching point come straight from the repository text, trimmed
   at sentence boundaries -- nothing is written for the coach). The PDF is a small hand-written container around
   those page images (JPEG), so it prints at the right size and needs no library. New layouts = one more entry in
   PRINT_LAYOUTS. Layout units are PDF points (1/72 in). */
const PRINT_LAYOUTS = {
  // w / h = the exact page in inches. c1f / c2f = share of the content width for the title and diagram columns.
  // f* = font sizes in points at full size; ftRenderPages() shrinks (down to minNote) and then shortens the
  // notes until the WHOLE session fits on that one page.
  pocket:{label:'Pocket', size:'4.25" \u00d7 5.5"', desc:'Compact field-side reference', w:4.25, h:5.5, dpi:240, m:11, c1f:0.21, c2f:0.27, gap:4,
          fTitle:7, fTime:5.6, fNote:6, fBanner:6.5, fHead:12, fMeta:5.8, banH:10.5, pad:3, foot:7, setupN:110, actN:170, coachN:110, minNote:4.6},
  half:{label:'Half Page', size:'5.5" \u00d7 8.5"', desc:'Easy to read on a clipboard', w:5.5, h:8.5, dpi:210, m:18, c1f:0.21, c2f:0.27, gap:6,
        fTitle:9, fTime:7, fNote:7.6, fBanner:8.5, fHead:18, fMeta:7.2, banH:13.5, pad:4.5, foot:9, setupN:150, actN:230, coachN:150, minNote:5.6},
  full:{label:'Full Page', size:'8.5" \u00d7 11"', desc:'Detailed coaching plan', w:8.5, h:11, dpi:200, m:30, c1f:0.2, c2f:0.27, gap:10,
        fTitle:11, fTime:9, fNote:9.5, fBanner:11, fHead:28, fMeta:10, banH:18, pad:7, foot:14, setupN:200, actN:320, coachN:200, minNote:6.3},
};
const PRINT_BODY_FONT = '"Inter", "Helvetica Neue", Arial, sans-serif';
const PRINT_HEAD_FONT = '"Barlow Condensed", "Arial Narrow", sans-serif';
// "linear-gradient(90deg, #a, #b)" token -> [#a, #b] (falls back to a flat colour).
function ftCssGradient(v, flat){
  const raw = ftCssColor(v);
  const hex = raw.match(/#[0-9a-fA-F]{3,8}/g);
  return hex && hex.length >= 2 ? [hex[0], hex[1]] : [flat, flat];
}
// Small line icons (24x24 grid) drawn straight onto the canvas.
const FT_ICON_PATHS = {
  calendar:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
  clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',
  stopwatch:'M12 8v5l3 2M9 2h6M12 2v3M12 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16z',
  users:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1M17 4a3.5 3.5 0 0 1 0 7M22 20v-1a5 5 0 0 0-3.5-4.8',
  pin:'M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12zM12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
  Activate:'M13 2L4 14h7l-1 8 9-12h-7z',
  Develop:'M4 4l5 5M9 4l-5 5M15 20a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM17 4l3 3-3 3',
  Play:'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3',
};
function ftDrawIcon(ctx, key, x, y, size, color, width){
  const d = FT_ICON_PATHS[key]; if(!d) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(size/24, size/24);
  ctx.strokeStyle = color; ctx.lineWidth = width || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke(new Path2D(d));
  ctx.restore();
}
function ftCssColor(v){
  const m = /var\((--[\w-]+)\)/.exec(v || '');
  const raw = m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : String(v || '');
  return raw || '#64748B';
}
// First `maxSent` sentences of a repository text, cut at a word boundary if it is still longer than maxChars.
function ftBrief(text, maxSent, maxChars){
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  if(!t) return '';
  const sents = t.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g) || [t];
  let out = sents.slice(0, maxSent).join(' ').trim();
  if(out.length > maxChars){
    out = out.slice(0, maxChars);
    out = out.slice(0, Math.max(out.lastIndexOf(' '), 20)).replace(/[,;:\s]+$/, '') + '…';
  }
  return out;
}
function ftImageUrl(ex){
  const u = ex && ex.mediaUrl;
  if(!u) return '';
  if(u.startsWith('data:image')) return u;
  if(isVideoUrl(u)) return thumbUrlFor(u);
  try{
    const file = decodeURIComponent(u.split('#')[0].split('?')[0].split('/').pop());
    return /\.(png|jpe?g|gif|webp)$/i.test(file) ? encodeURIComponent(file) : '';   // same-origin copy in the repo, so the canvas stays exportable
  }catch(e){ return ''; }
}
function ftLoadImage(src){
  return new Promise(res => {
    if(!src) return res(null);
    const im = new Image();
    const t = setTimeout(() => res(null), 8000);
    im.crossOrigin = 'anonymous';
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = src;
  });
}
// Text-trimming levels used when a long session still doesn't fit after shrinking: [cap multiplier, activity sentences].
const FT_TRIM_LEVELS = [[1, 2], [0.8, 2], [0.62, 1], [0.5, 1], [0.4, 1]];
const FT_DIAGRAM_K = [1, 1, 0.9, 0.8, 0.7];   // extra diagram shrink per trim level (the diagram also follows the type scale)
function ftPrintModel(s, L, level){
  const [capK, actSent] = FT_TRIM_LEVELS[level || 0];
  let n = 0;
  const mk = (e) => {
    n++;
    const ex = resolveSavedExercise(e);
    return {n, name: ex ? ex.name : e.name, mins: Number(e.duration) || (ex && ex.duration) || 0, unavailable: !ex,
      img: ex ? ftImageUrl(ex) : '',
      setup: ex ? ftBrief(ex.setup, 1, Math.round(L.setupN * capK)) : '',
      activity: ex ? ftBrief(ex.description, actSent, Math.round(L.actN * capK)) : '',
      coaching: ex ? ftBrief(ex.coachingPoints, 1, Math.round(L.coachN * capK)) : ''};
  };
  const groups = sessionDetailPhaseGroups(s).map(g => ({label:g.label, mins:g.mins, color:ftCssColor(g.color), grad:ftCssGradient(g.bg, ftCssColor(g.color)), dark:g.textOn === 'dark', items:g.items.map(mk)}));
  s.phases.filter(p => !PHASES.some(ph => ph.section === p.section) && p.exercises.length).forEach(p => {
    groups.push({label:p.label, mins:p.exercises.reduce((a,e)=>a+(Number(e.duration)||0),0), color:'#475569', grad:['#475569','#64748B'], dark:false, items:p.exercises.map(mk)});
  });
  const dateText = formatPracticeDateShort(s.practiceDate) || new Date(s.createdAt || Date.now()).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  const target = Number(s.targetDuration) || Number(s.totalMin) || 0;
  const start = timeToMin(s.startTime) !== null ? s.startTime : '';
  // Each phase's own clock window, laid end to end from the start time.
  let offset = 0;
  groups.forEach(g => { g.timeText = start ? timeRangeLabel(start, offset, g.mins) : ''; offset += g.mins; });

// Greedy word wrap; `runs` = [{t, bold}] words (so a bold label can lead a normal-weight sentence).
function ftWrapRuns(ctx, runs, maxW, fN, fB){
  const lines = []; let cur = [], w = 0;
  const sp = (() => { ctx.font = fN; return ctx.measureText(' ').width; })();
  runs.forEach(r => {
    ctx.font = r.bold ? fB : fN;
    const rw = ctx.measureText(r.t).width;
    if(cur.length && w + sp + rw > maxW){ lines.push(cur); cur = []; w = 0; }
    w += (cur.length ? sp : 0) + rw;
    cur.push(r);
  });

}
function ftRuns(label, text){
  const runs = label ? [{t:label, bold:true}] : [];
  String(text||'').split(' ').filter(Boolean).forEach(w => runs.push({t:w, bold:false}));
  return runs;
}
function ftDrawLine(ctx, line, x, y, fN, fB, color){
  const sp = (() => { ctx.font = fN; return ctx.measureText(' ').width; })();
  let cx = x;
  line.forEach((r,i) => {
    ctx.font = r.bold ? fB : fN;
    ctx.fillStyle = color;
    ctx.fillText(r.t, cx, y);
    cx += ctx.measureText(r.t).width + sp;

  const m = {PW, PH, M, CW, c1, c2, c3, fT, fN, fB, badge, lhT, lhN, imgH, badgeGap:Math.max(3.5, L.fTitle * 0.6)};   // room between the number circle and the title

    const h1 = Math.max(it.titleLines.length * lhT, badge) + 1.5 + L.fTime * 1.25;
    const notes = it.unavailable
      ? [ftWrapRuns(mc, ftRuns('Exercise unavailable:', 'This exercise is no longer in the FT2 exercise library.'), c3, fN, fB)]
      : [['Setup', it.setup], ['Activity', it.activity], ['Coaching point', it.coaching]].filter(n => n[1]).map(n => ftWrapRuns(mc, ftRuns(n[0] + ':', n[1]), c3, fN, fB));

  m.headH = m.bandH;
  m.banGap = L.fMeta * 0.5;

}
async function ftRenderPages(s, layoutKey){

  }catch(e){}
  const logo = await ftLoadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_PRINT));
  const base = ftPrintModel(s, L0, 0);

    for(let k = 1; k >= floorK - 0.001; k -= 0.025){
      const kk = Math.max(k, floorK);

async function ftBuildPdf(canvases, wPt, hPt){
  const enc = new TextEncoder(), chunks = [], offs = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  const jpgs = [];

  obj(2, () => push(`<< /Type /Pages /Kids [${jpgs.map((_,i) => `${3+3*i} 0 R`).join(' ')}] /Count ${n} >>`));
  jpgs.forEach((p, i) => {
    const pid = 3+3*i, cid = 4+3*i, iid = 5+3*i;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wPt} ${hPt}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`));
    const content = `q ${wPt} 0 0 ${hPt} 0 0 cm /Im0 Do Q`;
    obj(cid, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); push(p.bytes); push('\nendstream'); });
