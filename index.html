     exactly; existing app variable names kept so every component that already reads them
     picks up the new values with no call-site changes. See CLAUDE.md "Color system". */
  --bg-main:#FFFFFF;       /* Light Surface */
  --bg-surface:#F8FAFC;    /* Light Background */
  --text-primary:#0F172A;  /* Primary Text */
  --text-secondary:#64748B;/* Secondary Text */
  --border-color:#E5E7EB;  /* Light Border */
  --accent-volt:#F7FF00;   /* FT2 Yellow -- primary CTA / logo field */

  --pitch:#0F172A;        /* structural chrome (nav/header/tiles) -- lightens in dark mode below */
  --pitch-dark:#0B0F1A;
  --chrome:#0F172A;        /* topbar/bottomnav background specifically -- same as --pitch in light
                               mode (already reads clearly against the light page), but kept as
                               its own token so dark mode (below) can lift it a step above
                               --bg-surface without touching every other --pitch consumer
                               (tiles, numbered badges, etc.) */
  --chalk:var(--bg-main);
  --chalk-dim:var(--bg-surface);
  --turf:#14B8A6;          /* Teal -- general interactive accent (focus rings, buttons, progress,
                               "added"/selected states, avatar, star ratings). Not one of the six
                               phase colors -- deliberately its own hue so it never reads as a
                               specific phase. */
  --turf-dim:#CCFBF1;
  --cone:var(--accent-volt);
  --cone-dim:#FAFAD8;
  --sky-dim:#DBEAFE;       /* Home's Quick Access tiles -- pastel backdrops only, not phase colors */
  --mint-dim:#D1FAE5;
  --warn:#EF4444;          /* Destructive */
  --warn-dim:#F8DCD7;
  --set-blue:#3B82F6;      /* Settings icon-tile accents only -- generic UI colors, deliberately
                               distinct from the six phase colors (not sec-rondos/sec-duels). */
  --set-blue-dim:#DBEAFE;
  --set-purple:#6366F1;
  --set-purple-dim:#E0E7FF;
  --ink:var(--text-primary);
  --ink-soft:var(--text-secondary);
  --line:var(--border-color);
  --white:var(--bg-surface);

  /* Six practice-phase colors -- each a flat "start" hex (gradient's first stop; used for text
     color and border-color, which can't take a CSS gradient the simple way) plus a matching
     -bg gradient token (used for actual fill surfaces: card thumbnails, detail header, chips). */
  --sec-warmup:#FF6B6B;
  --sec-warmup-bg:linear-gradient(90deg,#FF6B6B,#FF8A3C);
  --sec-athletic:#FF8A3C;
  --sec-athletic-bg:linear-gradient(90deg,#FF8A3C,#F97316);
  --sec-duels:#7C3AED;
  --sec-duels-bg:linear-gradient(90deg,#7C3AED,#A855F7);
  --sec-rondos:#06B6D4;
  --sec-rondos-bg:linear-gradient(90deg,#06B6D4,#0EA5E9);
  --sec-ssg:#10B981;
  --sec-ssg-bg:linear-gradient(90deg,#10B981,#22C55E);
  --sec-scrimmage:#F59E0B;
  --sec-scrimmage-bg:linear-gradient(90deg,#F59E0B,#EAB308);
  --claret-dim:#FFE8E5;
  --burnt-orange:#B5561E;

  /* ============ STRUCTURAL DESIGN TOKENS (spacing / type / radius / shadow / state) ============
     Shape-and-rhythm tokens only -- no color values live here. Added to give every component a
     single shared scale to pull from instead of one-off literals. See CLAUDE.md for the phased
     rollout that introduced these. */

  /* spacing -- 4px base */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;
  --space-8:40px;
  --space-9:48px;

  /* type scale -- collapses ~23 ad hoc sizes down to these steps */
  --fs-2xs:10px;
  --fs-xs:11px;
  --fs-sm:12px;
  --fs-base:13px;
  --fs-md:14px;
  --fs-input:16px; /* protected: every real text input/textarea uses this and nothing smaller,
                       so iOS Safari never auto-zooms on focus */
  --fs-lg:17px;
  --fs-xl:19px;
  --fs-2xl:22px;
  --fs-display:28px;

  /* radius -- 4 tiers */
  --radius-chip:8px;
  --radius-control:12px;
  --radius-card:14px;
  --radius-pill:9999px;
  --radius-circle:50%;

  /* icon-button sizes -- 4 tiers, collapsing 8 near-duplicate one-off sizes down to these.
     sm/md sized down for a more compact, Nike/Peloton-style chrome density; lg/xl left alone --
     those are already at/above the ~44px minimum comfortable touch target and stay there. */
  --icon-btn-sm:26px;
  --icon-btn-md:32px;
  --icon-btn-lg:44px;
  --icon-btn-xl:52px;

  /* shadow -- split by job, not just visual weight */
  --shadow-rest:none;
  --shadow-raised:0 3px 10px rgba(0,0,0,0.08);
  --shadow-overlay:0 -10px 30px rgba(0,0,0,0.2);
  --shadow-chrome:0 -4px 18px rgba(0,0,0,0.18);
  --ring-focus:0 0 0 1.5px var(--turf);
  --ring-status:0 0 0 3px var(--cone);

  /* state */
  --opacity-disabled:0.4;
  --transition-fast:150ms ease;
  --transition-sheet:220ms cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  --bg-main:#0B0F1A;      /* Primary Dark */
  --bg-surface:#1C2535;   /* Dark Surface -- deliberately a clear step lighter than --bg-main so grouped cards/rectangles stay visible instead of reading black-on-black */
  --text-primary:#FFFFFF;
  --text-secondary:#94A3B8;/* Muted Text */
  --border-color:#2D394C; /* Dark Gray -- lifted along with --bg-surface so card outlines still read */
  --accent-volt:#F7FF00;
  --pitch:#111827;       /* lighter than --bg-main so tiles/chrome stay visible, not black-on-black */
  --pitch-dark:#1F2937;
  --chrome:#151E2E;       /* one step lighter than the old dark surface (#111827) so nav/header chrome
                              reads as its own layer instead of blending into cards/content */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-main:#0B0F1A;
    --bg-surface:#1C2535;
    --text-primary:#FFFFFF;
    --text-secondary:#94A3B8;
    --border-color:#2D394C;
    --accent-volt:#F7FF00;
    --pitch:#111827;
    --pitch-dark:#1F2937;
    --chrome:#151E2E;
  }
}
*{box-sizing:border-box;overflow-wrap:break-word;}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
img,video{max-width:100%;}
body{
  background:#DCD8CC;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#shell{
  max-width:430px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  background:var(--chalk);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.15);
}
.display{
  font-family:'Inter',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
}
.eyebrow{
  font-family:'Inter',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-size:var(--fs-sm);
  color:var(--turf);
}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
/* keyboard-focus ring: shows only for keyboard/switch-control navigation, never on a mouse/touch
   tap, so it doesn't fight the app's existing tap-feedback styles */
:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--turf);outline-offset:2px;
}
a{color:inherit;text-decoration:none;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 18px 10px;
  background:var(--chrome);
  background-image:repeating-linear-gradient(115deg, rgba(242,169,59,0.06) 0 3px, transparent 3px 22px);
  color:var(--white);
  position:relative;
}
.topbar .brand{
  display:flex;align-items:center;gap:8px;
}
.brand-home{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.brand-home:active{opacity:0.75;}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--cone);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);color:white;
}
.brand-name{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-xl);letter-spacing:0.02em;}
.topbar-icons{display:flex;gap:14px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.08);
  color:white;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.icon-btn svg{width:16px;height:16px;}
/* Touch targets: the visible circles stay 34px/32px, but an invisible ::after extends each one's
   tappable area to ~46px/44px (insets are measured from the padding box, inside each control's
   1-2px border) -- still under the 14px gap between controls so neighboring hit areas never overlap. */
.icon-btn::after,.avatar::after{content:'';position:absolute;border-radius:50%;}
.icon-btn::after{inset:-7px;}
.avatar::after{inset:-8px;}
.icon-btn,.avatar{transition:transform .1s ease,opacity .1s ease;}
.icon-btn:active,.avatar:active{transform:scale(0.92);opacity:0.75;}
.avatar{
  position:relative;padding:0;cursor:pointer;
  width:32px;height:32px;border-radius:50%;
  background:var(--turf);
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-sm);color:white;
  border:2px solid rgba(255,255,255,0.4);
}
.badge-dot{
  position:absolute;top:-2px;right:-2px;
  width:10px;height:10px;border-radius:50%;
  background:var(--cone);border:1.5px solid var(--chrome);
}

/* ---------- content area ---------- */
#content{
  flex:1;
  overflow-y:auto;
  padding-bottom:calc(110px + env(safe-area-inset-bottom)); /* keeps the same clearance above .bottomnav's current height */
  background:var(--chalk);
}
#content::-webkit-scrollbar{width:0;}
/* Session Setup/Build Session/Session Review's fixed workflow CTA (see #workflowFooter) adds
   ~76px on top of the bottom nav it docks above -- #shell carries .has-workflow-cta (toggled in
   render(), based on workflowFooterHtml() actually returning something for the current screen)
   so #content reserves enough extra scroll clearance to clear BOTH, never just the bottom nav. */
#shell.has-workflow-cta #content{
  padding-bottom:calc(190px + env(safe-area-inset-bottom));
}
/* Session Setup / Session Review / Build Session: the last content row (Edit / Save Draft / Discard) is meant to read as one
   group with the Save Session button docked right below it, so at the bottom of the scroll it
   sits flush against the footer's own 12px top padding (i.e. ~12px above the button) instead of
   the usual extra clearance -- footer ~73px + nav ~82px, minus the 16px overlap with that padding. */
#shell.has-workflow-cta.workflow-tight #content{
  padding-bottom:calc(143px + env(safe-area-inset-bottom));
}

.section-pad{padding:16px 18px;}

/* ---------- bottom dock (fixed workflow CTA + permanent bottom nav, stacked as one unit) ----------
   A single positioned wrapper around both, rather than each positioning itself independently --
   guarantees the CTA sits flush immediately above the bottom nav (flex stacking, not separately
   computed offsets) and that both share one fully opaque surface, so scrolled page content can
   never show through the gap between them. */
#bottomDock{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  display:flex;flex-direction:column;
}
/* Only Session Setup/Build Session/Session Review ever populate this (see workflowFooterHtml(),
   called from render()) -- every other screen leaves it empty, which collapses it to zero height
   via :empty below so there's no dead gap above the bottom nav on screens with no workflow CTA. */
#workflowFooter{
  background:var(--chalk); /* opaque, matches the current screen -- same token #content itself uses */
  padding:12px 18px 12px;   /* same white space below the button as above it */
}
#workflowFooter:empty{display:none;}
#workflowFooter .btn-primary{width:100%;padding:14.5px 0;font-size:var(--fs-lg);border-radius:12px;background:#F7FF00;
  border:1.5px solid #B8C2CF; /* small gray outline; padding trimmed by the border width so the button's total height stays 52.5px */}
:root[data-theme="dark"] #workflowFooter .btn-primary{border-color:#64748B;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #workflowFooter .btn-primary{border-color:#64748B;}
}

/* ---------- bottom nav ---------- */
.bottomnav{
  background:var(--chrome);
  display:flex;justify-content:space-around;align-items:stretch;
  /* Scaled 1.75x, then reduced to 80% of that (net 1.4x of the original 7px/6px), per request. */
  padding:10px 9px calc(10px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-chrome);
  border-top:1px solid transparent; /* dark mode gives this a real color below -- light mode
                                        already separates via --shadow-chrome alone */
}
:root[data-theme="dark"] .bottomnav{border-top-color:var(--border-color);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .bottomnav{border-top-color:var(--border-color);}
}
.navitem{
  flex:1;min-width:0;background:none;border:none;color:rgba(255,255,255,0.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:'Inter',sans-serif;
  padding:7px 3px;border-radius:17px;
  transition:background-color var(--transition-fast),color var(--transition-fast);
}
.navitem-label{
  /* Net 1.4x of --fs-2xs (10px) -- a literal value here, not the shared token, so this doesn't
     also resize every other small uppercase label across the app that happens to use --fs-2xs. */
  font-size:14px;font-weight:600;letter-spacing:0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.1;
}
/* Active = the one universal nav accent (--turf), never a phase color -- color alone never
   carries the state alone, a soft teal pill + bolder label weight go with it. */
.navitem.active{color:var(--turf);background:color-mix(in srgb, var(--turf) 18%, transparent);}
.navitem.active .navitem-label{font-weight:700;}
.navitem svg{width:28px;height:28px;flex-shrink:0;}

/* ---------- home ---------- */
/* Quick Access: a 2x2 grid of pastel-tinted tiles, one per shortcut -- each tile's own tint is
   just a visual grouping cue (a "which card is this" anchor), not a phase color or a status
   color, so any of the four dim tokens can sit on any tile. */
.main-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.mac-tile{
  /* Icon on the left, title/subtitle stacked to its right, chevron at the far right -- one
     horizontal row per tile, matching the reference layout (not the earlier icon-on-top design). */
  min-width:0;display:flex;flex-direction:row;align-items:center;gap:9px;
  border:none;border-radius:10px;
  padding:14px 12px;text-align:left;min-height:96px;
}
.mact-icon{
  width:48px;height:48px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  /* Fixed dark, not var(--ink) -- these tiles are always a light pastel chip regardless of
     theme, so their text/icon needs to stay dark too, not flip white in dark mode and vanish
     against a background that never darkens with it. */
  color:#0F172A;
}
.mact-icon svg{width:42px;height:42px;}
.mact-icon img.icon-ball-img{width:42px;height:42px;display:block;}
.mact-body{flex:1;min-width:0;}
.mact-chevron{flex-shrink:0;align-self:center;color:#475569;display:flex;}
.mact-chevron svg{width:15px;height:15px;}
/* overflow-wrap:normal overrides the global *{overflow-wrap:break-word} reset -- without it, a
   long single word like "Exercises" that doesn't quite fit this tile's width breaks mid-word
   ("Exercise" / "s") instead of wrapping at the space before it. */
.mact-label{display:flex;flex-direction:column;gap:1px;text-align:left;font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-sm);color:#0F172A;line-height:1.25;overflow-wrap:normal;}
.mact-stat{font-size:var(--fs-xs);color:#475569;margin-top:3px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.3;}

.feed-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.feed-item.linked{cursor:pointer;}
.feed-item.linked:active{background:var(--chalk-dim);}
.feed-thumb{
  width:46px;height:46px;border-radius:10px;background:var(--claret-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.feed-thumb svg{width:22px;height:22px;color:var(--turf);}
.feed-item .ftitle{font-size:var(--fs-md);font-weight:600;}
.feed-item .fsub{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.feed-item .fchevron{margin-left:auto;align-self:center;color:var(--ink-soft);flex-shrink:0;}
.feed-item .fchevron svg{width:16px;height:16px;}
.feed-tag{
  display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--turf);
  text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;
}

/* ---------- section headers ---------- */
.sh{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 10px;
}
.sh h2{font-family:'Inter',sans-serif;font-size:var(--fs-lg);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin:0;color:var(--text-primary);}
.sh a.see-all,.see-all{font-size:var(--fs-base);color:var(--turf);font-weight:600;padding:4px;display:inline-flex;align-items:center;gap:3px;background:none;border:none;}
.see-all svg{width:13px;height:13px;}

/* ---------- search / filters ---------- */
.searchbar{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:7px 14px;
}
.searchbar:focus-within{border-color:var(--turf);box-shadow:var(--ring-focus);}
.searchbar svg{width:18px;height:18px;color:var(--ink-soft);flex-shrink:0;}
.searchbar input{
  /* 16px minimum keeps iOS Safari from auto-zooming the page when this field gets focus */
  border:none;outline:none;flex:1;font-size:var(--fs-input);background:transparent;color:var(--ink);
}
.searchbar input::placeholder{font-size:var(--fs-base);color:var(--ink-soft);}
.search-clear-btn{
  background:var(--chalk-dim);border:none;border-radius:50%;flex-shrink:0;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}
.search-clear-btn svg{width:11px;height:11px;}
.filter-chip-row{
  display:flex;flex-wrap:nowrap;gap:7px;padding:12px 0 6px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-chip-row::-webkit-scrollbar{display:none;}
/* Section-specific Quick Filters (the "+ Add Exercise" picking screen) -- a lightweight,
   single-select, horizontally-scrolling row, kept visually distinct from the heavier Filters
   button below it so Quick Filters read as "fast" and Filters reads as "advanced". */
.quickfilter-row{
  display:flex;flex-wrap:nowrap;gap:7px;padding:12px 0 2px;
  overflow-x:auto;scrollbar-width:none;
}
.quickfilter-row::-webkit-scrollbar{display:none;}
.qf-chip{
  flex-shrink:0;white-space:nowrap;
  padding:9px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--white);font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);
}
.qf-chip.active{background:var(--turf);border-color:var(--turf);color:white;}
.qf-advanced-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 10px;}
.qf-advanced-btn{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--white);font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);
}
.qf-advanced-btn svg{width:14px;height:14px;}
.balance-btn{
  position:relative;display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:20px;border:1px solid transparent;
  background:color-mix(in srgb, var(--turf) 12%, var(--bg-surface));font-size:var(--fs-base);font-weight:700;color:var(--turf);
  white-space:nowrap;
}
.balance-btn svg{width:20px;height:20px;flex-shrink:0;}
.balance-btn-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
/* ---------- Quick Pick (+ Add Exercise flow) ---------- */
.qp-pill{
  display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;
  padding:12px 14px;border-radius:12px;border:1px solid transparent;
  background:color-mix(in srgb, var(--turf) 12%, var(--bg-surface));color:var(--turf);font-weight:700;font-size:var(--fs-base);
  min-height:44px;
}
.qp-pill svg:first-child{width:19px;height:19px;flex-shrink:0;}
.qp-pill span{flex:1;text-align:left;}
.qp-pill svg:last-child{width:16px;height:16px;flex-shrink:0;opacity:0.7;}
.qp-pill:active{opacity:0.75;}
.qp-filter-btn{
  position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  width:var(--icon-btn-md);height:var(--icon-btn-md);border-radius:12px;border:1px solid var(--line);
  background:var(--white);color:var(--ink-soft);
}
.qp-filter-btn svg{width:16px;height:16px;}
.qp-filter-btn:active{background:var(--chalk-dim);}
/* ---------- Batch 60: combined Search + Advanced Filters row, compact section heading ---------- */
.discovery-row{display:flex;align-items:center;gap:8px;}
.discovery-row .searchbar{flex:1;min-width:0;}
.ex-section-heading{display:flex;align-items:baseline;gap:6px;margin:14px 0 10px;}
.ex-section-heading .esh-name{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.03em;color:var(--text-primary);}
.ex-section-heading .esh-count{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);}
.qp-customize-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line) !important;}
.qp-customize-btn svg{width:15px;height:15px;flex-shrink:0;}
.qp-sheet-header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.qp-info-btn{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--ink-soft);
  background:transparent;color:var(--ink-soft);font-style:italic;font-weight:700;font-size:var(--fs-sm);
  font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;
  line-height:1;padding:0;
}
.qp-info-btn:active{background:var(--chalk-dim);}
.qp-close-btn{
  flex-shrink:0;width:var(--icon-btn-sm);height:var(--icon-btn-sm);border-radius:50%;border:none;
  background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
}
.qp-close-btn svg{width:15px;height:15px;}
.qp-close-btn:active{background:var(--line);}
.qp-info-panel{
  /* background is a fixed light teal in both themes (not a dark-mode-aware token), so the text
     must stay a fixed dark color too -- var(--ink) flips to near-white in dark mode, which made
     this unreadable against the still-light background. */
  background:var(--turf-dim);border:1px solid var(--turf);border-radius:10px;
  padding:10px 12px;font-size:var(--fs-base);line-height:1.5;color:#0F172A;margin:8px 0 10px;
}
.qp-fewer-note{font-size:var(--fs-sm);color:var(--ink-soft);font-style:italic;margin:-2px 0 12px;line-height:1.4;}
.qp-results{touch-action:pan-y;} /* leaves vertical scroll to the browser; the swipe-left handler only looks at horizontal-dominant gestures */
.qp-dots{display:flex;justify-content:center;align-items:center;gap:7px;margin:2px 0 12px;}
.qp-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background-color var(--transition-fast),transform var(--transition-fast);}
.qp-dot.active{background:var(--turf);transform:scale(1.3);}
.qp-pager{display:flex;align-items:center;justify-content:center;gap:22px;margin:2px 0 12px;}
.qp-pager .qp-dots{margin:0;}
.qp-pager-arrow{width:26px;height:26px;border-radius:50%;border:none;background:var(--chalk-dim);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qp-pager-arrow svg{width:12px;height:12px;}
.qp-pager-arrow:active{background:var(--turf-dim);color:var(--turf);}
/* Quick Pick's single card stays a fixed size no matter how much the name/tags/reason text
   would otherwise wrap -- without this, swiping/paging between suggestions of different text
   lengths made the card visibly grow and shrink. The two free-text fields are line-clamped so
   an unusually long name or reason degrades to an ellipsis instead of pushing past the fixed
   height (the tag row is already capped at 3 tags upstream, so it isn't clamped here). */
.qp-fixed-card{height:230px;overflow:hidden;}
.qp-fixed-card .balance-card-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.qp-fixed-card .balance-card-reason{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.balance-sheet-title{display:flex;align-items:center;gap:7px;}
.balance-sheet-title svg{width:19px;height:19px;flex-shrink:0;color:var(--turf);}
.balance-sub{font-size:var(--fs-base);color:var(--ink-soft);line-height:1.5;margin:-2px 0 14px;}
.balance-sub b{color:var(--ink);}
.balance-sub.qp-sub-dark{color:var(--ink);}
.balance-target-heading{
  font-size:var(--fs-base);font-weight:400;color:var(--ink);
  margin:0 0 12px;
}
.balance-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.balance-card-head{display:flex;align-items:center;gap:10px;}
.balance-card-num{
  width:24px;height:24px;border-radius:50%;background:var(--pitch-dark);color:white;
  font-size:var(--fs-sm);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.balance-card-name{font-size:var(--fs-md);font-weight:700;color:var(--ink);line-height:1.3;}
.balance-card-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:1px;}
.balance-card-scores{display:flex;gap:14px;margin-top:9px;font-size:var(--fs-base);font-weight:600;color:var(--ink-soft);}
.balance-card-scores b{color:var(--ink);font-weight:800;}
.balance-card-reason{font-size:var(--fs-base);color:var(--ink-soft);font-style:italic;margin-top:8px;line-height:1.4;}
.balance-add-btn{
  flex-shrink:0;border:1px solid var(--pitch);background:white;color:var(--pitch);
  border-radius:9px;padding:8px 12px;font-size:var(--fs-sm);font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.balance-add-btn.added{background:var(--cone-dim);border:1.5px solid var(--cone);color:#7a4a10;}
/* Quick Pick's own Add button, once tapped, matches the exact solid-neon "Added" treatment used
   on the main Explore Exercises card (.ex-addbtn.added) instead of Balance My Session's softer
   pale-yellow one -- a deliberate difference between the two, not an oversight. */
.balance-add-btn.qp-add-btn.added{background:var(--cone);border:1.5px solid #9B9B9B;color:var(--pitch-dark);}
.balance-add-btn svg{width:12px;height:12px;}
.ex-count-line{font-size:var(--fs-base);font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
.ex-count-eyebrow{font-size:var(--fs-sm);font-weight:800;letter-spacing:0.04em;color:var(--ink);margin-bottom:2px;}
.sec-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:54px;min-height:54px;flex-shrink:0;
  padding:8px 2px 7px;border-radius:11px;border:1px solid var(--line);
  background:var(--white);font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);
  text-align:center;line-height:1.15;
}
.sec-chip svg{width:18px;height:18px;}
.sec-chip.active{border-width:1.5px;}
.sec-chip.morefilters{width:50px;position:relative;}
.sec-chip.morefilters svg{width:19px;height:19px;}
.chip-count-dot{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;
  background:var(--cone);color:var(--pitch-dark);font-size:var(--fs-xs);font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.picking-banner{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--cone-dim);border:1px solid var(--cone);
  border-radius:12px;padding:10px 14px;margin-bottom:6px;
}
.picking-banner .ptxt{font-size:var(--fs-md);font-weight:600;color:#8a3d16;}
.picking-banner button{
  background:var(--cone);color:white;border:none;border-radius:8px;
  padding:9px 14px;font-size:var(--fs-base);font-weight:700;
}

/* ---------- exercise grid ---------- */
.view-toggle{display:flex;gap:8px;margin-top:14px;}
.view-toggle-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-surface);color:var(--ink-soft);font-size:var(--fs-base);font-weight:700;
}
.view-toggle-btn svg{width:14px;height:14px;}
.view-toggle-btn.active{background:var(--pitch);border-color:var(--pitch);color:white;font-weight:800;}
:root[data-theme="dark"] .view-toggle-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .view-toggle-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
}
/* ---------- Batch 60: exercise count + a compact, visually-secondary view toggle share one row ---------- */
.ex-count-line-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;margin-bottom:8px;}
.ex-count-line-row .ex-count-line{margin-bottom:0;}
.view-toggle-compact{display:flex;gap:4px;flex-shrink:0;}
.vtc-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
.vtc-btn svg{width:15px;height:15px;flex-shrink:0;}
.vtc-btn.active{background:var(--pitch);border-color:var(--pitch);color:white;}
:root[data-theme="dark"] .vtc-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .vtc-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
}
.ex-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;
}
/* List view reuses the exact same .ex-card markup as Tile view (same thumbnail, badges, name,
   add button) -- just reflowed into a horizontal row instead of a 2-up grid, so the two views
   always show identical information. */
.ex-grid.list-mode{display:flex;flex-direction:column;grid-template-columns:none;gap:10px;}
.ex-grid.list-mode .ex-card{flex-direction:row;height:84px;}
.ex-grid.list-mode .ex-thumb{width:84px !important;height:84px;flex-shrink:0;}
.ex-grid.list-mode .ex-body{flex:1;justify-content:center;min-width:0;padding:8px 78px 8px 12px;}
.ex-grid.list-mode .ex-name{min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-grid.list-mode .ex-addbtn{
  position:absolute;top:auto;bottom:8px;right:6px;width:auto;margin-top:0;transform:none;
  padding:6px 12px;font-size:var(--fs-sm);
}
/* Favorite icon gets its own list-mode spot (top-right, smaller, darker) instead of inheriting
   Tile view's top:4px/right:4px-over-the-thumb position, which in a wide list row landed over
   the light body background (white was invisible there) and overlapped the Add/Added button
   below it. Bottom-anchoring the button above and top-anchoring this icon leaves a clear gap. */
.ex-grid.list-mode .ex-bookmark{top:6px;right:6px;width:26px;height:26px;}
.ex-grid.list-mode .ex-bookmark svg{width:15px;height:15px;color:var(--ink-soft);}
.ex-grid.list-mode .ex-bookmark.on svg{color:var(--turf);}
.ex-grid.list-mode .added-badge{top:6px;left:6px;bottom:auto;right:auto;}
.ex-grid.list-mode .new-ex-card{flex-direction:row;min-height:84px;height:84px;padding:0 16px;gap:12px;}
.ex-grid.list-mode .ex-card-tags{display:none;}
.ex-pinned-label{
  display:flex;align-items:center;gap:6px;
  font-size:var(--fs-xs);font-weight:800;color:var(--turf);text-transform:uppercase;letter-spacing:0.04em;
  margin:0 0 2px;
}
.ex-pinned-label svg{width:12px;height:12px;}
.ex-pinned-divider{height:1px;background:var(--line);margin:6px 0 10px;}
/* ---------- Batch 60: collapsed "N in [Section]" row replacing pinned full cards by default ---------- */
.ex-added-toggle-row{grid-column:1/-1;margin:0 0 10px;}
.ex-added-toggle{display:flex;align-items:center;gap:6px;width:100%;background:var(--turf-dim);border:1px solid var(--turf);border-radius:10px;padding:9px 12px;font-size:var(--fs-base);font-weight:700;color:var(--turf);}
.ex-added-toggle svg:first-child{width:13px;height:13px;flex-shrink:0;}
.ex-added-toggle span{flex:1;text-align:left;}
.ex-added-toggle svg:last-child{width:12px;height:12px;flex-shrink:0;}
.ex-card{
  background:var(--white);border-radius:14px;border:1px solid var(--line);
  overflow:hidden;text-align:left;padding:0;position:relative;
  display:flex;flex-direction:column;
}
.ex-card.added{box-shadow:0 0 0 3px var(--cone);}
.new-ex-card{
  border:1.5px dashed var(--line);background:var(--chalk-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:76px;color:var(--ink-soft);
  align-self:start; /* grid rows default to stretch -- without this it matches whatever taller
                        exercise card it lands next to instead of staying short */
}
.new-ex-icon{
  width:26px;height:26px;border-radius:50%;background:var(--ink-soft);color:white;
  display:flex;align-items:center;justify-content:center;
}
.new-ex-icon svg{width:13px;height:13px;}
.new-ex-label{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-sm);text-align:center;line-height:1.2;color:var(--ink-soft);}
.ex-thumb{
  height:68px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--pitch);
}
.ex-thumb svg{width:30px;height:30px;opacity:0.85;}
.thumb-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;}
.thumb-placeholder svg{width:19px;height:19px;opacity:0.85;}
.thumb-placeholder-label{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;opacity:0.9;text-align:center;padding:0 6px;line-height:1.3;}
.ex-thumb .dur{
  position:absolute;top:6px;left:6px;
  background:rgba(0,0,0,0.4);color:white;font-size:var(--fs-sm);font-weight:700;
  padding:3px 8px;border-radius:8px;
}
.ex-bookmark{
  position:absolute;top:4px;right:4px;
  width:32px;height:32px;border-radius:50%;
  background:none;border:none;
  display:flex;align-items:center;justify-content:center;
}
.ex-bookmark svg{width:17px;height:17px;color:#fff;}
/* Tile view only -- a favorited icon renders filled WHITE here (not dark green), since the
   icon sits directly over the (often dark) thumbnail image where --turf reads as low
   contrast. The solid bookmarkFilled shape vs. the outline bookmark shape is what signals
   favorited/not, not a color change. List view keeps its own separate, unchanged rule below
   (.ex-grid.list-mode .ex-bookmark.on svg) -- it sits over the light card body there, where
   the dark green stays legible. */
.ex-bookmark.on svg{color:#fff;}
.ex-body{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1;}
.ex-sect{font-size:var(--fs-xs);font-weight:700;color:var(--turf);text-transform:uppercase;letter-spacing:0.05em;}
.ex-name{font-size:var(--fs-md);font-weight:700;line-height:1.25;margin:3px 0 7px;min-height:34px;}
.ex-addbtn{
  width:100%;border:1px solid var(--pitch);background:white;color:var(--pitch);
  border-radius:9px;padding:10px 0;font-size:var(--fs-base);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
  margin-top:auto;
}
.ex-addbtn svg{width:12px;height:12px;}
.ex-addbtn:active{opacity:0.7;}
.ex-addbtn.added{background:var(--cone);border:1.5px solid #9B9B9B;color:var(--pitch-dark);}
.added-badge{
  position:absolute;top:6px;left:6px;
  background:var(--cone);color:var(--pitch-dark);width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.added-badge svg{width:12px;height:12px;}

/* empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
}
.empty-state svg{width:40px;height:40px;color:var(--line);margin-bottom:11px;}
.empty-state p{font-size:var(--fs-md);margin:0;line-height:1.5;}

/* ---------- bottom sheet (filters) ---------- */
.sheet-backdrop{
  position:absolute;inset:0;background:rgba(20,26,22,0.45);
  z-index:55;
  opacity:0;transition:opacity var(--transition-sheet);
}
.sheet-backdrop.is-open{opacity:1;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--white);border-radius:20px 20px 0 0;
  max-height:82%;overflow-y:auto;
  padding:6px 18px calc(20px + env(safe-area-inset-bottom));
  z-index:56;
  box-shadow:var(--shadow-overlay);
  transform:translateY(100%);transition:transform var(--transition-sheet);
}
.sheet.is-open{transform:translateY(0);}
.sheet-handle{
  width:36px;height:4px;background:var(--line);border-radius:3px;
  margin:10px auto 14px;position:relative;touch-action:none;cursor:grab;
}
/* a generous invisible grab area around the little bar so it is easy to catch with a thumb */
.sheet-handle::after{content:'';position:absolute;left:-70px;right:-70px;top:-14px;bottom:-14px;}
.sheet > h3:first-of-type, .sheet > .sheet-handle + h3{touch-action:none;}
.sheet h3{font-family:'Inter',sans-serif;font-size:var(--fs-xl);margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-primary);}
.sheet h3:first-of-type{margin-top:0;}
.optrow{display:flex;gap:8px;flex-wrap:wrap;}
.opt{
  padding:10px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--chalk);font-size:var(--fs-md);font-weight:600;color:var(--ink-soft);
}
.opt.active{background:var(--turf);border-color:var(--turf);color:white;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;}
.toggle-row span{font-size:var(--fs-md);font-weight:600;}
.switch{width:46px;height:26px;border-radius:14px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--turf);}
.switch .dot{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--bg-surface);transition:left .15s;}
.switch.on .dot{left:22px;}
.sheet-footer{display:flex;gap:10px;margin-top:18px;}
.btn{
  border:none;border-radius:12px;padding:15px 0;font-weight:700;font-size:var(--fs-md);
  flex:1;text-align:center;
}
.btn-primary{background:#F7FF00;color:#0B0F1A;border:1.5px solid #B8C2CF;padding:13.5px 0;}   /* light-grey edge so the yellow reads on white */
:root[data-theme="dark"] .btn-primary{border-color:#64748B;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-primary{border-color:#64748B;} }
.btn-ghost{background:var(--chalk-dim);color:var(--ink);}
/* A clearly-a-button secondary: dark outline (same family as the app's selected-option outline). */
.btn-edge{border:1px solid var(--line);padding:14px 0;background-clip:padding-box;}   /* light-grey edge, same as the selectable option cards */
.btn-ghost.btn-edge{background:transparent;}
.btn-outline{background:var(--bg-surface);color:var(--ink);border:1.5px solid var(--ink);padding:13.5px 0;}
/* An icon dropped straight into a .btn's text (e.g. "${ICONS.check} Save Exercise") had no size
   rule of its own, so it rendered at the SVG's unconstrained intrinsic size -- fixes that for
   every .btn everywhere, not just the new Setup CTA that exposed it. */
.btn svg{width:16px;height:16px;vertical-align:-3px;flex-shrink:0;}

/* ---------- dark iOS-style alert (in-progress-session guard) ---------- */
.ios-alert-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:55;display:flex;align-items:center;justify-content:center;}
.ios-alert{width:min(300px, 84%);background:#2C2C2E;border-radius:16px;padding:20px 18px 16px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,0.4);}
.ios-alert h3{font-family:'Inter',sans-serif;font-size:var(--fs-lg);font-weight:700;color:#fff;margin:0 0 6px;}
.ios-alert p{font-size:var(--fs-base);color:rgba(255,255,255,0.7);margin:0 0 16px;line-height:1.4;}
.ios-alert-btns{display:flex;flex-direction:column;gap:8px;}
.ios-alert-btn{border:none;border-radius:11px;padding:13px 0;font-weight:700;font-size:var(--fs-md);background:rgba(255,255,255,0.08);color:#fff;width:100%;}
.ios-alert-btn.primary{background:#0A84FF;color:#fff;}
.ios-alert-btn.danger{background:rgba(255,255,255,0.08);color:#FF6B4A;}

/* ---------- detail page ---------- */
.detail-header{
  background:var(--pitch);color:white;padding:16px 18px 20px;position:relative;
}
.backbtn{
  background:rgba(255,255,255,0.15);border:none;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:white;margin-bottom:14px;
}
.backbtn svg{width:19px;height:19px;}
.detail-header .dpill{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);color:var(--white);
  font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:5px 10px;border-radius:8px;margin-bottom:8px;
}
.detail-header .dpill svg{width:13px;height:13px;flex-shrink:0;}
.detail-header .dpill img{width:16px;height:16px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,0.85);flex-shrink:0;}
.section-select-wrap{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:9px;padding:6px 11px;margin-bottom:8px;min-height:34px;
}
.section-select-wrap svg{width:14px;height:14px;flex-shrink:0;}
select.section-select{
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  padding:0;cursor:pointer;
}
select.section-select:focus-visible{outline:2px solid var(--turf);outline-offset:2px;}
select.section-select option{color:var(--ink);background:var(--bg-surface);text-transform:none;}
.section-select-cat{font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;opacity:0.85;}
.draft-pill{background:rgba(0,0,0,0.28) !important;margin-left:8px;margin-bottom:0;}
.back-to-session-pill{
  display:flex;align-items:center;gap:6px;
  background:#fff;color:var(--pitch-dark);border:none;border-radius:20px;
  padding:8px 14px;font-size:var(--fs-base);font-weight:700;min-height:34px;margin-bottom:14px;
  box-shadow:0 1px 5px rgba(0,0,0,0.3);
}
.back-to-session-pill svg{width:13px;height:13px;}
.back-pill-flat{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--chalk-dim);color:var(--ink);border:1px solid var(--line);border-radius:20px;
  padding:8px 14px;font-size:var(--fs-base);font-weight:700;min-height:44px;
}
.back-pill-flat svg{width:13px;height:13px;}
.draft-actions{display:flex;gap:10px;padding:14px 18px 0;}
.draft-hint{padding:0 18px 6px;font-size:var(--fs-sm);color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.draft-hint svg{width:10px;height:10px;flex-shrink:0;opacity:0.7;}
.detail-header h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-0.03em;font-size:var(--fs-display);line-height:1.08;margin:0 0 12px;font-weight:700;}
.stat-row{display:flex;gap:10px;}
.sd-saved-caption{margin-top:10px;font-size:var(--fs-sm);color:rgba(255,255,255,0.65);}
.stat{background:rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;flex:1;}
.stat .snum{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-xl);}
.stat .slbl{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.7);}
.snum-row{display:flex;align-items:baseline;gap:4px;}
.snum-editable{outline:none;border-radius:4px;min-width:10px;display:inline-block;}
.snum-editable:hover{background:rgba(255,255,255,0.15);}
.snum-editable:focus{background:rgba(255,255,255,0.25);box-shadow:0 0 0 1.5px currentColor;}
.snum-suffix{font-size:var(--fs-sm);font-weight:600;}
.stat-value{min-height:24px;display:flex;align-items:center;}
select.diff-select{
  /* Deliberately smaller than the Duration/Format value text -- "3 · Intermediate" needs the
     room, and .stat-value's shared min-height + flex centering keeps its baseline lined up with
     the other two pills regardless of the font-size difference. */
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);line-height:1.2;
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  width:100%;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
select.diff-select:focus-visible{outline:2px solid var(--turf);outline-offset:2px;}
select.diff-select option{color:var(--ink);background:var(--bg-surface);}

/* compact "eyebrow" line above the title -- replaces the old Section + Indoor/Outdoor pill
   row, freeing up header height. Indoor/Outdoor now lives down by the Tags list instead. */
.detail-eyebrow{
  display:flex;align-items:center;gap:6px;margin-bottom:5px;
  font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  opacity:0.95;
}
.detail-eyebrow svg{width:13px;height:13px;flex-shrink:0;}
.detail-eyebrow select{
  background:transparent;border:none;outline:none;-webkit-appearance:none;appearance:none;
  font:inherit;color:inherit;padding:0;cursor:pointer;
}
.detail-eyebrow select option{color:var(--ink);background:var(--bg-surface);text-transform:none;}
.detail-eyebrow .eyebrow-cat{opacity:0.85;}

.detail-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.detail-block-head h4{margin:0;}
.add-tag-trigger{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--turf);font-size:var(--fs-sm);font-weight:700;padding:4px 2px;flex-shrink:0;
}
.add-tag-trigger svg{width:12px;height:12px;}
.loc-select-pill{
  /* Deliberately its own accent (not the neutral tagpill gray) so Indoor/Outdoor reads as a
     distinct setting, not just another tag in the list. */
  display:inline-flex;align-items:center;gap:5px;
  background:var(--turf-dim);border:1px solid var(--turf);color:var(--turf);
  font-size:var(--fs-sm);font-weight:700;padding:5px 9px 5px 10px;border-radius:8px;
}
:root[data-theme="dark"] .loc-select-pill{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .loc-select-pill{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.14);color:var(--text-primary);}
}
.loc-select-pill svg{width:12px;height:12px;flex-shrink:0;}
.loc-select-pill select{
  border:none;background:transparent;outline:none;font-size:var(--fs-sm);font-weight:700;
  color:var(--turf);-webkit-appearance:none;appearance:none;padding:0;cursor:pointer;
}
.loc-select-pill select option{color:var(--ink);background:var(--bg-surface);}
:root[data-theme="dark"] .loc-select-pill select{color:var(--text-primary);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .loc-select-pill select{color:var(--text-primary);}
}
.tag-picker-sheet .tp-cat-label{
  font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:0.05em;margin:12px 0 6px;
}
.tag-picker-sheet .tp-cat-label:first-of-type{margin-top:2px;}

.diagram-box{
  margin:16px 18px 0;
  height:150px;border-radius:14px;
  background:var(--turf);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.diagram-box svg{width:100%;height:100%;}

.detail-block{padding:15px 18px;}
.detail-block h4{
  font-family:'Inter',sans-serif;font-size:var(--fs-md);text-transform:uppercase;
  letter-spacing:0.05em;color:var(--text-primary);margin:0 0 7px;
}
.detail-block p{font-size:var(--fs-lg);line-height:1.6;margin:0;color:var(--ink);white-space:pre-line;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;}
.tagpill{
  background:var(--chalk-dim);border:1px solid var(--line);color:var(--ink-soft);
  font-size:var(--fs-sm);font-weight:600;padding:var(--space-2) var(--space-3);border-radius:var(--radius-chip);
}
.divider{height:1px;background:var(--line);margin:0 18px;}

.tprof-block{padding-top:4px;padding-bottom:11px;}
.tprof-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.tprof-row-unscored{opacity:0.6;}
.tprof-label{width:76px;flex:0 0 76px;font-size:var(--fs-base);font-weight:600;color:var(--ink);}
.tprof-dots{display:flex;gap:4px;flex:0 0 auto;}
.tprof-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0;}
.tprof-dot.on{background:var(--pitch-dark);}
.tprof-num{font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);min-width:14px;text-align:right;}
.tprof-row-unscored .tprof-num{font-weight:500;}

.pprof-block{margin-top:18px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;}
.pprof-block h4{font-family:'Inter',sans-serif;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.05em;color:var(--text-primary);margin:0 0 11px;}
.pprof-rows{display:flex;flex-direction:column;gap:9px;}
.pprof-row{display:flex;align-items:center;gap:10px;}
.pprof-row-unscored{opacity:0.55;}
.pprof-label{width:72px;flex:0 0 72px;font-size:var(--fs-base);font-weight:600;color:var(--ink);}
.pprof-bar{flex:1;height:11px;border-radius:6px;background:var(--chalk-dim);overflow:hidden;}
.pprof-bar-fill{height:100%;border-radius:6px;background:var(--pitch-dark);}
.pprof-num{width:32px;flex:0 0 32px;text-align:right;font-size:var(--fs-base);font-weight:700;color:var(--ink-soft);}
.pprof-interpretation{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-base);line-height:1.5;color:var(--ink-soft);}

.detail-actions{
  display:flex;gap:10px;padding:16px 18px 4px;
}
.iconbtn-lg{
  width:var(--icon-btn-xl);height:var(--icon-btn-xl);border-radius:12px;border:1px solid var(--line);background:var(--bg-surface);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.iconbtn-lg svg{width:21px;height:21px;color:var(--ink);}
/* Bookmarked state intentionally keeps the same gray box (no cone tint) -- the solid
   bookmarkFilled shape (vs. the outline bookmark shape) is already what signals "bookmarked,"
   so the icon simply renders solid black like its outline counterpart, not a color change. */
.add-session-btn{
  flex:1;background:var(--pitch);color:white;border:none;border-radius:12px;padding:15px 0;
  font-weight:700;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-session-btn svg{width:17px;height:17px;}
.add-session-btn:active{opacity:0.7;}
.add-session-btn.added{background:var(--cone);color:var(--pitch-dark);border:1.5px solid #9B9B9B;}

.similar-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.sim-card{
  flex-shrink:0;width:120px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;padding:9px;
  display:flex;flex-direction:column;align-items:stretch;text-align:left;
}
.sim-card .sname{font-size:var(--fs-base);font-weight:700;line-height:1.25;margin-top:7px;text-align:left;color:var(--text-primary);}
.sim-thumb{height:48px;border-radius:8px;background:var(--pitch);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0;}
.sim-thumb svg{width:20px;height:20px;color:rgba(255,255,255,0.85);}

/* ---------- build a session ---------- */
.duration-target{
  display:flex;gap:8px;margin-top:4px;
}
.dtarget{
  flex:1;padding:13px 0;text-align:center;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-surface);font-weight:700;font-family:'Inter',sans-serif;font-size:var(--fs-lg);color:var(--ink-soft);
  min-height:46px;
}
.dtarget.active{background:var(--pitch);border-color:var(--pitch);color:white;font-weight:800;}
.dtarget-input{
  flex:1;min-width:0;padding:13px 4px;text-align:center;border-radius:10px;border:1.5px solid var(--turf);
  background:var(--turf-dim);font-weight:700;font-family:'Inter',sans-serif;font-size:var(--fs-lg);color:var(--ink);
  outline:none;min-height:46px;
}
/* New Session setup screen: Duration stacks its 60/75/90 row above a full-width Custom pill,
   since the two-column Date+Duration layout only leaves ~half the screen width per card -- not
   enough for four pills on one line. */
.duration-target.col{display:flex;flex-direction:column;gap:6px;margin-top:9px;}
.duration-target-row{display:flex;gap:6px;}
.duration-target.col .dtarget{padding:10px 0;font-size:var(--fs-base);min-height:47.5px;box-sizing:border-box;}
.dtarget.full,.dtarget-input.full{width:100%;flex:none;}

/* compact, de-emphasized practice-settings row */
.practice-settings-row{display:flex;gap:10px;margin-top:14px;}
.practice-setting-group{flex:1;min-width:0;}
.ps-label{font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.ps-label.with-icon{display:flex;align-items:center;gap:5px;}
.ps-label.with-icon svg{width:13px;height:13px;flex-shrink:0;}
.duration-target.compact{gap:5px;}
.dtarget.compact{
  padding:7px 0;font-size:var(--fs-sm);min-height:30px;border-radius:8px;
}
.dtarget-input.compact{padding:7px 2px;font-size:var(--fs-sm);min-height:30px;border-radius:8px;}
.location-toggle{display:flex;gap:5px;}
.loc-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);
  font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);min-height:30px;
}
.loc-btn svg{width:12px;height:12px;flex-shrink:0;}
.loc-btn.active{background:var(--pitch);border-color:var(--pitch);color:white;font-weight:800;}
/* New Session setup screen: Location is a primary, full-size control here (not the de-emphasized
   compact row used in Build's settings panel), so it gets a real touch target -- scoped to this
   screen's wrapper class rather than changing the shared .loc-btn default used elsewhere. */
.setup-loc-toggle{gap:8px;margin-top:4px;}
.setup-loc-toggle .loc-btn{padding:13px 4px;font-size:var(--fs-base);min-height:48px;border-radius:10px;gap:6px;}
.setup-loc-toggle .loc-btn svg{width:15px;height:15px;}
.session-name-wrap{position:relative;margin-top:2px;}
.session-name-wrap .session-name-input{margin-top:0;padding-right:26px;}
.session-name-pencil{
  position:absolute;right:2px;top:6px;color:var(--ink-soft);opacity:0.55;pointer-events:none;
}
.session-name-pencil svg{width:15px;height:15px;display:block;}
.session-name-input{
  width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-0.03em;font-weight:700;font-size:var(--fs-2xl);color:var(--ink);
  padding:4px 0 8px;outline:none;margin-top:2px;
}
.session-name-input:focus{border-color:var(--turf);}
.session-name-input::placeholder{color:var(--ink-soft);font-weight:600;opacity:0.6;}
.progress-wrap{margin-top:14px;}
.progress-track{height:9px;background:var(--chalk-dim);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF6B6B 0%,#FF8A3C 20%,#7C3AED 40%,#06B6D4 60%,#10B981 80%,#F59E0B 100%);background-size:400px 100%;border-radius:6px;transition:width .2s;}
.progress-fill.over{background:var(--warn);}
.phase-progress-row{margin-top:6px;}
.phase-over-tag{color:var(--warn);font-weight:700;}
.progress-caption{display:flex;justify-content:space-between;margin-top:7px;font-size:var(--fs-base);color:var(--ink-soft);}
.progress-caption b{color:var(--ink);}

/* ---------- suggested time split / comparison panel ---------- */
.time-panel{margin-top:16px;background:var(--bg-surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.time-panel-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:15px 14px;background:none;border:none;text-align:left;min-height:48px;
}
.tp-summary{font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:6px;}
.tp-summary b{font-family:'Inter',sans-serif;font-size:var(--fs-lg);}
.tp-sep{color:var(--line);}
.tp-chevron{color:var(--ink-soft);display:flex;transition:transform .15s;flex-shrink:0;}
.tp-chevron svg{width:16px;height:16px;transform:rotate(90deg);}
.tp-chevron.open svg{transform:rotate(-90deg);}
.tp-body{padding:0 13px 13px;border-top:1px solid var(--line);padding-top:12px;}
.sb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sb-header-title{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
.sb-total{font-family:'Inter',sans-serif;font-size:var(--fs-md);font-weight:700;color:var(--ink-soft);}
.sb-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chalk-dim);margin-bottom:6px;}
.sb-row{border-top:1px solid var(--line);padding:12px 0;}
.sb-row:first-child{border-top:none;}
.sb-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sb-row-left{display:flex;align-items:center;gap:9px;min-width:0;}
.sb-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.sb-row-label{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.sb-row-sublabel{font-size:var(--fs-2xs);color:var(--ink-soft);}
.sb-row-status{flex-shrink:0;display:flex;align-items:center;}
.sb-check{color:var(--turf);display:flex;}
.sb-check svg{width:16px;height:16px;}
.sb-diff{font-size:var(--fs-xs);font-weight:800;white-space:nowrap;}
.sb-row-bottom{display:flex;align-items:center;gap:10px;margin-top:8px;}
.sb-row-mins{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;}
.sb-row-track{flex:1;height:5px;}
.sb-row-fill{height:100%;border-radius:6px;transition:width .2s;}

.phase-strip{margin-top:20px;position:relative;}
.phase-card{
  position:relative;
  display:flex;gap:12px;
  padding-bottom:16px;
}
.phase-line{
  position:relative;width:26px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
}
.phase-num{
  width:30px;height:30px;border-radius:50%;background:var(--pitch);color:white;
  display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);
  flex-shrink:0;z-index:2;
}
.phase-num.empty{background:var(--line);color:var(--ink-soft);}
.phase-connector{
  flex:1;width:2px;background:var(--line);margin-top:2px;
}
.phase-content{flex:1;padding-top:2px;}
.phase-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.phase-title{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);text-transform:uppercase;letter-spacing:0.02em;}
.phase-time{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;flex-shrink:0;}
.phase-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.phase-icon-btn{
  width:var(--icon-btn-md);height:var(--icon-btn-md);border-radius:50%;border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.phase-icon-btn svg{width:14px;height:14px;}
.phase-del-icon{background:var(--warn-dim);color:var(--warn);}
.phase-add-pill{
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  background:var(--turf);color:white;border:none;border-radius:16px;
  padding:8px 13px 8px 10px;font-size:var(--fs-sm);font-weight:700;min-height:34px;
  white-space:nowrap;
}
.phase-add-pill svg{width:12px;height:12px;flex-shrink:0;}
.phase-add-pill:active{opacity:0.7;}
.phase-time-divider{width:1px;height:14px;background:var(--line);flex-shrink:0;}
/* "Warmup + Athletic" style subtitle under a merged phase-group's title, naming which of the
   original 6 sections were combined into it. */
.phase-group-sub{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;margin:1px 0 8px;}
.phase-exlist{margin-top:9px;display:flex;flex-direction:column;gap:8px;}
.phase-ex-item{
  display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px 9px 8px;transition:box-shadow 150ms ease;
}
.phase-ex-item.dragging{position:relative;z-index:5;box-shadow:0 12px 28px -10px rgba(0,0,0,0.32),0 2px 8px rgba(0,0,0,0.14);cursor:grabbing;}
.phase-ex-remove{background:none;border:none;color:var(--ink-soft);opacity:0.5;padding:6px;display:flex;flex-shrink:0;}
.phase-ex-remove:active{opacity:0.8;}
.phase-ex-remove svg{width:15px;height:15px;}
.pei-thumb{
  width:64px;height:48px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.pei-thumb svg{width:19px;height:19px;}
.pei-thumb img,.pei-thumb video{width:100%;height:100%;object-fit:cover;}
.pei-thumb-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;}
.pei-thumb-fallback svg{width:15px;height:15px;opacity:0.9;}
.pei-thumb-fallback-label{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;opacity:0.9;text-align:center;line-height:1.2;padding:0 3px;}
.phase-ex-item .peiname{flex:1;font-size:var(--fs-md);font-weight:600;}
.phase-ex-item .peiname.peiname-missing{font-style:italic;font-weight:500;color:var(--ink-soft);}
.phase-ex-item .peidur{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;}
.phase-ex-item button{background:none;border:none;color:var(--ink-soft);padding:8px;display:flex;margin:-8px;}
.phase-ex-item button svg{width:15px;height:15px;}
.addsection-row{margin-top:6px;}
.addsection-btn{
  width:100%;border:1px solid var(--line);background:var(--chalk-dim);border-radius:10px;
  padding:13px 16px;font-size:var(--fs-md);font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:flex-start;gap:6px;text-align:left;
}
.addsection-btn svg{width:14px;height:14px;flex-shrink:0;}
.settings-toggle-row{
  width:100%;border:1px solid var(--line);background:var(--chalk-dim);border-radius:10px;
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:10px;
}
.settings-toggle-row .stl-label{display:flex;align-items:center;gap:8px;font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.settings-toggle-row .stl-label svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}

/* ---------- settings screen (landing page) ---------- */
.settings-page-heading{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-xl);color:var(--ink);margin:4px 0 3px;}
.settings-page-sub{font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 16px;}
.settings-section-label{font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:20px 2px 8px;}
.settings-section-label:first-of-type{margin-top:4px;}
.settings-account-card{
  display:flex;align-items:center;gap:12px;width:100%;
  border:1px solid var(--line);background:var(--bg-surface);border-radius:var(--radius-card);
  padding:14px;
}
.settings-avatar{
  width:44px;height:44px;border-radius:50%;background:var(--turf);color:white;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);
}
.settings-account-text{flex:1;min-width:0;display:flex;flex-direction:column;}
.settings-account-name{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.settings-account-desc{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.settings-group{
  border:1px solid var(--line);background:var(--bg-surface);border-radius:var(--radius-card);
  overflow:hidden;
}
.settings-row{
  width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;
  border:none;background:none;text-align:left;
}
.settings-row + .settings-row{border-top:1px solid var(--line);}
.settings-row-icon{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.settings-row-icon svg{width:16px;height:16px;}
.settings-row-icon.teal{background:var(--turf-dim);color:var(--turf);}
.settings-row-icon.blue{background:var(--set-blue-dim);color:var(--set-blue);}
.settings-row-icon.purple{background:var(--set-purple-dim);color:var(--set-purple);}
.settings-row-icon.gold{background:var(--cone-dim);color:#8a611a;}
.settings-row-text{flex:1;min-width:0;display:flex;flex-direction:column;}
.settings-row-title{font-size:var(--fs-md);font-weight:700;color:var(--ink);}
.settings-row-desc{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:2px;}
.settings-row-chevron{color:var(--ink-soft);flex-shrink:0;display:flex;}
.settings-row-chevron svg{width:16px;height:16px;}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed;}

/* ---------- build screen: one full-width section per row ---------- */
.build-progress-line{display:flex;align-items:center;gap:9px;margin-top:10px;}
.build-progress-line .progress-track{flex:1;}
.build-progress-line span{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;flex-shrink:0;white-space:nowrap;}
.phase-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;}
.phase-box{background:var(--bg-surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 14px 14px;}
.phase-box.next-up{background:var(--chalk-dim);}
/* "Filled" = this section already has exercises in it. Previously looked identical to an empty
   section (aside from the tiny minute count), so a coach couldn't tell at a glance what was done.
   Turf green (the app's established "added/complete" color, same as exercise-card added badges)
   plus a small checkmark badge on the icon makes progress genuinely visible on the page. */
.phase-box.filled{border-color:var(--turf);box-shadow:0 0 0 1px var(--turf);}
.phase-box-header{margin-bottom:4px;}
.phase-box-header.with-icon{display:flex;align-items:center;gap:8px;}
.phase-box-body{flex:1;min-width:0;}
.phase-box-toprow{display:flex;align-items:center;gap:8px;}
.phase-box-subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
.phase-box-subrow-actions{display:flex;align-items:center;}
.pb-icon-wrap{position:relative;flex-shrink:0;display:flex;}
.pb-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pb-icon svg{width:14px;height:14px;}
/* Flatter, smaller header icon (was 38px "big") -- frees up width so the section title reliably
   fits on one line instead of wrapping ("Small Sided Games" was wrapping to 2 lines before). */
.pb-icon.md{width:36px;height:36px;border-radius:11px;}
.pb-icon.md svg{width:18px;height:18px;}
.pb-filled-badge{
  position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;
  background:var(--turf);color:#fff;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--bg-surface);
}
.pb-filled-badge svg{width:7px;height:7px;}
.phase-box-add-btn{
  background:var(--turf-dim);color:var(--turf);border:none;border-radius:12px;
  padding:8px 14px;font-size:var(--fs-sm);font-weight:800;text-align:center;
  flex-shrink:0;min-height:34px;display:flex;align-items:center;justify-content:center;
}
/* Icon + title now sit flush left as the row's first two elements (the collapse chevron moved to
   the end of the row, below), and the row is a single flex line -- title gets nowrap+ellipsis as
   a safety net, but with the extra width freed up here it fits on one line in practice. */
.phase-box-title{
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.01em;
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.next-up-pill{
  display:inline-block;background:var(--cone);color:var(--pitch-dark);text-transform:none;
  font-size:var(--fs-2xs);font-weight:700;letter-spacing:0.02em;padding:2px 7px;border-radius:20px;
  vertical-align:middle;margin-left:5px;
}
.phase-box-time{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:700;flex-shrink:0;white-space:nowrap;}
.phase-collapse-btn{background:none;border:none;color:var(--ink-soft);flex-shrink:0;padding:7px;display:flex;margin:-7px -7px -7px 0;transition:transform .15s;}
.phase-collapse-btn svg{width:15px;height:15px;transform:rotate(90deg);}
.phase-collapse-btn.collapsed svg{transform:rotate(0deg);}
.phase-box-edit{background:none;border:none;color:var(--ink-soft);flex-shrink:0;padding:7px;display:flex;margin:-6px 0 -6px 0;}
.phase-box-edit svg{width:14px;height:14px;}
.phase-box-del{background:none;border:none;color:var(--warn);flex-shrink:0;padding:7px;display:flex;margin:-6px -7px -6px 0;}
.phase-box-del svg{width:15px;height:15px;}

/* ---------- Build Practice redesign (batch 69) ---------- */
.pcard-add-btn{
  margin-top:11px;width:100%;background:none;border:1.5px dashed var(--line);color:var(--ink-soft);
  border-radius:10px;padding:10px 0;font-size:var(--fs-base);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.phase-box.filled .pcard-add-btn{border-style:solid;}

/* ---------- Build Session phase rows (brand v2) -- a bordered card per phase, colored icon
   tile on the left, the whole card one tap target straight to that phase's exercise picker
   (same destination "+ Add Exercise" always went to). Scoped to its own classes (not a restyle
   of .phase-box/.pcard-add-btn) since those are still used as-is by custom/extra sections on
   this screen and by the saved-session editing view. */
/* .phase-row-wrap is the actual bordered card (matches .phase-box's own header+inline-list
   pattern below) -- .phase-row is just the always-visible summary line inside it (now the one
   that carries the section tint, via inline style, so the wrap itself can stay a neutral surface
   and let an expanded .build-ex-list read as a distinct light-gray body beneath it), so an
   expanded exercise list still reads as part of the same card, not a second floating block. */
.phase-row-wrap{
  background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;
}
.phase-row-wrap.current{border-color:var(--turf);box-shadow:0 0 0 1.5px var(--turf);}
.phase-row-wrap.current .phase-row-title{color:var(--turf);}
.phase-row{display:flex;align-items:stretch;width:100%;}
.phase-row-content{display:flex;align-items:center;gap:14px;flex:1;min-width:0;padding:16px 14px;}
.phase-row-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;}
.phase-row-main:active{opacity:0.8;}
.phase-row-icon{
  /* No padding/margin of its own -- flush against the row's left/top/bottom edges, its height
     matching the row's height exactly via the row's own align-items:stretch. Its own radius (not
     just a clip from the wrap) so all four corners read as rounded, not just the two the wrap's
     overflow:hidden happens to clip. */
  width:80px;flex-shrink:0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.phase-row-icon svg{width:36px;height:36px;}
.phase-row-body{flex:1;min-width:0;}
.phase-row-title{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-md);color:var(--ink);}
.phase-row-sub{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.phase-row-sub svg{width:11px;height:11px;color:var(--turf);vertical-align:-1px;margin-left:3px;display:inline-block;}
.phase-row-sub .prs-starthere{color:var(--set-purple);font-weight:800;} /* indigo, not teal -- the highlighted "current" phase title beside it is already teal */
.phase-row-sub .pcard-sugg{font-weight:600;opacity:0.75;}
.pcard-add-pill{
  /* "+" sits to the left, vertically centered against the two centered text lines beside it
     ("Add" over "Exercise") -- see the .pcard-add-plus/.pcard-add-text children at the call site. */
  border:none;border-radius:14px;padding:8px 14px;font-weight:700;
  flex-shrink:0;display:flex;align-items:center;gap:6px;
}
.pcard-add-plus{font-size:var(--fs-lg);line-height:1;flex-shrink:0;}
.pcard-add-text{display:flex;flex-direction:column;align-items:center;font-size:var(--fs-sm);line-height:1.2;text-align:center;}
.phase-row .phase-collapse-btn{margin:0 -5px 0 -3px;}
.bp-meta-line{font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.bp-meta-edit-btn{background:none;border:none;color:var(--ink-soft);opacity:0.55;padding:3px;display:flex;flex-shrink:0;}
.bp-meta-edit-btn svg{width:12px;height:12px;}
.bp-details-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.bp-progress{margin-top:18px;}
.bp-progress-toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.bp-progress-label{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-base);letter-spacing:0.02em;color:var(--ink);text-transform:uppercase;}
.bp-progress-remaining{font-size:var(--fs-xs);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.02em;white-space:nowrap;}
.bp-progress-remaining.over{color:var(--warn);}
.ex-card-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;}
.tagpill.sm{font-size:var(--fs-2xs);font-weight:700;padding:var(--space-1) var(--space-2);border-radius:var(--radius-chip);}
.extra-box-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-input);text-transform:uppercase;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 3px;flex:1;min-width:0;outline:none;
}
.extra-box-title-input:focus{border-color:var(--turf);}
.phase-box.current .extra-box-title-input{color:var(--turf);}

/* each exercise: image on the left, bullets (from Description + Variations) on the right */
.build-ex-list{margin-top:6px;}
/* .phase-row-wrap has no padding of its own (see above, for the flush-icon layout), so its
   inline exercise list needs its own inset -- .phase-box (custom/extra sections) already has
   that padding on itself, so this stays scoped to just the standard-phase case. */
.phase-row-wrap > .build-ex-list{margin-top:0;padding:6px 14px 14px;background:var(--chalk-dim);}
.build-ex-row{position:relative;display:flex;gap:11px;padding:11px 4px 11px 0;border-top:1px solid var(--line);transition:box-shadow 150ms ease;}
.build-ex-list .build-ex-row:first-child{border-top:none;}
/* Diagram and title/text each take half the row -- equal flex-grow off a 0 basis, with the image
   stretching (flex default cross-axis behavior) to match however tall the text side naturally is. */
.build-ex-image{
  /* Fixed rectangle, not flex:1 -- it used to stretch to match .build-ex-info's height, which grows
     with however many setup/variation bullets an exercise has, so a 3-bullet row made the thumbnail
     tower to match. align-self:flex-start keeps it from stretching even though the row is a flex
     container. */
  width:110px;height:82px;flex:0 0 auto;align-self:flex-start;border-radius:10px;overflow:hidden;background:var(--chalk-dim);
}
.build-ex-image img,.build-ex-image video{width:100%;height:100%;object-fit:cover;display:block;}
.build-ex-image-fallback{
  /* Deliberately a fixed dark neutral, not a theme token or the exercise's section color -- a plain
     "no media yet" placeholder should look the same regardless of section or light/dark theme. */
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#374151;color:#E2E8F0;
}
.build-ex-image-fallback svg{width:20px;height:20px;opacity:0.85;}
.build-ex-image-fallback-label{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;opacity:0.85;text-align:center;line-height:1.2;padding:0 6px;}
.build-ex-info{flex:1;min-width:0;}
.build-ex-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.build-ex-name{font-size:var(--fs-md);font-weight:700;line-height:1.3;}
/* Duration + Replace + Remove all sit in one top-aligned row, evenly spaced -- previously the two
   icon buttons were absolutely positioned in a fixed top-right corner, which could drift out of
   line with the title/duration text and left them crowded together with no breathing room. */
.build-ex-actions{display:flex;align-items:flex-start;gap:10px;flex-shrink:0;}
.build-ex-dur{font-size:var(--fs-sm);color:var(--ink-soft);font-weight:600;flex-shrink:0;white-space:nowrap;padding-top:2px;}
.build-ex-bullets{margin:0;padding-left:15px;}
.build-ex-bullets li{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.45;margin-bottom:2px;}
.build-ex-grip{width:20px;align-self:stretch;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;touch-action:none;cursor:grab;margin-left:-4px;}
.build-ex-grip svg{width:14px;height:14px;}
.build-ex-row.dragging{position:relative;z-index:5;opacity:1;background:var(--bg-surface);border-radius:10px;box-shadow:0 12px 28px -10px rgba(0,0,0,0.32),0 2px 8px rgba(0,0,0,0.14);cursor:grabbing;}
.build-ex-remove{
  background:none;border:none;color:var(--ink-soft);flex-shrink:0;
  opacity:0.38;padding:8px;margin:-8px -6px 0 0;display:flex;
}
.build-ex-remove svg{width:13px;height:13px;}
.build-ex-remove:active{opacity:0.75;}
.build-ex-row .build-ex-replace{
  background:none;border:none;color:var(--turf);flex-shrink:0;
  opacity:0.6;padding:8px;margin:-8px 0 0;display:flex;
}
.build-ex-row .build-ex-replace svg{width:13px;height:13px;}
.build-ex-row .build-ex-replace:active{opacity:0.9;}
.phase-ex-item .build-ex-replace{color:var(--turf);}
.build-ex-empty{font-size:var(--fs-sm);color:var(--ink-soft);text-align:center;padding:14px 0 10px;font-style:italic;}
.build-add-btn{
  width:100%;margin-top:8px;border:1.5px dashed var(--line);background:var(--chalk-dim);
  border-radius:10px;padding:11px 0;font-size:var(--fs-base);font-weight:700;color:var(--turf);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.build-add-btn svg{width:13px;height:13px;}
.session-state-tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;padding:5px 10px;border-radius:20px;flex-shrink:0;}
/* The plain "New"/"In Progress" tags are text-only, but the Session Detail header's Shared/
   Private/By-coach variant (renderSessionDetail()) puts an icon in front of the text -- without an
   explicit size, that SVG rendered at the browser's oversized intrinsic default instead of a small
   inline icon. */
.session-state-tag svg{width:13px;height:13px;flex-shrink:0;}
.session-state-tag.new{background:var(--bg-surface);color:var(--ink-soft);border:1px solid var(--line);}
.session-state-tag.inprogress{background:var(--cone-dim);color:#7a4a10;border:1px solid var(--cone);}
.session-state-tag.saved{background:rgba(255,255,255,0.18);color:white;position:absolute;top:16px;right:18px;}
.discard-session-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.discard-session-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--warn);font-size:var(--fs-sm);font-weight:700;padding:6px 0;}
.discard-session-btn.tmpl-del-btn{color:var(--ink-soft);}
.discard-session-btn svg{width:13px;height:13px;}
.build-cta{
  /* Solid background, not a transparent-to-opaque gradient fade -- the fade let whatever phase
     color was scrolling underneath bleed through unevenly, looking inconsistent from one scroll
     position to the next. */
  position:sticky;bottom:0;background:var(--chalk);
  padding:16px 18px 6px;
}
.build-cta .btn-primary{width:100%;padding:14.5px 0;font-size:var(--fs-lg);border-radius:12px;background:#F7FF00;}

/* ---------- Practice Setup (batch 68) ---------- */
.setup-page-title{
