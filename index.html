  if(!targetKey) return;
  addToPhase(targetKey, id);
  showToast(`Added "${ex.name}" to ${phaseLabel(targetKey)}`);
  renderOverlay(); // keep the sheet open, just refresh this card's Added state
}
/* Combined ranking score for one candidate exercise. Same weight convention as the existing
   exerciseRankingScore(): an explicit signal (this section's primary dimension(s), or the coach's
   own Customize > Training Dimension override) counts x3 per score point; the softer practice-
   balance nudge counts x1, and only when it isn't already one of the primary dimensions (so it's
   never double-counted). A Customize Focus/Format tag match and a close duration fit each add a
   smaller, capped bonus -- present, but never able to outrank a real Training Dimension score
   advantage on their own. */
function quickPickScore(ex, ctx){
  let score = 0;
  ctx.primaryDims.forEach(k => { const v = clampScore(ex[k]); if(v !== null) score += v*3; });
  if(ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null) score += v*1;
  }
  if(ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) score += 4;
  if(ctx.formatTag && (ex.formatTags||[]).includes(ctx.formatTag)) score += 4;
  if(ctx.targetMin > 0){
    const diff = Math.abs((ex.duration||10) - ctx.targetMin);
    score += Math.max(0, 2 - diff/5); // full +2 at an exact match, fading to 0 by ~10min away
  }
  return score;
}
/* Short, data-traceable "why this fits" line -- every clause maps to a real field on the exercise
   (its own Training Dimension score, an actual tag it carries, its actual duration), same
   discipline as the existing balanceRecommendationReason(). Never invents a benefit the exercise's
   own tags/scores don't support, never shows a raw ranking number (the 0-5 Training Dimension
   scores themselves already appear plainly in .balance-card-scores just above -- this line names
   the dimension, not the number). At most one clause per priority tier below, at most 2 total,
   joined short rather than as a sentence:
     1. Exact/close duration fit
     2. An explicit Quick Pick customization match (dimension override, Focus tag, or Format tag)
     3. The section's own default primary dimension(s) -- "Strong"/"Good", same thresholds as
        balanceRecommendationReason() (score>=4 / >=3), combined as "Strong X + Y" when 2 both qualify
     4. The practice-balance dimension this session is currently lightest on
     5/6. Graceful fallback -- whether it's new to this session, and/or its single best dimension,
        and/or (last resort) just its section -- always something true, never nothing. */
function quickPickReason(ex, ctx){
  const dimLabel = k => (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label || '';
  const clauses = [];

  // 1. Duration fit
  const dur = ex.duration || 10;
  if(ctx.targetMin > 0 && Math.abs(dur-ctx.targetMin) <= 2){
    clauses.push(`Fits your ${ctx.targetMin}-min ${ctx.phaseLabel || ex.section} block`);
  }

  // 2. Explicit customization match -- at most one clause from this tier, whichever applies first
  if(clauses.length < 2){
    let customClause = null;
    if(ctx.dimensionOverride && ctx.primaryDims.length){
      const v = clampScore(ex[ctx.primaryDims[0]]);
      if(v !== null && v >= 3) customClause = `Matches your ${dimLabel(ctx.primaryDims[0])} focus`;
    }
    if(!customClause && ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) customClause = `Matches your ${ctx.focusTag} focus`;
    if(!customClause && ctx.formatTag && ctx.formatTag !== ctx.focusTag && (ex.formatTags||[]).includes(ctx.formatTag)) customClause = `Matches your ${ctx.formatTag} focus`;
    if(customClause) clauses.push(customClause);
  }

  // 3. Section's own default primary dimension(s) -- only when not already covered by an
  // explicit override above (that's tier 2's job)
  if(clauses.length < 2 && !ctx.dimensionOverride && ctx.primaryDims.length){
    const scored = ctx.primaryDims.map(k=>({k, v:clampScore(ex[k])})).filter(d=>d.v!==null).sort((a,b)=>b.v-a.v);
    const strong = scored.filter(d=>d.v>=4);
    const good = scored.filter(d=>d.v>=3);
    if(strong.length >= 2) clauses.push(`Strong ${strong.slice(0,2).map(d=>dimLabel(d.k)).join(' + ')}`);
    else if(strong.length === 1) clauses.push(`Strong ${dimLabel(strong[0].k)}`);
    else if(good.length) clauses.push(`Good ${dimLabel(good[0].k)}`);
  }

  // 4. Practice-balance complement
  if(clauses.length < 2 && ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null && v >= 3) clauses.push(`Builds up ${dimLabel(ctx.balanceDim)} (currently lightest)`);
  }

  // 5/6. Fallback -- only reached when nothing above applied. Candidates are already excluded
  // when already-in-session wherever possible (see computeQuickPicks()), so "new to this
  // session" is checked directly rather than assumed, and is never claimed when it isn't true.
  if(!clauses.length){
    if(!isExerciseInAnyPhase(ex.id)) clauses.push('New to this session');
    if(clauses.length < 2){
      const best = TRAINING_DIMENSIONS.map(d=>({label:d.label, v:clampScore(ex[d.key])})).filter(d=>d.v!==null).sort((a,b)=>b.v-a.v)[0];
      if(best && best.v >= 3) clauses.push(`Good ${best.label}`);
      else if(!clauses.length) clauses.push(`Good fit for ${ex.section}`);
    }
  }

  return clauses.slice(0,2).join(' · ');
}
/* Up to 3 recommendations for the section currently being picked for -- always section-scoped
   (rule 4: only ever the current section's own exercises), applies the coach's optional Customize
   choices if any are active, prefers exercises not already in the practice ("when possible" --
   falls back to including them rather than starving the list below 3, exactly like
   computeBalanceRecommendations() already does), and ranks the remainder by quickPickScore(). */
/* Recomputes Quick Pick's recommendation set and freezes it into state.quickPickSnapshot.
   Called only when the sheet opens or Customize is applied (a genuine change of criteria) --
   NEVER on a plain re-render, so tapping [+ Add] on a result doesn't cause computeQuickPicks()'s
   own "exclude already-in-practice when possible" rule to immediately kick the just-added
   exercise out of its own card and swap in a 4th suggestion. */
function refreshQuickPickResults(){
  state.quickPickOffset = 0; // any fresh (non-"next") recompute restarts the Refresh Exercises cycle at the top
  state.quickPickCardIndex = 0;
  state.quickPickSnapshot = computeQuickPicks();
}
/* Shared ranking pass -- same pool/filter/score logic Quick Pick has always used, just returning
   the FULL ordered candidate list (and the ctx it was scored with) instead of only the top 3, so
   "Refresh Exercises" can step to the next window of the same ranking instead of recomputing an
   identical top 3 every time. */
function rankedQuickPickCandidates(){
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  if(!phase) return {section:null, ctx:null, ranked:[], poolSize:0};
  const section = phase.section;
  const c = state.quickPickCustom;
  const primaryDims = c.dimension ? [c.dimension] : (SECTION_PRIMARY_DIMENSIONS[phaseKey] || []);
  const balanceDim = leastEmphasizedDimension();
  const targetMin = quickPickTargetMinutes(phaseKey);

  let pool = EXERCISES.filter(ex => ex.section === section);
  if(c.focus) pool = pool.filter(ex => allTagsFor(ex).includes(c.focus));
  if(c.format) pool = pool.filter(ex => (ex.formatTags||[]).includes(c.format));
  if(c.time){
    // Same 3-bucket convention as matchesFilters()' own Duration filter: <=5, <=10, else "15+".
    pool = pool.filter(ex => {
      const d = ex.duration||10;
      const bucket = d<=5 ? '5' : (d<=10 ? '10' : '15');
      return bucket === c.time;
    });
  }

  const alreadyIn = new Set();
  PHASES.forEach(p => state.phaseData[p.key].forEach(id=>alreadyIn.add(id)));
  state.extraSections.forEach(s => s.exercises.forEach(id=>alreadyIn.add(id)));

  let candidates = pool.filter(ex => !alreadyIn.has(ex.id));
  if(candidates.length < 3) candidates = pool; // prefer unused, but don't starve the list below 3

  const ctx = {primaryDims, balanceDim, targetMin, focusTag: c.focus, formatTag: c.format, phaseLabel: phase.label, dimensionOverride: !!c.dimension};
  const ranked = candidates
    .map(ex => ({ex, score: quickPickScore(ex, ctx)}))
    .sort((a,b) => b.score-a.score || a.ex.name.localeCompare(b.ex.name))
    .map(s=>s.ex);

  return {section, ctx, ranked, poolSize: pool.length};
}
function computeQuickPicks(){
  const {section, ctx, ranked, poolSize} = rankedQuickPickCandidates();
  if(!section) return {section:null, targetMin:0, primaryDims:[], balanceDim:null, items:[], poolSize:0};
  return {section, targetMin:ctx.targetMin, primaryDims:ctx.primaryDims, balanceDim:ctx.balanceDim, items: ranked.slice(0,3), poolSize};
}
/* "Refresh Exercises": steps forward through the same ranked list, 3 at a time, wrapping back to
   the top once it runs past the end -- never a different ranking, just the next window of it. */
function refreshQuickPickNext(){
  const {section, ctx, ranked, poolSize} = rankedQuickPickCandidates();
  if(!section || !ranked.length){ refreshQuickPickResults(); renderOverlay(); return; }
  state.quickPickOffset = (state.quickPickOffset + 3) % ranked.length;
  state.quickPickCardIndex = 0;
  const items = [];
  for(let i=0;i<3 && i<ranked.length;i++) items.push(ranked[(state.quickPickOffset+i) % ranked.length]);
  state.quickPickSnapshot = {section, targetMin:ctx.targetMin, primaryDims:ctx.primaryDims, balanceDim:ctx.balanceDim, items, poolSize};
  renderOverlay();
}
/* One card shows at a time (the pager dots + arrows above it, or a left/right flick, move
   between them) -- stepping past the last card of the current 3 rolls straight into
   refreshQuickPickNext()'s next window of the ranked pool rather than wrapping back to a card
   you already saw, since that's a genuinely new/different suggestion instead of a repeat.
   Stepping "previous" from the first card wraps within the current 3 -- there's no previous
   pool window to go back to, only forward ("Refresh Exercises" never runs in reverse). */
function stepQuickPickCard(delta){
  const items = (state.quickPickSnapshot || computeQuickPicks()).items;
  const n = items.length;
  if(n <= 1) return;
  const next = state.quickPickCardIndex + delta;
  if(next >= n){ refreshQuickPickNext(); return; }
  state.quickPickCardIndex = next < 0 ? n-1 : next;
  renderOverlay();
}
/* A left/right flick over the current card steps to the next/previous one -- see
   stepQuickPickCard() above. Pointer events (not native touch/drag) to match how this app
   already handles every other gesture. Ignores small movements and anything more vertical than
   horizontal, so it never hijacks a normal scroll or a tap on the card's own Add button. */
let qpSwipe = null;
function qpSwipeStart(e){ qpSwipe = {x: e.clientX, y: e.clientY}; }
function qpSwipeEnd(e){
  if(!qpSwipe) return;
  const dx = e.clientX - qpSwipe.x, dy = e.clientY - qpSwipe.y;
  qpSwipe = null;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) stepQuickPickCard(dx < 0 ? 1 : -1);
}
function quickPickCardHtml(ex, i, ctx){
  const inPhase = isExerciseInAnyPhase(ex.id);
  // Pin whichever dimension(s) actually drove this recommendation into the displayed scores
  // first (same "never contradict the reason text" rule balanceCardHtml() already follows), then
  // fill any remaining slot with the exercise's next-strongest other dimension for context.
  const pinnedKeys = new Set(ctx.primaryDims);
  const pinned = ctx.primaryDims
    .map(k => ({label: (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label, score: clampScore(ex[k])}))
    .filter(d => d.score !== null);
  const others = TRAINING_DIMENSIONS
    .filter(d => !pinnedKeys.has(d.key))
    .map(d => ({label:d.label, score:clampScore(ex[d.key])}))
    .filter(d => d.score !== null)
    .sort((a,b) => b.score-a.score);
  const topScores = [...pinned, ...others].slice(0,2);
  const tags = allTagsFor(ex).slice(0,3);
  return `
  <div class="balance-card qp-fixed-card">
    <div class="balance-card-head">
      <div class="balance-card-num">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div class="balance-card-name" onclick="openDetail('${escJsAttr(ex.id)}')" style="cursor:pointer;">${escHtml(ex.name)}</div>
        <div class="balance-card-meta">${ex.duration||10} min</div>
      </div>
      <button class="balance-add-btn qp-add-btn ${inPhase?'added':''}" onclick="quickPickAddExercise('${escJsAttr(ex.id)}')">${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}</button>
    </div>
    ${topScores.length ? `<div class="balance-card-scores">${topScores.map(d=>`<span>${d.label} <b>${d.score}</b></span>`).join('')}</div>` : ''}
    ${tags.length ? `<div class="tag-wrap" style="margin-top:6px;">${tags.map(t=>`<span class="tagpill">${escHtml(t)}</span>`).join('')}</div>` : ''}
    <div class="balance-card-reason">"${escHtml(quickPickReason(ex, ctx))}"</div>
  </div>`;
}
function renderQuickPickCustomizeHtml(){
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  const c = state.quickPickCustom;
  const focusValues = QUICK_FILTERS_BY_PHASE[phaseKey] || [];
  const formatValues = phase ? formatOptionsForSection(phase.section) : [];
  return `
  <div class="sheet-backdrop" onclick="closeQuickPickCustomize()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button class="back-pill-flat" style="margin-bottom:4px;" onclick="closeQuickPickCustomize()">${ICONS.back} Back to Quick Picks</button>
    <h3>Focus</h3>
    <div class="optrow">
      <button class="opt ${!c.focus?'active':''}" onclick="setQuickPickCustomVal('focus', null)">Any</button>
      ${focusValues.map(v => `<button class="opt ${c.focus===v?'active':''}" onclick="setQuickPickCustomVal('focus','${v}')">${escHtml(v)}</button>`).join('')}
    </div>

function renderQuickPickSheetHtml(){
  if(state.quickPickCustomizeOpen) return renderQuickPickCustomizeHtml();
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  const result = state.quickPickSnapshot || computeQuickPicks(); // frozen at open/Customize-apply (batch 58) -- see refreshQuickPickResults()
  const label = phase ? phase.label : '';
  const ctx = {primaryDims: result.primaryDims, balanceDim: result.balanceDim, targetMin: result.targetMin, focusTag: state.quickPickCustom.focus, formatTag: state.quickPickCustom.format, phaseLabel: label, dimensionOverride: !!state.quickPickCustom.dimension};
  const n = result.items.length;
  const idx = Math.min(state.quickPickCardIndex, Math.max(0, n-1)); // defensive clamp -- the index is always reset alongside a new snapshot, but never trust a stale index against a snapshot that's since shrunk
  return `
  <div class="sheet-backdrop" onclick="closeQuickPick()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="qp-sheet-header">
      <h3 class="balance-sheet-title">${ICONS.sparkles}<span>Quick Picks</span><button class="qp-info-btn" onclick="toggleQuickPickInfo()" title="What is Quick Pick?" aria-label="What is Quick Pick?">i</button></h3>
      <button class="qp-close-btn" onclick="closeQuickPick()" title="Close" aria-label="Close">${ICONS.x}</button>
    </div>
    ${state.quickPickInfoOpen ? `<div class="qp-info-panel">Quick Pick instantly suggests exercises that fit this section of your practice, based on your session length and this practice's training needs. It's a fast shortcut alongside the full exercise list below &mdash; you can always browse everything yourself or fine-tune these suggestions with Customize.</div>` : ''}
    ${n ? `<div class="balance-sub qp-sub-dark">Here ${n===1?'is':'are'} ${n} suggested exercise${n===1?'':'s'} based on the ${escHtml(label)} section, targeting about ${result.targetMin} min.</div>` : ''}
    ${n>1 ? `<div class="qp-pager">
      <button class="qp-pager-arrow" onclick="stepQuickPickCard(-1)" title="Previous suggestion" aria-label="Previous suggestion">${ICONS.back}</button>
      <div class="qp-dots">${result.items.map((ex2,d)=>`<span class="qp-dot ${d===idx?'active':''}"></span>`).join('')}</div>
      <button class="qp-pager-arrow" onclick="stepQuickPickCard(1)" title="Next suggestion" aria-label="Next suggestion">${ICONS.chevronRight}</button>
    </div>` : ''}
    ${n ? `<div class="qp-results" onpointerdown="qpSwipeStart(event)" onpointerup="qpSwipeEnd(event)">${quickPickCardHtml(result.items[idx], idx, ctx)}</div>` : `
    <div class="empty-state" style="padding:16px 0;">${ICONS.empty}<p>Couldn't find a strong match.</p></div>`}
    ${(n>0 && n<3) ? `<div class="qp-fewer-note">Only ${n} strong match${n===1?'':'es'} right now${(state.quickPickCustom.focus||state.quickPickCustom.format||state.quickPickCustom.time||state.quickPickCustom.dimension)?' for your Customize choices':''} -- showing what's available.</div>` : ''}
    <div class="sheet-footer" style="flex-direction:column;gap:8px;">
      ${n ? `<button class="btn btn-ghost qp-customize-btn" style="width:100%;" onclick="openQuickPickCustomize()">${ICONS.filter}<span>Customize</span></button>` : ''}
      <button class="btn btn-primary" style="width:100%;" onclick="closeQuickPick()">Done</button>
    </div>
  </div>`;
}

function nextExerciseId(){
  let max = 0;
  EXERCISES.forEach(e => { const m = /EX(\d+)/.exec(e.id); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return 'EX' + String(max+1).padStart(3,'0');
}

function createNewExercise(){
  const section = state.pickingPhase
    ? (PHASES.find(p=>p.key===state.pickingPhase)?.section || state.sectionFilter || 'Warmup')
    : (state.sectionFilter || 'Warmup');
  const id = nextExerciseId();
  const ex = {
    id, name:'New Exercise', section, category:null, difficulty:null, duration:10,
    setup:'', description:'', coachingPoints:'', variations:'',
    technicalTags:[], tacticalTags:[], formatTags:[], physicalTags:[], cognitiveTags:[], engagementTags:[],
    source:'Coach-created', mediaUrl:null, videoUrl:null,
  };
  // Held as a draft (not yet in the shared EXERCISES repository) until the coach explicitly saves it.
  state.draftExercise = ex;
  openDetail(id);
}
function saveDraftExercise(silent){
  if(!state.draftExercise) return;
  EXERCISES.unshift(state.draftExercise);
  // Also keep a durable copy separate from EXERCISES itself, since a live sheet sync replaces
  // EXERCISES wholesale -- this is the only thing that lets a coach-created exercise survive a
  // reload or a resync instead of silently vanishing while still showing "added to your library".
  state.localExercises.unshift(state.draftExercise);
  state.draftExercise = null;
  if(!silent) showToast('Exercise added to your library');
  render();
}
function discardDraftExercise(){
  state.draftExercise = null;
  nav('exercises');
}
function backFromDetail(){
  if(state.draftExercise){
    // In-app modal, not native confirm() -- confirm() is silently swallowed with no UI at all in
    // iOS Safari's "Add to Home Screen" standalone mode, same reasoning as pendingQuickAdd below.
    state.confirmDiscardExerciseOpen = true;
    renderOverlay();
    return;
  }
  if(state.fromSharedSession){ nav('sharedSession', {fromSharedSession:false}); return; }
  if(state.fromReview){ nav(state.fromCustomReview ? 'customSessionReview' : 'review'); return; }
  if(state.fromSavedSession){ nav('sessionDetail', {viewingSessionId: state.fromSavedSessionId, fromSavedSession:false, editingSavedSessionId:null}); return; }
  if(state.fromHome){ nav('home', {fromHome:false}); return; }
  if(state.fromBuildList){ nav('build', {fromBuildList:false}); return; }
  // Always back to Explore Exercises -- when fromBuild is true, state.pickingPhase is still set
  // (they're set together, only ever in pickForPhase()), so this naturally lands the coach back
  // on the same Building Session picker screen they came from rather than the full phase grid.
  nav('exercises');
}
/* Where backFromDetail() will actually send the coach, as the "Back to X" label -- checked in the
   exact same order backFromDetail() checks its flags, so the label can never disagree with the
   destination. The final fallthrough is nav('exercises'): that's Find Exercises while picking for a
   phase (pickingPhase still set), the standalone Exercise Library otherwise. */
function detailBackLabel(){
  if(state.fromSharedSession) return 'Shared Session';
  if(state.fromReview) return 'Session Review';
  if(state.fromSavedSession) return 'Saved Session';
  if(state.fromHome) return 'Home';
  if(state.fromBuildList) return 'Build Session';
  return state.pickingPhase ? 'Find Exercises' : 'Exercises';
}
function cancelDiscardExercise(){ state.confirmDiscardExerciseOpen = false; renderOverlay(); }
function confirmDiscardExerciseAndBack(){
  state.confirmDiscardExerciseOpen = false;
  state.draftExercise = null;
  backFromDetail();
}

function nav(screen, extra={}){
  // Leaving the exercise picker any other way than completing/cancelling a replace (bottom nav,
  // the "Full Session" pill, etc.) should never leave a stale replaceContext around to silently
  // hijack a later, unrelated "+ Add Exercise" tap. Detail is exempted: opening an exercise's
  // Detail page to preview it before replacing is still part of the same replace (resumed via
  // backFromDetail(), or completed via detailToggle() there) -- it used to silently cancel the
  // replace the instant you tapped into Detail, with no indication anything changed, so tapping
  // "Add" there just added a duplicate instead of completing the replace.
  if(state.replaceContext && screen !== 'exercises' && screen !== 'detail') state.replaceContext = null;
  if(screen !== 'detail' && screen !== 'sharedSession' && !('fromSharedSession' in extra)) extra = {...extra, fromSharedSession:false};
  setState({screen, ...extra}); const c=document.getElementById('content'); if(c) c.scrollTop=0;
}

function initTheme(){
  // Default to light regardless of the device's system dark-mode setting -- previously, a coach
  // with no saved preference yet (first visit, or storage cleared) would silently get dark mode
  // just because their phone's OS-wide setting was dark, via the prefers-color-scheme fallback.
  // An explicit in-app toggle (below) still saves and is still respected on every future load.
  try{
    const saved = localStorage.getItem('ft2-theme');
    document.documentElement.setAttribute('data-theme', saved==='dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){
    document.documentElement.setAttribute('data-theme','light');
    try{ localStorage.setItem('ft2-theme','light'); }catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    try{ localStorage.setItem('ft2-theme','dark'); }catch(e){}
  }
  render();
}

  nav('exercises', {sectionFilter:null, search:'', pickingPhase:null, quickFilterValue:null, filters:{...state.filters, bookmarkedOnly:true}});

/* Which bottom-nav tab is active. The whole session-building workflow (Session Setup, Build
   Session, Find Exercises, Exercise Detail, Session Review) lives under Sessions, so Sessions stays
   lit throughout it -- but only the CONTEXTUAL versions of Find Exercises/Exercise Detail count:
   Find Exercises = the exercises screen while picking for a phase (state.pickingPhase, set by
   pickForPhase()/pickReplacementFor() and cleared by every standalone entry point); Exercise Detail
   = opened from that picker (fromBuild, which only ever travels with pickingPhase -- a stale
   fromBuild alone doesn't count), from a Build row, from Review, or from a Saved Session. The
   standalone Exercise Library (Home's Explore Exercises, the Exercises tab) keeps lighting
   Exercises instead. Returns 'home' | 'exercises' | 'sessions' | 'settings' | null. */
function activeNavKey(){
  const sc = state.screen;
  if(sc === 'home') return 'home';
  if(sc === 'settings') return (state.templatesOrigin === 'sessions' && (state.viewingTemplatesList || state.editingTemplateId)) ? 'sessions' : 'settings';
  if(sc === 'sharedSession') return 'sessions';
  if(['practiceSetup','build','review','sessions','sessionDetail','quickStartCustom','customSessionSetup','customSessionGenerating','customSessionReview'].includes(sc)) return 'sessions';
  if(sc === 'exercises') return state.pickingPhase ? 'sessions' : 'exercises';
  if(sc === 'detail'){
    return ((state.fromBuild && state.pickingPhase) || state.fromBuildList || state.fromReview || state.fromSavedSession || state.fromSharedSession) ? 'sessions' : null;
  }
  return null;
}
function renderBottomnav(){
  const el = document.getElementById('bottomnav');
  const activeKey = activeNavKey();
  const item = (key,label,icon,onclick) => `
    <button class="navitem ${key===activeKey?'active':''}" onclick="${onclick}" aria-label="${label}" title="${label}">
      ${icon}
      <span class="navitem-label">${label}</span>
    </button>`;
  el.innerHTML = `
    ${item('home','Home',ICONS.homeFilled,"nav('home')")}
    ${item('exercises','Exercises',ICONS.ballOutline,"nav('exercises', {fromBuild:false, fromBuildList:false, fromReview:false, fromSavedSession:false, editingSavedSessionId:null, pickingPhase:null, sectionFilter:null, quickFilterValue:null})")}
    ${item('sessions','Sessions',ICONS.doc,"nav('sessions',{sessionsViewAll:false, viewingTemplatesList:false, editingTemplateId:null, templatesOrigin:null});syncSessionsFromSheet()")}
    ${item('settings','Settings',ICONS.gear,"nav('settings',{templatesOrigin:null, ...(state.templatesOrigin==='sessions' ? {viewingTemplatesList:false, editingTemplateId:null} : {})})")}
  `;
}

state.phaseHasAny = function(){
  return PHASES.some(p => state.phaseData[p.key].length) || state.extraSections.some(s=>s.exercises.length);
};

/* ============ SETTINGS ============
   Practice Templates are a coach's own named library of section/percentage splits -- as many as
   they want, not just a fixed one-per-location slot. This app has no login or backend, so "a
   coach's own templates" just means whatever's saved in their own browser's storage on their own
   device -- nothing here is shared between coaches or synced across devices. */
function getTemplate(id){ return state.practiceTemplates.find(t=>t.id===id); }
function templateSum(id){
  const t = getTemplate(id);
  return t ? t.sections.filter(s=>s.enabled!==false).reduce((a,s)=>a+s.pct,0) : 0;
}
function createTemplate(){
  teStartDraft(null);
  state.editingTemplateId = state.templateDraft.id;
  render();
  const c = document.getElementById('content'); if(c) c.scrollTop = 0;
}
function openTemplateEditor(id){
  teStartDraft(id);
  state.editingTemplateId = id;
  render();
  const c = document.getElementById('content'); if(c) c.scrollTop = 0;
}
// Back from the editor: asks first only when there are unsaved changes.
function closeTemplateEditor(){
  if(state.templateDraft && JSON.stringify(state.templateDraft) !== state.templateDraftOrig){ state.confirmDiscardTemplateOpen = true; renderOverlay(); return; }
  discardTemplateDraft();
}
function discardTemplateDraft(){
  state.confirmDiscardTemplateOpen = false;
  state.templateSectionModal = null;
  state.templateDraft = null; state.templateDraftOrig = '';
  state.editingTemplateId = null;
  render();
}
function cancelDiscardTemplate(){ state.confirmDiscardTemplateOpen = false; renderOverlay(); }
function renameTemplate(id, val){
  const t = getTemplate(id);
  if(t) t.name = val;
  setTimeout(render, 0);
}
function setTemplateLocation(id, loc){
  const t = getTemplate(id);
  if(t) t.location = loc;

}
function requestDeleteTemplate(id){ state.confirmDeleteTemplateId = id; renderOverlay(); }
function cancelDeleteTemplate(){ state.confirmDeleteTemplateId = null; renderOverlay(); }
function requestDeleteSession(id){ state.confirmDeleteSessionId = id; renderOverlay(); }
function cancelDeleteSession(){ state.confirmDeleteSessionId = null; renderOverlay(); }
function confirmDeleteSessionNow(){
  const id = state.confirmDeleteSessionId;
  if(state.screen === 'sessionDetail' && state.viewingSessionId === id) nav('sessions');
  state.savedSessions = state.savedSessions.filter(s=>s.id!==id);

  showToast('Session deleted');

}
function confirmDeleteTemplateNow(){
  const id = state.confirmDeleteTemplateId;
  state.practiceTemplates = state.practiceTemplates.filter(t=>t.id!==id);
  if(state.editingTemplateId === id){ state.editingTemplateId = null; state.templateDraft = null; state.templateDraftOrig = ''; }
  state.confirmDeleteTemplateId = null;
  showToast('Template deleted');
  render();
}
function adjustTemplatePct(id, key, delta){
  const t = getTemplate(id); if(!t) return;
  const s = t.sections.find(s=>s.key===key);
  if(!s) return;
  s.pct = Math.max(0, Math.min(100, s.pct + delta));
  render();
}
function toggleTemplateSection(id, key){
  const t = getTemplate(id); if(!t) return;
  const s = t.sections.find(s=>s.key===key);
  if(!s) return;
  s.enabled = s.enabled===false ? true : false;
  render();
}
function addTemplateCustomSection(id){
  const t = getTemplate(id); if(!t) return;
  const n = t.sections.filter(s=>!s.standard).length + 1;
  t.sections.push({key:'tmplcustom'+Date.now(), label:'Custom Section '+n, pct:0, standard:false, enabled:true});
  render();
}
function renameTemplateCustomSection(id, key, val){
  const t = getTemplate(id); if(!t) return;
  const s = t.sections.find(s=>s.key===key);
  if(s) s.label = val.trim() || s.label;
  setTimeout(render, 0);
}
function removeTemplateSection(id, key){
  const t = getTemplate(id); if(!t) return;
  t.sections = t.sections.filter(s=>s.key!==key);
  render();
}
/* Applying a template is what actually changes what the coach sees on the Build page -- only ever
   triggered explicitly (the "Load a template" sheet on Build, below), never automatically just
   because a template got edited/saved -- so editing a template never yanks a section out from
   under a coach who's mid-build. */
function applyTemplateToBuilder(id){
  const tmpl = getTemplate(id);
  if(!tmpl) return;
  state.csPlannedByPhase = null;   // a template brings its own plan
  state.enabledPhaseKeys = new Set(tmpl.sections.filter(s=>s.standard && s.enabled!==false).map(s=>s.key));
  state.phaseOrder = tmpl.sections.filter(s=>s.standard).map(s=>s.key);
  if(tmpl.duration) state.targetDuration = tmpl.duration;
  const templateCustoms = tmpl.sections.filter(s=>!s.standard && s.enabled!==false);
  templateCustoms.forEach(tc=>{
    let es = state.extraSections.find(es=>es.key===tc.key);
    if(!es){
      es = {key:tc.key, label:tc.label, exercises:[], templateManaged:true, pct:tc.pct};
      state.extraSections.push(es);
    } else {
      es.label = tc.label;
      es.pct = tc.pct; // keep its planned-minutes share in sync with the template (see extraSectionPlannedMinutes())
    }
  });
  state.extraSections = state.extraSections.filter(es=>{
    if(!es.templateManaged) return true;
    const stillWanted = templateCustoms.find(tc=>tc.key===es.key);
    return !!stillWanted || es.exercises.length>0;
  });
}
function saveTemplate(id){
  if(templateSum(id)!==100){ showToast('Percentages must add up to 100% before saving'); return; }
  showToast('Template saved');
  state.editingTemplateId = null;
  render();
}
function setTemplatePct(id, key, val){
  const t = getTemplate(id); if(!t) return;
  const s = t.sections.find(s=>s.key===key);
  if(!s) return;
  const n = parseInt(String(val).replace(/[^0-9]/g,''), 10);
  s.pct = isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
  render();
}
function setTemplateDuration(id, v){
  const t = getTemplate(id); if(!t) return;
  t.duration = v;
  state.editingTemplateDurationId = null;
  render();
}
function toggleTemplateDurationEdit(id){
  state.editingTemplateDurationId = id;
  render();
  setTimeout(()=>{ const el=document.getElementById('tmplCustomDurInput'); if(el){ el.focus(); el.select(); } }, 0);
}
function commitTemplateCustomDuration(id, rawVal){
  const t = getTemplate(id);
  const n = parseInt(String(rawVal).replace(/[^0-9]/g,''), 10);
  if(t && !isNaN(n) && n>0) t.duration = Math.max(15, n);
  state.editingTemplateDurationId = null;
  setTimeout(render, 0);
}
/* ============ CREATE / EDIT TEMPLATE ============
   The editor works on `state.templateDraft` (a copy); only Save Template validates it and writes it into
   practiceTemplates, so backing out never leaves a half-made template behind. Allocation rules:
   - enabled sections always total exactly 100%; disabled sections are 0% / 0 min;
   - every enabled section keeps at least TE_MIN_PCT, so "enabled" never means "0 minutes";
   - changing one section re-splits the REMAINING percentage over the other enabled sections in proportion to
     what they have now (whole numbers, largest-remainder rounding, so the total can never drift);
   - minutes = total duration split by the same largest-remainder rule, so they always add up to the duration. */
const TE_MIN_PCT = 5, TE_STEP = 5;
const TE_DURATIONS = [60, 75, 90];
const TE_DEFAULT_AGE = 'U11';
const TE_SECTION_DESC = {
  warmup:'Prepare the body and ball', athletic:'Get players moving and focused', duels:'1v1 and 2v2 situations',
  rondos:'Keep the ball and build possession', ssg:'Small-sided games', scrimmage:'Play and compete',
};
function tmplEditTarget(id){ return (state.templateDraft && state.templateDraft.id === id) ? state.templateDraft : getTemplate(id); }
// Split `total` into whole numbers in proportion to `weights` (largest remainder), so the parts sum to total exactly.
function teSplit(total, weights){
  const W = weights.reduce((a,b)=>a+b,0);
  const raw = weights.map(w => W > 0 ? total * w / W : total / weights.length);
  const out = raw.map(Math.floor);
  let left = total - out.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r - out[i], i]).sort((a,b)=>b[0]-a[0] || a[1]-b[1]).forEach(([,i])=>{ if(left > 0){ out[i]++; left--; } });
  return out;
}
// Re-split `target` percent over these sections (each keeps >= TE_MIN_PCT, extra shared by their current size).
function teRedistribute(secs, target){
  if(!secs.length) return;
  const extra = Math.max(0, target - TE_MIN_PCT * secs.length);
  const shares = teSplit(extra, secs.map(x => Math.max(x.pct - TE_MIN_PCT, 0)));
  secs.forEach((x,i)=>{ x.pct = TE_MIN_PCT + shares[i]; });
}
function teEnabled(d){ return d.sections.filter(x => x.enabled !== false); }
function teMinutes(d){
  const en = teEnabled(d);
  const mins = teSplit(Number(d.duration)||0, en.map(x => x.pct));
  const map = {}; d.sections.forEach(x => { map[x.key] = 0; });
  en.forEach((x,i)=>{ map[x.key] = mins[i]; });
  return map;
}
function teTotalPct(d){ return teEnabled(d).reduce((a,x)=>a+x.pct,0); }
function teNormalize(d){
  d.sections.forEach(x => { if(x.enabled === false) x.pct = 0; });
  const en = teEnabled(d);
  if(!en.length){ d.sections[0].enabled = true; en.push(d.sections[0]); d.sections[0].pct = 100; }
  if(teTotalPct(d) !== 100 || en.some(x => x.pct < TE_MIN_PCT)) teRedistribute(en, 100);
}
function teStartDraft(id){
  let d;
  if(id){
    const t = getTemplate(id);
    d = JSON.parse(JSON.stringify(t));
  } else {
    d = {id:'tmpl'+Date.now(), name:'', location:'outdoor', duration:75, ageGroup:TE_DEFAULT_AGE, isNew:true, sections:defaultTemplateSections()};
  }
  if(!CS_AGE_GROUPS.includes(d.ageGroup)) d.ageGroup = TE_DEFAULT_AGE;
  d.sections.forEach(x => { if(x.standard && !x.description) x.description = TE_SECTION_DESC[x.key] || ''; });
  teNormalize(d);
  state.templateDraft = d;
  state.templateDraftOrig = JSON.stringify(d);
}
function teSetName(v){ if(state.templateDraft) state.templateDraft.name = v; }
function teSetDuration(v){ if(state.templateDraft){ state.templateDraft.duration = parseInt(v,10) || 75; render(); } }
function teSetLocation(v){ if(state.templateDraft){ state.templateDraft.location = v; render(); } }
function teSetAge(v){ if(state.templateDraft){ state.templateDraft.ageGroup = v; render(); } }
function teSetPct(key, want){
  const d = state.templateDraft; if(!d) return;
  const s = d.sections.find(x => x.key === key); if(!s || s.enabled === false) return;
  const others = teEnabled(d).filter(x => x !== s);
  if(!others.length){ showToast('Turn on another section to change this one'); render(); return; }
  const max = 100 - TE_MIN_PCT * others.length;
  const next = Math.max(TE_MIN_PCT, Math.min(max, Math.round(want)));
  if(next === s.pct){ showToast(want < s.pct ? `Each section keeps at least ${TE_MIN_PCT}%` : 'The other sections need at least 5% each'); render(); return; }
  s.pct = next;
  teRedistribute(others, 100 - next);
  render();
}
function teAdjust(key, dir){
  const d = state.templateDraft; if(!d) return;
  const s = d.sections.find(x => x.key === key); if(!s) return;
  teSetPct(key, s.pct + dir * TE_STEP);
}
function teToggle(key){
  const d = state.templateDraft; if(!d) return;
  const s = d.sections.find(x => x.key === key); if(!s) return;
  if(s.enabled !== false){
    if(teEnabled(d).length <= 1){ showToast('Keep at least one section on'); return; }
    s.lastPct = s.pct; s.enabled = false; s.pct = 0;
    teRedistribute(teEnabled(d), 100);           // its share flows to the sections that stay on
  } else {
    const others = teEnabled(d);
    const max = 100 - TE_MIN_PCT * others.length;
    s.enabled = true;
    s.pct = Math.max(TE_MIN_PCT, Math.min(max, s.lastPct || 10));
    teRedistribute(others, 100 - s.pct);
  }
  render();
}
function teRemoveCustom(key){
  const d = state.templateDraft; if(!d) return;
  const s = d.sections.find(x => x.key === key); if(!s || s.standard) return;
  d.sections = d.sections.filter(x => x !== s);
  teNormalize(d);
  render();
}
function teOpenSectionModal(key){
  const d = state.templateDraft; if(!d) return;
  const s = key ? d.sections.find(x => x.key === key) : null;
  const others = teEnabled(d).length;
  const max = 100 - TE_MIN_PCT * others;
  state.templateSectionModal = s
    ? {mode:'edit', key, name:s.label, desc:s.description||'', pct:s.pct, error:''}
    : {mode:'add', key:null, name:'', desc:'', pct:Math.max(TE_MIN_PCT, Math.min(10, max)), error:''};
  renderOverlay();
  setTimeout(()=>{ const el = document.getElementById('teSecName'); if(el) el.focus(); }, 60);
}
function teSectionModalField(f, v){ if(state.templateSectionModal) state.templateSectionModal[f] = v; }
function teCloseSectionModal(){ state.templateSectionModal = null; renderOverlay(); }
function teSaveSectionModal(){
  const m = state.templateSectionModal, d = state.templateDraft; if(!m || !d) return;
  const name = String(m.name||'').trim().replace(/\s+/g,' ');
  if(!name){ m.error = 'Give the section a name.'; renderOverlay(); return; }
  if(d.sections.some(x => x.key !== m.key && x.label.trim().toLowerCase() === name.toLowerCase())){ m.error = 'A section with that name already exists.'; renderOverlay(); return; }
  if(m.mode === 'edit'){
    const s = d.sections.find(x => x.key === m.key);
    if(s){ s.label = name; s.description = String(m.desc||'').trim(); }
  } else {
    const pct = parseInt(String(m.pct).replace(/[^0-9]/g,''), 10);
    const others = teEnabled(d);
    const max = 100 - TE_MIN_PCT * others.length;
    if(isNaN(pct) || pct < TE_MIN_PCT || pct > max){ m.error = `Enter a percentage between ${TE_MIN_PCT} and ${max}.`; renderOverlay(); return; }
    d.sections.push({key:'tmplcustom'+Date.now(), label:name, description:String(m.desc||'').trim(), pct, standard:false, enabled:true});
    teRedistribute(others, 100 - pct);
  }
  state.templateSectionModal = null;
  render();
}
function teSaveTemplate(){
  const d = state.templateDraft; if(!d || state.templateSaveBusy) return;
  state.templateSaveBusy = true;
  try{
    const name = String(d.name||'').trim().replace(/\s+/g,' ');
    if(!name){ showToast('Name your template first'); const el = document.getElementById('teName'); if(el) el.focus(); return; }
    if(!TE_DURATIONS.includes(Number(d.duration))){ showToast('Choose 60, 75 or 90 minutes'); return; }
    if(d.location !== 'outdoor' && d.location !== 'indoor'){ showToast('Choose Outdoor or Indoor'); return; }
    if(!CS_AGE_GROUPS.includes(d.ageGroup)){ showToast('Choose an age group'); return; }
    if(!teEnabled(d).length){ showToast('Turn on at least one section'); return; }
    if(teTotalPct(d) !== 100){ showToast('Section percentages must add up to 100%'); return; }
    const mins = teMinutes(d);
    if(Object.values(mins).reduce((a,b)=>a+b,0) !== Number(d.duration)){ showToast('Section minutes don’t add up to the session length'); return; }
    const saved = JSON.parse(JSON.stringify(d));
    delete saved.isNew;
    saved.name = name;
    saved.sections.forEach(x => { x.minutes = mins[x.key] || 0; x.pct = x.enabled === false ? 0 : x.pct; });
    saved.updatedAt = Date.now();
    const prev = state.practiceTemplates.slice();
    const i = state.practiceTemplates.findIndex(t => t.id === saved.id);
    if(i >= 0) state.practiceTemplates[i] = saved; else state.practiceTemplates.push(saved);
    // Only report success once it has really been written to this device's storage.
    saveAppStateToStorage();
    let ok = false;
    try{ ok = (localStorage.getItem(APP_STATE_STORAGE_KEY) || '').indexOf('"' + saved.id + '"') !== -1; }catch(e){ ok = false; }
    if(!ok){
      state.practiceTemplates = prev;
      showToast('Couldn’t save — this device’s storage isn’t available');
      return;
    }
    state.templateDraft = null; state.templateDraftOrig = ''; state.editingTemplateId = null; state.templateSectionModal = null;
    showToast('Template saved');
    render();
    const c = document.getElementById('content'); if(c) c.scrollTop = 0;
  } finally {
    state.templateSaveBusy = false;
  }
}
function teSegHtml(options, current, fn){
  return `<div class="su-seg te-seg">${options.map(([v,l,icon]) => `<button class="su-seg-btn ${current===v?'active':''}" aria-pressed="${current===v}" onclick="${fn}('${v}')">${icon||''}${escHtml(l)}</button>`).join('')}</div>`;
}
function teRowHtml(s, mins){
  const off = s.enabled === false;
  const key = escJsAttr(s.key);
  const phase = s.standard ? PHASES.find(p => p.key === s.key) : null;
  const st = phase ? secStyle(phase.section) : null;
  const icon = s.standard
    ? `<div class="te-icon" style="background:${st.bg};color:${st.textOn==='dark'?'var(--pitch-dark)':'white'};">${st.icon}</div>`
    : `<div class="te-icon custom">${ICONS.doc}</div>`;
  const grip = s.key === 'warmup' ? `<span class="te-grip-spacer"></span>` : `<span class="te-grip" onpointerdown="tmplGripDown(event,'${escJsAttr(state.templateDraft.id)}','${key}')" title="Long-press and drag to reorder" aria-label="Drag to reorder ${escAttr(s.label)}">${ICONS.grip}</span>`;
  const label = s.standard ? (phase.key === 'ssg' ? 'SSG' : s.label) : s.label;
  return `
  <div class="te-row ${off?'off':''}" data-key="${escAttr(s.key)}">
    <div class="te-row-top">
      ${grip}
      <button class="te-switch-hit" role="switch" aria-checked="${!off}" aria-label="${off?'Include':'Exclude'} ${escAttr(label)}" onclick="teToggle('${key}')"><span class="switch ${off?'':'on'}"><span class="dot"></span></span></button>
      ${icon}
      <div class="te-text"><div class="te-name">${escHtml(label)}</div><div class="te-desc">${escHtml(s.description||'')}</div></div>
      <div class="te-alloc"><div class="te-alloc-pct">${s.pct}%</div><div class="te-alloc-min">${mins[s.key]} min</div></div>
    </div>
    <div class="te-row-ctl">
      <button class="te-adj te-adj-minus" ${off?'disabled':''} onclick="teAdjust('${key}',-1)" aria-label="Decrease ${escAttr(label)} by ${TE_STEP}%">${ICONS.minus}</button>
      <span class="te-val" aria-live="polite">${s.pct}%</span>
      <button class="te-adj te-adj-plus" ${off?'disabled':''} onclick="teAdjust('${key}',1)" aria-label="Increase ${escAttr(label)} by ${TE_STEP}%">${ICONS.plus}</button>
      <input class="te-range" type="range" min="0" max="100" step="${TE_STEP}" value="${s.pct}" ${off?'disabled':''} aria-label="${escAttr(label)} allocation" onchange="teSetPct('${key}', this.value)">
      ${s.standard ? '' : `<button class="te-mini" onclick="teOpenSectionModal('${key}')" aria-label="Edit ${escAttr(label)}">${ICONS.pencil}</button><button class="te-mini" onclick="teRemoveCustom('${key}')" aria-label="Delete ${escAttr(label)}">${ICONS.trash}</button>`}
    </div>
  </div>`;
}
function renderTemplateEditor(){
  const d = state.templateDraft;
  if(!d){ state.editingTemplateId = null; return renderSettings(); }
  const mins = teMinutes(d);
  const total = teTotalPct(d);
  const isNew = !!d.isNew;
  return `
  <div class="section-pad te-page">
    <button class="back-pill-flat" onclick="closeTemplateEditor()">${ICONS.back} Back to Templates</button>
    <div class="te-titlebar">${navPageTitleHtml(isNew ? 'Create New Template' : 'Edit Template', 'Set the details, then adjust each section.')}</div>

    <div class="te-card te-compact">
      <label class="te-label" for="teName">Template Name</label>
      <input id="teName" class="te-input" type="text" value="${escAttr(d.name)}" placeholder="My U10 Training Template" oninput="teSetName(this.value)" autocomplete="off">
      <div class="te-field">
        <div class="te-label">Session Duration</div>
        ${teSegHtml(TE_DURATIONS.map(v => [String(v), v + ' min']), String(d.duration), 'teSetDuration')}
      </div>
      <div class="te-field">
        <div class="te-label">Location</div>
        ${teSegHtml([['outdoor','Outdoor',ICONS.sun],['indoor','Indoor',ICONS.home]], d.location, 'teSetLocation')}
      </div>
      <div class="te-field">
        <div class="te-label">Age Group</div>
        ${teSegHtml(CS_AGE_GROUPS.map(a => [a,a]), d.ageGroup, 'teSetAge')}
      </div>
    </div>

    <div class="te-structure-head">
      <div>
        <h2 class="te-h2">Session Structure</h2>
        <div class="te-sub">Include the sections you want and adjust the time allocation.</div>
      </div>

/* Long-press-and-drag reorder for Settings template rows. Warmup is excluded entirely -- it's
   never the drag source and never a valid drop target -- so it's structurally impossible for a
   swap to land anything above it; it stays pinned first without any extra bookkeeping.
   A short setTimeout distinguishes a deliberate long-press-drag from an ordinary tap/scroll:
   if the pointer moves more than a few px before the timer fires, the gesture is treated as a
   scroll instead and the drag is cancelled. */
let tmplDrag = null;
function tmplGripDown(e, id, key){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!tmplDrag) return;
    tmplDrag.longPressed = true;
    const row = document.querySelector(`.te-row[data-key="${key}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  tmplDrag = {id, key, timer, startY, longPressed:false};
  document.addEventListener('pointermove', tmplGripMove);
  document.addEventListener('pointerup', tmplGripUp);
}
function tmplGripMove(e){
  if(!tmplDrag) return;
  if(!tmplDrag.longPressed){
    if(Math.abs(e.clientY - tmplDrag.startY) > 8){ tmplGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const tmpl = tmplEditTarget(tmplDrag.id);
  if(!tmpl) return;
  const sections = tmpl.sections;
  const reorderableKeys = sections.filter(s=>s.key!=='warmup').map(s=>s.key);
  let overKey = null;
  reorderableKeys.forEach(k=>{
    const el = document.querySelector(`.te-row[data-key="${k}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overKey = k;
  });
  if(!overKey || overKey===tmplDrag.key) return;
  const fromIdx = sections.findIndex(s=>s.key===tmplDrag.key);
  const toIdx = sections.findIndex(s=>s.key===overKey);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = sections.splice(fromIdx,1);
  sections.splice(toIdx,0,moved);
  render();
  const key = tmplDrag.key;
  setTimeout(()=>{ const row=document.querySelector(`.te-row[data-key="${key}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function tmplGripCancel(){
  if(tmplDrag) clearTimeout(tmplDrag.timer);
  tmplDrag = null;
  document.removeEventListener('pointermove', tmplGripMove);
  document.removeEventListener('pointerup', tmplGripUp);
}
function tmplGripUp(){
  tmplGripCancel();
  render();
}
