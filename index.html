// One tall image: the pages stacked top to bottom with a thin gap (kept under the phone browsers' canvas size limit).
async function ftBuildImage(canvases){
  const gap = Math.round(canvases[0].width * 0.02);
  const w = canvases[0].width, hEach = canvases[0].height;
  let k = 1;
  const area = w * (hEach * canvases.length + gap * (canvases.length - 1));
  if(area > 14e6) k = Math.sqrt(14e6 / area);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * k); cv.height = Math.round((hEach * canvases.length + gap * (canvases.length - 1)) * k);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#E2E8F0'; ctx.fillRect(0, 0, cv.width, cv.height);
  canvases.forEach((c, i) => ctx.drawImage(c, 0, Math.round(i * (hEach + gap) * k), Math.round(w * k), Math.round(hEach * k)));

function ftSlug(n){ return String(n||'session').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'session'; }

function openPrintSheet(id){

  renderOverlay();
}
function ftRevokePreview(ps){ if(ps && ps.previewUrl){ try{ URL.revokeObjectURL(ps.previewUrl); }catch(e){} ps.previewUrl = ''; } }

async function createPrintFile(){
  const ps = state.printSheet; if(!ps || ps.step === 'working') return;
  const s = state.savedSessions.find(x => x.id === ps.sessionId);
  if(!s){ ps.step = 'error'; renderOverlay(); return; }
  ps.step = 'working'; renderOverlay();
  try{
    // Use the live exercise library (waits for / retries the sync). If it can't be reached AND the session has exercises the
    // old bundled copy doesn't know, stop with a clear message instead of printing them as "unavailable".
    const live = await ensureExercisesSynced(true);
    if(!live && s.phases.some(p => p.exercises.some(e => !resolveSavedExercise(e)))){
      if(state.printSheet === ps){ ps.step = 'error'; ps.error = 'library'; renderOverlay(); }
      return;
    }
    ps.error = '';
    const {canvases, wPt, hPt} = await ftRenderPages(s, ps.layout);
    let blob, name;
    if(ps.format === 'pdf'){ blob = await ftBuildPdf(canvases, wPt, hPt); name = `${ftSlug(s.name)}-${ps.layout}.pdf`; }
    else { blob = await ftBuildImage(canvases); name = `${ftSlug(s.name)}-${ps.layout}.png`; }
    // What the coach previews: the image itself, or (for a PDF) the same pages stacked as one picture.
    const previewBlob = ps.format === 'image' ? blob : await ftBuildImage(canvases);
    if(state.printSheet !== ps) return;     // the coach closed the sheet meanwhile
    ftRevokePreview(ps);
    ps.file = new File([blob], name, {type:blob.type});
    ps.fileName = name;
    ps.previewUrl = URL.createObjectURL(previewBlob);
    ps.step = 'ready';
    renderOverlay();     // the phone's share sheet opens from the Save / Send button below -- it needs its own tap
  }catch(err){
    console.warn('Print/export failed:', err && err.message);
    if(state.printSheet === ps){ ps.step = 'error'; renderOverlay(); }
  }
}
async function sharePrintFile(){
  const ps = state.printSheet; if(!ps || !ps.file) return;
  if(navigator.canShare && navigator.canShare({files:[ps.file]})){
    try{
      await navigator.share({files:[ps.file], title:ps.fileName});
      if(state.printSheet === ps) closePrintSheet();     // saved / sent / printed: the work is done, so the window goes away
      return;
    }
    catch(e){ if(e && e.name === 'AbortError') return; }     // the coach backed out of the share sheet: keep this window open
  }
  if(ps.format === 'pdf'){ const url = URL.createObjectURL(ps.file); window.open(url, '_blank'); setTimeout(() => URL.revokeObjectURL(url), 60000); }
  else downloadPrintFile();
  if(state.printSheet === ps) closePrintSheet();
}
function downloadPrintFile(){
  const ps = state.printSheet; if(!ps || !ps.file) return;
  const url = URL.createObjectURL(ps.file);
  const a = document.createElement('a'); a.href = url; a.download = ps.fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ============ SHARE A SAVED SESSION ============
   A saved session can be sent to anyone as a link. The link carries only a long random token
   (?s=...) -- never the session itself and never a guessable id -- and the Apps Script looks the
   session up by that token and returns ONLY the plan (title, date, length, exercises as
   {id,name,duration} per phase): no notes, ratings, other sessions, or coach accounts. The
   recipient's page (renderSharedSession) is read-only: it never writes to savedSessions, drafts or
   the Sheet. Exercises are references -- each tap goes through resolveSavedExercise() against the
   recipient's own copy of the library and opens the normal Exercise Detail, so a renumbered or
   removed exercise degrades to "no longer available" instead of opening the wrong one. */
const SHARE_TOKEN_RE = /^[A-Za-z0-9_-]{16,64}$/;
function newShareToken(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  try{
    const buf = new Uint8Array(24);
    crypto.getRandomValues(buf);
    buf.forEach(b => { out += chars[b % 62]; });
  }catch(e){
    for(let i=0;i<24;i++) out += chars[Math.floor(Math.random()*62)];
  }
  return out;
}
function appBaseUrl(){ return window.location.href.split(/[?#]/)[0]; }
function shareUrlFor(token){ return appBaseUrl() + '?s=' + encodeURIComponent(token); }
function inSharedPreview(){
  return !!state.sharedToken && (state.screen === 'sharedSession' || (state.screen === 'detail' && state.fromSharedSession));
}
// Called once at boot: a ?s=<token> in the address means this load is someone opening a shared link.
function initSharedLink(){
  try{
    const tok = new URLSearchParams(window.location.search).get('s');
    if(tok && SHARE_TOKEN_RE.test(tok)){
      state.sharedToken = tok;
      state.sharedSession = null;
      state.sharedStatus = 'loading';
      state.screen = 'sharedSession';
      state.fromSharedSession = false;
    }
  }catch(e){ /* no URL support -- just a normal launch */ }
}
async function fetchSharedSession(token){
  if(!APPS_SCRIPT_URL) return {status:'offline'};
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?sheet=sessions&share=' + encodeURIComponent(token), {cache:'no-store'});
    if(!res.ok) return {status:'offline'};
    const data = await res.json();
    // An Apps Script that hasn't been updated yet ignores ?share= and answers with the whole
    // sessions list (an array) -- treat that as "sharing not switched on" rather than guessing.
    if(Array.isArray(data)) return {status:'unsupported'};
    if(!data || data.error || !Array.isArray(data.phases)) return {status:'unavailable'};
    return {status:'ready', data};
  }catch(err){
    return {status:'offline'};
  }
}
async function loadSharedSession(){
  if(!state.sharedToken) return;
  state.sharedStatus = 'loading';
  render();
  const r = await fetchSharedSession(state.sharedToken);
  state.sharedSession = r.status === 'ready' ? r.data : null;
  state.sharedStatus = r.status;
  render();
}
function leaveSharedSession(){
  const hadCoach = !!state.coachName;
  state.sharedToken = null; state.sharedSession = null; state.sharedStatus = 'idle'; state.fromSharedSession = false;
  try{ window.history.replaceState(null, '', appBaseUrl()); }catch(e){}
  if(hadCoach) nav('home'); else { state.screen = 'home'; render(); }
}
function shareDetailLine(s){
  const parts = [];
  const mins = Number(s.targetDuration) || Number(s.totalMin) || 0;
  parts.push(mins ? `${mins}-minute${s.ageGroup ? ' ' + s.ageGroup : ''} session` : `${s.ageGroup ? s.ageGroup + ' ' : ''}session`);
  const st = (CS_STYLES.find(x => x[0] === s.sessionStyle) || [])[1];
  if(st) parts.push(st.replace(/^More /, ''));
  parts.push(s.location === 'indoor' ? 'Indoor' : 'Outdoor');
  return parts.join(' • ');
}
// Share Session = give another coach a link to the actual saved session. The sheet prepares the link first
// (token pushed + confirmed on the server) so Copy Session can write to the clipboard straight inside the tap.
function sessionMetaPlain(s){
  const parts = [`${Number(s.targetDuration) || Number(s.totalMin) || 0} min`];
  if(s.ageGroup) parts.push(s.ageGroup);
  parts.push(s.location === 'indoor' ? 'Indoor' : 'Outdoor');
  return parts.join(' · ');
}
function shareMessageFor(s, url){
  return `${s.name}\n${sessionMetaPlain(s)}\n\nView this session in FT2 Coaches:\n${url}`;
}
// One tap on Share Session: the link was already prepared in the background when the session opened, so this tap
// copies the message to the clipboard, flashes "Session Link Copied", and opens the phone's share sheet -- all inside
// the one tap (browsers only allow clipboard + share from a direct tap, so nothing here may wait on the network).
function copyTextNow(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => false); }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return Promise.resolve(!!ok);
  }catch(e){ return Promise.resolve(false); }
}
function flashShareCopied(ok){
  state.shareFlash = ok === false ? 'fail' : 'ok';
  renderOverlay();
  clearTimeout(flashShareCopied._t);
  flashShareCopied._t = setTimeout(() => { state.shareFlash = null; renderOverlay(); }, 2600);
}
function shareNow(r){
  const s = state.savedSessions.find(x => x.id === r.sessionId);
  const copied = copyTextNow(r.message);                       // started inside the tap
  flashShareCopied(true);
  copied.then(ok => { if(!ok) flashShareCopied(false); });
  if(navigator.share){
    navigator.share({title:r.title, text:s ? `${s.name}\n${sessionMetaPlain(s)}` : r.title, url:r.url}).catch(() => {});
  } else {
    state.shareSheet = {sessionId:r.sessionId, status:'copied', url:r.url, message:r.message, title:r.title, errorText:''};   // desktop: no share sheet to open
    renderOverlay();
  }
}
async function shareSavedSession(id){
  const s = state.savedSessions.find(x => x.id === id);
  if(!s || s.createdBy !== state.coachName) return;
  const r = state.shareReady[id];
  if(r){ shareNow(r); return; }
  // Link not ready yet (just opened, slow connection, or an earlier try failed): get it, then ask for one more tap.
  state.shareSheet = {sessionId:id, status:'preparing', url:'', message:'', title:'', errorText:''};
  renderOverlay();
  await prepareShareLink(id);
}
async function buildShareLink(id){
  const s = state.savedSessions.find(x => x.id === id);
  if(!s) return {ok:false, errorText:'Session not found.'};
  try{
    // The link has to exist on the server before it is handed out, so push the token first and
    // then confirm the server can actually serve it back; otherwise the friend would get a dead link.
    if(!s.shareToken || s._syncPending){
      if(!s.shareToken) s.shareToken = newShareToken();
      await pushSessionToSheet(s);
    }
    const check = await fetchSharedSession(s.shareToken);
    if(check.status !== 'ready') return {ok:false, errorText: check.status === 'unsupported' ? 'Sharing isn’t switched on yet.' : 'Check your connection and try again.'};
    const url = shareUrlFor(s.shareToken);
    const focus = (csFocusArea(s.focusArea) || {}).title;
    return {ok:true, r:{sessionId:id, url, message:shareMessageFor(s, url), title:'FT2 Coaches — ' + (focus ? focus + ' Session' : s.name)}};
  }catch(err){
    return {ok:false, errorText:'Check your connection and try again.'};
  }
}
// Quiet background preparation when a coach opens one of their own saved sessions (no UI unless they tap Share first).
async function prefetchShareLink(id){
  const s = state.savedSessions.find(x => x.id === id);
  if(!s || s.createdBy !== state.coachName || state.shareReady[id] || state.sharePrepping[id]) return;
  state.sharePrepping[id] = true;
  const res = await buildShareLink(id);
  state.sharePrepping[id] = false;
  if(res.ok){
    state.shareReady[id] = res.r;
    // The coach tapped Share while this was still working: show the one-tap "ready" button.
    if(state.shareSheet && state.shareSheet.sessionId === id && state.shareSheet.status === 'preparing'){ state.shareSheet.status = 'ready'; renderOverlay(); }
  }
}
async function prepareShareLink(id){
  const sh = state.shareSheet;
  if(!sh || sh.sessionId !== id) return;
  sh.status = 'preparing'; renderOverlay();
  const res = await buildShareLink(id);
  if(state.shareSheet !== sh) return;
  if(res.ok){ state.shareReady[id] = res.r; sh.status = 'ready'; }
  else { sh.status = 'error'; sh.errorText = res.errorText; }
  renderOverlay();
}
function closeShareSheet(){ state.shareSheet = null; renderOverlay(); }
function shareFromSheet(){
  const sh = state.shareSheet; if(!sh) return;
  const r = state.shareReady[sh.sessionId]; if(!r) return;
  state.shareSheet = null;
  shareNow(r);
}
async function copyShareLink(url, title){
  let ok = false;
  try{ await navigator.clipboard.writeText(url); ok = true; }catch(e){}
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, url.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
  }
  if(ok){ showToast('Link copied'); }
  else { state.shareLinkModal = {url, title}; renderOverlay(); }
}

/* ============ PERSISTENCE ============
   A reload -- from the OS reclaiming a backgrounded phone browser tab/PWA, not from anything this
   app itself triggers -- previously meant losing an in-progress draft session, every saved session,
   and every bookmark, since none of it lived anywhere but memory. Every render() call now snapshots
   the meaningful state to localStorage, and it's restored once on load before the first render. */
const APP_STATE_STORAGE_KEY = 'ft2-app-state-v1';
// render() calls this on every single re-render (every tap, every toast, every keystroke-driven
// soft-render), and the snapshot includes the full savedSessions/localExercises/etc. arrays --
// at a large saved-session count that's a real, avoidable synchronous cost on every interaction
// anywhere in the app. Debounced the same way search input already is (see onSearch), with a
// flush on tab-hide/close below so backgrounding or closing the app never loses the latest state
// to an unfired timer -- mobile Safari doesn't reliably fire beforeunload/unload, so this flushes
// on visibilitychange -> hidden and pagehide instead, both of which it does fire reliably.
let saveStateDebounceTimer = null;
function scheduleSaveAppStateToStorage(){
  clearTimeout(saveStateDebounceTimer);
  saveStateDebounceTimer = setTimeout(saveAppStateToStorage, 400);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden'){ clearTimeout(saveStateDebounceTimer); saveAppStateToStorage(); } });
window.addEventListener('pagehide', () => { clearTimeout(saveStateDebounceTimer); saveAppStateToStorage(); });
function saveAppStateToStorage(){
  try{
    const snapshot = {
      phaseData: state.phaseData,
      extraSections: state.extraSections,
      sessionName: state.sessionName,
      targetDuration: state.targetDuration,
      practiceLocation: state.practiceLocation,
      practiceDate: state.practiceDate,
      practiceStartTime: state.practiceStartTime,
      activeTemplateId: state.activeTemplateId,
      savedSessions: state.savedSessions,
      bookmarks: [...state.bookmarks],
      enabledPhaseKeys: [...state.enabledPhaseKeys],
      phaseOrder: state.phaseOrder,
      practiceTemplates: state.practiceTemplates,
      sectionDefaultPcts: {...sectionDefaultPcts},
      localExercises: state.localExercises,
      // Navigation context -- so a reload lands the coach back on the screen they were actually
      // on (mid-build, picking exercises, reviewing) instead of bouncing to Home even though the
      // underlying data survived. Validated against live data below before being trusted.
      screen: state.screen,
      detailId: state.detailId,
      pickingPhase: state.pickingPhase,
      sectionFilter: state.sectionFilter,
      quickFilterValue: state.quickFilterValue,
      viewingSessionId: state.viewingSessionId,
      fromBuild: state.fromBuild,
      fromReview: state.fromReview,
      fromCustomReview: state.fromCustomReview,
      pickReturnTo: state.pickReturnTo,
      csReviewCfg: state.csReviewCfg,
      csDraftGenerated: state.csDraftGenerated,
      csGeneratedSig: state.csGeneratedSig, csReviewNotes: state.csReviewNotes, csReviewExplain: state.csReviewExplain, csPlannedByPhase: state.csPlannedByPhase,
      fromSavedSession: state.fromSavedSession,
      fromSavedSessionId: state.fromSavedSessionId,
      editingSavedSessionId: state.editingSavedSessionId,
      reviewGroupOrder: state.reviewGroupOrder,
      replaceContext: state.replaceContext,
      customSessionStep: state.customSessionStep,
      csFocusAreaId: state.csFocusAreaId,
      csTitle: state.csTitle, csTitleEdited: state.csTitleEdited, csDate: state.csDate, csStartTime: state.csStartTime,
      csDuration: state.csDuration, csLocation: state.csLocation, csAgeGroup: state.csAgeGroup, csSessionStyle: state.csSessionStyle,
    };
    localStorage.setItem(APP_STATE_STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){ /* storage unavailable (private browsing, quota, etc.) -- app still works, just won't persist */ }
}
function loadAppStateFromStorage(){
  try{
    const raw = localStorage.getItem(APP_STATE_STORAGE_KEY);
    if(!raw) return;
    const snap = JSON.parse(raw);
    if(snap.phaseData){
      // Merge onto the current phaseData skeleton, key by key, so a PHASES entry that didn't exist
      // yet when this draft was saved still ends up as a valid empty array instead of missing.
      PHASES.forEach(p => { state.phaseData[p.key] = snap.phaseData[p.key] || []; });
    }
    if(Array.isArray(snap.extraSections)) state.extraSections = snap.extraSections;
    if(typeof snap.sessionName === 'string' && snap.sessionName.trim()) state.sessionName = snap.sessionName;
    if(typeof snap.targetDuration === 'number' && snap.targetDuration > 0) state.targetDuration = snap.targetDuration;
    if(snap.practiceLocation === 'indoor' || snap.practiceLocation === 'outdoor') state.practiceLocation = snap.practiceLocation;
    if(typeof snap.practiceDate === 'string' && snap.practiceDate) state.practiceDate = snap.practiceDate;
    if(timeToMin(snap.practiceStartTime) !== null) state.practiceStartTime = snap.practiceStartTime;
    if(typeof snap.activeTemplateId === 'string' || snap.activeTemplateId === null) state.activeTemplateId = snap.activeTemplateId ?? null;
    if(Array.isArray(snap.savedSessions)) state.savedSessions = snap.savedSessions;
    if(Array.isArray(snap.bookmarks)) state.bookmarks = new Set(snap.bookmarks);
    if(snap.csReviewCfg && typeof snap.csReviewCfg === 'object'){ state.csReviewCfg = snap.csReviewCfg; state.csDraftGenerated = !!snap.csDraftGenerated; state.csGeneratedSig = snap.csGeneratedSig || null; state.csReviewNotes = Array.isArray(snap.csReviewNotes) ? snap.csReviewNotes : []; state.csReviewExplain = (snap.csReviewExplain && Array.isArray(snap.csReviewExplain.steps)) ? snap.csReviewExplain : null; state.csPlannedByPhase = (snap.csPlannedByPhase && typeof snap.csPlannedByPhase === 'object') ? snap.csPlannedByPhase : null; }
    if(csFocusArea(snap.csFocusAreaId)){
      state.csFocusAreaId = snap.csFocusAreaId;
      state.customSessionStep = (snap.customSessionStep === 2 || snap.customSessionStep === 3) ? 2 : (snap.customSessionStep === 4 ? 4 : 1);
      if(typeof snap.csTitle === 'string') state.csTitle = snap.csTitle;
      state.csTitleEdited = !!snap.csTitleEdited;
      if(typeof snap.csDate === 'string') state.csDate = snap.csDate;
      if(timeToMin(snap.csStartTime) !== null) state.csStartTime = snap.csStartTime;
      state.csDuration = snap.csDuration ?? null;
      state.csLocation = snap.csLocation ?? null;
      state.csAgeGroup = snap.csAgeGroup ?? null;
      state.csSessionStyle = snap.csSessionStyle ?? null;
    }
    if(Array.isArray(snap.enabledPhaseKeys) && snap.enabledPhaseKeys.length) state.enabledPhaseKeys = new Set(snap.enabledPhaseKeys);
    if(Array.isArray(snap.phaseOrder) && snap.phaseOrder.length) state.phaseOrder = snap.phaseOrder;
    if(Array.isArray(snap.practiceTemplates)){
      // One-time upgrade (2026-09): the stock template set gained a 90-min Outdoor option and
      // Indoor's stock default moved from 75 to 60 min. Only apply it when the saved library is
      // still exactly the untouched old stock pair (by id+duration) -- a coach who's already
      // renamed, retimed, or added their own templates keeps exactly what they have.
      const t = snap.practiceTemplates;
      const isUntouchedStockPair = t.length===2
        && t[0]?.id==='tmpl-outdoor-default' && t[0]?.duration===75
        && t[1]?.id==='tmpl-indoor-default' && t[1]?.duration===75;
      state.practiceTemplates = isUntouchedStockPair ? state.practiceTemplates : t;
    } else if(snap.practiceTemplates && typeof snap.practiceTemplates === 'object'){
      // Migrate from the old fixed outdoor/indoor-slot shape (before templates became a named
      // library) so nobody's already-saved template configuration silently vanishes.
      const migrated = [];
      if(snap.practiceTemplates.outdoor) migrated.push({id:'tmpl-outdoor-default', name:'Outdoor Practice', location:'outdoor', duration:snap.practiceTemplates.outdoor.duration||75, sections:snap.practiceTemplates.outdoor.sections||defaultTemplateSections()});
      if(snap.practiceTemplates.indoor) migrated.push({id:'tmpl-indoor-default', name:'Indoor Practice', location:'indoor', duration:snap.practiceTemplates.indoor.duration||75, sections:snap.practiceTemplates.indoor.sections||defaultTemplateSections()});
      if(migrated.length) state.practiceTemplates = migrated;
    }
    if(snap.sectionDefaultPcts && typeof snap.sectionDefaultPcts === 'object'){
      PHASES.forEach(p => { if(typeof snap.sectionDefaultPcts[p.key] === 'number') sectionDefaultPcts[p.key] = snap.sectionDefaultPcts[p.key]; });
    }
    if(Array.isArray(snap.localExercises) && snap.localExercises.length){
      // Merge coach-created exercises (never in the bundled/synced sheet data) back into
      // EXERCISES before the detailId check below runs, so reopening the app on a Detail page
      // for one of them doesn't wrongly bounce to Home for "not found".
      state.localExercises = snap.localExercises;
      EXERCISES.unshift(...state.localExercises);
      state.hasIdCollision = dedupeExerciseIds(EXERCISES);
    }

    // Restore navigation context last, once savedSessions/etc. above are already in place, so the
    // screen-specific data a restored screen depends on (a saved session's id, an exercise's id)
    // can actually be checked against real, current data rather than trusted blindly.
    // Skipped entirely when opened as the installed Home Screen web app (navigator.standalone) --
    // tapping that icon should always open to Home, not wherever the coach last was, even though
    // the actual draft/session data above is still restored either way. A regular Safari tab
    // (navigator.standalone is false there) keeps resuming the last screen as before.
    if(typeof snap.screen === 'string' && screens[snap.screen] && window.navigator.standalone !== true){
      let restoredScreen = snap.screen;
      state.detailId = snap.detailId ?? null;
      state.pickingPhase = snap.pickingPhase ?? null;
      state.sectionFilter = snap.sectionFilter ?? null;
      state.quickFilterValue = snap.quickFilterValue ?? null;
      state.viewingSessionId = snap.viewingSessionId ?? null;
      state.fromBuild = !!snap.fromBuild;
      state.fromReview = !!snap.fromReview;
      state.fromCustomReview = !!snap.fromCustomReview;
      state.pickReturnTo = snap.pickReturnTo === 'customReview' ? 'customReview' : null;
      state.fromSavedSessionId = snap.fromSavedSessionId ?? null;
      state.fromSavedSession = !!snap.fromSavedSession && state.savedSessions.some(s => s.id === state.fromSavedSessionId);
      state.editingSavedSessionId = (snap.editingSavedSessionId && state.savedSessions.some(s => s.id === snap.editingSavedSessionId)) ? snap.editingSavedSessionId : null;
      if(snap.reviewGroupOrder && typeof snap.reviewGroupOrder === 'object') state.reviewGroupOrder = snap.reviewGroupOrder;
      if(restoredScreen === 'detail' && !exById(state.detailId)) restoredScreen = 'home';
      // Step 3/4 only make sense mid-run; a reload lands back on Session Setup with every choice kept.
      if(restoredScreen === 'customSessionGenerating') restoredScreen = 'customSessionSetup';
      if(restoredScreen === 'customSessionReview' && !(state.csReviewCfg && currentTotalMinutes().count > 0)) restoredScreen = 'customSessionSetup';
      if(restoredScreen === 'sessionDetail' && !state.savedSessions.some(s => s.id === state.viewingSessionId)) restoredScreen = 'sessions';
      if(restoredScreen === 'sharedSession') restoredScreen = 'home'; // a shared page only exists while its ?s= link is open
      // A reload mid-"replace an exercise" used to silently drop the replace context while still
      // landing back on what looked like the same picker screen -- tapping an exercise there then
      // just added a duplicate instead of replacing anything, with no banner to show anything was
      // wrong. Only trust it back if it's still reachable (exercises/detail) and the old exercise
      // it's replacing is still actually sitting in that exact phase/section.
      const rc = snap.replaceContext;
      if(rc && typeof rc === 'object' && rc.oldId && (rc.returnTo === 'build' || rc.returnTo === 'review' || rc.returnTo === 'customReview')
          && (restoredScreen === 'exercises' || restoredScreen === 'detail')){
        const arr = exerciseListFor(rc.key);
        if(arr && arr.includes(rc.oldId)) state.replaceContext = {key: rc.key, oldId: rc.oldId, returnTo: rc.returnTo};
      }
      state.screen = restoredScreen;
    }
  }catch(e){ /* corrupted/incompatible saved data (e.g. from an older version of this app) -- fall back to defaults rather than crash */ }
}

/* ============ ROUTER / RENDER ============ */
const screens = {
  home: renderHome,
  exercises: renderExercises,
  detail: renderDetail,
  practiceSetup: renderPracticeSetup,
  build: renderBuild,
  review: renderReview,
  sessions: renderSessions,
  sessionDetail: renderSessionDetail,
  sharedSession: renderSharedSession,
  settings: renderSettings,
  quickStartHome: renderQuickStartHome,
  quickStartPractices: renderQuickStartPractices,
  quickStartCustom: renderQuickStartCustom,
  customSessionSetup: renderCustomSessionSetup,
  customSessionGenerating: renderCustomSessionGenerating,
  customSessionReview: () => renderReview(true),
};

function render(){
  const bottomnavEl = document.getElementById('bottomnav');
  const sharedPreview = !state.coachName && inSharedPreview();
  if(!state.coachName && !sharedPreview){
    // Gate the whole app behind "who's coaching" -- no nav makes sense before that's known.
    document.getElementById('topbar').innerHTML = `<div class="brand"><div class="logo-badge">${LOGO_MARK}</div><div class="brand-lockup"><div class="bl-line1">Fast Tigers</div><div class="bl-line2">Futbol Training</div></div></div>`;
    bottomnavEl.innerHTML = '';
    document.getElementById('bottomDock').style.display = 'none';
    document.getElementById('workflowFooter').innerHTML = '';
    document.getElementById('shell').classList.remove('has-workflow-cta', 'workflow-tight');
    document.getElementById('content').innerHTML = renderWhoIsCoaching();
    renderOverlay();
    return;
  }
  document.getElementById('bottomDock').style.display = sharedPreview ? 'none' : '';
  if(sharedPreview) renderSharedTopbar(); else renderTopbar();
  document.getElementById('content').innerHTML = screens[state.screen]();
  initLazyMedia();
  if(sharedPreview) bottomnavEl.innerHTML = ''; else renderBottomnav();
  const footerHtml = sharedPreview ? '' : workflowFooterHtml();
  document.getElementById('workflowFooter').innerHTML = footerHtml;
  document.getElementById('shell').classList.toggle('has-workflow-cta', !!footerHtml);
  document.getElementById('shell').classList.toggle('workflow-tight', (state.screen === 'review' || state.screen === 'customSessionReview' || state.screen === 'build' || state.screen === 'practiceSetup'));
  renderOverlay();
  scheduleSaveAppStateToStorage();
}

/* Every bottom sheet can be pulled down to dismiss: grab the little grey bar (or the title strip right under it) and drag
   down. A long enough pull, or a quick flick, closes it by "tapping" its own backdrop, i.e. through the sheet's normal close
   handler -- so anything that refuses to close (e.g. a PDF being made) simply springs back. */
function initSheetDrag(){
  const ov = document.getElementById('overlay'); if(!ov) return;
  let d = null;
  const reset = (sheet, backdrop) => {
    sheet.style.transition = 'transform .2s ease'; sheet.style.transform = '';
    if(backdrop){ backdrop.style.transition = ''; backdrop.style.opacity = ''; }
    setTimeout(() => { sheet.style.transition = ''; }, 220);
  };
  ov.addEventListener('pointerdown', e => {
    const sheet = e.target.closest && e.target.closest('.sheet');
    if(!sheet || !ov.contains(sheet)) return;
    if(e.target.closest('button,input,select,textarea,a,[contenteditable]')) return;
    const r = sheet.getBoundingClientRect();
    if(e.clientY - r.top > 60) return;                  // only the top strip (grabber + title) drags the sheet
    const prev = sheet.previousElementSibling;
    const backdrop = prev && prev.classList.contains('sheet-backdrop') ? prev : null;
    d = {sheet, backdrop, startY:e.clientY, t:performance.now(), dy:0, id:e.pointerId, h:r.height};
    sheet.style.transition = 'none'; if(backdrop) backdrop.style.transition = 'none';
    try{ sheet.setPointerCapture(e.pointerId); }catch(_){}
  });
  ov.addEventListener('pointermove', e => {
    if(!d || e.pointerId !== d.id) return;
    d.dy = Math.max(0, e.clientY - d.startY);
    d.sheet.style.transform = `translateY(${d.dy}px)`;
    if(d.backdrop) d.backdrop.style.opacity = String(Math.max(0, 1 - d.dy / d.h));
    e.preventDefault();
  });
  const end = e => {
    if(!d || e.pointerId !== d.id) return;
    const {sheet, backdrop, dy, h} = d;
    const dt = Math.max(performance.now() - d.t, 1);
    d = null;
    if(dy > Math.min(120, h * 0.3) || (dy / dt > 0.6 && dy > 24)){
      sheet.style.transition = 'transform .18s ease-out'; sheet.style.transform = 'translateY(100%)';
      if(backdrop){ backdrop.style.transition = 'opacity .18s'; backdrop.style.opacity = '0'; }
      setTimeout(() => {
        if(backdrop) backdrop.click();
        if(document.body.contains(sheet)) reset(sheet, backdrop);      // the sheet declined to close -- put it back
      }, 190);
    } else reset(sheet, backdrop);
  };
  ov.addEventListener('pointerup', end);
  ov.addEventListener('pointercancel', end);
}

initTheme();
initSheetDrag();
loadAppStateFromStorage();
state.coachName = loadCoachName();
initSharedLink();
render();
ensureExercisesSynced(false);
if(state.coachName) syncSessionsFromSheet();
if(state.sharedToken) loadSharedSession();

/* Select all existing text the moment an editable field gets focus, so typing immediately
   replaces it instead of requiring a manual select-all or delete first. Delegated on #content
   (a stable element that persists across re-renders) so it covers every editable field, including
   ones added later, without wiring up each one individually. */
document.getElementById('content').addEventListener('focusin', (e) => {
  const el = e.target;
  if(el.isContentEditable){
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } else if(el.tagName === 'INPUT' && (el.type === 'text' || el.type === '')){
    el.select();
  }
});

</script>
