.dh-icon-btn{background:rgba(255,255,255,0.15);border:none;width:var(--icon-btn-md);height:var(--icon-btn-md);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0;}
.dh-icon-btn svg{width:16px;height:16px;}
.dh-icon-btn.on svg{color:var(--turf);}

/* Favorite star on a saved-session list row -- session-row became a div (see renderSessions) so
   this button is a proper sibling instead of an invalid nested button. */
.session-fav-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--ink-soft);}
.session-fav-btn svg{width:18px;height:18px;}
.session-fav-btn.on svg{color:var(--turf);}
.session-del-btn{background:none;border:none;padding:4px;display:flex;flex-shrink:0;color:var(--warn);}
.session-del-btn svg{width:17px;height:17px;}

/* Home screen "you already started one of these" banner -- same claret identity as the main
   action tiles just below it, so it reads as part of the same screen rather than a foreign alert. */
.continue-draft-banner{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg-surface);border:1.5px solid var(--claret);border-radius:14px;padding:12px 14px;margin:10px 0 4px;text-align:left;}
.cdb-icon{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;}
.cdb-icon img{width:100%;height:100%;object-fit:cover;}
.cdb-title{font-size:var(--fs-base);font-weight:800;text-transform:uppercase;letter-spacing:0.03em;color:var(--claret);}
.cdb-sub{font-size:var(--fs-base);color:var(--ink-soft);margin-top:2px;}
.continue-draft-banner .cdb-chevron{margin-left:auto;color:var(--ink-soft);flex-shrink:0;}

/* ---------- editable fields ---------- */
[contenteditable="true"]{
  outline:none;border-radius:6px;transition:background .12s;
  padding:2px 4px;margin:-2px -4px;
}
[contenteditable="true"]:hover{background:var(--chalk-dim);}
[contenteditable="true"]:focus{background:var(--turf-dim);box-shadow:0 0 0 1.5px var(--turf);}
.edit-hint{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--fs-sm);font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;
  margin-left:6px;opacity:0.65;
}
.edit-hint svg{width:10px;height:10px;}
.editable-title[contenteditable="true"]{display:inline-block;min-width:40px;}
input.section-title-input{
  font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-input);text-transform:uppercase;letter-spacing:0.02em;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);
  padding:2px 0 4px;width:100%;outline:none;
}
input.section-title-input:focus{border-color:var(--turf);}

/* ---------- media / gif box ---------- */
.media-box{
  margin:16px 18px 0;height:220px;border-radius:14px;overflow:hidden;position:relative;
  background:var(--chalk-dim);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.media-box img,.media-box video{width:100%;height:100%;object-fit:cover;}
.media-box-placeholder{flex-direction:column;gap:8px;color:var(--ink-soft);}
.media-box-placeholder svg{width:28px;height:28px;opacity:0.6;}
.media-box-placeholder span{font-size:var(--fs-base);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.media-error-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--chalk-dim);color:var(--ink-soft);text-align:center;overflow:hidden;}
.media-error-fallback svg{width:18px;height:18px;opacity:0.6;flex-shrink:0;}
.media-error-fallback span{font-size:var(--fs-2xs);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:0 4px;line-height:1.25;}

/* Video thumbnails everywhere except the Detail page: shows the clip's first frame only (no
   playback), with a small play badge so it still reads as "tap to watch", not a broken image. */
.media-still-wrap{position:relative;overflow:hidden;}
.media-still-wrap video{pointer-events:none;}
.media-play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;background:rgba(16,20,31,0.55);
  display:flex;align-items:center;justify-content:center;color:white;
}
.media-play-badge svg{width:15px;height:15px;margin-left:2px;}
.media-input-row{display:flex;gap:8px;padding:0 18px;margin-top:10px;}
.media-input-row input{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:var(--fs-input);outline:none;
}
.media-input-row input:focus{border-color:var(--turf);}
.media-input-row button{background:var(--pitch);color:white;border:none;border-radius:10px;padding:0 18px;font-size:var(--fs-md);font-weight:700;}

.video-row{
  display:flex;align-items:center;gap:10px;padding:6px 18px 4px;
}
.video-link-btn{
  display:inline-flex;align-items:center;gap:5px;background:var(--chalk-dim);color:var(--ink-soft);
  border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:var(--fs-sm);font-weight:700;flex-shrink:0;
}
.video-link-btn svg{width:11px;height:11px;}

/* ---------- sessions list / detail ---------- */
.session-row{
  display:flex;align-items:center;gap:12px;background:var(--bg-surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;text-align:left;width:100%;min-height:64px;
  cursor:pointer;
}
.session-row .srthumb{
  width:44px;height:44px;border-radius:10px;background:var(--pitch);color:white;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.session-row .srthumb svg{width:20px;height:20px;}
.session-row .srname{font-size:var(--fs-md);font-weight:700;color:var(--text-primary);}
.session-row .srmeta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;}
.session-row .srmeta svg{width:12px;height:12px;flex-shrink:0;}
.session-row .srchevron{margin-left:auto;color:var(--ink-soft);flex-shrink:0;}
.session-row .srchevron svg{width:16px;height:16px;}
.recent-clickable{cursor:pointer;}
.recent-clickable:hover{background:var(--chalk-dim);}

.sd-meta-row{display:flex;gap:10px;margin-top:14px;}
.rate-session-box{background:var(--bg-surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;}
.rate-session-title{font-family:'Inter',sans-serif;font-weight:800;font-size:var(--fs-md);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:10px;color:var(--text-primary);}
.star-row{display:flex;gap:6px;margin-bottom:10px;}
.star-btn{background:none;border:none;padding:2px;display:flex;}
.star-btn svg{width:26px;height:26px;color:var(--line);}
.star-btn.filled svg{color:var(--claret);fill:var(--claret);}
.rate-comment{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg-main);color:var(--text-primary);padding:10px;font-family:inherit;font-size:var(--fs-input);resize:vertical;}
.rate-comment:focus{border-color:var(--turf);box-shadow:var(--ring-focus);outline:none;}
.sd-phases .phase-title{font-size:var(--fs-md);}
.sd-meta{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;flex:1;}
.sd-meta .smnum{font-family:'Inter',sans-serif;font-weight:700;font-size:var(--fs-lg);color:var(--text-primary);}
.sd-meta .smlbl{font-size:var(--fs-sm);color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
</style>

<style>
/* ---- Nike theme flourish: sharp corners, inverted primary CTAs, generous whitespace ---- */
body{background:var(--bg-main);}
button,.btn,.ex-card,.mac-tile,.phase-box,.session-builder-box,.stat,.feed-item,.view-toggle-btn,
.sec-chip,.new-ex-card,.searchbar,input,select,textarea,.session-row,.tagpill,.loc-select-pill,
.ex-thumb,.ex-bookmark,.backbtn,.back-to-session-pill,.icon-btn,.avatar,.media-box,.detail-header,
.thumb-placeholder-label,.search-clear-btn,.feed-thumb,
.tsg-card,.setup-scratch-card,.setup-tmpl-card,.rate-session-box,.balance-card{
  /* the last 5 selectors on this line were previously missing from this list, which left them
     accidentally rounded while every sibling card was sharp-cornered -- added so all cards agree */
  border-radius:0 !important;
}
/* ...except the elements that are deliberately round pills/circles, not square-corner cards:
   the topbar icon buttons, the coach-initials avatar, the bottom-nav soccer-ball button, and true
   filter/tag chips (.qf-chip was previously missing here too, left at an in-between 20px radius
   that matched neither the sharp cards nor a true pill -- now a full pill like other chips/tags).
   Both rules above and here are !important, so this one wins on higher selector specificity
   (.navitem.build-fab, a compound class) and matching source order (.icon-btn/.avatar, same
   specificity as their mention above but declared later). */
.icon-btn,.avatar,.navitem.build-fab,.qp-info-btn,.qp-close-btn{
  border-radius:50% !important;
}
.qf-chip{
  border-radius:var(--radius-pill) !important;
}
.btn-primary,.build-cta .btn-primary{
  background:var(--text-primary) !important;color:var(--bg-main) !important;
  text-transform:uppercase !important;letter-spacing:0.04em !important;
}
.section-pad{padding-left:20px;padding-right:20px;}
.mac-tile{padding:22px 3px;}
* { transition:background-color .15s ease,color .15s ease,border-color .15s ease; }
</style>
</head>

const EXERCISES = JSON.parse(document.getElementById('exercise-data').textContent);
/* Normalizes one exercise record's fields — used both for the bundled starting data and for
   rows freshly pulled from the live Google Sheet, so both paths behave identically. */
// A Diagram/Video URL cell that isn't actually a link (a stray note like "Insta" landing in the
// wrong spreadsheet column, a typo, etc.) would otherwise get handed straight to an <img>/<video>
// src and render as a blank or broken tile instead of the normal fallback icon. Treat anything
// that doesn't look like a real link the same as if the cell were empty.
function looksLikeMediaUrl(v){
  if(typeof v !== 'string') return false;
  const s = v.trim();
  return /^https?:\/\//i.test(s) || /^data:(image|video)\//i.test(s);
}
// Trims whitespace and folds legacy/casing variants (a lingering "Warm Up" from before the
// single-word rename, stray capitalization, a trailing space from a copy-paste) onto the section
// names the app actually knows about -- so a formatting slip in the sheet doesn't silently zero
// out a section filter (e.g. picking exercises for the Warmup phase showing no results). Anything
// unrecognized is left as-is (trimmed) so custom, coach-added sections still work.
const SECTION_ALIASES = {
  'warm up':'Warmup', 'warmup':'Warmup', 'athletic':'Athletic', 'duels':'Duels',
  'rondos':'Rondos', 'ssgs':'SSGs', 'ssg':'SSGs', 'scrimmage':'Scrimmage',
};
function normalizeSectionValue(v){
  if(v===undefined || v===null) return v;
  const trimmed = String(v).trim();
  if(!trimmed) return trimmed;
  return SECTION_ALIASES[trimmed.toLowerCase()] || trimmed;
}
// Guards against duplicate or blank Exercise IDs (most often: a new row copied from an existing
// one whose ID column never got changed, or was left blank). Without this, EXERCISES.find(e =>
// e.id === id) always resolves to whichever colliding row comes first in the sheet -- so tapping
// one exercise's tile can silently open a completely different exercise's detail page. Instead of
// failing silently, every row is guaranteed a unique id, and the collision is flagged (via the
// return value, surfaced as a Home-screen banner) rather than causing confusing navigation.
function dedupeExerciseIds(list){
  const seen = new Map();
  let hadIssue = false;
  list.forEach((e, i) => {
    let id = (e.id || '').trim();
    if(!id){
      hadIssue = true;       // blank ID -- flag it, even though the fallback below keeps it unique
      id = '_ROW' + i;
    }
    if(seen.has(id)){
      hadIssue = true;       // a real duplicate, not just a blank
      const n = seen.get(id) + 1;
      seen.set(id, n);
      e.id = id + '-dup' + n;
    } else {
      seen.set(id, 0);
      e.id = id;
    }
  });
  return hadIssue;
}
function normalizeExerciseRecord(e){
  if(e.mediaUrl===undefined) e.mediaUrl=null;
  if(e.videoUrl===undefined) e.videoUrl=null;
  if(e.mediaUrl && !looksLikeMediaUrl(e.mediaUrl)) e.mediaUrl=null;
  if(e.videoUrl && !looksLikeMediaUrl(e.videoUrl)) e.videoUrl=null;
  e.section = normalizeSectionValue(e.section);
  if(e.location===undefined || e.location===null || e.location===''){
    const text = (e.name + ' ' + (e.setup||'') + ' ' + (e.description||'')).toLowerCase();
    e.location = text.includes('wall') ? 'indoor' : 'both';
  } else {
    e.location = String(e.location).toLowerCase();
    if(!['indoor','outdoor','both'].includes(e.location)) e.location = 'both';
  }
  return e;
}
EXERCISES.forEach(normalizeExerciseRecord);

   and only if the sheet's sharing is set to "Anyone with the link — Viewer". */

const DIFF_TEXT_MAP = {Beginner:1, Intermediate:3, Advanced:5};
function parseDifficultyField(v){
  if(v===undefined || v===null || v==='') return null;
  const trimmed = String(v).trim();
  if(DIFF_TEXT_MAP[trimmed] !== undefined) return DIFF_TEXT_MAP[trimmed];
  const n = parseInt(trimmed, 10);
  return isNaN(n) ? null : n;

function splitTags(v){
  if(!v) return [];
  // Google Sheets' native multi-select dropdown ("Allow multiple selections" on a chip-format
  // Data Validation rule) writes its picks into the cell comma-separated (e.g. "Passing, Receiving"),
  // not semicolon-separated -- so both delimiters need to be accepted here. None of the tag
  // vocabulary itself contains a comma or semicolon, so splitting on either is safe.
  return String(v).split(/[;,]/).map(s=>s.trim()).filter(Boolean);
}
function csvRowToExercise(row){

// number), so this coerces defensively rather than assuming .trim() is safe like the CSV path can.
function jsonRowToExercise(row){

    tacticalScore: num(row['Tactical Score']),

async function syncExercisesFromSheet(){
  let rows = null;
  let usedSource = null;

  // Preferred: Apps Script Web App — works even though the sheet itself is private.
  if(APPS_SCRIPT_URL){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        rows = data.map(jsonRowToExercise);
        usedSource = 'Apps Script';
      }
    } catch(err){
      console.warn('Apps Script sync skipped:', err.message);
    }
  }

  // Fallback: direct CSV export — only works if the sheet is shared "Anyone with the link — Viewer".
  if(!rows){
    try{
      const res = await fetch(SHEET_CSV_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
      const csvText = await res.text();
      if(typeof Papa === 'undefined') throw new Error('CSV parser not loaded');
      const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
      const csvRows = parsed.data.filter(r => (r['Exercise Name']||'').trim());
      if(csvRows.length){
        rows = csvRows.map(csvRowToExercise);
        usedSource = 'CSV export';
      }
    } catch(err){
      console.warn('CSV sheet sync skipped:', err.message);
    }
  }

  // Neither source worked (offline, opened as a local file, CSP blocking external fetch on a
  // hosted Artifact copy, a stale/redeployed Apps Script URL, etc.) — keep the bundled data, but
  // (unlike before) tell the coach so a stale copy never masquerades as current. This is the
  // single most likely explanation any time a recently-added video or diagram link "isn't
  // showing up" on a phone: the newest sheet edits never made it down to that device.
  if(!rows){ state.dataSource = 'offline'; render(); return; }
  state.dataSource = 'live';

  // Keep any locally-attached media (e.g. animated diagrams built directly in the app) for
  // exercises the sheet doesn't have a Diagram URL for yet, matched by name.
  const localMediaByName = {};
  EXERCISES.forEach(e => { if(e.mediaUrl) localMediaByName[e.name] = e.mediaUrl; });

  const fresh = rows.map(e => {
    if(!e.mediaUrl && localMediaByName[e.name]) e.mediaUrl = localMediaByName[e.name];
    return normalizeExerciseRecord(e);
  });
  state.hasIdCollision = dedupeExerciseIds(fresh);

  EXERCISES.length = 0;
  EXERCISES.push(...fresh);
  render();
  showToast(`Synced with your live exercise sheet (${usedSource})`);
}

// (routes on ?sheet=validvalues) for this to return live data -- until then it silently keeps
// showing VALID_VALUES_FALLBACK, same "stale bundled copy, no crash" behavior as EXERCISES.
async function syncValidValuesFromSheet(){
  if(!APPS_SCRIPT_URL) return;

/* ============ SAVED SESSIONS: shared sync (added Sep 2026) ============
   Mirrors syncExercisesFromSheet()'s shape: fetch, fall back quietly, never let a failed fetch
   pretend to be current data. See claude_FT2_AppsScript_Code.gs for the server side. */
function normalizeCloudSession(c){
  return {
    id: String(c.id), name: c.name || 'Untitled Practice', createdBy: c.createdBy || 'Unknown coach',
    createdAt: Number(c.createdAt) || Date.now(),
    totalMin: Number(c.totalMin) || 0, exCount: Number(c.exCount) || 0,
    targetDuration: Number(c.targetDuration) || 60,
    phases: Array.isArray(c.phases) ? c.phases : [],
    practiceDate: c.practiceDate || '', location: c.location || 'outdoor',
    templateId: c.templateId || null,
    rating: Number(c.rating) || 0, comment: c.comment || '', favorited: !!c.favorited,
    visibility: c.visibility === 'private' ? 'private' : 'shared',
  };
}
async function syncSessionsFromSheet(){
  if(!APPS_SCRIPT_URL) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?sheet=sessions', {cache:'no-store'});
    if(!res.ok) throw new Error('Apps Script fetch failed: ' + res.status);
    const cloud = await res.json();
    if(!Array.isArray(cloud)) throw new Error((cloud && cloud.error) || 'Unexpected sessions response');

    // Merge rather than replace outright: a session this device saved/edited but hasn't
    // successfully pushed yet (_syncPending) stays as our local copy until it confirms -- the
    // Sheet is the source of truth for everything else, including sessions from other coaches.
    const localById = new Map(state.savedSessions.map(s=>[s.id, s]));
    const seenIds = new Set();
    const merged = cloud.map(c => {
      seenIds.add(String(c.id));
      const local = localById.get(String(c.id));
      return (local && local._syncPending) ? local : normalizeCloudSession(c);
    });
    state.savedSessions.forEach(s => { if(!seenIds.has(String(s.id))) merged.push(s); }); // local-only, never yet synced (e.g. saved while offline)
    state.savedSessions = merged;
    state.sessionsSyncSource = 'live';
    render();
    retryPendingSessionPushes();
  } catch(err){
    console.warn('Session sync skipped:', err.message);
    state.sessionsSyncSource = 'offline';
    render();
  }
}
// The client always sends the WHOLE current session object; the server always replaces the whole
// row (see upsertSession() server-side) -- this one function covers create, rename, rate,
// favorite, visibility, and add/remove-exercise, since every one of those already ends with the
// caller mutating the local session object and calling render().
async function pushSessionToSheet(session){
  session._syncPending = true;
  if(!APPS_SCRIPT_URL) return;
  try{
    const {_syncPending, ...payload} = session;
    // Deliberately no explicit Content-Type header: Apps Script Web Apps don't handle the
    // CORS preflight (OPTIONS) request a declared "application/json" body would trigger from a
    // browser, so this relies on fetch's default text/plain body type to stay a "simple request".
    // The server reads the raw body regardless of declared type, so this doesn't affect parsing.
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'upsert', session:payload}) });
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data && data.error) || 'Save did not confirm');
    session._syncPending = false;
  } catch(err){
    console.warn('Session push failed, will retry next sync:', err.message);
  }
  render();
}
async function deleteSessionFromSheet(id){
  if(!APPS_SCRIPT_URL) return;
  try{
    await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'delete', session:{id}}) });
  } catch(err){
    console.warn('Session delete-sync failed (it stays deleted locally either way):', err.message);
  }
}
function retryPendingSessionPushes(){
  state.savedSessions.filter(s=>s._syncPending).forEach(s => pushSessionToSheet(s));
}

/* Coach-adjustable defaults for a brand-new practice template's starting percentages -- editable

   default templates on a fresh install. Kept as its own module-level object (not a field of
   `state`) since defaultTemplateSections() is called while the `state` object literal itself is

   (Warmup 5 + Athletic 20) / Develop 50% (Duels 10 + Rondos 20 + Small Sided Games 20) / Play 25%
   (Scrimmage 25) split -- exactly 100%. */
const DEFAULT_SECTION_PCTS = {warmup:5, athletic:20, duels:10, rondos:20, ssg:20, scrimmage:25};
const sectionDefaultPcts = {...DEFAULT_SECTION_PCTS};
function defaultTemplateSections(){

function adjustDefaultSectionPct(key, delta){

// PHASES in the order the coach has saved/dragged them into (state.phaseOrder) -- falls back to
// declaration order for any key not yet present (e.g. before a template has ever been saved).
function orderedPhases(){
  return state.phaseOrder.map(k => PHASES.find(p => p.key===k)).filter(Boolean);
}

// Coaching guideline for how a session's time should roughly break down -- simplified from 6
// equal-weight sections into 3 higher-level practice phases, easier for a coach to read at a
// glance: Activate (Warmup + Athletic), Develop (Duels + Rondos + Small Sided Games), and Play
// (Scrimmage). phaseKeys lists which PHASES entries roll up into each group (in display order);
// sublabel is the human-readable "what's in this phase" line shown under each group's heading.
// This is also the single source of truth for the PHASES-to-phase-group mapping --
// computeGroupMinutes(), computeGroupMinutesFromPhases(), reviewPhaseGroups(), and
// sessionDetailPhaseGroups() all derive from it, so the grouping is only ever defined once.
const PHASE_GROUPS = [
  {key:'activate', label:'Activate', pct:25, phaseKeys:['warmup','athletic'],    sublabel:'Warmup + Athletic',                  color:'var(--sec-warmup)',    textOn:'white', icon: ICONS.flame},
  {key:'develop',  label:'Develop',  pct:50, phaseKeys:['duels','rondos','ssg'], sublabel:'Duels + Rondos + Small Sided Games', color:'var(--sec-duels)',     textOn:'white', icon: ICONS.circleArrows},
  {key:'play',     label:'Play',     pct:25, phaseKeys:['scrimmage'],            sublabel:'Scrimmage',                          color:'var(--sec-scrimmage)', textOn:'dark',  icon: ICONS.trophy},
];
/* Suggested-split minutes, rounded to the nearest 5m for a cleaner readout (e.g. ~11m -> 10m,
   ~19m -> 20m) without letting the rounded total run over the session's target length when
   avoidable -- trims 5m at a time from whichever phase group is currently furthest above its
   own raw (un-rounded) share until the rounded total fits, or every group has hit 0. */
function suggestedSplitMinutes(target){
  const raw = PHASE_GROUPS.map(s => target * s.pct / 100);
  const rounded = raw.map(r => Math.max(0, Math.round(r/5)*5));
  let total = rounded.reduce((a,b)=>a+b,0);
  while(total > target){
    let idx = -1, bestOver = -Infinity;
    rounded.forEach((r,i) => {
      if(r <= 0) return;
      const over = r - raw[i];
      if(over > bestOver){ bestOver = over; idx = i; }
    });
    if(idx === -1) break;
    rounded[idx] -= 5;
    total -= 5;
  }
  return rounded;
}

// Counts how many values two tag arrays have in common -- used by similarityScore() below.
function tagOverlapCount(a, b){
  if(!a || !a.length || !b || !b.length) return 0;
  let n = 0;
  for(const t of a){ if(b.includes(t)) n++; }
  return n;
}
// "Similar Exercises" ranking: total shared Format/Technical/Physical/Cognitive tags between two
// exercises. Tactical and Engagement are deliberately excluded (matches the exact fields the
// coach asked "Similar Exercises" to consider).
function similarityScore(a, b){
  return tagOverlapCount(a.formatTags, b.formatTags)
       + tagOverlapCount(a.technicalTags, b.technicalTags)
       + tagOverlapCount(a.physicalTags, b.physicalTags)
       + tagOverlapCount(a.cognitiveTags, b.cognitiveTags);
}

function exById(id){

/* Renders an exercise's media as the right tag: <video> for MP4/WebM/MOV exports (e.g. from
   tactical-board.com), <img> for GIF/PNG/JPEG/etc. extraStyle sizes the element/wrapper.
   autoplay (default true) controls playback: the Detail page passes true so a coach sees the
   drill actually run as soon as they open it; every thumbnail context (grid cards, build-list
   rows, session review, similar-exercises) passes false so the same video shows only its first
   frame as a still — no small autoplaying videos competing for attention in a scrolling list,
   and far less bandwidth than playing every visible video at once. A small play badge marks
   still frames as tappable-to-watch so it doesn't read as a broken image. */
function isVideoUrl(url){
  return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url) || url.startsWith('data:video/');
}
let mediaFallbackSeq = 0;
const mediaFallbackHtml = {};
function mediaTagHtml(url, altText, extraStyle, autoplay, fallbackHtml){
  if(autoplay === undefined) autoplay = true;
  const style = extraStyle || '';
  // fallbackHtml, when given, is the exact same markup this call site already uses for its own
  // "no media at all" case -- stashed by id (not inlined into the onerror attribute -- it can
  // contain quotes/markup that wouldn't survive that) so a broken link renders identically to a
  // missing one, instead of always falling back to one generic gray box with no section context.
  let fid = '';
  if(fallbackHtml){
    fid = 'mf'+(++mediaFallbackSeq);
    mediaFallbackHtml[fid] = fallbackHtml;
  }
  if(isVideoUrl(url)){
    if(autoplay){
      return `<video src="${escAttr(url)}" autoplay muted loop playsinline style="${style}" onerror="mediaLoadFailed(this,'${fid}')"></video>`;
    }
    // Plain first-frame still, no play badge overlay -- reads as a normal photo thumbnail.
    return `<div class="media-still-wrap" style="${style}">
      <video src="${escAttr(url)}#t=0.1" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;" onloadedmetadata="this.currentTime=0.1" onerror="mediaLoadFailed(this,'${fid}')"></video>
    </div>`;
  }
  return `<img src="${escAttr(url)}" alt="${escAttr(altText||'')}" style="${style}" onerror="mediaLoadFailed(this,'${fid}')">`;
}
/* A Diagram URL that's set but unreachable/invalid (wrong link type -- a Google Drive share page
   or YouTube page instead of a direct file link -- a typo'd/renamed filename, or a link accidentally
   pasted into the wrong Sheet column) previously showed the browser's own bare broken-image icon,
   with zero indication anything was wrong or why. Swap it for a "Diagram coming soon" placeholder --
   the caller's own fallbackHtml (matching what it shows for "no media at all") when one was given,
   otherwise a generic fallback, so a bad link degrades gracefully everywhere mediaTagHtml() is used
   (exercise cards, the Detail page, session rows, Similar Exercises). */
function mediaLoadFailed(el, fid){
  if(el.dataset.mediaFailed) return;
  el.dataset.mediaFailed = '1';
  const wrap = el.closest('.media-still-wrap');
  const target = wrap || el;
  const custom = fid && mediaFallbackHtml[fid];
  if(custom){
    const temp = document.createElement('div');
    temp.innerHTML = custom;
    const fallback = temp.firstElementChild;
    if(fallback){
      target.replaceWith(fallback);
      delete mediaFallbackHtml[fid];
      return;
    }
  }
  const style = target.getAttribute('style') || '';
  const fallback = document.createElement('div');
  fallback.className = 'media-error-fallback';
  fallback.setAttribute('style', style);
  fallback.innerHTML = `${ICONS.image}<span>Diagram coming soon</span>`;
  target.replaceWith(fallback);
}
function allTagsFor(ex){
  return [...ex.technicalTags, ...ex.tacticalTags, ...ex.formatTags, ...ex.physicalTags, ...ex.cognitiveTags, ...ex.engagementTags];
}

/* ============ TRAINING PROFILE ============ */
/* Canonical definition of the 4 core Training Dimensions the exercise repository scores every
   exercise on, 0-5 (0 = not meaningfully trained ... 5 = primary purpose). Deliberately excludes
   Engagement -- an activity characteristic, still available as Engagement Tags metadata, not a
   training dimension -- and Format/Duration/Difficulty/Location, which are activity
   characteristics too. This is the single source of truth for the 4 dimensions:
   TRAINING_DIMENSIONS (score-key/label pairs) and DIMENSION_TAG_CATEGORIES (score-key/valid-
   values-key pairs, used by dimensionForTagValue) are both derived from it below, and
   activeRankingDimensions() derives its tag-field-to-score-key map from it too, so the 4
   dimensions only ever need to be listed once. (The separate FOCUS_CATEGORIES constant above is
   intentionally NOT derived from this -- it's a different concept: a UI list of tag FIELDS for
   the Training Focus chips, with its own "Athletic" label for the Physical dimension, not the
   same thing as a Training Dimension SCORE.) */
const TRAINING_DIMENSION_DEFS = [
  {scoreKey:'technicalScore', label:'Technical', tagFieldKey:'technicalTags', validKey:'Technical Tags'},
  {scoreKey:'tacticalScore',  label:'Tactical',  tagFieldKey:'tacticalTags',  validKey:'Tactical Tags'},
  {scoreKey:'physicalScore',  label:'Physical',  tagFieldKey:'physicalTags',  validKey:'Physical Tags'},
  {scoreKey:'cognitiveScore', label:'Cognitive', tagFieldKey:'cognitiveTags', validKey:'Cognitive Tags'},
];
const TRAINING_DIMENSIONS = TRAINING_DIMENSION_DEFS.map(d => ({key:d.scoreKey, label:d.label}));
/* Normalizes one raw score value (from an exercise record, a saved-session snapshot, etc.) to
   either a number clamped to the valid 0-5 range, or null when it isn't usable data at all
   (missing/undefined/non-numeric/NaN). Used everywhere a Training Dimension score is read, so
   every consumer treats out-of-range or malformed data the same defensive way. Never invents a
   score -- null in, null out. */
function clampScore(raw){
  return (typeof raw === 'number' && !isNaN(raw)) ? Math.max(0, Math.min(5, raw)) : null;
}
/* Reads the 4 scores straight off the exercise record -- never computed or invented here.
   A missing score (null/undefined/non-numeric, e.g. a brand-new draft exercise that hasn't
   been scored yet) comes back as score:null so the caller can render an explicit "not scored"
   state. 0 is itself a valid, meaningful score ("not meaningfully trained"), so it must never
   be treated as a stand-in for "no data". */
function trainingProfileFor(ex){
  return TRAINING_DIMENSIONS.map(d => {
    const score = ex ? clampScore(ex[d.key]) : null;
    return {key: d.key, label: d.label, score};
  });
}
function trainingProfileRowHtml(dim){
  const scored = dim.score !== null;
  const filled = scored ? Math.round(dim.score) : 0;
  const dots = Array.from({length:5}, (_,i) => `<i class="tprof-dot ${i<filled?'on':''}"></i>`).join('');
  return `<div class="tprof-row ${scored?'':'tprof-row-unscored'}">
    <span class="tprof-label">${dim.label}</span>
    <span class="tprof-dots">${dots}</span>
    <span class="tprof-num">${scored?dim.score:'\u2014'}</span>
  </div>`;
}

/* ============ PRACTICE TRAINING PROFILE ============ */
/* Duration-weighted average of the same 4 Training Dimensions across every exercise in a
   practice (a build-in-progress or a saved/completed session) -- a 20-minute exercise
   contributes 4x as much as a 5-minute one, never a simple per-exercise average. Takes a
   plain {duration, scores}[] list rather than raw exercise objects so the same function
   works for a live build (scores read straight off the current EXERCISES data) and a saved
   session (scores read from that session's own frozen snapshot -- see completeSession()).
   A dimension with zero scored exercises anywhere in the practice comes back as score:null
   (nothing to average -- same "don't invent a number" rule as the per-exercise profile); an
   individual exercise missing just one dimension's score is excluded only from that
   dimension's average (its duration still counts toward whichever other dimensions it *is*
   scored on) rather than being treated as a 0, which would silently understate the practice. */
function practiceTrainingProfile(items){
  return TRAINING_DIMENSIONS.map(d => {
    let weighted = 0, durSum = 0;
    items.forEach(({duration, scores}) => {
      const score = scores ? clampScore(scores[d.key]) : null;
      const dur = (typeof duration === 'number' && duration > 0) ? duration : 0;
      if(score !== null && dur > 0){ weighted += score*dur; durSum += dur; }
    });
    return {key: d.key, label: d.label, score: durSum>0 ? weighted/durSum : null};
  });
}
/* {duration, scores} items for the build-in-progress practice (Review screen), pulled live
   from every used phase + extra section so the profile always reflects the current draft. */
function currentPracticeTrainingItems(){
  const items = [];
  PHASES.forEach(p => state.phaseData[p.key].forEach(id => {
    const ex = exById(id);
    if(ex) items.push({duration: ex.duration||10, scores: ex});
  }));
  state.extraSections.forEach(s => s.exercises.forEach(id => {
    const ex = exById(id);
    if(ex) items.push({duration: ex.duration||10, scores: ex});
  }));
  return items;
}
/* {duration, scores} items for a saved/completed session. Sessions saved by this batch carry
   their own frozen score snapshot (see completeSession()) so a practice's profile doesn't
   silently drift if an exercise's scores get edited later. A session saved before this
   feature existed has no snapshot -- falls back to a live exById() lookup so older sessions
   still get a best-effort profile instead of showing nothing. */
function savedSessionTrainingItems(s){
  const items = [];
  s.phases.forEach(p => p.exercises.forEach(e => {
    // hasScoreSnapshot is an explicit flag set by completeSession() at save time -- more
    // reliable than inferring from score contents, since a legitimately-scored-all-0 exercise
    // (0 is a valid, meaningful score) would otherwise look identical to "no snapshot taken".
    // Sessions saved before this flag existed fall back to the same content-based heuristic so
    // they still get a best-effort profile via a live exById() lookup instead of showing nothing.
    const hasSnapshot = e.hasScoreSnapshot === true || TRAINING_DIMENSIONS.some(d => typeof e[d.key] === 'number');
    const scores = hasSnapshot ? e : exById(e.id);
    items.push({duration: e.duration, scores});
  }));
  return items;
}
function practiceProfileRowHtml(dim){
  const scored = dim.score !== null;
  const pct = scored ? Math.max(0, Math.min(100, dim.score/5*100)) : 0;
  return `<div class="pprof-row ${scored?'':'pprof-row-unscored'}">
    <span class="pprof-label">${dim.label}</span>
    <div class="pprof-bar"><div class="pprof-bar-fill" style="width:${pct}%;"></div></div>
    <span class="pprof-num">${scored?dim.score.toFixed(1):'\u2014'}</span>
  </div>`;
}
function tpJoinPlus(labels){ return labels.join(' + '); }
function tpJoinAnd(labels){
  if(labels.length<=1) return labels.join('');
  if(labels.length===2) return labels.join(' and ');
  return labels.slice(0,-1).join(', ') + ', and ' + labels[labels.length-1];
}
/* Plain-language, descriptive-only summary of a practice's Training Profile -- explicitly
   NOT a recommendation: never says a score is "too low"/"too high", never invents a target,
   never assumes an even 25/25/25/25 split is the goal. It just describes in one sentence
   what the duration-weighted numbers above already show. "Primary" = at/near the top score
   (within 0.3) and clearly present (>=3.5); "secondary" = present but not dominant (>=2.5,
   not already primary); anything below 2.5 is simply left out of the sentence -- an
   omission, not a judgment call about it being too low. */
function practiceProfileInterpretation(profile){
  const scored = profile.filter(d => d.score !== null);
  if(!scored.length) return 'Training Profile not available yet \u2014 none of this practice\'s exercises have Training Dimension scores.';
  const top = Math.max(...scored.map(d=>d.score));
  const primary = scored.filter(d => d.score>=3.5 && (top-d.score)<=0.3).sort((a,b)=>b.score-a.score);
  const primaryKeys = new Set(primary.map(d=>d.key));
  const secondary = scored.filter(d => !primaryKeys.has(d.key) && d.score>=2.5).sort((a,b)=>b.score-a.score);

  if(primary.length>=2){
    const tail = secondary.length ? `, with moderate ${tpJoinAnd(secondary.map(d=>d.label))} demand` : '';
    return `Strong ${tpJoinPlus(primary.map(d=>d.label))} emphasis${tail}.`;
  }
  if(primary.length===1){
    const tail = secondary.length ? ` with moderate ${tpJoinAnd(secondary.map(d=>d.label))} demand` : '';
    return `High ${primary[0].label} emphasis${tail}.`;
  }
  if(secondary.length>=2) return `Balanced ${tpJoinAnd(secondary.map(d=>d.label))} session.`;
  if(secondary.length===1) return `Moderate ${secondary[0].label} demand across this session.`;
  return 'Light emphasis across all four training dimensions in this practice.';
}

/* ============ TRAINING-PROFILE-AWARE DISCOVERY & QUICK PICK ============ */
/* Maps a tag VALUE (e.g. "Speed", "Possession", "Decision Making") to the single Training
   Dimension score field it belongs to, by checking it against the coach's own Valid Values
   vocabulary (state.validValues) -- never a hardcoded table, so it can't drift out of sync
   with the actual tag categories. Returns null when the value isn't a Technical/Tactical/
   Physical/Cognitive tag at all (a Format value like "1v1", or an Engagement value), or when
   it's legitimately valid under more than one dimension (e.g. "Reaction" is valid under both
   Physical and Cognitive) -- either way there's no single unambiguous dimension to rank by,
   so callers just skip the score-based ranking boost for that value rather than guess. */
const DIMENSION_TAG_CATEGORIES = TRAINING_DIMENSION_DEFS.map(d => ({validKey:d.validKey, scoreKey:d.scoreKey}));
function dimensionForTagValue(value){
  if(!value) return null;
  const matches = DIMENSION_TAG_CATEGORIES.filter(c => (state.validValues[c.validKey]||[]).includes(value));
  return matches.length === 1 ? matches[0].scoreKey : null;
}
/* Which Training Dimension score(s) should rank the exercise list right now -- the coach's own
   signal of "training priority", read from what they've actually done, never invented: the
   Training Focus chips in the Filters sheet if any are active (each one already IS one of the
   4 dimensions), otherwise the active per-section Quick Filter value if it maps unambiguously
   to a single dimension via dimensionForTagValue(). Multiple active Training Focus dimensions
   rank by their combined score. */
function activeRankingDimensions(){
  if(state.filters.focusCategories.size){
    const map = {};
    TRAINING_DIMENSION_DEFS.forEach(d => { map[d.tagFieldKey] = d.scoreKey; });
    return [...state.filters.focusCategories].map(k=>map[k]).filter(Boolean);
  }
  if(state.pickingPhase && state.quickFilterValue){
    const dim = dimensionForTagValue(state.quickFilterValue);
    return dim ? [dim] : [];
  }
  return [];
}
/* The current practice's least-emphasized Training Dimension (reusing the batch-46 duration-
   weighted practice profile) -- a gentle secondary ranking nudge while picking exercises for
   an in-progress practice, never a hard rule. Returns null for an empty practice (nothing to
   be under-represented relative to yet). A dimension with no data at all (score:null --
   literally zero exercises have trained it so far) is treated the same as a real 0 for this
   specific "what's most under-represented" comparison, since both mean "nothing here yet".
   Tie-break: TRAINING_DIMENSIONS is walked in its fixed Technical/Tactical/Physical/Cognitive
   order and only a STRICTLY lower value replaces the current minimum, so when two or more
   dimensions are tied for least-emphasized, the earliest one in that fixed order wins --
   deterministic, not a claim that one is "more" under-emphasized than the other.
   Memoized per practice-composition signature (which exercises are in which phase/section --
   not scroll position or any other render state), so repeated calls within one render pass --
   including from renderOverlay()-only call sites that skip the full render(), e.g.
   balanceAddExercise()/toggleFilters()/openTagPicker() -- don't redo the same computation. The
   cache key is rebuilt from the actual phase/section exercise lists, so it can never go stale:
   any real composition change immediately produces a different signature. */
let _leastEmphasizedCache = null; // {sig, key}
function leastEmphasizedDimension(){
  const sig = JSON.stringify([PHASES.map(p=>state.phaseData[p.key]), state.extraSections.map(s=>s.exercises)]);
  if(_leastEmphasizedCache && _leastEmphasizedCache.sig === sig) return _leastEmphasizedCache.key;
  const items = currentPracticeTrainingItems();
  let result = null;
  if(items.length){
    const profile = practiceTrainingProfile(items);
    let min = null;
    profile.forEach(d => {
      const v = d.score === null ? 0 : d.score;
      if(min === null || v < min.value) min = {key:d.key, value:v};
    });
    result = min ? min.key : null;
  }
  _leastEmphasizedCache = {sig, key: result};
  return result;
}
/* Combined ranking priority for one exercise in the currently-shown list. Explicit coach
   intent (an active Training Focus / Quick Filter dimension, weight x3) dominates over the
   softer practice-balance nudge (weight x1, and only applied when it isn't already the
   explicit dimension, to avoid double-counting) -- so the coach's actual request always wins
   and the balance signal only orders among exercises that already satisfy it. This function
   only decides the ORDER of an already-filtered list; matchesFilters() alone decides what's
   in it, per the coach's explicit "ranking, not filtering" instruction. */
function exerciseRankingScore(ex, rankDims, balanceDim){
  let score = 0;
  rankDims.forEach(k => { const v = clampScore(ex[k]); if(v !== null) score += v*3; });
  if(balanceDim && !rankDims.includes(balanceDim)){
    const v = clampScore(ex[balanceDim]);
    if(v !== null) score += v*1;
  }
  return score;
}

/* ---- Balance My Practice ---- */
/* Up to 3 exercise recommendations aimed at strengthening whichever Training Dimension the
   current practice is currently lightest on. Always respects the section being picked, the
   active Quick Filter (if any), and prefers excluding exercises already in the practice --
   but only "when possible": if excluding them would leave fewer than 3 candidates, they're
   included after all rather than returning a starved list. Duration is a soft tiebreaker
   (closer to the practice's remaining time budget ranks higher among equally-scored
   candidates), never a hard cutoff -- an empty remaining budget just turns that tiebreaker
   off instead of producing zero recommendations. */
/* Given a Training Dimension key, returns the PHASES key most associated with training it --
   used only when Balance My Practice is opened without an active picking-phase context (i.e.
   from the Review page, batch 55, rather than from inside "+ Add Exercise" for a specific
   section as before). Reuses Quick Pick's own SECTION_PRIMARY_DIMENSIONS mapping (declared
   further down this file) rather than inventing a second one -- prefers a section where the
   dimension is that section's PRIMARY (first-listed) focus before falling back to any section
   where it's only a secondary one, so e.g. a practice that's lightest on Physical routes to
   Athletic (Physical is its sole/primary focus) rather than Duels (where Physical is only
   secondary to Tactical). */
function bestSectionKeyForDimension(dim){
  const primary = PHASES.find(p => (SECTION_PRIMARY_DIMENSIONS[p.key]||[])[0] === dim);
  if(primary) return primary.key;
  const secondary = PHASES.find(p => (SECTION_PRIMARY_DIMENSIONS[p.key]||[]).includes(dim));
  return secondary ? secondary.key : (PHASES[0]?.key || null);
}
/* Recomputes Balance My Practice's recommendation set and freezes it into state.balanceSnapshot,
   exactly like refreshQuickPickResults() does for Quick Pick (batch 58) -- otherwise recomputing
   fresh on every render (including right after tapping [+ Add]) could change which exercises are
   shown, or even silently retarget which section/dimension is being balanced, mid-interaction. */
function refreshBalanceResults(){
  state.balanceSnapshot = computeBalanceRecommendations();
}
function computeBalanceRecommendations(){
  const dim = leastEmphasizedDimension();
  if(!dim) return {dim:null, section:null, phaseKey:null, items:[]};
  const phaseKey = bestSectionKeyForDimension(dim);
  const phase = PHASES.find(p=>p.key===phaseKey);
  const section = phase ? phase.section : state.sectionFilter;
  if(!section) return {dim, section:null, phaseKey:null, items:[]};

  const alreadyIn = new Set();
  PHASES.forEach(p => state.phaseData[p.key].forEach(id=>alreadyIn.add(id)));
  state.extraSections.forEach(s => s.exercises.forEach(id=>alreadyIn.add(id)));

  const {total} = currentTotalMinutes();
  const remaining = Math.max(0, state.targetDuration - total);

  // Balance My Practice is Review-only (batch 55) -- there's no active Quick Filter concept
  // on that page, so the pool is always the full section (no leftover-filter scoping).
  let pool = EXERCISES.filter(ex => ex.section === section);

  let candidates = pool.filter(ex => !alreadyIn.has(ex.id));
  if(candidates.length < 3) candidates = pool; // "exclude already-included when possible"

  const scored = candidates
    .map(ex => ({ex, dimScore: clampScore(ex[dim]) ?? 0}))
    .sort((a,b) => {
      if(b.dimScore !== a.dimScore) return b.dimScore - a.dimScore;
      if(remaining>0){
        const da = Math.abs((a.ex.duration||10)-remaining);
        const db = Math.abs((b.ex.duration||10)-remaining);
        if(da !== db) return da-db;
      }
      return a.ex.name.localeCompare(b.ex.name);
    });

  return {dim, section, phaseKey, items: scored.slice(0,3).map(s=>s.ex)};
}
/* Short, data-traceable "why this fits" sentence -- every clause maps directly to a real field
   on the exercise (its score for the dimension being balanced, and, when a Quick Filter is
   active, whether it actually carries that tag) rather than any generic praise language. */
function balanceRecommendationReason(ex, dim){
  const dimMeta = TRAINING_DIMENSIONS.find(d=>d.key===dim);
  const label = dimMeta ? dimMeta.label : '';
  const score = clampScore(ex[dim]);
  const hasScore = score !== null;
  const tier = hasScore && score>=4 ? 'Strong ' : (hasScore && score>=3 ? 'Good ' : '');
  let sentence = hasScore ? `${tier}${label} Score (${score})` : `No ${label} Score recorded yet`;
  return sentence + '.';
}
function openBalanceSheet(){ state.balanceSheetOpen = true; state.quickPickOpen = false; state.quickPickCustomizeOpen = false; refreshBalanceResults(); renderOverlay(); }
function closeBalanceSheet(){ state.balanceSheetOpen = false; state.balanceSnapshot = null; renderOverlay(); }
function balanceAddExercise(id){
  const ex = exById(id);

  }

  const targetKey = (state.balanceSnapshot && state.balanceSnapshot.phaseKey) || bestSectionKeyForDimension(leastEmphasizedDimension());
  if(!targetKey) return;

}
function balanceCardHtml(ex, i, dim){

/* "Add [this exercise / one of these two / one of these three] to [Section]" -- states plainly,

function balanceTargetHeadingText(section, count){

/* ============ QUICK PICK ============
   "Give me 3 good exercises for this part of my practice" -- a fast, section-aware, one-click
   alternative to browsing the full list, living entirely inside the existing "+ Add Exercise"
   flow (never a separate page, never a bottom-nav item, never a second "build by training
   intent" workflow). Deliberately distinct from two other existing features it can look similar
   to at a glance:
     - Filters = "I want to precisely search the database" (exhaustive, multi-criteria, coach
       reads every result). Quick Pick never duplicates that interface -- it always returns
       exactly 3 (or fewer, if that's really all there is) and stays a single tap to use.
     - Balance My Practice = "which ONE dimension is this practice lightest on, and what could
       help with specifically that" (always ranks by the single most under-represented
       dimension). Quick Pick's primary signal is instead "what does THIS SECTION typically
       train" (see SECTION_PRIMARY_DIMENSIONS below) -- the practice's lightest dimension is only
       ever a secondary nudge here, exactly the same reduced weight leastEmphasizedDimension()
       already gets from exerciseRankingScore() elsewhere in this file.
   Fully deterministic -- no LLM, no randomness. Every ranking factor below reads a real field
   already on the exercise record or the current practice/session state, so any result can be
   traced back to quickPickReason() below, which only ever describes data that's actually true of
   that exercise. */

// Which Training Dimension score(s) a section's exercises are chosen for -- Quick Pick's PRIMARY
// ranking signal for that section. Not derived from the data (the repository has no "this section
// trains this dimension" field) -- a fixed coaching judgment call, matching the two examples given
// explicitly (Athletic -> Physical; Rondos -> Tactical + Cognitive) and extended to the remaining
// four sections with the same reasoning: Warmup is technical ball-mastery work; Duels are 1v1
// contests (tactical decision-making expressed physically); SSGs and Scrimmage are game-realistic
// small-sided play (tactical primary, physical secondary). A coach can always override this for one
// Quick Pick via Customize > Training Dimension.
const SECTION_PRIMARY_DIMENSIONS = {
  warmup:    ['technicalScore'],
  athletic:  ['physicalScore'],
  duels:     ['tacticalScore','physicalScore'],
  rondos:    ['tacticalScore','cognitiveScore'],
  ssg:       ['tacticalScore','physicalScore'],
  scrimmage: ['tacticalScore','physicalScore'],
};
/* This section's suggested minutes, from the coach's own Settings > Training Session Default
   Settings split (sectionDefaultPcts, batch 51) applied to the current session's target length --
   the closest thing this app already tracks to a per-section time budget, reused rather than
   inventing a new one. Never a hard cap (see quickPickScore()'s soft duration-fit bonus below). */
function sectionPlannedMinutes(phaseKey){
  const pct = sectionDefaultPcts[phaseKey] || 0;
  return Math.max(5, Math.round(state.targetDuration * pct / 100));
}
function sectionRemainingMinutes(phaseKey){
  const used = (state.phaseData[phaseKey]||[]).reduce((a,id)=>a+(exById(id)?.duration||10),0);
  return Math.max(0, sectionPlannedMinutes(phaseKey) - used);
}
// What Quick Pick shows as "SECTION • N MIN" and soft-prioritizes duration around -- remaining
// budget for this section if there's any left, otherwise its full planned share (never 0/blank).
function quickPickTargetMinutes(phaseKey){
  return sectionRemainingMinutes(phaseKey) || sectionPlannedMinutes(phaseKey);
}
// Distinct Format Tag values that actually appear on exercises in one section, in canonical Valid
// Values order (same derivation as filterValueOptions(), just pre-scoped to a section) -- this is
// how Duels naturally offers 1v1/2v1/2v2 and Rondos naturally offers 4v2/5v2/6v3 in Customize,
// without a hardcoded per-section list that could drift from the real repository.
function formatOptionsForSection(section){
  const canonical = state.validValues['Format Tags'] || [];
  const used = new Set();
  EXERCISES.filter(ex => ex.section === section).forEach(ex => (ex.formatTags||[]).forEach(v => { if(v) used.add(v); }));
  const ordered = canonical.filter(v => used.has(v));
  const extra = [...used].filter(v => !canonical.includes(v)).sort((a,b)=>a.localeCompare(b));
  return [...ordered, ...extra];
}

function quickPickAddExercise(id){

/* Combined ranking score for one candidate exercise. Same weight convention as the existing
   exerciseRankingScore(): an explicit signal (this section's primary dimension(s), or the coach's
   own Customize > Training Dimension override) counts x3 per score point; the softer practice-
   balance nudge counts x1, and only when it isn't already one of the primary dimensions (so it's
   never double-counted). A Customize Focus/Format tag match and a close duration fit each add a
   smaller, capped bonus -- present, but never able to outrank a real Training Dimension score
   advantage on their own. */
function quickPickScore(ex, ctx){
  let score = 0;
  ctx.primaryDims.forEach(k => { const v = clampScore(ex[k]); if(v !== null) score += v*3; });
  if(ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null) score += v*1;
  }
  if(ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) score += 4;
  if(ctx.formatTag && (ex.formatTags||[]).includes(ctx.formatTag)) score += 4;
  if(ctx.targetMin > 0){
    const diff = Math.abs((ex.duration||10) - ctx.targetMin);
    score += Math.max(0, 2 - diff/5); // full +2 at an exact match, fading to 0 by ~10min away
  }
  return score;
}
/* Short, data-traceable "why this fits" sentence -- every clause maps to a real field on the
   exercise (its own Training Dimension score, an actual tag it carries, its actual duration),
   same discipline as the existing balanceRecommendationReason(). Never invents a benefit the
   exercise's own tags/scores don't support. */
function quickPickReason(ex, ctx){
  const dimLabel = k => (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label || '';
  const clauses = [];
  const primaryScored = ctx.primaryDims
    .map(k => ({k, v: clampScore(ex[k])}))
    .filter(d => d.v !== null)
    .sort((a,b) => b.v-a.v);
  if(primaryScored.length && primaryScored[0].v >= 4){
    clauses.push(`${primaryScored[0].v>=5?'Very high':'High'} ${dimLabel(primaryScored[0].k)} Score (${primaryScored[0].v})`);
  } else if(primaryScored.length && primaryScored[0].v >= 3){
    clauses.push(`Good ${dimLabel(primaryScored[0].k)} Score (${primaryScored[0].v})`);
  }
  if(ctx.focusTag && allTagsFor(ex).includes(ctx.focusTag)) clauses.push(`matches ${ctx.focusTag}`);
  if(ctx.formatTag && (ex.formatTags||[]).includes(ctx.formatTag) && ctx.formatTag !== ctx.focusTag) clauses.push(`matches ${ctx.formatTag}`);
  if(ctx.balanceDim && !ctx.primaryDims.includes(ctx.balanceDim)){
    const v = clampScore(ex[ctx.balanceDim]);
    if(v !== null && v >= 3) clauses.push(`helps build up ${dimLabel(ctx.balanceDim)}, currently lightest in this practice`);
  }
  const dur = ex.duration || 10;
  if(ctx.targetMin > 0 && Math.abs(dur-ctx.targetMin) <= 2) clauses.push(`a ${dur}-minute fit for the time available`);
  if(!clauses.length){
    // Fallback stays grounded in something real rather than a generic platitude.
    const best = TRAINING_DIMENSIONS.map(d=>({label:d.label, v:clampScore(ex[d.key])})).filter(d=>d.v!==null).sort((a,b)=>b.v-a.v)[0];
    clauses.push(best ? `${best.label} Score of ${best.v}` : `a fit for ${ex.section}`);
  }
  // Cap at 2 clauses -- "Keep it concise," even when 3-4 signals all genuinely applied.
  const sentence = clauses.slice(0,2).join(' and ');
  return sentence.charAt(0).toUpperCase() + sentence.slice(1) + '.';
}
/* Up to 3 recommendations for the section currently being picked for -- always section-scoped
   (rule 4: only ever the current section's own exercises), applies the coach's optional Customize
   choices if any are active, prefers exercises not already in the practice ("when possible" --
   falls back to including them rather than starving the list below 3, exactly like
   computeBalanceRecommendations() already does), and ranks the remainder by quickPickScore(). */
/* Recomputes Quick Pick's recommendation set and freezes it into state.quickPickSnapshot.
   Called only when the sheet opens or Customize is applied (a genuine change of criteria) --
   NEVER on a plain re-render, so tapping [+ Add] on a result doesn't cause computeQuickPicks()'s
   own "exclude already-in-practice when possible" rule to immediately kick the just-added
   exercise out of its own card and swap in a 4th suggestion. */
function refreshQuickPickResults(){
  state.quickPickSnapshot = computeQuickPicks();
}
function computeQuickPicks(){
  const phaseKey = state.pickingPhase;
  const phase = PHASES.find(p=>p.key===phaseKey);
  if(!phase) return {section:null, targetMin:0, primaryDims:[], balanceDim:null, items:[], poolSize:0};
  const section = phase.section;
  const c = state.quickPickCustom;
  const primaryDims = c.dimension ? [c.dimension] : (SECTION_PRIMARY_DIMENSIONS[phaseKey] || []);
  const balanceDim = leastEmphasizedDimension();
  const targetMin = quickPickTargetMinutes(phaseKey);

  let pool = EXERCISES.filter(ex => ex.section === section);
  if(c.focus) pool = pool.filter(ex => allTagsFor(ex).includes(c.focus));
  if(c.format) pool = pool.filter(ex => (ex.formatTags||[]).includes(c.format));
  if(c.time){
    // Same 3-bucket convention as matchesFilters()' own Duration filter: <=5, <=10, else "15+".
    pool = pool.filter(ex => {
      const d = ex.duration||10;
      const bucket = d<=5 ? '5' : (d<=10 ? '10' : '15');
      return bucket === c.time;
    });
  }

  const alreadyIn = new Set();
  PHASES.forEach(p => state.phaseData[p.key].forEach(id=>alreadyIn.add(id)));
  state.extraSections.forEach(s => s.exercises.forEach(id=>alreadyIn.add(id)));

  let candidates = pool.filter(ex => !alreadyIn.has(ex.id));
  if(candidates.length < 3) candidates = pool; // prefer unused, but don't starve the list below 3

  const ctx = {primaryDims, balanceDim, targetMin, focusTag: c.focus, formatTag: c.format};
  const scored = candidates
    .map(ex => ({ex, score: quickPickScore(ex, ctx)}))
    .sort((a,b) => b.score-a.score || a.ex.name.localeCompare(b.ex.name));

  return {section, targetMin, primaryDims, balanceDim, items: scored.slice(0,3).map(s=>s.ex), poolSize: pool.length};
}
function quickPickCardHtml(ex, i, ctx){
  const inPhase = isExerciseInAnyPhase(ex.id);
  // Pin whichever dimension(s) actually drove this recommendation into the displayed scores
  // first (same "never contradict the reason text" rule balanceCardHtml() already follows), then
  // fill any remaining slot with the exercise's next-strongest other dimension for context.
  const pinnedKeys = new Set(ctx.primaryDims);
  const pinned = ctx.primaryDims
    .map(k => ({label: (TRAINING_DIMENSIONS.find(d=>d.key===k)||{}).label, score: clampScore(ex[k])}))
    .filter(d => d.score !== null);
  const others = TRAINING_DIMENSIONS
    .filter(d => !pinnedKeys.has(d.key))
    .map(d => ({label:d.label, score:clampScore(ex[d.key])}))
    .filter(d => d.score !== null)
    .sort((a,b) => b.score-a.score);
  const topScores = [...pinned, ...others].slice(0,2);
  const tags = allTagsFor(ex).slice(0,3);
  return `
  <div class="balance-card">
    <div class="balance-card-head">
      <div class="balance-card-num">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div class="balance-card-name" onclick="openDetail('${ex.id}')" style="cursor:pointer;">${escHtml(ex.name)}</div>
        <div class="balance-card-meta">${ex.duration||10} min</div>
      </div>
      <button class="balance-add-btn ${inPhase?'added':''}" onclick="quickPickAddExercise('${ex.id}')">${inPhase?`${ICONS.check} Added`:`${ICONS.plus} Add`}</button>
    </div>
    ${topScores.length ? `<div class="balance-card-scores">${topScores.map(d=>`<span>${d.label} <b>${d.score}</b></span>`).join('')}</div>` : ''}
    ${tags.length ? `<div class="tag-wrap" style="margin-top:6px;">${tags.map(t=>`<span class="tagpill">${escHtml(t)}</span>`).join('')}</div>` : ''}
    <div class="balance-card-reason">"${escHtml(quickPickReason(ex, ctx))}"</div>
  </div>`;
}

function initTheme(){
  // Default to light regardless of the device's system dark-mode setting -- previously, a coach
  // with no saved preference yet (first visit, or storage cleared) would silently get dark mode
  // just because their phone's OS-wide setting was dark, via the prefers-color-scheme fallback.
  // An explicit in-app toggle (below) still saves and is still respected on every future load.
  try{
    const saved = localStorage.getItem('ft2-theme');
    document.documentElement.setAttribute('data-theme', saved==='dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){
    document.documentElement.setAttribute('data-theme','light');
    try{ localStorage.setItem('ft2-theme','light'); }catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    try{ localStorage.setItem('ft2-theme','dark'); }catch(e){}
  }
  render();
}

function adjustTemplatePct(id, key, delta){
  const t = getTemplate(id); if(!t) return;

/* Applying a template is what actually changes what the coach sees on the Build page -- only ever
   triggered explicitly (the "Load a template" sheet on Build, below), never automatically just
   because a template got edited/saved -- so editing a template never yanks a section out from
   under a coach who's mid-build. */
function applyTemplateToBuilder(id){
  const tmpl = getTemplate(id);
  if(!tmpl) return;
  state.enabledPhaseKeys = new Set(tmpl.sections.filter(s=>s.standard && s.enabled!==false).map(s=>s.key));
  state.phaseOrder = tmpl.sections.filter(s=>s.standard).map(s=>s.key);
  if(tmpl.duration) state.targetDuration = tmpl.duration;
  const templateCustoms = tmpl.sections.filter(s=>!s.standard && s.enabled!==false);
  templateCustoms.forEach(tc=>{
    let es = state.extraSections.find(es=>es.key===tc.key);
    if(!es){
      es = {key:tc.key, label:tc.label, exercises:[], templateManaged:true};
      state.extraSections.push(es);
    } else {

    }
  });
  state.extraSections = state.extraSections.filter(es=>{
    if(!es.templateManaged) return true;
    const stillWanted = templateCustoms.find(tc=>tc.key===es.key);
    return !!stillWanted || es.exercises.length>0;
  });
}

/* Long-press-and-drag reorder for Settings template rows. Warmup is excluded entirely -- it's
   never the drag source and never a valid drop target -- so it's structurally impossible for a
   swap to land anything above it; it stays pinned first without any extra bookkeeping.
   A short setTimeout distinguishes a deliberate long-press-drag from an ordinary tap/scroll:
   if the pointer moves more than a few px before the timer fires, the gesture is treated as a
   scroll instead and the drag is cancelled. */
let tmplDrag = null;
function tmplGripDown(e, id, key){
  e.preventDefault();
  const startY = e.clientY;
  const timer = setTimeout(()=>{
    if(!tmplDrag) return;
    tmplDrag.longPressed = true;
    const row = document.querySelector(`.tmpl-row[data-key="${key}"]`);
    if(row) row.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(15);
  }, 320);
  tmplDrag = {id, key, timer, startY, longPressed:false};
  document.addEventListener('pointermove', tmplGripMove);
  document.addEventListener('pointerup', tmplGripUp);
}
function tmplGripMove(e){
  if(!tmplDrag) return;
  if(!tmplDrag.longPressed){
    if(Math.abs(e.clientY - tmplDrag.startY) > 8){ tmplGripCancel(); }
    return;
  }
  e.preventDefault();
  const y = e.clientY;
  const tmpl = getTemplate(tmplDrag.id);
  if(!tmpl) return;
  const sections = tmpl.sections;
  const reorderableKeys = sections.filter(s=>s.key!=='warmup').map(s=>s.key);
  let overKey = null;
  reorderableKeys.forEach(k=>{
    const el = document.querySelector(`.tmpl-row[data-key="${k}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) overKey = k;
  });
  if(!overKey || overKey===tmplDrag.key) return;
  const fromIdx = sections.findIndex(s=>s.key===tmplDrag.key);
  const toIdx = sections.findIndex(s=>s.key===overKey);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = sections.splice(fromIdx,1);
  sections.splice(toIdx,0,moved);
  render();
  const key = tmplDrag.key;
  setTimeout(()=>{ const row=document.querySelector(`.tmpl-row[data-key="${key}"]`); if(row) row.classList.add('dragging'); }, 0);
}
function tmplGripCancel(){
  if(tmplDrag) clearTimeout(tmplDrag.timer);
  tmplDrag = null;
  document.removeEventListener('pointermove', tmplGripMove);
  document.removeEventListener('pointerup', tmplGripUp);
}
function tmplGripUp(){
  tmplGripCancel();
  render();
}
